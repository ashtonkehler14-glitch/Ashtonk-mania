    const src = Music.source;
    if (src) {
      const t = AudioManager.ctx.currentTime, r = src.playbackRate.value;
      src.playbackRate.setValueAtTime(r, t);
      src.playbackRate.linearRampToValueAtTime(r * 0.3, t + FAIL_WIND_DOWN);
      Music.setVolume(0, FAIL_WIND_DOWN * 1000);
      setTimeout(() => { if (Music.source === src) Music.stop(0); }, FAIL_WIND_DOWN * 1000 + 100);
    }
    SkinManager.sample('failsound').then(b => b && AudioManager.play(b));
    if (s.mode === 'play') {
      const { score } = await this.saveScore(false, now);
      this.failedScore = score; this.failedReplay = this._unsavedReplay;
      if (s.mp) { Multiplayer.finish(score); setTimeout(() => { if (this.s === s) Screens.go('multiplayer', {}, { replace: true }); }, 1600); return; }
    }
    if (Settings.get('gameplay.retryOnFail') && s.mode === 'play') { setTimeout(() => { if (this.s === s) this.retry(); }, 1400); return; }
    setTimeout(() => { if (this.s === s) this.showPause('Failed', true); }, 900);
  },
  async complete() {
    const s = this.s;
    s.finished = true; s.running = false;
    this.settleAutoScale();
    this.releaseAll();
    const summary = s.engine.summary();
    if (s.mode === 'play') {
      MapOffsets.last = { hash: s.rec.hash, mean: summary.meanError || 0, hits: s.engine.hitErrors.filter(e => !e.tail).length };
      const { score, replay } = await this.saveScore(!s.mpFailed); // (a multiplayer play that ran out of health is a failed score)
      if (s.mp) { Multiplayer.finish(score); setTimeout(() => { if (this.s === s) Screens.go('multiplayer', {}, { replace: true }); }, 900); return; }
      setTimeout(() => { if (this.s === s) Screens.go('results', { score, replay, fresh: true }, { replace: true, transition: 'zoom' }); }, 600);
    } else {
      const score = this.buildScore(true, summary);
      setTimeout(() => { if (this.s === s) Screens.go('results', { score, replay: s.mode === 'replay' ? s.replay : null, fresh: false, watched: s.mode }, { replace: true, transition: 'zoom' }); }, 600);
    }
  },
  buildScore(passed, summary) {
    const s = this.s;
    const grade = ScoreSystem.gradeFor(summary.accuracy, !passed, s.mods, summary.counts);
    const stars = s.stars;
    const pp = passed && !s.mods.includes('AT') ? OsuMath.pp(stars, summary.counts, s.mods) : 0;
    return {
      id: 'sc-' + uid(), mapHash: s.rec.hash, mapId: s.rec.id, setId: s.rec.setId,
      title: s.rec.title, artist: s.rec.artist, version: s.rec.version, creator: s.rec.creator,
      keys: s.keys, stars, pp,
      mods: s.mods, rate: s.rate, score: summary.score, scoreStd: summary.scoreStd, accuracy: summary.accuracy, maxCombo: summary.maxCombo,
      counts: summary.counts, grade, passed, date: Date.now(),
      duration: Math.round(performance.now() - s.startedReal), player: s.replay ? s.replay.player : ProfileManager.profile.name,
      meanError: summary.meanError, unstableRate: summary.unstableRate, early: summary.early, late: summary.late,
      hitErrors: summary.hitErrors, totalJudgements: summary.totalJudgements, accuracyMode: s.accuracyMode,
      windows: s.windows, od: s.bm.od, replayId: null, modConfig: s.modConfig,
      healthTimeline: s.engine.health.timeline, srVersion: SR_VERSION,
    };
  },
  async saveScore(passed) {
    const s = this.s;
    const summary = s.engine.summary();
    const score = this.buildScore(passed, summary);
    const replay = ReplayManager.build({
      map: s.rec, mods: s.mods, rate: s.rate, seed: s.seed, windows: s.windows, accuracyMode: s.accuracyMode, hp: s.bm.hp, keys: s.keys, modConfig: s.modConfig,
      events: s.events, summary: { ...summary, grade: score.grade }, scoreId: score.id, player: score.player, duration: score.duration, noFail: !!s.mp, rules: s.rules,
    });
    await ScoreManager.add(score);
    const mode = Settings.get('replays.autosave');
    if ((mode === 'all' && passed) || (mode === 'pb' && score.isPB)) {
      await ReplayManager.save(replay);
      score.replayId = replay.id;
    }
    this._unsavedReplay = replay;
    return { score, replay };
  },

  // ─────────────────────────────── breaks ───────────────────────────────
  /** Break overlay between distant notes (gaps of at least the minimum break length). */
  updateBreak(now) {
    const s = this.s;
    if (!s.running || s.practice) { if (this._inBreak) { this._inBreak = false; this.breakEl.classList.remove('show'); } return; }
    if (!s.gaps) {
      const minGap = Settings.get('gameplay.breakMin');
      const times = s.baseNotes.map(n => [n.time, n.end]).sort((a, b) => a[0] - b[0]);
      s.gaps = [];
      let lastEnd = times.length ? times[0][1] : 0;
      for (let i = 1; i < times.length; i++) {
        if (times[i][0] - lastEnd >= minGap * s.rate) s.gaps.push([lastEnd, times[i][0]]);
        lastEnd = Math.max(lastEnd, times[i][1]);
      }
    }
    const g = s.gaps.find(([a, b]) => now > a + 800 * s.rate && now < b - 800 * s.rate);
    if (!!g !== this._inBreak) {
      this._inBreak = !!g;
      // the skin's section sounds (osu!): how you're doing as the break starts
      if (g) SkinManager.skinOnly(s.engine.health.value >= 0.5 ? 'sectionpass' : 'sectionfail', 0.7);
      if (g) {
        // osu!lazer-style: countdown, a bar shrinking to the centre, and your current accuracy / rank
        const e = s.engine, grade = ScoreSystem.gradeFor(e.score.accuracy, false, s.mods, e.score.counts);
        this.brkCount = h('div.brk-count'); this.brkBar = h('i');
        clearEl(this.breakEl).append(this.brkCount, h('div.brk-bar', h('span.brk-arrow.l', '›'), h('div.brk-track', this.brkBar), h('span.brk-arrow.r', '‹')),
          h('div.brk-info', h('div', h('span', 'Accuracy'), h('b', fmtAcc(e.score.accuracy))), h('div', h('span', 'Rank'), gradeEl(grade))));
        this._brkLeft = this._brkQ = null;
      }
      this.breakEl.classList.toggle('show', !!g);
      this.breakEl.hidden = false;
      if (Settings.get('gameplay.lightenBreaks')) this.dimEl.style.opacity = g ? this.baseDim * 0.55 : this.baseDim;
    }
    if (!g) return;
    const left = Math.max(0, Math.ceil((g[1] - 800 * s.rate - now) / 1000 / s.rate));
    if (left !== this._brkLeft) { this._brkLeft = left; this.brkCount.textContent = left; }
    const rem = clamp((g[1] - 800 * s.rate - now) / (g[1] - g[0] - 1600 * s.rate), 0, 1);
    const q = Math.round(rem * 300);
    if (q !== this._brkQ) { this._brkQ = q; this.brkBar.style.transform = `scaleX(${q / 300})`; }
  },

  // ─────────────────────────────── gamepad ───────────────────────────────
  /** Gamepads: buttons are bound like keys ("Pad0", "Pad1", …) in the key configuration. */
  pollGamepad() {
    if (!navigator.getGamepads) return;
    const s = this.s;
    const pads = [...navigator.getGamepads()].filter(Boolean);
    if (!pads.length) return;
    this._padState = this._padState || {};
    for (const gp of pads) {
      gp.buttons.forEach((b, i) => {
        const code = `Pad${i}`, prev = !!this._padState[code], now = !!b.pressed;
        if (now === prev) return;
        this._padState[code] = now;
        const col = s.keyMap.get(code);
        if (col === undefined) return;
        const t = Music.timeAtCtx(AudioManager.perfToCtx(gp.timestamp || performance.now())) - this.offsetMs() * s.rate - Settings.get('input.latency') * s.rate;
        if (now) this.keyDown(col, code, t); else this.keyUp(col, code, t);
      });
    }
  },

  // ─────────────────────────────── watching replays ───────────────────────────────
  /** osu!lazer's replay player controls, for replays and Auto: pause, seek anywhere (the replay is re-judged
   *  up to that point, so the score is exactly what it was there) and playback speed. */
  buildReplayBar() {
    const s = this.s;
    const tl = h('div.rp-timeline', { title: 'Click or drag to seek' });
    const cv = h('canvas');
    // (fill and playhead move with transforms only, so updating them never re-lays out the page)
    this.rpFill = h('div.rp-fill'); this.rpHead = h('div.rp-headwrap', h('div.rp-head'));
    tl.append(cv, this.rpFill, this.rpHead);
    const span = () => ({ a: Math.min(0, s.startPos), b: s.endTime });
    const at = ev => { const r = tl.getBoundingClientRect(), { a, b } = span(); return a + clamp((ev.clientX - r.left) / r.width, 0, 1) * (b - a); };
    let drag = false, lastSeek = 0;
    tl.addEventListener('pointerdown', ev => { drag = true; tl.setPointerCapture(ev.pointerId); this.replaySeek(at(ev)); lastSeek = performance.now(); });
    tl.addEventListener('pointermove', ev => { if (drag && performance.now() - lastSeek > 90) { lastSeek = performance.now(); this.replaySeek(at(ev)); } });
    tl.addEventListener('pointerup', ev => { if (drag) { drag = false; this.replaySeek(at(ev)); } });
    tl.addEventListener('pointercancel', () => { drag = false; });
    this.rpPlay = h('button.btn.sm.rp-play', { onclick: () => this.replayToggle(), title: 'Pause / play (Space)' }, icon('pause'));
    this.rpTime = h('span.rp-time');
    this.rpSpeeds = REPLAY_SPEEDS.map(k => h(`button.chip${k === 1 ? '.on' : ''}`, { onclick: () => this.replaySpeed(k) }, `${k}×`));
    this._rpHover = false;
    // (on the side the notes come from, so it never covers the judgement line you're watching)
    const bar = h(`div.replay-bar${Settings.get('gameplay.scrollDirection') === 'up' ? '' : '.top'}`, { onpointerenter: () => { this._rpHover = true; }, onpointerleave: () => { this._rpHover = false; } },
      tl,
      h('div.rp-controls',
        this.rpPlay,
        h('button.btn.sm', { onclick: () => this.replaySeek(this.gameTime() - 5000 * s.rate), title: 'Back 5 seconds (←)' }, '−5s'),
        h('button.btn.sm', { onclick: () => this.replaySeek(this.gameTime() + 5000 * s.rate), title: 'Forward 5 seconds (→)' }, '+5s'),
        this.rpTime,
        h('span.grow'),
        h('span.muted.rp-label', 'Speed'),
        h('div.speed-group', ...this.rpSpeeds)));
    this.replayBar = bar;
    this.hud.append(bar);
    // note density along the timeline
    requestAnimationFrame(() => {
      if (!cv.isConnected) return;
      const dpr = Zoom.dpr();
      cv.width = Math.max(1, cv.clientWidth * dpr); cv.height = Math.max(1, cv.clientHeight * dpr);
      const x = cv.getContext('2d'), { a, b } = span();
      const bins = new Array(Math.max(10, Math.floor(cv.width / (3 * dpr)))).fill(0);
      for (const n of s.baseNotes) bins[clamp(Math.floor((n.time - a) / (b - a) * bins.length), 0, bins.length - 1)]++;
      const max = Math.max(...bins, 1), bw = cv.width / bins.length;
      bins.forEach((v, i) => { const hh = v / max * cv.height * 0.85; x.fillStyle = `rgba(255,255,255,${0.12 + 0.3 * v / max})`; x.fillRect(i * bw, cv.height - hh, Math.max(1, bw - dpr), hh); });
    });
    this._rpT = 0;
  },
  updateReplayBar(now, force = false) {
    const s = this.s;
    if (!this.replayBar || !s) return;
    const wall = performance.now();
    if (!force && wall - this._rpT < 100) return;
    // hidden (no mouse movement, playing, not hovered): nothing to update
    if (!force && s.running && !this.el.classList.contains('show-cursor') && !this._rpHover) return;
    this._rpT = wall;
    const a = Math.min(0, s.startPos), p = clamp((now - a) / Math.max(1, s.endTime - a), 0, 1);
    this.rpFill.style.transform = `scaleX(${p})`;
    this.rpHead.style.transform = `translateX(${p * 100}%)`;
    const t = `${fmtTime(Math.max(0, now / s.rate))} / ${fmtTime(s.endTime / s.rate)}`;
    if (this.rpTime.textContent !== t) this.rpTime.textContent = t;
    const ic = s.running ? 'pause' : 'play';
    if (this.rpPlay.dataset.ic !== ic) { this.rpPlay.dataset.ic = ic; this.rpPlay.replaceChildren(icon(ic)); }
    this.replayBar.classList.toggle('paused', !s.running);
  },
  replayKey(e) {
    const s = this.s;
    switch (e.code) {
      case 'Space':
        if (e.repeat) return true;
        if (s.running && this.gameTime() < s.skipTarget - 1000 * s.rate) this.skip(); else this.replayToggle();
        return true;
      case 'ArrowLeft': this.replaySeek(this.gameTime() - 5000 * s.rate); return true;
      case 'ArrowRight': this.replaySeek(this.gameTime() + 5000 * s.rate); return true;
      case 'ArrowDown': case 'ArrowUp': {
        if (e.repeat) return true;
        const i = REPLAY_SPEEDS.indexOf(s.speed) + (e.code === 'ArrowUp' ? 1 : -1);
        if (i >= 0 && i < REPLAY_SPEEDS.length) this.replaySpeed(REPLAY_SPEEDS[i]);
        return true;
      }
    }
    return false;
  },
  replayToggle() {
    const s = this.s;
    if (!s || s.finished || s.failed || this.pauseEl || s.changingSpeed) return;
    if (s.running) { s.running = false; Music.pause(); }
    else { s.running = true; Music.play(Music.pausedPos); }
    UISounds.click();
    this.updateReplayBar(this.gameTime(), true);
  },
  /** Jump to song time `t`: a fresh engine re-judges the recorded inputs up to `t` (deterministic, so the
   *  score, combo and health are exactly what they were there), then the song carries on from `t`. */
  replaySeek(t) {
    const s = this.s;
    if (!s || !s.feed || s.finished || s.changingSpeed) return;
    t = clamp(t, Math.min(0, s.startPos), s.endTime + 300 * s.rate);
    this._resim = true;
    try {
      this.newEngine();
      const eng = s.engine, ev = s.feed;
      let i = 0;
      for (; i < ev.length && ev[i] <= t; i += 3) { s.held[ev[i + 1]] = ev[i + 2] === 1; eng.input(ev[i + 1], ev[i + 2] === 1, ev[i]); }
      eng.advance(t);
      s.feedIdx = i;
      this._lastCombo = eng.score.combo;
    } finally { this._resim = false; }
    this._ppJudged = this._lastSc = this._lastAcc = undefined;
    const pos = t + this.offsetMs() * s.rate;
    if (s.running) Music.play(pos); else Music.pausedPos = pos;
    this.updateReplayBar(t, true);
  },
  /** Playback speed while watching (the recorded inputs stay on the song's clock, so they stay in sync). */
  async replaySpeed(k) {
    const s = this.s;
    if (!s || s.speed === k || s.changingSpeed || s.finished) return;
    const pos = Music.time, wasRunning = s.running;
    s.changingSpeed = true;
    s.running = false; Music.pause();
    s.speed = k;
    this.rpSpeeds.forEach((b, i) => b.classList.toggle('on', REPLAY_SPEEDS[i] === k));
    // back at 1× the play's own audio is used again (time-stretched for DT / HT with "keep pitch"); other speeds
    // just play faster or slower, so switching is instant
    const slow = k === 1 && s.preserve;
    const msg = slow ? h('div.hud-center-msg', 'Changing speed…') : null;
    if (msg) this.hud.append(msg);
    try { await Music.setRate(s.rate * k, k === 1 && s.preserve, f => { if (msg) msg.textContent = `Changing speed… ${Math.round(f * 100)}%`; }); }
    finally { msg && msg.remove(); s.changingSpeed = false; }
    if (this.s !== s) return;
    Music.pausedPos = pos;
    if (wasRunning) { s.running = true; Music.play(pos); }
    Toast.show(`Playback speed ${k}×`);
    this.updateReplayBar(this.gameTime(), true);
  },

  // ─────────────────────────────── practice ───────────────────────────────
  buildPracticeBar() {
    const s = this.s;
    const tl = h('div.pr-timeline');
    const cv = h('canvas');
    this.prLoop = h('div.pr-loop', { style: { display: 'none' } });
    this.prHead = h('div.pr-head');
    tl.append(cv, this.prLoop, this.prHead);
    tl.addEventListener('pointerdown', ev => {
      const r = tl.getBoundingClientRect();
      const t = (ev.clientX - r.left) / r.width * s.endTime;
      this.practiceSeek(t);
    });
    const speedBtns = PRACTICE_SPEEDS.map(sp => h(`button.chip${Math.abs(sp - s.rate) < 1e-3 ? '.on' : ''}`, { onclick: () => this.practiceSpeed(sp) }, `${Math.round(sp * 100)}%`));
    this.prOffset = h('span.muted');
    this.prInfo = h('span.muted');
    const bar = h('div.practice-bar',
      tl,
      h('div.pr-controls',
        h('span', { style: { fontWeight: 900, color: 'var(--gold)' } }, 'PRACTICE'),
        h('button.btn.sm', { onclick: () => this.setLoop('A'), title: 'Set loop start ( [ )' }, 'Set A ', h('span.kbd', '[')),
        h('button.btn.sm', { onclick: () => this.setLoop('B'), title: 'Set loop end ( ] )' }, 'Set B ', h('span.kbd', ']')),
        h('button.btn.sm', { onclick: () => this.setLoop('clear'), title: 'Clear loop ( \\ )' }, 'Clear'),
        h('button.btn.sm', { onclick: () => this.restartSection(), title: 'Restart section (Backspace)' }, icon('retry'), 'Restart ', h('span.kbd', '⌫')),
        h('div.speed-group', ...speedBtns),
        // (the offset nudge stays together: − offset +)
        h('span.pr-offset', h('button.btn.sm', { onclick: () => this.nudgeOffset(-5), title: 'Offset −5ms ( - )' }, '−'),
          this.prOffset,
          h('button.btn.sm', { onclick: () => this.nudgeOffset(5), title: 'Offset +5ms ( = )' }, '+')),
        h('span.grow'), this.prInfo));
    this.practiceBar = bar;
    this.hud.append(bar);
    this.placePracticeBar();
    this._prResize = () => this.placePracticeBar();
    window.addEventListener('resize', this._prResize);
    // density graph
    requestAnimationFrame(() => {
      const dpr = Zoom.dpr();
      cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
      const x = cv.getContext('2d');
      const bins = new Array(Math.max(10, Math.floor(cv.width / (3 * dpr)))).fill(0);
      for (const n of s.baseNotes) bins[Math.min(bins.length - 1, Math.floor(n.time / s.endTime * bins.length))]++;
      const max = Math.max(...bins, 1);
      const bw = cv.width / bins.length;
      bins.forEach((v, i) => {
        const hh = v / max * cv.height * 0.9;
        x.fillStyle = `rgba(176,124,255,${0.35 + 0.5 * v / max})`;
        x.fillRect(i * bw, cv.height - hh, Math.max(1, bw - dpr), hh);
      });
    });
    this.updatePracticeLabels();
  },
  /** Dock the practice tools beside the stage when there is room, so they never cover the receptors. */
  placePracticeBar() {
    const bar = this.practiceBar, r = this.renderer;
    if (!bar || !bar.isConnected) { window.removeEventListener('resize', this._prResize); return; }
    r.resize();
    const ratio = this.canvas.clientWidth / Math.max(1, r.W);
    const left = r.stageX * ratio;
    // beside the stage when it fits (a narrower panel just wraps into more rows); otherwise at the end of the screen
    // away from the receptors (the top for downscroll), never over them
    const docked = left >= 200;
    bar.classList.toggle('docked', docked);
    bar.classList.toggle('top', !docked && Settings.get('gameplay.scrollDirection') !== 'up');
    bar.style.width = docked ? Math.min(480, left - 24) + 'px' : '';
  },
  updatePracticeLabels() {
    if (!this.prOffset) return;
    this.prOffset.textContent = `offset ${Settings.get('audio.offset')}ms`;
    const s = this.s;
    if (!s) return;
    this.prInfo.textContent = s.loopA != null || s.loopB != null ? `loop ${fmtTime(s.loopA ?? 0)} → ${fmtTime(s.loopB ?? s.endTime)}` : 'click the timeline to seek';
    if (s.loopA != null || s.loopB != null) {
      const a = (s.loopA ?? 0) / s.endTime * 100, b = (s.loopB ?? s.endTime) / s.endTime * 100;
      Object.assign(this.prLoop.style, { display: '', left: a + '%', width: Math.max(0.3, b - a) + '%' });
    } else this.prLoop.style.display = 'none';
  },
  updatePractice(now) {
    const s = this.s;
    if (!s.practice || !this.prHead) return;
    this.prHead.style.left = clamp(now / s.endTime * 100, 0, 100) + '%';
    this.practiceBar.classList.toggle('dim', s.held.some(Boolean));
    if (s.loopB != null && now > s.loopB + 400 * s.rate) this.restartSection();
    if (s.loopB == null && now > s.endTime + 1000 * s.rate) this.practiceSeek(s.loopA ?? 0);
  },
  practiceKey(e) {
    const s = this.s;
    if (s.keyMap.has(e.code)) return false;
    switch (e.code) {
      case 'BracketLeft': this.setLoop('A'); return true;
      case 'BracketRight': this.setLoop('B'); return true;
      case 'Backslash': this.setLoop('clear'); return true;
      case 'Backspace': this.restartSection(); return true;
      case 'Minus': this.nudgeOffset(-5); return true;
      case 'Equal': this.nudgeOffset(5); return true;
      case 'ArrowLeft': this.practiceSeek(this.gameTime() - 5000 * s.rate); return true;
      case 'ArrowRight': this.practiceSeek(this.gameTime() + 5000 * s.rate); return true;
    }
    return false;
  },
  setLoop(which) {
    if (!this.s) return; // (the practice bar can still be clicked while the screen fades out)
    const s = this.s, t = this.gameTime();
    if (which === 'A') { s.loopA = clamp(t, 0, s.endTime); if (s.loopB != null && s.loopB <= s.loopA) s.loopB = null; }
    else if (which === 'B') { s.loopB = clamp(t, 0, s.endTime); if (s.loopA != null && s.loopA >= s.loopB) s.loopA = null; }
    else { s.loopA = null; s.loopB = null; }
    UISounds.click();
    this.updatePracticeLabels();
  },
  restartSection() { if (this.s) this.practiceSeek(this.s.loopA ?? 0); },
  practiceSeek(t) {
    const s = this.s;
    if (!s) return;
    t = clamp(t, 0, s.endTime);
    const lead = 1200 * s.rate;
    this.newEngine(t);
    s.running = true;
    this.closePause();
    Music.play(t - lead + this.offsetMs() * s.rate);
  },
  async practiceSpeed(sp) {
    const s = this.s;
    if (!s) return;
    const pos = this.gameTime();
    Settings.set('practice.speed', sp);
    Music.stop(0);
    s.running = false;
    const msg = h('div.hud-center-msg', 'Changing speed…');
    this.hud.append(msg);
    await Music.setRate(sp, Settings.get('audio.preservePitch'), f => msg.textContent = `Changing speed… ${Math.round(f * 100)}%`);
    msg.remove();
    s.rate = sp;
    $$('.speed-group .chip', this.practiceBar).forEach((b, i) => b.classList.toggle('on', Math.abs(PRACTICE_SPEEDS[i] - sp) < 1e-3));
    this.practiceSeek(s.loopA != null && pos < s.loopA ? s.loopA : Math.max(0, pos));
  },
  nudgeOffset(d) {
    Settings.set('audio.offset', clamp(Settings.get('audio.offset') + d, -300, 300));
    this.updatePracticeLabels();
  },
};

/** Global frame statistics (FPS counter + debug). */
const FPS = {
  last: 0, fps: 0, frameMs: 0, acc: 0, n: 0,
  frame(now) {
    if (this.last) {
      const dt = now - this.last;
      this.frameMs = this.frameMs * 0.9 + dt * 0.1;
      this.acc += dt; this.n++;
      if (this.acc >= 500) {
        this.fps = this.n * 1000 / this.acc; this.acc = 0; this.n = 0;
        const el = $('#fps-counter');
        if (Settings.get('graphics.showFps')) {
          // osu!lazer style: big fps number + frame time, tinted by how healthy the frame rate is
          if (!this.fpsEl) { this.fpsEl = h('b'); this.msEl = h('i'); clearEl(el).append(h('span.fc-fps', this.fpsEl, h('small', 'fps')), this.msEl); }
          el.hidden = false;
          this.fpsEl.textContent = this.fps.toFixed(0);
          this.msEl.textContent = `${this.frameMs.toFixed(1)}ms`;
          const lvl = this.fps >= 55 ? 'good' : this.fps >= 30 ? 'ok' : 'bad';
          if (el.dataset.lvl !== lvl) el.dataset.lvl = lvl;
        } else if (!el.hidden) el.hidden = true;
      }
    }
    this.last = now;
  },
};

/* ===== 16-screen-results.js ===== */
/* Results screen — grade, score, judgement breakdown, timing distribution & timing-over-time graphs,
 * personal-best tracking and replay actions. */

const ResultsScreen = {
  tab: 'songselect',
  enter(p) {
    this.p = p;
    const s = p.score;
    const map = BeatmapManager.mapByHash(s.mapHash);
    const el = h('div.results');
    if (map) BeatmapManager.bgURL(map).then(u => Background.set(u, { blur: Settings.get('graphics.menuBlur') + 6, dim: 0.35 }));
    const body = h('div.res-body');
    // osu!lazer: the score panel opens in the middle; clicking it slides it aside for the statistics (and back)
    const grid = h('div.res-grid');
    const card = this.gradeCard(s, p);
    card.title = 'Click for statistics';
    card.addEventListener('click', e => {
      if (e.target.closest('button, a, input')) return;
      UISounds.click();
      grid.classList.toggle('stats-open');
      card.title = grid.classList.contains('stats-open') ? 'Click to hide statistics' : 'Click for statistics';
    });
    grid.append(card, this.rightCol(s));
    body.append(grid);
    const actions = this.actions(s, p, map);
    el.append(body, actions);
    if (p.fresh && s.passed) setTimeout(() => Screens.currentName === 'results' && SkinManager.sample(s.accuracy >= 0.95 ? 'applause' : 'sectionpass').then(b => b && AudioManager.play(b, { volume: 0.6 })), 1300);
    return el;
  },
  leave() { cancelAnimationFrame(this._cnt); (this._srcs || []).forEach(x => { try { x.stop(); } catch {} }); this._srcs = []; },
  /** lazer's results sounds: a tick each step of the accuracy circle (slowing down and rising in pitch as the
   *  fill eases out), then the rank's impact as the grade lands. */
  async introSounds(acc, fillMs, failed) {
    this._srcs = [];
    if (!fillMs || !Settings.get('audio.uiSounds') || !AudioManager.ctx || AudioManager.ctx.state !== 'running') return;
    const [tick, impact] = await Promise.all([UISounds._get('score-tick'), UISounds._get(failed ? 'rank-impact-fail' : 'rank-impact-pass')]);
    if (Screens.currentName !== 'results') return;
    const t0 = AudioManager.ctx.currentTime + 0.03, N = Math.max(1, Math.round(acc * 40));
    let last = -1;
    for (let k = 1; k <= N; k++) {
      const f = k / N, t = (1 - Math.pow(1 - f, 1 / 5)) * fillMs; // (when the eased fill reaches f)
      if (t - last < 38 || t > fillMs * 0.55) continue;
      last = t;
      this._srcs.push(AudioManager.play(tick, { bus: 'ui', when: t0 + t / 1000, rate: 0.9 + 0.6 * f * acc, volume: 0.7 }));
    }
    this._srcs.push(AudioManager.play(impact, { bus: 'ui', when: t0 + (fillMs * 0.55 + 180) / 1000 }));
    this._srcs = this._srcs.filter(Boolean);
  },
  onKey(e) {
    if (e.code === 'KeyR' || (e.ctrlKey && e.code === 'KeyR')) { this.retry(); return true; }
    if (e.code === 'Enter' || e.code === 'Space') { this.retry(); return true; }
    return false;
  },
  onBack() { Screens.go('songselect', { mapId: this.p.score.mapId }, { replace: true }); return true; },
  retry() {
    const s = this.p.score;
    const map = BeatmapManager.mapByHash(s.mapHash);
    if (!map) { Toast.err('Beatmap not found', 'This beatmap is no longer in your library.'); return; }
    UISounds.click();
    Game.launch({ mapId: map.id, mods: this.p.watched === 'auto' ? s.mods : s.mods.filter(m => m !== 'AT'), mode: 'play' });
  },
  /** osu!lazer's expanded score panel: the player on top; then the beatmap, the accuracy circle (grade segments
   *  around it, the grade in the middle), mods, the score and the statistics. Colours are lazer's rank colours. */
  gradeCard(s, p) {
    const RANK = RANK_COLOURS;
    const letter = s.grade === 'XH' ? 'SS' : s.grade === 'SH' ? 'S' : s.grade;
    const rc = RANK[s.grade] || '#fff';
    // the player
    const mine = !p.watched || p.watched === 'replay' && s.player === ProfileManager.profile.name;
    const av = mine && s.player === ProfileManager.profile.name ? ProfileManager.avatarEl(64) : h('span.rs-initial', (s.player || '?')[0].toUpperCase());
    const top = h('div.rs-top', av, h('div.rs-who', h('div.rs-name', s.player || 'Player'), h('div.rs-when', `Played on ${fmtDateTime(s.date)}`)),
      p.watched ? h('span.rs-tag', p.watched === 'auto' ? 'AUTO' : 'REPLAY') : null);
    // accuracy circle (lazer's AccuracyCircle): the accuracy fills the thick outer ring; just inside it the grade
    // thresholds are coloured segments (SS shown as a virtual 1% so it's visible); each rank's badge pops in when the
    // fill passes it, so only the ranks you reached show up. Positions and sizes follow lazer's relative values.
    const VSS = 0.01, GAP = 2 / 360, R = 108, W = 0.2 * 120, C = 2 * Math.PI * R, R2 = 0.8 * 120 - 2.5 - 2.4, C2 = 2 * Math.PI * R2;
    const segs = [[0, 0.7, RANK.D], [0.7, 0.8, RANK.C], [0.8, 0.9, RANK.B], [0.9, 0.95, RANK.A], [0.95, 1 - VSS, RANK.S], [1 - VSS, 1, RANK.X]];
    const arc = (a, b, col) => `<circle cx="120" cy="120" r="${R2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="4.8" stroke-dasharray="${Math.max(0.5, (b - a - GAP) * C2).toFixed(2)} ${C2.toFixed(2)}" stroke-dashoffset="${(-(a + GAP / 2) * C2).toFixed(2)}"/>`;
    // an SS can be under 100% (a 300 counts a little less than a MAX): lazer fills the circle for it anyway
    const isSS = ['XH', 'X', 'SS'].includes(s.grade);
    const acc = isSS || s.accuracy >= 1 ? 1 : Math.min(s.accuracy, 1 - VSS);
    const fillMs = 1400 * (Settings.get('ui.animSpeed') > 0 ? 1 / Settings.get('ui.animSpeed') : 0);
    const ring = h('div.rs-ring');
    ring.innerHTML = `<svg viewBox="0 0 240 240"><defs><linearGradient id="rsg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cf6ff"/><stop offset="1" stop-color="#baffa9"/></linearGradient></defs>
      <circle cx="120" cy="120" r="${R - 1.2}" fill="none" stroke="rgba(47,47,47,.5)" stroke-width="${W + 2.4}"/>
      <circle class="accring" cx="120" cy="120" r="${R}" fill="none" stroke="url(#rsg)" stroke-width="${W}" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition: stroke-dashoffset ${fillMs}ms cubic-bezier(.1,1,.2,1)"/>
      ${segs.map(([a, b, c]) => arc(a, b, c)).join('')}</svg>`;
    // badges sit on an ellipse just outside the ring; A and S are nudged down so they don't collide with SS (as lazer does)
    const badges = [['D', 0, 0.35], ['C', 0.7, 0.75], ['B', 0.8, 0.85], ['A', 0.9, 0.9125], ['S', 0.95, 0.96], ['SS', 1, 1]];
    for (const [g, cut, at] of badges) {
      if (g === 'SS' ? !isSS && s.accuracy < 1 : s.accuracy < cut && !isSS) continue;
      const ang = (at * 360 - 90) * Math.PI / 180;
      // when the (eased) fill reaches this rank's cutoff
      const t = cut <= 0 ? 0 : 1 - Math.pow(1 - Math.min(1, cut / acc), 1 / 5);
      ring.append(h(`span.rs-badge${g === letter ? '.on' : ''}`, { style: { left: `${50 + Math.cos(ang) * 50 * 140 / 120}%`, top: `${50 + Math.sin(ang) * 50 * 135 / 120}%`, '--rc': RANK[g === 'SS' ? 'X' : g], '--rt': RANK_INK[g], animationDelay: `${Math.round(t * fillMs)}ms` } }, g));
    }
    ring.append(h('div.rs-grade', { style: { '--rc': rc, animationDelay: `${Math.round(fillMs * 0.55)}ms` } }, letter));
    requestAnimationFrame(() => requestAnimationFrame(() => { const c = ring.querySelector('.accring'); if (c) c.style.strokeDashoffset = C * (1 - acc); }));
    this.introSounds(acc, fillMs, ['D', 'F'].includes(s.grade));
    // score, counted up (in the skin's number font when it has one)
    const scoreEl = h('div.res-score', '0');
    let digits = null;
    SkinManager.scoreFont().then(f => { if (!f) return; digits = skinDigits(f, 44, { align: 'center' }); scoreEl.classList.add('skinned'); scoreEl.replaceChildren(digits.el); digits.set(fmtScore(shown)); }).catch(() => {});
    let shown = 0;
    const t0 = performance.now(), dur = 1100 * (Settings.get('ui.animSpeed') > 0 ? 1 / Settings.get('ui.animSpeed') : 0);
    const tick = () => {
      const k = dur ? clamp((performance.now() - t0) / dur, 0, 1) : 1;
      shown = ScoreManager.value(s) * (1 - Math.pow(1 - k, 3));
      if (digits) digits.set(fmtScore(shown)); else scoreEl.textContent = fmtScore(shown);
      if (k < 1) this._cnt = requestAnimationFrame(tick);
    };
    tick();
    const pp = ScoreManager.ppOf(s);
    const stat = (k, v, title) => h('div.rs-stat', { title: title || '' }, h('div.k', k), h('div.v', v));
    const counts = s.counts || [0, 0, 0, 0, 0, 0];
    const mid = h('div.rs-mid',
      h('div.rs-map',
        h('div.rs-title', s.title), h('div.rs-artist', s.artist),
        h('div.rs-diff', starBadge(s.stars || 0), h('span.rs-version', { title: s.version }, s.version)),
        h('div.rs-mapper', h('span.muted', `${s.keys}K · mapped by `), h('b', s.creator || '?'))),
      ring,
      (s.mods || []).length ? h('div.rs-mods', ...s.mods.map(m => ModSystem.badge(m, false, s.modConfig || null))) : null,
      !s.passed ? h('div.rs-failed', 'FAILED') : null,
      scoreEl,
      h('div.rs-stats',
        stat('Accuracy', fmtAcc(s.accuracy)),
        stat('Max combo', fmtInt(s.maxCombo) + 'x'),
        stat('pp', fmtInt(pp), !s.passed || (s.mods || []).includes('AT') ? 'pp is only awarded for passes (not Auto)' : '')),
      h('div.rs-judges', ...JUDGEMENTS.map((j, i) => h('div.rs-j', h('div.k', { style: { color: j.color } }, j.short), h('div.v', fmtInt(counts[i]))))));
    if (p.fresh && s.passed && s.totalPpAfter != null && s.totalPpBefore != null && Math.round(s.totalPpAfter) > 0) {
      const d = s.totalPpAfter - s.totalPpBefore;
      mid.append(h('div.muted.res-ppdelta', `Total ${fmtInt(s.totalPpAfter)}pp (${d >= 0.5 ? '+' + fmtInt(d) : d <= -0.5 ? fmtInt(d) : '±0'})`));
    }
    if (s.isPB && p.fresh) mid.append(h('div.res-pb', '★ NEW PERSONAL BEST'));
    else if (s.prevBest && p.fresh && s.passed) {
      const me = ScoreManager.value(s), best = ScoreManager.value(s.prevBest);
      mid.append(h('div.muted.res-prev', `Personal best: ${fmtScore(best)} (${me >= best ? '+' : ''}${fmtInt(me - best)})`));
    }
    // osu!lazer: calibrate this beatmap's offset from the play you just finished
    const sug = p.fresh ? MapOffsets.suggestion(s.mapHash) : null;
    if (sug != null) {
      const cur = MapOffsets.get(s.mapHash);
      mid.append(h('button.btn.sm.res-calib', { title: 'Shifts this beatmap\'s offset by your average hit error', onclick: async e => {
        const btn = e.currentTarget;
        await MapOffsets.set(s.mapHash, cur + sug); MapOffsets.last = null; UISounds.click();
        btn.replaceWith(h('div.muted.res-calib', icon('check'), `Beatmap offset is now ${cur + sug > 0 ? '+' : ''}${cur + sug}ms`));
      } }, icon('clock'), `You hit ${Math.abs(sug)}ms ${sug > 0 ? 'late' : 'early'} on average · fix offset`));
    }
    return h('div.rs', { style: { '--rc': rc } }, top, mid);
  },
  rightCol(s) {
    const col = h('div.res-right', h('div.rs-head', 'Statistics'));
    const errs = (s.hitErrors || []).filter(e => !e[3]);
    const W = (s.windows || timingWindows({ od: s.od ?? 8 })).slice();
    const hist = h('div.panel.glass.chart-card', h('h3', 'Hit distribution'));
    const scatter = h('div.panel.glass.chart-card', h('h3', 'Timing over time', h('span.grow'), h('span', 'early ↑ · late ↓')));
    if (errs.length) {
      hist.append(Charts.histogram(errs.map(e => e[1]), W, s.meanError || 0));
      // lazer's statistic items under the graph: unstable rate and the average hit error (early / late)
      const me = s.meanError || 0;
      hist.append(h('div.res-stats',
        h('div.res-stat', h('span', 'Unstable rate'), h('b', (s.unstableRate || 0).toFixed(2))),
        h('div.res-stat', h('span', 'Average hit error'), h('b', `${Math.abs(me).toFixed(2)} ms ${Math.abs(me) < 0.005 ? '' : me < 0 ? 'early' : 'late'}`.trim())),
        h('div.res-stat', h('span', 'Timed hits'), h('b', fmtInt(errs.length)))));
      scatter.append(Charts.scatter(s.hitErrors, W));
      scatter.append(h('div.chart-legend', ...JUDGEMENTS.slice(0, 5).map(j => h('span', { style: { '--c': j.color } }, j.short))));
    } else {
      hist.append(h('div.empty', { style: { padding: '24px' } }, 'No timing data for this play.'));
      scatter.style.display = 'none';
    }
    col.append(hist);
    // Secondary graphs stay folded away to keep the screen simple.
    const more = h('details.res-more', h('summary', 'More statistics'));
    if (errs.length) more.append(scatter);
    const hl = s.healthTimeline || [];
    if (hl.length > 2) {
      const step = Math.max(1, Math.floor(hl.length / 240));
      const pts = hl.filter((_, i) => i % step === 0 || i === hl.length - 1).map(([t, v]) => ({ y: v * 100, tip: `${fmtTime(t)} · health ${Math.round(v * 100)}%` }));
      more.append(h('div.panel.glass.chart-card', h('h3', 'Health over time', h('span.grow'), h('span', `lowest ${Math.round(Math.min(...hl.map(x => x[1])) * 100)}%`)),
        Charts.line(pts, { height: 130, yMin: 0, yMax: 100, fmtY: v => Math.round(v) + '%', dots: false })));
    }
    if (more.children.length > 1) {
      col.append(more);
    }
    return col;
  },
  actions(s, p, map) {
    const replay = p.replay || null;
    const hasSaved = !!s.replayId || (replay && ReplayManager.list.some(r => r.id === replay.id));
    const bar = h('div.res-actions');
    const watch = h('button.btn', { onclick: () => this.watch() }, icon('film'), 'Watch replay');
    const save = h('button.btn', { onclick: async () => {
      if (!replay) return;
      await ReplayManager.save(replay);
      s.replayId = replay.id;
      Toast.ok('Replay saved', 'Find it in Replays.');
      save.disabled = true; save.textContent = 'Replay saved';
      bar.insertBefore(exp, save.nextSibling);
    } }, icon('save'), 'Save replay');
    const exp = h('button.btn.ghost', { onclick: async () => { const r = replay || await ReplayManager.get(s.replayId); if (r) ReplayManager.export(r); } }, icon('download'), 'Export .amr');
    bar.append(
      backButton(() => this.onBack()),
      h('button.btn.primary', { onclick: () => this.retry(), disabled: !map, title: 'Retry (R)' }, icon('retry'), 'Retry'));
    if (replay || s.replayId) bar.append(watch);
    if (replay && !hasSaved && p.watched !== 'auto' && p.watched !== 'replay') bar.append(save);
    if (hasSaved || p.watched === 'replay') bar.append(exp);
    bar.append(h('button.btn.ghost.res-share', { onclick: () => ShareCard.open(s), title: 'A picture of this result to copy or save' }, icon('upload'), 'Share'));
    if (!map) bar.append(h('span.muted', 'Beatmap no longer in library'));

    return bar;
  },
  async watch() {
    const s = this.p.score;
    const replay = this.p.replay || (s.replayId && await ReplayManager.get(s.replayId));
    if (!replay) { Toast.err('No replay available'); return; }
    const map = BeatmapManager.mapByHash(replay.mapHash);
    if (!map) { Toast.err('Beatmap not found', 'Import the beatmap to watch this replay.'); return; }
    Game.launch({ mapId: map.id, mode: 'replay', replay, returnTo: { ...this.p } });
  },
};

/** A 1200×630 picture of a result (the size link previews use), to copy, save or share anywhere. */
const ShareCard = {
  W: 1200, H: 630,
  async render(s) {
    const W = this.W, H = this.H;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const F = (w, px) => `${w} ${px}px Outfit, "Segoe UI", system-ui, sans-serif`;
    try { await Promise.all([800, 700, 500].map(w => document.fonts.load(F(w, 40)))); } catch (e) { /* system font */ }
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff66ab';
    // background: the beatmap's picture, blurred and darkened
    x.fillStyle = '#18171c'; x.fillRect(0, 0, W, H);
    const map = BeatmapManager.mapByHash(s.mapHash);
    const url = map ? await BeatmapManager.bgURL(map).catch(() => null) : null;
    const img = url ? await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = url; }) : null;
    if (img && img.naturalWidth) {
      const k = Math.max(W / img.naturalWidth, H / img.naturalHeight) * 1.08;
      const iw = img.naturalWidth * k, ih = img.naturalHeight * k;
      x.save(); x.filter = 'blur(8px)'; x.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih); x.restore();
    }
    let g = x.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(14,11,22,.93)'); g.addColorStop(0.55, 'rgba(14,11,22,.78)'); g.addColorStop(1, 'rgba(14,11,22,.62)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = accent; x.fillRect(0, 0, W, 6);
    const text = (t, px, y, { w = 700, color = '#fff', align = 'left', max = 0, xPos = 60 } = {}) => {
      x.font = F(w, px); x.fillStyle = color; x.textAlign = align; x.textBaseline = 'alphabetic';
      let str = String(t);
      if (max) while (str.length > 1 && x.measureText(str).width > max) str = str.slice(0, -2) + '…';
      x.fillText(str, xPos, y);
      return x.measureText(str).width;
    };
    const pill = (label, px, y, bg, fg = '#fff', h = 30, font = 16) => {
      x.font = F(700, font); const w = x.measureText(label).width + 22;
      x.fillStyle = bg; x.beginPath(); x.roundRect ? x.roundRect(px, y, w, h, h / 2) : x.rect(px, y, w, h); x.fill();
      x.fillStyle = fg; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillText(label, px + 11, y + h / 2 + 1); x.textBaseline = 'alphabetic';
      return w;
    };
    // beatmap
    text(s.title || 'Unknown', 44, 92, { w: 800, max: 760 });
    text(`${s.artist || ''}${s.creator ? ` · mapped by ${s.creator}` : ''}`, 24, 128, { w: 500, color: 'rgba(255,255,255,.75)', max: 760 });
    let px = 60;
    const sr = s.stars || 0, sc = starColour(sr);
    px += pill(`★ ${sr.toFixed(2)}`, px, 150, sc, sr >= 6.5 ? '#ffd966' : '#1a1a1a') + 8;
    px += pill(`[${s.version}]`, px, 150, 'rgba(255,255,255,.12)') + 8;
    px += pill(`${s.keys}K`, px, 150, 'rgba(255,255,255,.12)') + 8;
    for (const m of s.mods || []) { const d = MOD_BY_ID.get(m); px += pill(m, px, 150, d ? d.color : accent, '#1a1a1a') + 6; }
    // grade
    const label = s.grade === 'XH' ? 'SS' : s.grade === 'SH' ? 'S' : s.grade;
    const rc = RANK_COLOURS[s.grade] || '#fff', fill = ['#fff', rc];
    x.font = F(800, 210); x.textAlign = 'center';
    g = x.createLinearGradient(0, 250, 0, 450); g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1] || fill[0]);
    x.save(); x.shadowColor = fill[fill.length - 1]; x.shadowBlur = 40; x.fillStyle = g; x.fillText(label, 200, 440); x.restore();
    if (!s.passed) pill('FAILED', 150, 470, '#ff3b4f');
    // score and stats
    text(fmtScore(ScoreManager.value(s)), 76, 300, { w: 800, xPos: 380 });
    const stat = (k, v, i) => { const sx = 380 + i * 190; text(k, 17, 350, { w: 600, color: 'rgba(255,255,255,.6)', xPos: sx }); text(v, 34, 390, { w: 700, xPos: sx }); };
    const pp = ScoreManager.ppOf(s);
    stat('Accuracy', fmtAcc(s.accuracy), 0); stat('Max combo', fmtInt(s.maxCombo) + 'x', 1); stat('pp', fmtInt(pp), 2);
    if (s.unstableRate) stat('UR', s.unstableRate.toFixed(1), 3);
    // judgements
    const counts = s.counts || [0, 0, 0, 0, 0, 0];
    JUDGEMENTS.forEach((j, i) => {
      const jx = 380 + (i % 3) * 250, jy = 450 + Math.floor(i / 3) * 44;
      x.fillStyle = j.color; x.beginPath(); x.arc(jx + 7, jy - 7, 7, 0, Math.PI * 2); x.fill();
      text(j.short, 20, jy, { w: 600, color: 'rgba(255,255,255,.8)', xPos: jx + 24 });
      text(fmtInt(counts[i]), 22, jy, { w: 800, xPos: jx + 215, align: 'right' });
    });
    // footer
    x.fillStyle = 'rgba(255,255,255,.08)'; x.fillRect(0, H - 64, W, 64);
    text(`played by ${s.player || 'Player'} · ${new Date(s.date).toLocaleDateString(undefined, { dateStyle: 'medium' })}`, 20, H - 25, { w: 600, color: 'rgba(255,255,255,.8)' });
    const bw = text('mania', 22, H - 25, { w: 500, color: 'rgba(255,255,255,.85)', xPos: W - 60, align: 'right' });
    text('ashtonk!', 30, H - 25, { w: 800, color: accent, xPos: W - 64 - bw, align: 'right' });
    return new Promise(r => c.toBlob(r, 'image/png'));
  },
  fileName(s) { return `${s.artist} - ${s.title} [${s.version}] ${fmtAcc(s.accuracy)}.png`.replace(/[\\/:*?"<>|]/g, '_'); },
  /** Preview with Copy / Save / Share (the system share sheet, where the browser has one). */
  async open(s) {
    UISounds.click();
    const blob = await this.render(s);
    if (!blob) { Toast.err('Couldn\'t draw the result card'); return; }
    const url = URL.createObjectURL(blob);
    const file = new File([blob], this.fileName(s), { type: 'image/png' });
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    const copy = async () => {
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); Toast.ok('Result card copied', 'Paste it anywhere.'); }
      catch (e) { Toast.err('Couldn\'t copy the image', 'Your browser blocked it — use Save instead.'); }
    };
    const o = Dialog.custom('Share your result', h('img.share-card', { src: url, alt: 'Result card' }), [
      { label: 'Close' },
      ...(canShare ? [{ label: 'Share…', onClick: () => navigator.share({ files: [file], title: `${s.title} [${s.version}]` }).catch(() => {}) }] : []),
      { label: 'Save PNG', onClick: () => downloadBlob(blob, file.name) },
      ...(navigator.clipboard && window.ClipboardItem ? [{ label: 'Copy image', primary: true, onClick: copy }] : []),
    ]);
    const close = o.close;
    o.close = () => { URL.revokeObjectURL(url); close(); };
    return o;
  },
};

/** Small canvas chart helpers with hover tooltips (single-series, thin marks, recessive grid). */
const Charts = {
  _setup(heightPx) {
    const wrap = h('div.chart-wrap');
    const cv = h('canvas', { style: { height: heightPx + 'px' } });
    const tip = h('div.chart-tip', { hidden: true });
    wrap.append(cv, tip);
    return { wrap, cv, tip };
  },
  _ctx(cv) {
    const dpr = Zoom.dpr();
    const w = cv.clientWidth || 600, hh = cv.clientHeight || 160;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr);
    const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { x, w, h: hh };
  },
  _css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); },
  histogram(errs, W, mean) {
    const { wrap, cv, tip } = this._setup(170);
    // lazer's HitEventTimingDistributionGraph: 50 bins either side of a centre bin, sized from the widest hit
    const SIDE = 50, nb = SIDE * 2 + 1;
    const maxAbs = Math.max(1, ...errs.map(e => Math.abs(e)));
    const bin = Math.max(1, Math.ceil(maxAbs / SIDE));
    const range = (SIDE + 0.5) * bin;
    const bins = new Array(nb).fill(0);
    for (const e of errs) bins[clamp(Math.round(e / bin) + SIDE, 0, nb - 1)]++;
    const max = Math.max(...bins, 1);
    const colourAt = c => { let j = 0; while (j < 5 && Math.abs(c) > W[j]) j++; return JUDGEMENTS[Math.min(j, 4)].color; };
    let geo = null;
    const draw = hover => {
      const { x, w, h: H } = this._ctx(cv);
      const pad = { l: 8, r: 8, t: 8, b: 20 };
      const pw = w - pad.l - pad.r, ph = H - pad.t - pad.b;
      const bw = pw / nb;
      geo = { pad, pw, ph, bw };
      x.strokeStyle = 'rgba(255,255,255,.06)'; x.lineWidth = 1;
      for (let k = 1; k <= 3; k++) { const y = pad.t + ph * (1 - k / 4); x.beginPath(); x.moveTo(pad.l, y); x.lineTo(w - pad.r, y); x.stroke(); }
      const bwid = Math.max(1, bw * 0.7), rad = bwid / 2;
      bins.forEach((v, i) => {
        const bx = pad.l + i * bw + (bw - bwid) / 2;
        x.fillStyle = colourAt((i - SIDE) * bin);
        // empty bins stay as faint dots so the shape of the window still reads
        const hh = v ? Math.max(bwid, v / max * ph) : bwid;
        x.globalAlpha = !v ? 0.18 : hover === i ? 1 : 0.85;
        x.beginPath();
        x.roundRect ? x.roundRect(bx, pad.t + ph - hh, bwid, hh, rad) : x.rect(bx, pad.t + ph - hh, bwid, hh);
        x.fill();
      });
      x.globalAlpha = 1;
      const zx = pad.l + pw / 2;
      x.fillStyle = 'rgba(255,255,255,.28)'; x.fillRect(zx - 0.5, pad.t, 1, ph);
      const mx = pad.l + clamp((mean + range) / (2 * range), 0, 1) * pw;
      x.fillStyle = '#ffd54a'; x.fillRect(mx - 1, pad.t, 2, ph);
      x.fillStyle = this._css('--muted') || '#999'; x.font = '700 11px Torus, Outfit, system-ui'; x.textAlign = 'center';
      x.fillText(`-${Math.round(range)}ms (early)`, pad.l + 44, H - 5); x.fillText('0', zx, H - 5); x.fillText(`+${Math.round(range)}ms (late)`, w - pad.r - 44, H - 5);
    };
    requestAnimationFrame(() => draw(-1));
    new ResizeObserver(() => draw(-1)).observe(cv);
    cv.addEventListener('pointermove', e => {
      if (!geo) return;
      const r = cv.getBoundingClientRect();
      const i = Math.floor(((e.clientX - r.left) * Zoom.z - geo.pad.l) / geo.bw);
      if (i < 0 || i >= nb) { tip.hidden = true; draw(-1); return; }
      const c = (i - SIDE) * bin;
      tip.hidden = false; tip.textContent = `${bin > 1 ? `${c - Math.floor(bin / 2)} to ${c + Math.ceil(bin / 2) - 1}` : c}ms: ${bins[i]} hit${bins[i] === 1 ? '' : 's'}`;
      tip.style.left = (e.clientX - r.left) * Zoom.z + 'px'; tip.style.top = (e.clientY - r.top) * Zoom.z + 'px';
      draw(i);
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; draw(-1); });
    return wrap;
  },
  scatter(hitErrors, W) {
    const { wrap, cv, tip } = this._setup(170);
    const pts = hitErrors.filter(e => !e[3]);
    const range = W[J.BAD];
    const t0 = pts.length ? pts[0][0] : 0, t1 = pts.length ? pts[pts.length - 1][0] : 1;
    let geo = null;
    const draw = hi => {
      const { x, w, h: H } = this._ctx(cv);
      const pad = { l: 40, r: 8, t: 8, b: 8 };
      const pw = w - pad.l - pad.r, ph = H - pad.t - pad.b;
      geo = { pad, pw, ph };
      const Y = e => pad.t + ph / 2 + clamp(e, -range, range) / range * ph / 2;
      for (let j = 3; j >= 0; j--) {
        x.fillStyle = JUDGEMENTS[j].color; x.globalAlpha = 0.05;
        x.fillRect(pad.l, Y(-W[j]), pw, Y(W[j]) - Y(-W[j]));
      }
      x.globalAlpha = 1;
      x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(pad.l, Y(0) - 0.5, pw, 1);
      x.fillStyle = this._css('--muted') || '#999'; x.font = '700 10px Torus, Outfit, system-ui'; x.textAlign = 'right';
      x.fillText(`-${Math.round(range)}`, pad.l - 6, pad.t + 9); x.fillText('0', pad.l - 6, Y(0) + 3); x.fillText(`+${Math.round(range)}`, pad.l - 6, H - pad.b);
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const px = pad.l + (p[0] - t0) / Math.max(1, t1 - t0) * pw;
        x.fillStyle = JUDGEMENTS[p[2]].color;
        x.globalAlpha = hi === i ? 1 : 0.7;
        x.fillRect(px - 1.5, Y(p[1]) - 1.5, hi === i ? 5 : 3, hi === i ? 5 : 3);
      }
      x.globalAlpha = 1;
    };
    requestAnimationFrame(() => draw(-1));
    new ResizeObserver(() => draw(-1)).observe(cv);
    cv.addEventListener('pointermove', e => {
      if (!geo || !pts.length) return;
      const r = cv.getBoundingClientRect();
      const t = t0 + ((e.clientX - r.left) * Zoom.z - geo.pad.l) / geo.pw * (t1 - t0);
      let best = 0, bd = Infinity;
      for (let i = 0; i < pts.length; i++) { const d = Math.abs(pts[i][0] - t); if (d < bd) { bd = d; best = i; } }
      const p = pts[best];
      tip.hidden = false; tip.textContent = `${fmtTime(p[0])} · ${p[1] > 0 ? '+' : ''}${p[1]}ms · ${JUDGEMENTS[p[2]].name}`;
      tip.style.left = (e.clientX - r.left) * Zoom.z + 'px'; tip.style.top = (e.clientY - r.top) * Zoom.z + 'px';
      draw(best);
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; draw(-1); });
    return wrap;
  },
  /** Vertical bars over categories (stats page). data: [{label, value, tip}] */
  bars(data, { height = 180, color = null } = {}) {
    const { wrap, cv, tip } = this._setup(height);
    let geo = null;
    const draw = hi => {
      const { x, w, h: H } = this._ctx(cv);
      const pad = { l: 34, r: 6, t: 10, b: 22 };
      const pw = w - pad.l - pad.r, ph = H - pad.t - pad.b;
      const intData = data.every(d => Number.isInteger(d.value));
      let max = Math.max(1, ...data.map(d => d.value));
      if (intData) max = Math.max(4, Math.ceil(max / 4) * 4);
      const bw = pw / data.length;
      const maxBar = 56;
      geo = { pad, pw, ph, bw };
      x.strokeStyle = 'rgba(255,255,255,.06)'; x.fillStyle = this._css('--muted') || '#999'; x.font = '700 10px Torus, Outfit, system-ui'; x.textAlign = 'right';
      for (let k = 0; k <= 4; k++) {
        const y = pad.t + ph * (1 - k / 4);
        x.beginPath(); x.moveTo(pad.l, y); x.lineTo(w - pad.r, y); x.stroke();
        x.fillText(intData ? fmtInt(max * k / 4) : String(Math.round(max * k / 4 * 10) / 10), pad.l - 5, y + 3);
      }
      const col = color || this._css('--accent') || '#b07cff';
      data.forEach((d, i) => {
        const hh = d.value / max * ph;
        const bwid = Math.max(1, Math.min(maxBar, bw - 2)), bx = pad.l + i * bw + (bw - bwid) / 2;
        x.fillStyle = d.color || col; x.globalAlpha = hi === i ? 1 : 0.82;
        if (hh > 0) { x.beginPath(); x.roundRect ? x.roundRect(bx, pad.t + ph - hh, bwid, hh, [Math.min(4, bwid / 2), Math.min(4, bwid / 2), 0, 0]) : x.rect(bx, pad.t + ph - hh, bwid, hh); x.fill(); }
      });
      x.globalAlpha = 1; x.textAlign = 'center'; x.fillStyle = this._css('--muted') || '#999';
      const every = Math.ceil(data.length / 10);
      data.forEach((d, i) => { if (i % every === 0 || data.length <= 12) x.fillText(d.label, pad.l + (i + 0.5) * bw, H - 6); });
    };
    requestAnimationFrame(() => draw(-1));
    new ResizeObserver(() => draw(-1)).observe(cv);
    cv.addEventListener('pointermove', e => {
      if (!geo) return;
      const r = cv.getBoundingClientRect();
      const i = Math.floor(((e.clientX - r.left) * Zoom.z - geo.pad.l) / geo.bw);
      if (i < 0 || i >= data.length) { tip.hidden = true; draw(-1); return; }
      tip.hidden = false; tip.textContent = data[i].tip || `${data[i].label}: ${data[i].value}`;
      tip.style.left = (e.clientX - r.left) * Zoom.z + 'px'; tip.style.top = (e.clientY - r.top) * Zoom.z + 'px';
      draw(i);
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; draw(-1); });
    return wrap;
  },
  /** Line chart (single series). pts: [{x, y, tip}] */
  line(pts, { height = 180, yMin = null, yMax = null, fmtY = v => v, dots = true } = {}) {
    const { wrap, cv, tip } = this._setup(height);
    let geo = null;
    const draw = hi => {
      const { x, w, h: H } = this._ctx(cv);
      const pad = { l: 46, r: 10, t: 10, b: 10 };
      const pw = w - pad.l - pad.r, ph = H - pad.t - pad.b;
      const ys = pts.map(p => p.y);
      const lo = yMin ?? Math.min(...ys), hi2 = yMax ?? Math.max(...ys);
      const span = Math.max(1e-6, hi2 - lo);
      const X = i => pad.l + (pts.length < 2 ? pw / 2 : i / (pts.length - 1) * pw);
      const Y = v => pad.t + ph * (1 - (v - lo) / span);
      geo = { pad, pw, X };
      x.strokeStyle = 'rgba(255,255,255,.06)'; x.fillStyle = this._css('--muted') || '#999'; x.font = '700 10px Torus, Outfit, system-ui'; x.textAlign = 'right';
      for (let k = 0; k <= 4; k++) { const v = lo + span * k / 4, y = Y(v); x.beginPath(); x.moveTo(pad.l, y); x.lineTo(w - pad.r, y); x.stroke(); x.fillText(fmtY(v), pad.l - 5, y + 3); }
      const acc = this._css('--accent') || '#b07cff';
      x.strokeStyle = acc; x.lineWidth = 2; x.lineJoin = 'round'; x.beginPath();
      pts.forEach((p, i) => i ? x.lineTo(X(i), Y(p.y)) : x.moveTo(X(i), Y(p.y))); x.stroke();
      pts.forEach((p, i) => {
        if (!dots && hi !== i) return;
        x.fillStyle = this._css('--panel-solid') || '#111'; x.beginPath(); x.arc(X(i), Y(p.y), hi === i ? 6 : 4, 0, Math.PI * 2); x.fill();
        x.fillStyle = acc; x.beginPath(); x.arc(X(i), Y(p.y), hi === i ? 4.5 : 3, 0, Math.PI * 2); x.fill();
      });
    };
    requestAnimationFrame(() => draw(-1));
    new ResizeObserver(() => draw(-1)).observe(cv);
    cv.addEventListener('pointermove', e => {
      if (!geo || !pts.length) return;
      const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * Zoom.z;
      let best = 0, bd = Infinity;
      pts.forEach((p, i) => { const d = Math.abs(geo.X(i) - mx); if (d < bd) { bd = d; best = i; } });
      tip.hidden = false; tip.textContent = pts[best].tip;
      tip.style.left = geo.X(best) + 'px'; tip.style.top = (e.clientY - r.top) * Zoom.z + 'px';
      draw(best);
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; draw(-1); });
    return wrap;
  },
};

/** A page laid out like an osu!lazer overlay (OverlayHeader): a title band in the overlay's Dark5 with its icon and
 *  lowercase title, the actions on the right, optional tabs on Dark4 underneath, then the body in Background5.
 *  `hue` picks the overlay colour scheme (lazer: Blue 200, Pink 333, Plum 320, Orange 45, Aquamarine 160, …). */
const OVERLAY_HUES = { red: 0, orange: 45, lime: 90, green: 125, aquamarine: 160, blue: 200, purple: 255, plum: 320, pink: 333 };
function overlayHeader(title, { icon: ic = 'star', sub = null, actions = [], tabs = null } = {}) {
  return h('div.ov-head',
    h('div.ov-titlebar', h('div.ov-inner',
      h('span.ov-icon', icon(ic)), h('h1', title), sub ? h('span.ov-sub', sub) : null, h('div.grow'), ...actions)),
    tabs ? h('div.ov-tabs', h('div.ov-inner', tabs)) : null);
}
function pageShell(title, sub, actions = [], { icon: ic = 'star', hue = 'purple', tabs = null, wide = false } = {}) {
  const body = h('div.screen-body');
  const page = h('div.page');
  body.append(overlayHeader(title, { icon: ic, sub, actions, tabs }), h('div.ov-content', page));
  const el = h(`div.ov${wide ? '.ov-wide' : ''}`, { style: { '--o-h': OVERLAY_HUES[hue] ?? hue } }, body, h('div.page-back', backButton(() => Screens.back())));
  return { el, page };
}

async function importViaPicker(accept, directory = false) {
  const files = await pickFiles({ accept, multiple: true, directory });
  if (files.length) await App.importFiles(files);
}

    const secs = [];

    const sub = (title, count, ...kids) => h('div.pf-subsec', h('h3', title, count != null ? h('span.pf-count', fmtInt(count)) : null), ...kids);

    const ranks = section('ranks', 'Ranks',
      sub('Best performance', topPlays.length, topPlays.length

        : h('div.pf-empty', 'No performance records. Pass a map to earn pp.')));
    const recent = ScoreManager.recent(10);
    const rec = section('recent', 'Recent',
      sub('Recent plays', recent.length, recent.length
        ? h('div.pf-scores', ...recent.map(s => this.scoreRow(s, s.passed ? fmtInt(ScoreManager.ppOf(s)) : null)))
        : h('div.pf-empty', 'No recent plays.')));

    const tabs = h('div.pf-tabs', ...secs.map(([id, title, el]) => h('button.ov-tab', { onclick: () => { UISounds.click(); pinned = id; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); [...tabs.children].forEach((b, i) => b.classList.toggle('on', secs[i][0] === id)); } }, title.toLowerCase())));
    page.append(h('div.pf-header', top, centre, detail), tabs, hist, ranks, rec);
    // lazer lights the tab of the section you're reading
    requestAnimationFrame(() => {
      let sc = tabs.parentElement;
      while (sc && !/(auto|scroll)/.test(getComputedStyle(sc).overflowY)) sc = sc.parentElement;
      if (!sc) return;
      const sync = () => {
        if (!tabs.isConnected) { sc.removeEventListener('scroll', sync); return; }
        if (pinned) return;
        const line = tabs.getBoundingClientRect().bottom + 60;
        let cur = secs[0][0];
        for (const [id, , el] of secs) if (el.getBoundingClientRect().top < line) cur = id;
        if (sc.scrollTop > 0 && sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2) cur = secs[secs.length - 1][0];
        [...tabs.children].forEach((b, i) => b.classList.toggle('on', secs[i][0] === cur));
      };
      sc.addEventListener('scroll', sync, { passive: true });
      const unpin = () => { if (pinned) { pinned = null; sync(); } };
      sc.addEventListener('wheel', unpin, { passive: true });
      sc.addEventListener('pointerdown', e => { if (!e.target.closest('.pf-tabs')) unpin(); });
      sync();
    });
  },
  /** lazer's DrawableProfileScore: rank pill, title / artist, difficulty and date, mods, accuracy, and the pp in a

  },
};

class SkinPreview {
  /** scrollSpeed: scroll at the player's scroll speed setting instead of a fixed demo speed. */
  constructor(canvas, { scrollSpeed = false } = {}) { this.canvas = canvas; this.renderer = new ManiaRenderer(canvas); this.running = false; this.useSpeed = scrollSpeed; }
  async show(skin, keys) {
    this.token = {};
    const tok = this.token;
    // (the previous skin may be unloaded while the new one loads: stop drawing its health bar now)
    if (this.hpBar) { this.hpBar.el.remove(); this.hpBar = null; }
    const layout = await skin.mania(keys);
    if (tok !== this.token) return;
    this.keys = keys;
    this.renderer.setLayout(layout);
    // show the health bar the way gameplay will: the skin's own bar in the corner, the skin's or the slim bar beside
    // the stage (the osu!lazer bar lives in the gameplay HUD, so the preview shows none for it)
    const hm = healthModeFor(layout);
    this.renderer.healthMode = hm === 'stage' || hm === 'skinstage' ? hm : null;
    if (hm === 'skin' && this.canvas.parentElement) { this.hpBar = new SkinHealthBar(layout); this.canvas.parentElement.append(this.hpBar.el); }
    // demo pattern: stairs, chords, jacks and long notes
    const notes = [];
    let t = 800;
    for (let bar = 0; bar < 6; bar++) {
      for (let i = 0; i < keys; i++) notes.push({ col: i, time: t + i * 110, end: t + i * 110, isLN: false });
      t += keys * 110 + 150;
      notes.push({ col: 0, time: t, end: t + 700, isLN: true }, { col: keys - 1, time: t + 200, end: t + 900, isLN: true });
      if (keys > 2) notes.push({ col: Math.floor(keys / 2), time: t + 350, end: t + 350, isLN: false }, { col: Math.floor(keys / 2) - (keys > 3 ? 1 : 0), time: t + 350, end: t + 350, isLN: false });
      t += 1100;
    }
    notes.sort((a, b) => a.time - b.time || a.col - b.col);
    const fixed = [];
    const last = new Array(keys).fill(-1e9);
    for (const n of notes) { if (n.time <= last[n.col] + 30) continue; last[n.col] = n.end; fixed.push(n); }
    this.notes = fixed; this.end = t + 500;
    this.reset();
    if (!this.running) { this.running = true; this.loop(); }
  }
  reset() {
    this.engine = new GameplayEngine({ notes: this.notes, keys: this.keys, windows: timingWindows({ od: 8 }), noFail: true });
    this.engine.onEvent(e => { if (e.type === 'judgement') this.renderer.onJudgement(e, performance.now()); });
    this.feed = generateAutoInputs(this.engine.notes, this.keys);
    this.fi = 0; this.held = new Array(this.keys).fill(false); this.t0 = performance.now();
  }
  loop() {
    const frame = () => {
      if (!this.running) return;
      this._raf = requestAnimationFrame(frame);
      if (!this.engine) return;
      const now = performance.now() - this.t0;
      if (now > this.end) { this.reset(); return; }
      while (this.fi < this.feed.length && this.feed[this.fi][0] <= now) {
        const [tt, c, d] = this.feed[this.fi++];
        this.held[c] = !!d; if (!d) this.renderer.onRelease(c, performance.now());
        this.engine.input(c, !!d, tt);
      }
      this.engine.advance(now);
      this.renderer.render({ now, posNow: now, scroll: { pos: t => t, posAt: t => t }, pxPerMs: (this.useSpeed ? this.renderer.scrollLength : this.renderer.hitY) / (this.useSpeed ? 11485 / Settings.get('gameplay.scrollSpeed') : 520), engine: this.engine, held: this.held, hidden: null, realNow: performance.now() });
      // (Auto never loses health: the demo bar rises and falls so the skin's low-health look shows too)
      if (this.hpBar) this.hpBar.update(0.6 + 0.4 * Math.cos(now / 1800), performance.now());
    };
    frame();
  }
  stop() { this.running = false; cancelAnimationFrame(this._raf); if (this.hpBar) { this.hpBar.el.remove(); this.hpBar = null; } }
}

/* Beatmap Explorer — search osu!mania beatmaps online and download them straight into the library.
 * On the Cloudflare deployment it talks to the same-origin Worker (/api/search, /api/download/:id),
 * which uses the official osu! API (if configured) or public mirrors. When the page is not served
 * by the Worker (e.g. a local copy) it calls the mirrors directly, which works where they allow CORS. */

const OnlineBeatmaps = {
  apiAvailable: null,
  PAGE: 40,
  DIRECT_SEARCH: [
    p => `https://catboy.best/api/v2/search?q=${encodeURIComponent(p.q)}&mode=3&limit=40&offset=${p.page * 40}${p.status !== 'any' && p.status !== 'leaderboard' ? `&status=${({ ranked: 1, qualified: 3, loved: 4, pending: 0, wip: -1, graveyard: -2 })[p.status] ?? 1}` : ''}${p.sort ? `&sort=${p.sort}` : ''}`,
    p => `https://api.nerinyan.moe/search?q=${encodeURIComponent(p.q)}&m=3&ps=40&p=${p.page}&s=${p.status === 'any' ? 'all' : p.status === 'leaderboard' ? 'ranked,approved,qualified,loved' : p.status}${p.sort ? `&sort=${p.sort}` : ''}`,
  ],
  // Web-Osu-Mania's providers ($setId = the beatmap set number)
  DOWNLOAD_PROVIDERS: {
    mino: 'https://catboy.best/d/$setId', nerinyan: 'https://api.nerinyan.moe/d/$setId?noVideo=true',
    sayobot: 'https://dl.sayobot.cn/beatmaps/download/novideo/$setId', osudirect: 'https://osu.direct/api/d/$setId',
    nekoha: 'https://mirror.nekoha.moe/api4/download/$setId',
  },
  PREVIEW_PROVIDERS: { official: 'https://b.ppy.sh/preview/$setId.mp3', beatconnect: 'https://beatconnect.io/preview/$setId.mp3', sayobot: 'https://cdnx.sayobot.cn:25225/preview/$setId.mp3' },
  COVER_PROVIDERS: { official: 'https://assets.ppy.sh/beatmaps/$setId/covers/$kind.jpg', sayobot: 'https://a.sayobot.cn/beatmaps/$setId/covers/cover.webp' },
  _covers: new Map(),
  fill(tpl, id, kind = 'cover') { return String(tpl).split('$setId').join(id).split('$kind').join(kind); },
  /** Where to download a set from, in the order to try (chosen provider first, then the rest). */
  downloadURLs(id, viaServer) {
    const choice = Settings.get('online.downloadSource');
    const custom = choice === 'custom' && /\$setId/.test(Settings.get('online.customDownload') || '') ? this.fill(Settings.get('online.customDownload').trim(), id) : null;
    const order = Object.keys(this.DOWNLOAD_PROVIDERS).sort((a, b) => (b === choice) - (a === choice));
    const direct = order.map(k => this.fill(this.DOWNLOAD_PROVIDERS[k], id));

  },

  async checkApi() {
    if (this.apiAvailable !== null) return this.apiAvailable;
    if (!/^https?:/.test(location.protocol)) return (this.apiAvailable = false);
    try {
      const r = await fetch('api/health', { cache: 'no-store' });
      this.apiAvailable = r.ok && /json/.test(r.headers.get('content-type') || '');
    } catch (e) { this.apiAvailable = false; }

  },
  /** Mirror/osu! set → compact form (same shape as the Worker's normalizeSet). */
  normalize(raw) {
    if (!raw || typeof raw !== 'object') return null;

      id: Number(b.id ?? b.BeatmapID ?? 0),
      mode: b.mode_int ?? (typeof b.mode === 'number' ? b.mode : b.mode === 'mania' ? 3 : b.Mode ?? (b.mode === undefined ? 3 : -1)),
      version: String(b.version ?? b.DiffName ?? 'Normal'), stars: Number(b.difficulty_rating ?? b.DifficultyRating ?? 0),
      keys: Math.round(Number(b.cs ?? b.CS ?? 4)), od: Number(b.accuracy ?? b.OD ?? 0), hp: Number(b.drain ?? b.HP ?? 0),
      bpm: Number(b.bpm ?? b.BPM ?? raw.bpm ?? 0), length: Number(b.total_length ?? b.TotalLength ?? 0),
      notes: Number(b.count_circles ?? 0), lns: Number(b.count_sliders ?? 0),
    })).filter(d => Number(d.mode) === 3).sort((a, b) => a.stars - b.stars);
    if (!diffs.length) return null;
    const st = raw.status ?? raw.ranked ?? raw.RankedStatus;
    const names = { '-2': 'graveyard', '-1': 'wip', 0: 'pending', 1: 'ranked', 2: 'approved', 3: 'qualified', 4: 'loved' };
    return {
      id, title: String(raw.title ?? raw.Title ?? ''), titleUnicode: String(raw.title_unicode ?? raw.title ?? ''),
      artist: String(raw.artist ?? raw.Artist ?? ''), artistUnicode: String(raw.artist_unicode ?? raw.artist ?? ''),
      creator: String(raw.creator ?? raw.Creator ?? ''), source: String(raw.source ?? ''),
      status: /^-?\d+$/.test(String(st)) ? (names[st] || 'pending') : String(st || 'pending'),
      playCount: Number(raw.play_count ?? raw.PlayCount ?? 0), favourites: Number(raw.favourite_count ?? raw.Favourites ?? 0),
      video: !!(raw.video ?? raw.HasVideo), nsfw: !!raw.nsfw, diffs,
      rankedDate: raw.ranked_date ?? raw.RankedDate ?? raw.approved_date ?? null, lastUpdated: raw.last_updated ?? raw.LastUpdate ?? null, rating: Number(raw.rating ?? raw.Rating ?? 0) || this.ratingOf(raw.ratings),
      genreId: raw.genre_id ?? raw.genre?.id ?? null, languageId: raw.language_id ?? raw.language?.id ?? null,
    };
  },
  /** Average rating from vote counts (index = score), for sources that don't send the average. */
  ratingOf(v) {
    if (!Array.isArray(v)) return 0;
    let n = 0, sum = 0;
    v.forEach((c, i) => { if (i > 0) { n += +c || 0; sum += i * (+c || 0); } });

  },
  async search(p) {
    // like Web-Osu-Mania, "sort" is only sent when it isn't the default: osu! then picks its own order (relevance
    // for a text search, last update for pending / WIP / graveyard, newest ranked otherwise)
    p = { status: 'leaderboard', ...p };

    const params = new URLSearchParams({ q: p.q || '', status: p.status, page: String(p.page || 0) });
    if (p.keys.length) params.set('keys', p.keys.join(','));

    if (p.genre) params.set('g', p.genre);
    if (p.language) params.set('l', p.language);
    if (p.nsfw === false) params.set('nsfw', 'false');
    if (p.minStars > 0) params.set('minStars', p.minStars);
    if (p.maxStars < 20) params.set('maxStars', p.maxStars);
    if (p.cursor) params.set('cursor', p.cursor);
    if (p.provider) params.set('provider', p.provider);

      const r = await fetch('api/search?' + params);
      const d = await r.json().catch(() => ({}));

      return d;

    const errors = [];
    // mirrors differ on "rating" and "relevance": if one rejects the sort, ask again in its default order
    // (the explorer sorts what comes back itself)
    const want = p.sort || (p.q ? 'relevance_desc' : 'ranked_desc');
    const sorts = want.startsWith('relevance') ? [null] : want === 'ranked_desc' ? [want] : [want, null];

        const r = await fetch(u({ ...p, q, sort }));
        if (!r.ok) { errors.push(`${new URL(u(p)).host}: HTTP ${r.status}`); continue; }

          .map(s => ({ ...s, diffs: s.diffs.filter(d => (!p.keys.length || p.keys.includes(d.keys)) && d.stars >= p.minStars && d.stars <= p.maxStars) }))
          .filter(s => s.diffs.length);

      } catch (e) { errors.push(`${new URL(u(p)).host}: ${e.message}`); }
    }
    throw Object.assign(new Error('The beatmap servers aren\'t answering right now. Try again in a minute.'), {
      details: errors.join('\n') + '\nTip: the explorer works best on the Cloudflare deployment (its server searches osu! and the mirrors for you).' });
  },
  /** Download an .osz with progress; returns a File. */
  async download(id, onProgress) {
    const urls = this.downloadURLs(id, Settings.get('online.proxyDownloads') && await this.checkApi());

    for (const url of urls) {

        const r = await fetch(url);

        if (!r.ok || /json|html|text/.test(ct)) { lastErr = new Error(`HTTP ${r.status}`); continue; }

  async downloadAndImport(set, onProgress, { quiet = false } = {}) {

    if (!report.sets.length) throw new Error(report.errors.join('\n') || 'The archive had no playable difficulties.');

  coverURL(id, kind = 'card') {

  /** Load a set's cover into `el` as its background, trying each size in turn (older sets lack the @2x ones). */

// Categories and sorting as on osu! and Web-Osu-Mania: "Has leaderboard", newest ranked first by default.
const EXPLORE_STATUSES = [['any', 'Any'], ['leaderboard', 'Has leaderboard'], ['ranked', 'Ranked'], ['qualified', 'Qualified'], ['loved', 'Loved'], ['pending', 'Pending'], ['wip', 'WIP'], ['graveyard', 'Graveyard']];

// osu!'s genre and language ids, in the order osu! (and Web-Osu-Mania) list them
const EXPLORE_GENRES = [[0, 'Any'], [1, 'Unspecified'], [2, 'Video Game'], [3, 'Anime'], [4, 'Rock'], [5, 'Pop'], [6, 'Other'], [7, 'Novelty'], [9, 'Hip Hop'], [10, 'Electronic'], [11, 'Metal'], [12, 'Classical'], [13, 'Folk'], [14, 'Jazz']];
const EXPLORE_LANGUAGES = [[0, 'Any'], [2, 'English'], [4, 'Chinese'], [7, 'French'], [8, 'German'], [11, 'Italian'], [3, 'Japanese'], [6, 'Korean'], [10, 'Spanish'], [9, 'Swedish'], [12, 'Russian'], [13, 'Polish'], [5, 'Instrumental'], [1, 'Unspecified'], [14, 'Other']];

function statusMatches(set, status) {
  if (status === 'any') return true;
  if (status === 'leaderboard') return ['ranked', 'approved', 'qualified', 'loved'].includes(set.status);
  if (status === 'ranked') return set.status === 'ranked' || set.status === 'approved';
  return set.status === status;
}

function genreLanguage(set) {
  const g = set.genreId > 1 ? (EXPLORE_GENRES.find(([v]) => v === set.genreId) || [])[1] : null;
  const l = set.languageId > 1 ? (EXPLORE_LANGUAGES.find(([v]) => v === set.languageId) || [])[1] : null;
  return [g, l].filter(Boolean).join(' · ');
}
/** Order loaded results by the chosen criterion (stable), so pages from any source line up the same way. */
function sortOnlineSets(list, sort, dir) {
  const date = s => Date.parse(s.rankedDate || s.lastUpdated || '') || 0;
  const key = {
    title: s => s.title.toLowerCase(), artist: s => s.artist.toLowerCase(),
    difficulty: s => s.diffs[0] ? s.diffs[0].stars : 0, ranked: date, rating: s => s.rating || 0,
    plays: s => s.playCount || 0, favourites: s => s.favourites || 0,
    updated: s => Date.parse(s.lastUpdated || s.rankedDate || '') || 0,
  }[sort];
  if (!key) return list; // relevance: keep the server's order
  const sign = dir === 'asc' ? 1 : -1;
  return list.map((s, i) => [s, key(s), i]).sort((a, b) => {
    const x = a[1], y = b[1];
    const c = typeof x === 'string' ? x.localeCompare(y) : x - y;
    return c ? c * sign : a[2] - b[2];
  }).map(e => e[0]);
}
