/** Legacy mania health: calibrates hpMultiplierNormal by simulating a perfect play, then applies
 *  per-judgement increases (hold-tail misses cost half). */
function computeHpMultiplier(notes, hp, breaks = [], rawHp = hp) {
  const lowestHpEver = OsuMath.difficultyRange(hp, 0.975, 0.8, 0.3);
  const lowestHpEnd = OsuMath.difficultyRange(hp, 0.99, 0.9, 0.4);
  const hpRecoveryAvailable = OsuMath.difficultyRange(hp, 0.04, 0.02, 0);
  let hpMultiplierNormal = 1;
  if (!notes.length) return 1;
  const heads = notes.slice().sort((a, b) => a.time - b.time);
  const drainStart = heads[0].time;
  const increaseFor = (j, hold) => healthIncrease(j, rawHp, hold, hpMultiplierNormal);
  let testDrop = 0.00025;
  for (let guard = 0; guard < 4000; guard++) {
    let currentHp = 1, currentHpUncapped = 1, lastTime = drainStart, currentBreak = 0, fail = false, count = 0;
    const reduce = amt => { currentHpUncapped = Math.max(0, currentHpUncapped - amt); currentHp = Math.max(0, currentHp - amt); };
    const increase = hold => { const a = increaseFor(J.MARV, hold); currentHpUncapped += a; currentHp = Math.max(0, Math.min(1, currentHp + a)); };
    for (const h of heads) {
      count++;
      while (currentBreak < breaks.length && breaks[currentBreak].end <= h.time) { lastTime = h.time; currentBreak++; }
      reduce(testDrop * (h.time - lastTime));
      lastTime = h.end;
      if (currentHp <= lowestHpEver) { fail = true; testDrop *= 0.96; break; }
      const reduction = testDrop * (h.end - h.time);
      const overkill = Math.max(0, reduction - currentHp);
      reduce(reduction);
      if (h.isLN) { increase(true); increase(true); }
      if (overkill > 0 && currentHp - overkill <= lowestHpEver) { fail = true; testDrop *= 0.96; break; }
      if (!h.isLN) increase(false);
    }
    if (!fail && currentHp < lowestHpEnd) { fail = true; testDrop *= 0.94; hpMultiplierNormal *= 1.01; }
    const recovery = (currentHpUncapped - 1) / Math.max(1, count);
    if (!fail && recovery < hpRecoveryAvailable) { fail = true; testDrop *= 0.96; hpMultiplierNormal *= 1.01; }
    if (!fail && !isFinite(hpMultiplierNormal)) return 1;
    if (!fail) return hpMultiplierNormal;
  }
  return hpMultiplierNormal;
}
function healthIncrease(j, hp, hold, mult = 1) {
  switch (j) {
    case J.MISS: return hold ? -(hp + 1) * 0.00375 : -(hp + 1) * 0.0075;
    case J.BAD: return -(hp + 1) * 0.0016;
    case J.GOOD: return 0;
    case J.GREAT: return mult * (0.004 - hp * 0.0004);
    case J.PERF: return mult * (0.005 - hp * 0.0005);
    default: return mult * (0.0055 - hp * 0.0005);
  }
}

/** Star rating: port of osu!lazer's ManiaDifficultyCalculator (Strain skill). */
const ManiaStarRating = {
  DIFFICULTY_MULTIPLIER: 0.018, INDIVIDUAL_DECAY_BASE: 0.125, OVERALL_DECAY_BASE: 0.3,
  DECAY_WEIGHT: 0.9, SECTION_LENGTH: 400, RELEASE_THRESHOLD: 30,

  calculate(notes, keys, rate = 1) {
    if (notes.length < 2) return 0;
    const hos = notes.map(n => ({ startTime: n.time / rate, endTime: (n.isLN ? n.end : n.time) / rate, column: n.col }))
      .sort((a, b) => Math.round(a.startTime) - Math.round(b.startTime));

    return this._strain(objs, keys) * this.DIFFICULTY_MULTIPLIER;
  },
  _diffObjects(hos, keys) {
    const objects = [], perCol = Array.from({ length: keys }, () => []);
    for (let i = 1; i < hos.length; i++) {
      const cur = hos[i], last = hos[i - 1];
      const col = perCol[cur.column] || (perCol[cur.column] = []);
      const prevInCol = col[col.length - 1] || null;
      const prevs = new Array(keys).fill(null);
      if (objects.length) {
        const p = objects[objects.length - 1];
        for (let j = 0; j < keys; j++) prevs[j] = p.prevs[j];
        prevs[p.column] = p;
      }
      const o = {
        index: objects.length, startTime: cur.startTime, endTime: cur.endTime, deltaTime: cur.startTime - last.startTime,
        column: cur.column, columnStrainTime: prevInCol ? cur.startTime - prevInCol.startTime : cur.startTime, prevs,
      };
      objects.push(o); col.push(o);
    }
    return objects;
  },
  _strain(objects, keys) {
    const decay = (v, dt, base) => v * Math.pow(base, dt / 1000);
    const bigger = (a, b, d) => a - b > d;
    const logistic = (x, mid, mul, max = 1) => max / (1 + Math.exp(mul * (mid - x)));
    const indiv = new Array(keys).fill(0);
    let highestIndiv = 0, overall = 1, currentStrain = 0, sectionPeak = 0, sectionEnd = 0;
    const peaks = [];
    for (const cur of objects) {
      if (cur.index === 0) sectionEnd = Math.ceil(cur.startTime / this.SECTION_LENGTH) * this.SECTION_LENGTH;
      while (cur.startTime > sectionEnd) {
        peaks.push(sectionPeak);
        const prev = cur.index > 0 ? objects[cur.index - 1] : null;
        const prevStart = prev ? prev.startTime : cur.startTime;
        sectionPeak = decay(highestIndiv, sectionEnd - prevStart, this.INDIVIDUAL_DECAY_BASE) + decay(overall, sectionEnd - prevStart, this.OVERALL_DECAY_BASE);
        sectionEnd += this.SECTION_LENGTH;
      }
      currentStrain *= Math.pow(1, cur.deltaTime / 1000);

      let holdFactor = 1;
      for (const p of cur.prevs) {
        if (p && bigger(p.endTime, cur.endTime, 1) && bigger(cur.startTime, p.startTime, 1)) { holdFactor = 1.25; break; }
      }
      indiv[cur.column] = decay(indiv[cur.column], cur.columnStrainTime, this.INDIVIDUAL_DECAY_BASE) + 2 * holdFactor;
      highestIndiv = cur.deltaTime <= 1 ? Math.max(highestIndiv, indiv[cur.column]) : indiv[cur.column];
      // overall strain
      let overlapping = false, closestEnd = Math.abs(cur.endTime - cur.startTime), hf = 1, holdAdd = 0;
      for (const p of cur.prevs) {
        if (!p) continue;
        overlapping = overlapping || (bigger(p.endTime, cur.startTime, 1) && bigger(cur.endTime, p.endTime, 1) && bigger(cur.startTime, p.startTime, 1));
        if (bigger(p.endTime, cur.endTime, 1) && bigger(cur.startTime, p.startTime, 1)) hf = 1.25;
        closestEnd = Math.min(closestEnd, Math.abs(cur.endTime - p.endTime));
      }
      if (overlapping) holdAdd = logistic(closestEnd, this.RELEASE_THRESHOLD, 0.27);
      overall = decay(overall, cur.deltaTime, this.OVERALL_DECAY_BASE) + (1 + holdAdd) * hf;
      currentStrain += highestIndiv + overall - currentStrain;
      sectionPeak = Math.max(currentStrain, sectionPeak);
    }
    peaks.push(sectionPeak);
    let diff = 0, w = 1;
    for (const p of peaks.filter(x => x > 0).sort((a, b) => b - a)) { diff += p * w; w *= this.DECAY_WEIGHT; }
    return diff;
  },
};

/* Renderer — Canvas 2D mania stage renderer driven by the TimingEngine clock.

  constructor(segs) { this.segs = segs; this.i = 0; }
  pos(t) {
    const s = this.segs;
    let i = this.i;
    if (i >= s.length) i = s.length - 1;
    if (t < s[i].time) { i = bsearchLE(s, t, 'time'); if (i < 0) i = 0; }
    else while (i + 1 < s.length && s[i + 1].time <= t) i++;

}

  /** Render a frame. g: {now, posNow, scroll:ScrollMap, pxPerMs, engine, held[], hidden:'HD'|'FI'|null, realNow} */
  render(g) {
    const L = this.layout;

    const ctx = this.ctx, s = this.s, K = L.keys, H = this.H;
    const realNow = g.realNow ?? performance.now();
    ctx.setTransform(1, 0, 0, 1, -this.cropX, 0);

    ctx.save();
    ctx.translate(this.stageX, 0);
    this._tx = this.stageX - this.cropX;

    // column backgrounds, snapped to whole device pixels: adjacent columns then share an exact edge instead of
    // two anti-aliased half-covered pixels, which let the background show through as thin vertical seams
    const sx = this.stageX;
    for (let i = 0; i < K; i++) {
      const x0 = Math.round(sx + this.colX[i]) - sx, x1 = Math.round(sx + this.colX[i] + this.colW[i]) - sx;
      ctx.fillStyle = rgba(L.colours.column[i], Settings.get('gameplay.stageOpacity'));
      ctx.fillRect(x0, 0, x1 - x0, H);

      }

    const noteOffset = Settings.get('gameplay.noteOffset') * s;

    // stage light (key press glow)
    if (Settings.get('skin.effects')) {

        const t = L.tinted.stageLight[i];
        if (!t) continue;
        let a = 0;
        if (g.held[i]) a = 1; else { const dt = realNow - this.keyLight[i]; if (dt < 120) a = 1 - dt / 120; }
        if (a <= 0) continue;
        ctx.globalAlpha = a;
        const h = t.h * (this.legacy ? this.u : s);
        const bottom = (L.lightPosition + Settings.get('gameplay.hitPositionOffset')) * s;
        this._cropImg(t.frameAt(realNow), this.colX[i], bottom - h, this.colW[i], h, this.up);
        ctx.globalAlpha = 1;

      const t = L.tex.stageHint, h = t.h * (this.legacy ? this.u : s);

    const drawKeys = () => {
      for (let i = 0; i < K; i++) {

        const t = down ? L.tex.keyD[i] : L.tex.key[i];
        if (!t) continue;
        const flip = down ? this.fl.keyD[i] : this.fl.key[i];
        if (this.legacy && !t.fromDefault) {

          // (a 4K skin played at more keys shrinks its keys about the hit position, as its columns shrank)
          const ks = L.keyScale || 1, h = t.h * this.u * ks;

        } else {

          // (t.anchor down the texture) centred on the notes as they're hit
          const h = t.h * (this.colW[i] / t.w);
          const nh = this._noteH(L.tex.note[i], i);

    if (L.judgementLine) {

    const us = this.legacy ? this.u : s;
    if (L.tex.stageLeft) { const t = L.tex.stageLeft, w = t.w * us; ctx.drawImage(t.img, -w, 0, w, H); }
    if (L.tex.stageRight) { const t = L.tex.stageRight, w = t.w * us; ctx.drawImage(t.img, this.stageW, 0, w, H); }

    this._drawParticles(realNow);
    // judgement & combo
    if (g.engine) {

      this._drawCombo(g.engine.score.combo, realNow);
    }
    ctx.restore();
    if (g.engine) {
      // (the osu!lazer-style bar is part of the HUD, not the canvas)
      if (this.healthMode === 'stage') this._drawHealth(g.engine.health.value);
      else if (this.healthMode === 'skinstage') this._drawSkinHealth(g.engine.health.value);
      if (Settings.get('input.keyOverlay')) this._drawKeyOverlay(g);
    }
  }

  /** Hidden / Fade In lane cover: `coverage` is the fraction of the lane (above the receptors) that is covered. */

    if (hidden === 'HD') return clamp((1 - c - f) / fade + 1, 0, 1);

  _drawBody(tex, x, w, top, bottom, style, realNow, flip = false) {

  // ── effects
  onJudgement(e, realNow) {
    const L = this.layout;
    if (!L) return;
    // osu!lazer: a missed note keeps scrolling while it fades out over 150 ms instead of vanishing
    if (e.j === J.MISS && !e.note.isLN) (this._missFx || (this._missFx = [])).push({ n: e.note, t0: realNow });
    // culling: a new hit light replaces the column's previous one (dense streams used to stack them)

      const fx = { type: 'N', col: e.col, t0: realNow };
      (this._lastN || (this._lastN = []))[e.col] = fx;

    }
    if (Settings.get('gameplay.showJudgements') && (e.j !== J.MARV || Settings.get('gameplay.showMax'))) {
      const thr = Settings.get('gameplay.earlyLate');
      const el = thr > 0 && e.err != null && e.j !== J.MARV && Math.abs(e.err) >= thr ? (e.err < 0 ? 'EARLY' : 'LATE') : null;
      this.judgementFx = { j: e.j, t0: realNow, el };

      const n = Math.min(e.j === J.MARV ? 7 : 4, Math.max(0, 96 - (this._pN || 0)));
      this._pN = (this._pN || 0) + n;
      for (let k = 0; k < n; k++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
        const sp = (0.25 + Math.random() * 0.45) * this.s;
        this.effects.push({ type: 'P', col: e.col, t0: realNow, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          color: rgba(L.colours.light[e.col]), life: 380 + Math.random() * 200 });

  }
  onRelease(col, realNow) { this.keyLight[col] = realNow; }

  /** Hit and hold lighting, drawn additively. Every frame comes from a pre-scaled sprite: resampling these big

  _drawLighting(g, realNow) {

    ctx.globalCompositeOperation = 'lighter';
    // hold lighting
    const eng = g.engine;
    if (eng) for (let c = 0; c < L.keys; c++) {
      if (!eng.holding[c]) continue;
      const t = L.tinted.lightingL[c];
      if (!t) continue;
      const w = this._lightW(t, c, L.lightingLWidth), hh = t.h * (w / t.w);
      const cx = this.colX[c] + this.colW[c] / 2;

    for (let i = 0; i < fx.length; i++) {
      const e = fx[i];
      if (e.type !== 'N') { fx[keep++] = e; continue; }
      if (this._lastN && this._lastN[e.col] !== e) continue; // superseded by a newer hit in this column
      const t = L.tinted.lightingN[e.col];

    const size = Math.round(26 * s * sk * bump);
    ctx.font = `800 ${size}px Torus, Outfit, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const yy = this.up ? this.H - y : y;
    ctx.lineWidth = Math.max(2, size / 8); ctx.strokeStyle = 'rgba(0,0,0,.7)';
    ctx.strokeText(text, cx, yy);
    const milestone = Settings.get('gameplay.comboEffects') && combo % 100 === 0;
    ctx.fillStyle = milestone ? '#ffd54a' : (this.layout.skin.builtin ? '#efe6ff' : '#fff');
    ctx.fillText(text, cx, yy);
  }
  /** Health: a slim bar beside the stage running from near the top down to the bottom of the screen.
   *  The value eases smoothly, glows in the accent colour and turns red (with a gentle pulse) when low. */
  _drawHealth(v) {
    const ctx = this.ctx, s = this.s, now = performance.now();
    const dt = Math.min(100, now - (this._hpT || now)); this._hpT = now;
    this._hp = this._hp == null ? v : this._hp + (v - this._hp) * Math.min(1, dt / 120);
    const hp = clamp(this._hp, 0, 1);
    const w = Math.max(4, 3.4 * s), x = this.stageX + this.stageW + 5 * s, top = this.H * 0.06, bottom = this.H;
    const len = bottom - top, r = w / 2;
    const bar = (y0, y1) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y0, w, y1 - y0, [r, r, 0, 0]) : ctx.rect(x, y0, w, y1 - y0); ctx.fill(); };
    // track
    ctx.fillStyle = 'rgba(255,255,255,.08)'; bar(top, bottom);
    if (hp <= 0) return;
    const low = hp < 0.3;
    const y = bottom - len * hp;
    const accent = this._hpAccent || (this._hpAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff66ab');
    const c1 = low ? '#ff5a6e' : accent, c2 = low ? '#ff9a6e' : '#ffffff';
    const pulse = low ? 0.55 + 0.45 * Math.abs(Math.sin(now / 220)) : 1;
    // soft glow (a wider translucent bar is much cheaper than shadowBlur)
    ctx.globalAlpha = 0.18 * pulse; ctx.fillStyle = c1;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - w, y - w, w * 3, bottom - y + w, [w * 1.5, w * 1.5, 0, 0]) : ctx.rect(x - w, y - w, w * 3, bottom - y + w); ctx.fill();
    ctx.globalAlpha = 1;
    const grd = ctx.createLinearGradient(0, y, 0, bottom);
    grd.addColorStop(0, c2); grd.addColorStop(0.08, c1); grd.addColorStop(1, c1);
    ctx.fillStyle = grd; bar(y, bottom);
    // bright head
    ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.9 * pulse;
    ctx.beginPath(); ctx.arc(x + r, y + r, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /** The skin's scorebar, as osu!stable draws it in mania: turned upright beside the stage, filling upwards. */
  _drawSkinHealth(v) {
    const L = this.layout, col = L.tex.scorebarColour, bg = L.tex.scorebarBg;
    if (!col) return;
    const ctx = this.ctx, now = performance.now();
    const dt = Math.min(100, now - (this._hpT || now)); this._hpT = now;
    this._hp = this._hp == null ? v : this._hp + (v - this._hp) * Math.min(1, dt / 120);
    const hp = clamp(this._hp, 0, 1);
    const ref = bg || col;
    // screen px per skin px: the bar spans most of the height at most, and stays inside the room beside the stage
    const k = Math.min(this.s, this.H * 0.94 / ref.w, 66 * this.s / ref.h);
    ctx.save();
    ctx.translate(Math.round(this.stageX + this.stageW + 2 * this.s), this.H);
    ctx.rotate(-Math.PI / 2);
    if (bg) ctx.drawImage(bg.img, 0, 0, bg.w * k, bg.h * k);
    // fill offset inside the background (osu!: 4.8,16 for old-style skins, 12,12.5 with a scorebar-marker)
    const [ox, oy] = !bg ? [0, 0] : L.scorebarNewStyle ? [12, 12.5] : [4.8, 16];
    if (hp > 0) {
      const f = col.frameAt(now);
      ctx.drawImage(f, 0, 0, f.width * hp, f.height, ox * k, oy * k, col.w * k * hp, col.h * k);
    }
    ctx.restore();
  }
  _drawKeyOverlay(g) {
    const ctx = this.ctx, s = this.s, K = this.layout.keys;
    const size = 14 * s, gap = 2 * s;
    const x0 = this.stageX + this.stageW + 14 * s, y0 = this.H * 0.5;
    ctx.font = `700 ${Math.round(size * 0.36)}px Torus, Outfit, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < K; i++) {
      const y = y0 + i * (size + gap);
      ctx.fillStyle = g.held[i] ? rgba(this.layout.colours.light[i], 0.85) : 'rgba(20,12,34,.75)';
      ctx.fillRect(x0, y, size * 2.2, size);
      ctx.fillStyle = g.held[i] ? '#000' : '#ddd';
      ctx.fillText(`${g.keyLabels?.[i] || i + 1}  ${g.engine.pressCounts[i]}`, x0 + size * 1.1, y + size / 2);
    }
  }
}

/* ===== 11-managers.js ===== */
/* ScoreManager, ReplayManager, StatisticsManager, ProfileManager, CollectionManager, Favorites, DataManager. */

const ScoreManager = {
  scores: [],                // all, newest last
  byHash: new Map(),         // mapHash -> scores[]
  async init() {
    this.scores = (await DB.getAll('scores')).sort((a, b) => a.date - b.date);
    this._reindex();
  },
  _reindex() {
    this.byHash.clear();
    for (const s of this.scores) {
      if (!this.byHash.has(s.mapHash)) this.byHash.set(s.mapHash, []);
      this.byHash.get(s.mapHash).push(s);
    }
  },
  /** The score shown and compared: osu!lazer's standardised score when that's the chosen display (scores set
   *  before it existed keep their classic one), else the classic ScoreV1 score. Works on saved scores and live ones. */
  value(s) { return Settings.get('gameplay.scoring') === 'standardised' && s.scoreStd != null ? s.scoreStd : s.score; },
  forMap(hash) { return (this.byHash.get(hash) || []).slice().sort((a, b) => this.value(b) - this.value(a) || b.accuracy - a.accuracy); },
  best(hash) { const l = this.forMap(hash).filter(s => s.passed); return l[0] || null; },
  playCount(hash) { return (this.byHash.get(hash) || []).length; },
  lastPlayed(hash) { const l = this.byHash.get(hash); return l && l.length ? l[l.length - 1].date : 0; },
  recent(n = 20) { return this.scores.slice(-n).reverse(); },
  /** pp of a score (osu!mania formula). Older scores without stored pp are computed on demand. */
  ppOf(s) {
    if (!s || !s.passed || (s.mods || []).includes('AT')) return 0;
    if (typeof s.pp === 'number' && s.srVersion === SR_VERSION) return s.pp;
    const m = typeof BeatmapManager !== 'undefined' ? BeatmapManager.mapByHash(s.mapHash) : null;
    const stars = (s.rate || 1) === 1 && m && m.srVersion === SR_VERSION ? m.stars : (s.stars || 0);
    return OsuMath.pp(stars, s.counts || [0, 0, 0, 0, 0, 0], s.mods || []);
  },
  /** Best pp per beatmap (osu! counts one score per map toward the total). */
  bestPpPerMap(scores = this.scores) {
    const best = new Map();
    for (const s of scores) {
      const pp = this.ppOf(s);
      if (pp > 0 && (!best.has(s.mapHash) || best.get(s.mapHash).pp < pp)) best.set(s.mapHash, { pp, score: s });
    }
    return [...best.values()].sort((a, b) => b.pp - a.pp);
  },
  totalPp(scores = this.scores) { return OsuMath.totalPp(this.bestPpPerMap(scores).map(x => x.pp)); },
  /** Total pp after each play, for the profile/statistics history graph. */
  ppHistory() {
    const out = [], best = new Map();
    for (const s of this.scores) {
      const pp = this.ppOf(s);
      if (pp > (best.get(s.mapHash) || 0)) best.set(s.mapHash, pp);
      else if (!pp) continue;
      out.push({ date: s.date, pp: OsuMath.totalPp([...best.values()]).total, title: s.title, version: s.version });
    }
    return out;
  },
  async add(score) {
    const prev = this.best(score.mapHash);
    score.isPB = score.passed && (!prev || this.value(score) > this.value(prev));
    score.prevBest = prev ? { score: prev.score, scoreStd: prev.scoreStd, accuracy: prev.accuracy, grade: prev.grade, pp: this.ppOf(prev) } : null;
    score.totalPpBefore = this.totalPp().total;
    await DB.put('scores', score);
    this.scores.push(score);
    this._reindex();
    score.totalPpAfter = this.totalPp().total;
    await DB.put('scores', score);
    Bus.emit('scores:changed');
    return score;
  },
  async remove(id) {
    await DB.del('scores', id);
    this.scores = this.scores.filter(s => s.id !== id); this._reindex(); Bus.emit('scores:changed');
  },
  async clear() { await DB.clear('scores'); this.scores = []; this._reindex(); Bus.emit('scores:changed'); },
};

const ReplayManager = {
  list: [],
  async init() { this.list = (await DB.getAll('replays')).sort((a, b) => b.date - a.date); },
  build({ map, mods, rate, seed, windows, accuracyMode, hp, keys, events, summary, scoreId, player, duration, modConfig = {}, noFail = false, rules = RULES }) {
    return {
      app: APP_NAME, kind: 'replay', format: 1, id: 'rp-' + uid(), date: Date.now(),
      mapHash: map.hash, mapId: map.id, title: map.title, artist: map.artist, version: map.version, creator: map.creator,
      keys, mods, rate, seed, windows, accuracyMode, hp, player, duration, modConfig, noFail,
      rules, // judging rules (see 09-gameplay.js); replays without it were recorded under rules 1
      events, // flat [t, col, down, t, col, down, ...] in song ms
      summary: { score: summary.score, scoreStd: summary.scoreStd, accuracy: summary.accuracy, maxCombo: summary.maxCombo, counts: summary.counts, grade: summary.grade },
      scoreId: scoreId || null,
    };
  },
  async save(rep) {
    await DB.put('replays', rep);
    this.list = [rep, ...this.list.filter(r => r.id !== rep.id)];
    if (rep.scoreId) {
      const s = ScoreManager.scores.find(x => x.id === rep.scoreId);
      if (s && s.replayId !== rep.id) { s.replayId = rep.id; await DB.put('scores', s); }
    }
    Bus.emit('replays:changed');
    return rep;
  },
  async get(id) { return DB.get('replays', id); },
  async remove(id) { await DB.del('replays', id); this.list = this.list.filter(r => r.id !== id); Bus.emit('replays:changed'); },
  async clear() { await DB.clear('replays'); this.list = []; Bus.emit('replays:changed'); },
  export(rep) { downloadJSON(rep, `${rep.artist} - ${rep.title} [${rep.version}] (${new Date(rep.date).toISOString().slice(0, 10)}).amr`.replace(/[\\/:*?"<>|]/g, '_')); },
  validate(obj) {
    if (!obj || obj.app !== APP_NAME || obj.kind !== 'replay' || !Array.isArray(obj.events) || obj.events.length % 3 !== 0) throw new Error('Not a valid Ashtonk!mania replay');
    if (!Array.isArray(obj.windows) || obj.windows.length !== 6) throw new Error('Replay is missing timing windows');
    return obj;
  },
  async importFile(f) { return this.importObject(JSON.parse(await f.text())); },
  async importObject(obj) { this.validate(obj); return this.save({ ...obj, imported: true }); },
};

const Favorites = {
  set: new Set(),
  async init() { this.set = new Set(await DB.kvGet('favorites', [])); },
  has(setId) { return this.set.has(setId); },
  async toggle(setId) {
    if (this.set.has(setId)) this.set.delete(setId); else this.set.add(setId);
    await DB.kvSet('favorites', [...this.set]);
    Bus.emit('favorites:changed', setId);
    return this.set.has(setId);
  },
};

/** Per-beatmap offset (osu!lazer's "beatmap offset"), added to the global audio offset for one difficulty.
 *  Positive = you hit late on this map (its notes arrive later). */
const MapOffsets = {
  map: {},
  last: null, // { hash, mean, hits } — the most recent finished play, for "calibrate using last play"
  async init() { const m = await DB.kvGet('map.offsets', {}); this.map = m && typeof m === 'object' ? m : {}; },
  get(hash) { return (hash && this.map[hash]) || 0; },
  async set(hash, ms) {
    if (!hash) return;
    ms = clamp(Math.round(ms), -300, 300);
    if (ms) this.map[hash] = ms; else delete this.map[hash];
    Bus.emit('mapoffset:changed', hash, ms);
    await DB.kvSet('map.offsets', this.map);
  },
  /** The offset change the last play on `hash` suggests (its mean hit error), or null if there isn't enough data. */
  suggestion(hash) {
    const l = this.last;
    if (!l || l.hash !== hash || l.hits < 30 || Math.abs(l.mean) < 2) return null;
    return Math.round(l.mean);
  },
};

const Collections = {
  list: [],
  async init() {
    this.list = await DB.kvGet('collections', null);
    if (!this.list) { this.list = [{ id: uid(), name: 'Practice', hashes: [], created: Date.now() }]; await this.save(); }
  },
  async save() { await DB.kvSet('collections', this.list); Bus.emit('collections:changed'); },
  async create(name) { const c = { id: uid(), name: name.trim() || 'New collection', hashes: [], created: Date.now() }; this.list.push(c); await this.save(); return c; },
  async rename(id, name) { const c = this.get(id); if (c) { c.name = name.trim() || c.name; await this.save(); } },
  async remove(id) { this.list = this.list.filter(c => c.id !== id); await this.save(); },
  get(id) { return this.list.find(c => c.id === id); },
  has(id, hash) { const c = this.get(id); return !!(c && c.hashes.includes(hash)); },
  async toggle(id, hash) {
    const c = this.get(id); if (!c) return;
    if (c.hashes.includes(hash)) c.hashes = c.hashes.filter(x => x !== hash); else c.hashes.push(hash);
    await this.save();
    return c.hashes.includes(hash);
  },
  containing(hash) { return this.list.filter(c => c.hashes.includes(hash)); },
};

const ProfileManager = {
  profile: null,
  async init() {
    this.profile = await DB.kvGet('profile', null);
    if (!this.profile) { this.profile = { name: 'Player', avatar: 'default', created: Date.now(), banner: 'kori', onboarded: false }; await this.save(); }
    await this.loadAvatar();
  },
  async save() { await DB.kvSet('profile', this.profile); Bus.emit('profile:changed'); },
  async setName(n) { this.profile.name = n.trim().slice(0, 24) || 'Player'; await this.save(); },
  async setAvatar(kind, blob) {
    this.profile.avatar = kind;
    if (kind === 'custom' && blob) { const t = await makeThumbnail(blob, 256); await DB.put('files', t || blob, 'profile/avatar'); }
    await this.loadAvatar(); await this.save();
  },
  avatarURL: null,
  async loadAvatar() {
    if (this.avatarURL && this.avatarURL.startsWith('blob:')) URL.revokeObjectURL(this.avatarURL);
    this.avatarURL = null;
    const a = this.profile.avatar || 'default';
    if (a === 'custom') {
      const b = await DB.get('files', 'profile/avatar');
      if (b) this.avatarURL = URL.createObjectURL(b);
    } else if (a.startsWith('preset:')) this.avatarURL = AvatarPresets.url(a.slice(7));
    else if (a.startsWith('file:')) this.avatarURL = 'avatars/' + encodeURIComponent(a.slice(5));
    this.sharedAvatar = await this.makeSharedAvatar().catch(() => '');
  },
  /** What other players see: the preset / public picture's id, or a small copy of an uploaded picture (64 px). */
  sharedAvatar: '',
  async makeSharedAvatar() {
    const a = this.profile.avatar || 'default';
    if (a.startsWith('preset:') || a.startsWith('file:')) return a;
    if (a !== 'custom' || !this.avatarURL) return '';
    const img = new Image(); img.src = this.avatarURL; await img.decode();
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), sz = Math.min(img.naturalWidth, img.naturalHeight);
    x.drawImage(img, (img.naturalWidth - sz) / 2, (img.naturalHeight - sz) / 2, sz, sz, 0, 0, 64, 64);
    return c.toDataURL('image/jpeg', 0.8);
  },
  /** Avatar element (custom image or monogram). */
  avatarEl(size = 40) {
    const p = this.profile;
    const el = h('div.avatar', { style: { width: size + 'px', height: size + 'px' } });
    if (p.avatar !== 'default' && this.avatarURL) el.style.backgroundImage = `url("${this.avatarURL}")`;
    else { el.classList.add('avatar-mono'); el.textContent = (p.name || 'A').slice(0, 1).toUpperCase(); el.style.fontSize = size * 0.45 + 'px'; }
    return el;
  },
  /** XP & level derived from local scores. */
  xpInfo() {
    let xp = 0;
    for (const s of ScoreManager.scores) {
      const hits = s.counts ? s.counts.slice(0, 5).reduce((a, b) => a + b, 0) : 0;
      xp += Math.round(hits * 0.5 + (s.passed ? 50 + s.accuracy * 100 * Math.max(1, s.stars || 1) : 10));
    }
    let level = 1, need = 500, acc = 0;
    while (xp >= acc + need) { acc += need; level++; need = Math.round(500 * Math.pow(level, 1.35)); }
    return { xp, level, into: xp - acc, need, progress: (xp - acc) / need };
  },
};

const StatisticsManager = {
  compute() {
    const sc = ScoreManager.scores;
    const passed = sc.filter(s => s.passed);
    const st = {
      plays: sc.length, passed: passed.length, failed: sc.filter(s => !s.passed).length,
      playtime: sc.reduce((a, s) => a + (s.duration || 0), 0),
      notes: sc.reduce((a, s) => a + (s.counts ? s.counts.slice(0, 5).reduce((x, y) => x + y, 0) : 0), 0),
      misses: sc.reduce((a, s) => a + (s.counts ? s.counts[5] : 0), 0),
      avgAcc: passed.length ? passed.reduce((a, s) => a + s.accuracy, 0) / passed.length : 0,
      highestScore: sc.reduce((a, s) => Math.max(a, s.score), 0),
      highestCombo: sc.reduce((a, s) => Math.max(a, s.maxCombo), 0),
      bestGrade: null, grades: {}, keyModes: {}, perDay: [], accTrend: [], judgements: [0, 0, 0, 0, 0, 0],
    };
    const order = ['XH', 'SS', 'SH', 'S', 'A', 'B', 'C', 'D', 'F'];
    for (const s of sc) {
      st.grades[s.grade] = (st.grades[s.grade] || 0) + 1;
      const k = st.keyModes[s.keys] || (st.keyModes[s.keys] = { plays: 0, passed: 0, accSum: 0, best: 0, playtime: 0 });
      k.plays++; k.playtime += s.duration || 0;
      if (s.passed) { k.passed++; k.accSum += s.accuracy; k.best = Math.max(k.best, s.score); }
      if (s.counts) s.counts.forEach((c, i) => st.judgements[i] += c);
    }
    for (const g of order) if (st.grades[g] && g !== 'F') { st.bestGrade = g; break; }
    const day = 86400000, today = Math.floor(Date.now() / day);
    for (let d = 29; d >= 0; d--) st.perDay.push({ day: today - d, plays: 0 });
    for (const s of sc) { const idx = Math.floor(s.date / day) - (today - 29); if (idx >= 0 && idx < 30) st.perDay[idx].plays++; }
    st.accTrend = passed.slice(-60).map(s => ({ date: s.date, acc: s.accuracy, title: s.title, version: s.version }));
    return st;
  },
};

const DataManager = {
  async exportAll() {
    const obj = {
      app: APP_NAME, kind: 'backup', version: APP_VERSION, date: Date.now(),
      settings: Settings.export(), profile: ProfileManager.profile, favorites: [...Favorites.set],
      collections: Collections.list, scores: await DB.getAll('scores'), replays: await DB.getAll('replays'),
      note: 'Beatmap and skin files are not included; re-import your .osz/.osk files after restoring.',
    };
    downloadJSON(obj, `ashtonk-mania-backup-${new Date().toISOString().slice(0, 10)}.json`);
  },
  exportSettings() {
    downloadJSON({ app: APP_NAME, kind: 'settings', version: APP_VERSION, date: Date.now(), settings: Settings.export() }, 'ashtonk-mania-settings.json');
  },
  async importAll(obj) {
    if (!obj || obj.app !== APP_NAME) throw new Error('Not an Ashtonk!mania data file');
    if (obj.settings) await Settings.import(obj.settings);
    if (obj.kind === 'settings') return;
    if (obj.profile) { ProfileManager.profile = { ...ProfileManager.profile, ...obj.profile }; await ProfileManager.save(); }
    if (Array.isArray(obj.favorites)) { for (const f of obj.favorites) Favorites.set.add(f); await DB.kvSet('favorites', [...Favorites.set]); }
    if (Array.isArray(obj.collections)) {
      for (const c of obj.collections) {
        const ex = Collections.list.find(x => x.id === c.id || x.name === c.name);
        if (ex) ex.hashes = [...new Set([...ex.hashes, ...(c.hashes || [])])]; else Collections.list.push(c);
      }
      await Collections.save();
    }
    if (Array.isArray(obj.scores)) await DB.putMany(obj.scores.filter(s => s && s.id).map(s => ({ store: 'scores', value: s })));
    if (Array.isArray(obj.replays)) await DB.putMany(obj.replays.filter(r => r && r.id).map(r => ({ store: 'replays', value: r })));
    await ScoreManager.init(); await ReplayManager.init();
    Bus.emit('scores:changed'); Bus.emit('replays:changed'); Bus.emit('favorites:changed');
  },
  async resetEverything() {
    DB.db && DB.db.close(); DB.db = null;
    await new Promise(r => { const q = indexedDB.deleteDatabase(DB.name); q.onsuccess = q.onerror = q.onblocked = () => r(); });
    location.reload();
  },
};

/* ===== 11b-avatars.js ===== */
/* Free profile pictures: the bundled Teto, Neru and Miku pictures in public/avatars, plus any images listed in
 * public/avatars/avatars.json — [{ "file": "rin.png", "name": "Rin" }, …] — so more can be added by dropping them
 * into that folder. Profile avatar values: 'default' (initial), 'custom' (uploaded), 'preset:<id>' or 'file:<file>'. */

const AVATAR_PRESETS = [
  { id: 'teto', name: 'Teto', file: 'teto.jpg' },
  { id: 'neru', name: 'Neru', file: 'neru.jpg' },
  { id: 'miku', name: 'Miku', file: 'miku.jpg' },
];

const AvatarPresets = {
  /** The picture for a preset id. Older profiles saved drawn presets such as 'teto-1' / 'miku-2': those map to that
   *  character's picture. */
  url(id) {
    const p = AVATAR_PRESETS.find(x => x.id === id) || AVATAR_PRESETS.find(x => x.id === String(id).split('-')[0]);
    return p ? 'avatars/' + p.file : null;
  },
  /** Extra pictures from public/avatars/avatars.json (cached for the session). */
  extra() {
    if (!this._extra) this._extra = fetch('avatars/avatars.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : []).then(a => Array.isArray(a)
      ? a.filter(x => x && typeof x.file === 'string' && /^[\w .()-]+\.(png|jpe?g|webp|gif|svg)$/i.test(x.file)).map(x => ({ file: x.file, name: String(x.name || x.file), url: 'avatars/' + encodeURIComponent(x.file) }))
      : []).catch(() => []);
    return this._extra;
  },
};

function starColour(sr) {
  const stops = [[0, '#4290fb'], [1.25, '#4fc0ff'], [2, '#4fffd5'], [2.5, '#7cff4f'], [3.3, '#f6f05c'], [4.2, '#ff8068'], [4.9, '#ff4e6f'], [5.8, '#c645b8'], [6.7, '#6563de'], [7.7, '#18158e'], [9, '#000000']];

 *  the digits are aligned inside it, so a score changing 20 times a second doesn't re-layout the page each time. */

    if (!ref || !glyphs.length) { x.clearRect(0, 0, c.width, c.height); return; }

    // padding), which drawn to the box height left the numbers tiny

const Toast = {

/** Context menu: items [{label, icon, onClick, checked, sep, header}] */
/** A popup menu at (x, y); with { above: true } y is where its bottom edge goes (a menu opened from a footer button). */
function showMenu(x, y, items, { above = false } = {}) {
  const menu = h('div.menu', { role: 'menu' });
  for (const it of items) {
    if (it.sep) { menu.appendChild(h('div.sep')); continue; }
    if (it.header) { menu.appendChild(h('div.hdr', it.header)); continue; }
    menu.appendChild(h(`button${it.danger ? '.danger' : ''}`, { role: 'menuitem', onclick: () => { UISounds.click(); o.close(); it.onClick && it.onClick(); } },
      it.icon ? icon(it.icon) : null, it.label, it.checked ? h('span.check', '✓') : null));
  }
  const o = makeOverlay(menu, { backdrop: false });
  const closer = e => { if (!menu.contains(e.target)) { o.close(); document.removeEventListener('pointerdown', closer, true); } };
  setTimeout(() => document.addEventListener('pointerdown', closer, true), 0);
  requestAnimationFrame(() => {
    const r = menu.getBoundingClientRect();
    menu.style.left = clamp(x, 8, innerWidth - r.width - 8) * Zoom.z + 'px';
    menu.style.top = clamp(above ? y - r.height : y, 8, innerHeight - r.height - 8) * Zoom.z + 'px';
    const f = menu.querySelector('button'); f && f.focus();
  });
  menu.addEventListener('keydown', e => {
    const btns = $$('button', menu); const i = btns.indexOf(document.activeElement);

    if (e.key === 'ArrowUp') { btns[(i - 1 + btns.length) % btns.length].focus(); e.preventDefault(); }
  });
  return o;
}

// ─────────────────────────────── Background ───────────────────────────────
const Background = {
  current: null, flip: false,
  /** The blur is baked into a small copy of the image once (and cached), so the browser never has to run a live
   *  full-screen blur filter: that's what made menu blur too slow for Chromebooks. Where canvas filters aren't
   *  supported the CSS blur is used as before. */
  _baked: new Map(),
  canBake: typeof CanvasRenderingContext2D !== 'undefined' && 'filter' in CanvasRenderingContext2D.prototype,
  bake(url, blur) {
    const key = url + '|' + blur;
    let p = this._baked.get(key);
    if (p) return p;
    p = (async () => {
      const img = new Image();
      img.src = url;
      await img.decode();
      const W = 640, Hh = Math.max(1, Math.round(W * img.naturalHeight / Math.max(1, img.naturalWidth)));
      const c = document.createElement('canvas'); c.width = W; c.height = Hh;
      const x = c.getContext('2d');
      const r = blur * W / Math.max(640, innerWidth);
      x.filter = `blur(${r.toFixed(2)}px)`;
      x.drawImage(img, -r * 2, -r * 2, W + r * 4, Hh + r * 4); // drawn a little oversize so the edges stay opaque
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
      return blob ? URL.createObjectURL(blob) : null;
    })().catch(() => null);
    this._baked.set(key, p);
    if (this._baked.size > 16) { const [k, old] = this._baked.entries().next().value; this._baked.delete(k); old.then(u => u && setTimeout(() => URL.revokeObjectURL(u), 5000)); }
    return p;
  },
  set(url, { blur = Settings.get('graphics.menuBlur'), dim = 0 } = {}) {
    if (url !== this.current) Bus.emit('bg:changed', url);
    const app = $('#app');
    app.classList.toggle('bg-empty', !url);
    const a = $('#bg-a'), b = $('#bg-b');
    const bake = url && blur > 0.5 && this.canBake;
    const bright = `brightness(${1 - dim})`;
    const filter = bake ? bright : `blur(${blur}px) ${bright}`;
    const apply = el => {
      if (!bake) return;
      const tok = this._tok = {};
      this.bake(url, blur).then(u => { if (u && tok === this._tok && this.current === url) { el.style.backgroundImage = `url("${u}")`; el.style.filter = bright; } });
    };
    if (url === this.current) {
      const el = this.flip ? b : a;
      if (bake) apply(el); else { el.style.backgroundImage = url ? `url("${url}")` : 'none'; el.style.filter = filter; }
      return;
    }
    this.current = url;
    this.flip = !this.flip;
    const show = this.flip ? b : a, hide = this.flip ? a : b;
    // until the blurred copy is ready (a few ms; instant when cached) the image shows with a CSS blur
    show.style.backgroundImage = url ? `url("${url}")` : 'none';
    show.style.filter = `blur(${blur}px) ${bright}`;
    show.classList.toggle('show', !!url);
    hide.classList.remove('show');
    apply(show);
  },
  parallax(e) {
    if (!Settings.get('ui.parallax') || $('#app').classList.contains('in-game')) { $('#bg-layer').style.transform = ''; return; }
    const x = (e.clientX / innerWidth - 0.5) * -16, y = (e.clientY / innerHeight - 0.5) * -12;
    $('#bg-layer').style.transform = `translate(${x}px, ${y}px) scale(1.02)`;
  },
};

/** osu!lazer-style now playing panel: cover, title, seekable progress and previous / play-pause / next. */
const NowPlaying = {
  el: null, open: false, pinned: false, _t: 0,
  ensure() {
    if (this.el) return;
    this.cover = h('div.np-cover');
    this.title = h('div.np-title'); this.artist = h('div.np-artist');
    this.fill = h('i');
    this.bar = h('div.np-bar', this.fill);
    this.cur = h('span'); this.dur = h('span');
    const b = (ic, tip, fn) => h('button.np-ctl', { title: tip, 'aria-label': tip, onclick: e => { e.stopPropagation(); UISounds.click(); fn(); } }, icon(ic));
    this.playBtn = b('pause', 'Play / pause', () => MenuMusic.toggle());
    this.el = h('div.np-panel',
      this.cover,
      h('div.np-body', this.title, this.artist,
        h('div.np-ctls', b('prev', 'Previous track', () => MenuMusic.prev()), this.playBtn, b('skip', 'Next track', () => MenuMusic.next())),
        h('div.np-times', this.cur, this.dur)),
      this.bar);
    const seek = e => {
      const r = this.bar.getBoundingClientRect();
      if (!Music.loaded) return;
      const pos = clamp((e.clientX - r.left) / r.width, 0, 1) * Music.duration;
      if (Music.playing) Music.play(pos, { fadeIn: 60 }); else Music.pausedPos = pos;
      this.update();
    };
    this.bar.addEventListener('pointerdown', e => { seek(e); this.bar.setPointerCapture(e.pointerId); this._drag = true; });
    this.bar.addEventListener('pointermove', e => { if (this._drag) seek(e); });
    this.bar.addEventListener('pointerup', () => { this._drag = false; });
    this.el.addEventListener('pointerenter', () => clearTimeout(this._t));
    this.el.addEventListener('pointerleave', () => this.hoverClose());
    $('#app').appendChild(this.el);
    Bus.on('music:changed', () => this.render());
    document.addEventListener('pointerdown', e => {
      if (this.open && !this.el.contains(e.target) && !Toolbar.npBtn.contains(e.target)) this.hide();
    }, true);
    window.addEventListener('keydown', e => { if (e.key === 'Escape' && this.open) { e.preventDefault(); e.stopImmediatePropagation(); this.hide(); } }, true);
    Bus.on('screen:changed', () => this.hide());
  },
  hoverOpen() { clearTimeout(this._t); if (!this._shut) this.show(); },
  hoverClose() { this._shut = false; if (this.pinned) return; clearTimeout(this._t); this._t = setTimeout(() => this.hide(), 350); },
  /** The toolbar button: opens the panel (and keeps it open), or closes it if it's showing — hovering doesn't

  toggle(pin) {
    // a click on a panel that hovering just opened keeps it open; a click on a kept-open panel closes it
    if (this.open && pin && !this.pinned) { clearTimeout(this._t); this.pinned = true; return; }
    if (this.open) { this.hide(); this._shut = true; return; }
    this.pinned = !!pin; this.show();

  show() {

    this.el.classList.add('show');

    loop();

  hide() { if (!this.el) return; this.open = false; this.pinned = false; this.el.classList.remove('show'); cancelAnimationFrame(this._raf); },
  async render() {
    if (!this.el) return;

  },

/** osu!lazer's VolumeOverlay: the mouse wheel changes the volume on the main menu and in game (anywhere with Alt),
 *  shown at the left edge as three rings — effects, master (the big one) and music. Hover a ring to choose which
 *  one the wheel changes; the overlay fades away a moment after the last change. */
const VolumeOverlay = {
  el: null, hideT: 0, sel: 'master', hover: false,
  KEYS: { master: 'audio.master', music: 'audio.music', effects: 'audio.effects' },
  adjust(which, delta) {
    const key = this.KEYS[which] || 'audio.master';
    const v = clamp(Math.round((Settings.get(key) + delta) * 100) / 100, 0, 1);
    Settings.set(key, v);
    if (which === 'master' && v > 0) this._muted = null;
    this.show(which);
  },
  ring(which, label, big) {
    const R = big ? 38 : 26, C = 2 * Math.PI * R, sz = (R + 8) * 2;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', `0 0 ${sz} ${sz}`); svg.setAttribute('width', sz); svg.setAttribute('height', sz);
    svg.innerHTML = `<circle cx="${sz / 2}" cy="${sz / 2}" r="${R}" class="vo-bg"/><circle cx="${sz / 2}" cy="${sz / 2}" r="${R}" class="vo-fg" stroke-dasharray="${C}" transform="rotate(-90 ${sz / 2} ${sz / 2})"/>`;
    const num = h('span.vo-num'), el = h(`div.vo-meter.${which}${big ? '.big' : ''}`, { onpointerenter: () => { this.sel = which; this.paint(); } }, h('div.vo-dial', svg, num), h('div.vo-label', label));
    el._fg = svg.querySelector('.vo-fg'); el._C = C; el._num = num; el._which = which;
    return el;
  },
  build() {
    this.meters = [this.ring('effects', 'Effects'), this.ring('master', 'Master', true), this.ring('music', 'Music')];
    this.muteBtn = h('button.vo-mute', { title: 'Mute', 'aria-label': 'Mute', onclick: () => this.toggleMute() }, icon('volume'));
    this.el = h('div.volume-overlay', { onpointerenter: () => { this.hover = true; clearTimeout(this.hideT); }, onpointerleave: () => { this.hover = false; this.later(); } },
      this.muteBtn, ...this.meters);
    $('#app').appendChild(this.el);
  },
  toggleMute() {
    const v = Settings.get('audio.master');
    if (v > 0) { this._muted = v; Settings.set('audio.master', 0); } else Settings.set('audio.master', this._muted || 0.8);
    this.show('master');
  },
  paint() {
    for (const m of this.meters) {
      const v = Settings.get(this.KEYS[m._which]);
      m._fg.style.strokeDashoffset = (m._C * (1 - v)).toFixed(1);
      m._num.textContent = Math.round(v * 100);
      m.classList.toggle('sel', m._which === this.sel);
    }
    const muted = Settings.get('audio.master') === 0;
    this.muteBtn.classList.toggle('on', muted);
    clearEl(this.muteBtn).append(icon(muted ? 'mute' : 'volume'));
  },
  show(which) {
    if (!this.el) this.build();
    if (which) this.sel = which;
    this.paint();
    this.el.classList.add('show');
    this.later();
  },
  later() { clearTimeout(this.hideT); if (!this.hover) this.hideT = setTimeout(() => { this.el.classList.remove('show'); this.sel = 'master'; }, 1000); },
  /** Is the pointer over something that scrolls (a list, a panel)? Then the wheel scrolls it instead. */
  overScroller(t) {
    for (let el = t; el && el !== document.body; el = el.parentElement) {

    }

  },
  bind() {
    window.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) return;
      const scr = Screens.currentName, shown = this.el && this.el.classList.contains('show');
      const here = scr === 'home' || (scr === 'gameplay' && !Settings.get('input.noWheelVolumeInGame'));
      if (!e.altKey && !(shown && this.hover)) {
        if (!here || Overlays.stack.length || SettingsPanel.o || this.overScroller(e.target)) return;
        if (scr === 'gameplay' && GameplayScreen.pauseEl) return;
      }
      e.preventDefault(); e.stopPropagation();
      const which = e.altKey && e.shiftKey ? 'music' : e.altKey && e.ctrlKey ? 'effects' : this.sel;
      const steps = Math.max(1, Math.round(Math.abs(e.deltaY) / 100));
      this.adjust(which, (e.deltaY < 0 ? 0.05 : -0.05) * Math.min(steps, 3));
    }, { passive: false, capture: true });

/** osu!lazer's menu cursor: a white arrow with a soft outline, drawn by the browser (so it never lags) at the size
 *  chosen in settings; it shrinks a little while a button is held, like lazer's. Hidden in game as before. */
const LazerCursor = {
  apply() {
    const on = Settings.get('ui.lazerCursor') !== false, size = clamp(Settings.get('ui.cursorSize') || 1, 0.5, 2);

    // lazer's menu cursor: a dark rounded arrow with a white rim; pressed, it shrinks slightly and glows pink
    const mk = (k, pressed) => {
      const S = Math.round(32 * size * k);
      const path = 'M6.2 3.2 L25.4 17.2 Q27.3 18.7 24.9 19.2 L17.6 20.4 Q16.6 20.6 16.1 21.5 L12.4 28.2 Q11.2 30.1 10.5 28 L4.6 5.2 Q4.1 2.1 6.2 3.2 Z';
      const glow = pressed ? '<path d="' + path + '" fill="none" stroke="#ff66ab" stroke-opacity=".75" stroke-width="5" stroke-linejoin="round"/>' : '';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 32 32">${glow}<path d="${path}" transform="translate(.8 1.4)" fill="rgba(0,0,0,.35)"/><path d="${path}" fill="#16141c" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M7.4 6.4 L21.6 16.8" stroke="rgba(255,255,255,.18)" stroke-width="1.4" stroke-linecap="round"/></svg>`;

/** osu!lazer's NotificationOverlay: everything that popped up as a toast is kept here (newest first) until cleared;
 *  the toolbar bell counts the ones you haven't seen. */
const Notifications = {
  list: [], unread: 0, el: null,
  add(title, body, type = 'info') {
    this.list.unshift({ id: Math.random().toString(36).slice(2), title: String(title), body: body ? String(body) : '', type, at: Date.now() });
    if (this.list.length > 60) this.list.length = 60;
    if (!this.isOpen()) this.unread++;
    Bus.emit('notif:changed');
    if (this.isOpen()) this.render();
  },
  isOpen() { return !!(this.el && this.el.classList.contains('open')); },
  toggle() { this.isOpen() ? this.close() : this.open(); },
  open() {
    if (!this.el) {
      this.listEl = h('div.nf-list');
      this.el = h('div.nf-panel', { role: 'dialog', 'aria-label': 'Notifications' },
        h('div.nf-head', h('div.nf-title', 'notifications'), h('div.nf-sub', 'waiting for \'ya'), h('button.btn.sm.nf-clear', { onclick: () => this.clear() }, 'Clear all')),
        this.listEl);
      $('#app').appendChild(this.el);
      document.addEventListener('pointerdown', e => { if (this.isOpen() && !this.el.contains(e.target) && !e.target.closest('.tb-btn')) this.close(); }, true);
      // like lazer's overlays: Esc closes it (before anything else hears the key), and so does going to another screen
      window.addEventListener('keydown', e => { if (e.key === 'Escape' && this.isOpen()) { e.preventDefault(); e.stopImmediatePropagation(); UISounds.back(); this.close(); } }, true);
      Bus.on('screen:changed', () => this.close());
    }
    this.render();
    this.el.classList.add('open');
    this.unread = 0; Bus.emit('notif:changed');
    $$('#toolbar [data-tab="notifications"]').forEach(b => b.classList.add('active'));
  },
  close() { if (this.el) this.el.classList.remove('open'); $$('#toolbar [data-tab="notifications"]').forEach(b => b.classList.remove('active')); },
  clear() { this.list = []; this.render(); Bus.emit('notif:changed'); },
  ago(t) { const s = Math.round((Date.now() - t) / 1000); return s < 45 ? 'just now' : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`; },
  render() {
    if (!this.listEl) return;
    const ico = { info: 'info', ok: 'star', err: 'x' };
    clearEl(this.listEl).append(...(this.list.length ? this.list.map(n => h(`div.nf-item.${n.type}`,
      h('div.nf-ico', icon(ico[n.type] || 'info', n.type === 'ok' ? 'fill' : '')),
      h('div.nf-body', h('div.nf-t', n.title), n.body ? h('div.nf-b', n.body) : null, h('div.nf-time', this.ago(n.at))),
      h('button.nf-x', { title: 'Dismiss', 'aria-label': 'Dismiss', onclick: () => { this.list = this.list.filter(x => x !== n); this.render(); } }, icon('x')))) : [h('div.nf-empty', 'No notifications')]));
  },

/**
 * Keeps the interface the same physical size regardless of browser zoom (like a native client):
 * zoom shortcuts (Ctrl +/-/0, Ctrl + wheel, pinch) are blocked, and a zoom level that is already set
 * is detected (outer/inner window width, sanity-checked against the device pixel ratio) and undone by
 * laying #app out at the un-zoomed size and scaling it back down.
 */
const Zoom = {
  z: 1,
  LEVELS: [0.25, 0.3, 1 / 3, 0.5, 2 / 3, 0.75, 0.8, 0.9, 1, 1.1, 1.2, 1.25, 4 / 3, 1.5, 1.7, 1.75, 2, 2.4, 2.5, 3, 4, 5],
  BASE_DPR: [1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.625, 3, 3.5, 4],
  init() {
    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['Equal', 'Minus', 'NumpadAdd', 'NumpadSubtract', 'Digit0', 'Numpad0'].includes(e.code)) e.preventDefault();
    }, true);
    window.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false, capture: true });
    ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    window.addEventListener('resize', () => this.update());
    this.update();
  },
  /** The browser's zoom level. The first reading compares the window's outer and inner widths; after that, zooming
   *  changes devicePixelRatio while the screen stays the same, so a change is followed exactly from there (a new
   *  screen — another monitor — takes a fresh reading). */
  detect() {
    const dpr = window.devicePixelRatio || 1, sw = screen.width, sh = screen.height;
    const b = this._base;
    if (b && b.sw === sw && b.sh === sh) return clamp(b.bz * dpr / b.dpr, 0.25, 5);
    const bz = this.guess();
    this._base = { dpr, bz, sw, sh };
    return bz;
  },
  guess() {
    const ow = window.outerWidth, iw = window.innerWidth;
    if (!ow || !iw) return 1;
    const raw = ow / iw;
    const lvl = this.LEVELS.reduce((a, b) => Math.abs(b - raw) < Math.abs(a - raw) ? b : a);
    if (lvl === 1 || Math.abs(lvl - raw) / lvl > 0.03) return 1; // side panels / devtools make the ratio meaningless
    const base = (window.devicePixelRatio || 1) / lvl;
    return this.BASE_DPR.some(b => Math.abs(b - base) < 0.06) ? lvl : 1;
  },
  /** The whole interface is laid out for a 1366×768 space and scaled to fit the window (as lazer's scaling container
   *  does), times the "UI scaling" setting — so it looks the same at any resolution and any browser zoom, and UI
   *  scaling is the one way to make it bigger or smaller. Narrow screens (phones) keep their own responsive layout. */
  update() {
    const bz = this.detect(), W = innerWidth * bz, H = innerHeight * bz;
    const fit = W >= 1000 && H >= 560 ? clamp(Math.min(W / 1366, H / 768), 0.75, 4) : 1;
    const ui = typeof Settings !== 'undefined' && Settings.values ? clamp(Settings.get('ui.scale') || 0.9, 0.5, 2) : 0.9;
    const k = fit * ui / bz, z = Math.abs(k - 1) < 0.002 ? 1 : 1 / k;
    const r = document.documentElement.style;
    // (vw / vh inside the app mean the app's layout size, not the window's)
    r.setProperty('--vw', (innerWidth * z / 100).toFixed(3) + 'px'); r.setProperty('--vh', (innerHeight * z / 100).toFixed(3) + 'px');
    if (z === this.z) return;
    this.z = z;
    r.setProperty('--zoom', z); r.setProperty('--zoom-inv', 1 / z);
    $('#app').classList.toggle('zoomfix', z !== 1);
    Bus.emit('ui:scaled', 1 / z);
  },
  /** Canvas backing-store scale for sizes measured in layout px (clientWidth). */
  dpr() { return (window.devicePixelRatio || 1) / this.z; },
};

function toggleFullscreen(force) {
  const el = document.documentElement;
  const on = !!document.fullscreenElement;
  if (force === undefined) force = !on;
  if (force && !on) return (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : Promise.reject()).catch(() => Toast.err('Fullscreen unavailable', 'Your browser blocked fullscreen.'));
  if (!force && on) return document.exitFullscreen().catch(() => {});
  return Promise.resolve();
}

// ─────────────────────────────── ScreenManager ───────────────────────────────
const Screens = {
  registry: {},
  current: null, currentName: null,
  history: [],
  busy: false,
  register(name, screen) { this.registry[name] = screen; },
  async go(name, params = {}, { replace = false, transition = 'default' } = {}) {
    const next = this.registry[name];
    if (!next || this.busy) return;
    if (this.currentName === name && !params.force) { next.refresh && next.refresh(params); return; }
    this.busy = true;
    try {
      const prev = this.current, prevName = this.currentName;
      if (prev) {
        if (prev.canLeave && !(await prev.canLeave())) return;
        if (!replace && prevName && !prev.transient) this.history.push(prevName);
        if (this.history.length > 20) this.history.shift();
        const oldEl = prev.el;
        prev.leave && prev.leave();
        if (oldEl) {
          oldEl.classList.remove('enter', 'zoom', 'from-right');
          oldEl.classList.add('leave'); if (transition === 'zoom') oldEl.classList.add('zoom');
          oldEl.inert = true; // (its state is already torn down: a click during the fade-out used to reach stale handlers)
          setTimeout(() => oldEl.remove(), 220);
        }
      }
      this.current = next; this.currentName = name;
      const el = await next.enter(params);
      next.el = el;
      el.classList.add('screen', 'enter');
      if (transition === 'zoom') el.classList.add('zoom');
      if (transition === 'right') el.classList.add('from-right');
      $('#screens').appendChild(el);
      Toolbar.setActive(next.tab || name);
      $('#app').classList.toggle('in-game', !!next.inGame);
      Bus.emit('screen:changed', name);
    } finally { this.busy = false; }
  },
  back() {
    if (this.current && this.current.onBack && this.current.onBack() === true) return;
    let prev = this.history.pop();
    while (prev && (prev === this.currentName || this.registry[prev]?.transient)) prev = this.history.pop();
    UISounds.back();
    this.go(prev || 'home', {}, { replace: true });
  },
};

/* ===== 13-screen-home.js ===== */
/* Main menu (osu!lazer's ButtonSystem): the logo sits in the middle of the screen; clicking it (or pressing any key)
 * opens the slanted button bar — Settings to the left of the logo; Play (→ Solo / Multi), Edit (→ skins, importing
 * and the library) and Browse to its right. Fifteen idle seconds bring the big logo back. Behind it all, lazer's
 * triangles drift upwards in the colour of the playing song's background. */

const HomeScreen = {
  tab: 'home',
  menuState: 'initial',
  IDLE_MS: 15000,
  enter() {
    this.logo = this.buildLogo();
    this.leftBtns = h('div.lz-buttons.lz-left');
    this.rightBtns = h('div.lz-buttons.lz-right');
    this.bar = h('div.lz-bar', h('div.lz-logo-slot', this.logo), this.leftBtns, this.rightBtns);
    this.flashL = h('div.msf.l'); this.flashR = h('div.msf.r');
    const el = h('div.home.lz-menu', { dataset: { state: 'initial' } }, MenuTriangles.mount(), this.flashL, this.flashR, h('div.lz-stage', this.bar), NeruMascot.build());
    this.el = el;
    this.setState(Screens.history.length ? 'top' : 'initial', true);
    this.startMenuMusic();
    this._idleAt = performance.now();
    this._poke = () => { this._idleAt = performance.now(); };
    for (const ev of ['pointermove', 'pointerdown', 'keydown', 'wheel']) window.addEventListener(ev, this._poke, { passive: true });
    this.loop();
    return el;
  },
  leave() {
    cancelAnimationFrame(this._raf); NeruMascot.stop(); MenuTriangles.stop();
    for (const ev of ['pointermove', 'pointerdown', 'keydown', 'wheel']) window.removeEventListener(ev, this._poke);
  },

  /** Button definitions (colours are osu!lazer's main-menu colours). */
  menuButtons(state) {
    const back = ['Back', 'back', '#555555', () => this.setState('top'), 'Esc'];
    if (state === 'play') return {
      left: [back],
      right: [
        ['Solo', 'user', '#6644cc', () => Screens.go('songselect', {}, { transition: 'zoom' }), 'S'],
        ['Multi', 'multi', '#5e3fba', () => Screens.go('multiplayer'), 'M'],
      ],
    };
    // where lazer has Edit (beatmap / skin editor): everything for changing what's installed
    if (state === 'edit') return {
      left: [back],
      right: [
        ['Skins', 'brush', '#eeaa00', () => Screens.go('skins'), 'S'],
        ['Import', 'upload', '#dca000', () => importViaPicker('.osz,.osk,.zip,.osu,.osr'), 'I'],
        ['Beatmaps', 'music', '#eeaa00', () => Screens.go('beatmaps'), 'B'],
        ['Collections', 'folder', '#dca000', () => Screens.go('collections'), 'C'],
        ['Replays', 'film', '#eeaa00', () => Screens.go('replays'), 'R'],
      ],
    };
    return {
      left: [['Settings', 'gear', '#555555', () => SettingsPanel.open(), 'O']],
      right: [
        ['Play', 'play', '#6644cc', () => this.setState('play'), 'P'],
        ['Edit', 'edit', '#eeaa00', () => this.setState('edit'), 'E'],
        ['Browse', 'download', '#a5cc00', () => Screens.go('explore'), 'B'],
      ],
    };
  },
  setState(state, instant = false) {
    this.menuState = state;
    this.el.dataset.state = state;
    this.el.classList.toggle('lz-instant', instant);
    const mk = ([label, ic, color, fn, key]) => {
      const b = h('button.lz-btn', { style: { '--c': color }, 'aria-label': label, title: key ? `${label} (${key})` : label, onclick: () => { UISounds.click(); fn(); } },
        h('span.lz-inner', h('span.lz-ico', icon(ic)), h('span.lz-label', label)));
      b.addEventListener('pointerenter', () => UISounds.hover());
      return b;
    };
    const d = this.menuButtons(state);
    clearEl(this.leftBtns).append(...d.left.map(mk));
    clearEl(this.rightBtns).append(...d.right.map(mk));
  },
  /** lazer's MainMenuButton: the hovered button's icon sways from side to side and bounces with the beat. */
  onBeat(len) {
    this._beatN = (this._beatN || 0) ^ 1;
    const b = this.el && this.el.querySelector('.lz-btn:hover');
    if (!b) return;
    const ico = b.querySelector('.lz-ico');
    ico.style.setProperty('--bt', `${Math.round(clamp(len, 250, 900))}ms`);
    ico.classList.toggle('bl', !this._beatN); ico.classList.toggle('br', !!this._beatN);
    ico.classList.remove('bounce'); void ico.offsetWidth; ico.classList.add('bounce');
  },
  /** lazer's MenuSideFlashes: the screen's edges light up with the music — both on each bar's first beat, or
   *  left and right in turn on every beat during kiai — as bright as the track is loud, fading over a beat. */
  sideFlash(beat, tp, kiai, amp) {
    if (!this.flashL || !Settings.get('ui.animSpeed')) return;
    const meter = tp.meter || 4;
    const alpha = clamp((amp - 0.25) / (kiai ? 0.94 : 1.36), 0, 1);
    if (alpha < 0.03) return;
    const dur = 80 + tp.beatLength;
    const flash = el => el.animate([{ opacity: 0, easing: 'linear' }, { opacity: alpha, offset: 80 / dur, easing: 'ease-in' }, { opacity: 0 }], { duration: dur });
    if (kiai ? beat % 2 === 0 : beat % meter === 0) flash(this.flashL);
    if (kiai ? beat % 2 === 1 : beat % meter === 0) flash(this.flashR);
  },
  onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    if (this.menuState === 'initial' && !['Escape', 'Tab', 'Shift'].includes(e.key)) { UISounds.click(); this.setState('top'); return true; }
    if (e.code === 'KeyU') { UISounds.click(); Screens.go('profile'); return true; } // (listed under ? as a main menu key)
    const d = this.menuButtons(this.menuState);
    const hit = [...d.left, ...d.right].find(b => b[4] && b[4].length === 1 && e.code === 'Key' + b[4]);
    if (hit) { UISounds.click(); hit[3](); return true; }
    if (e.key === 'Enter') {
      if (document.activeElement && document.activeElement.classList.contains('lz-btn')) document.activeElement.click();
      else { UISounds.click(); if (this.menuState === 'top') this.setState('play'); else Screens.go('songselect', {}, { transition: 'zoom' }); }
      return true;
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const btns = $$('.lz-btn', this.el), i = btns.indexOf(document.activeElement);
      const n = btns[clamp(i + (e.key === 'ArrowRight' ? 1 : -1), 0, btns.length - 1)];
      if (n) { n.focus(); UISounds.hover(); }
      return true;
    }
    return false;
  },
  onBack() {
    if (this.menuState === 'play' || this.menuState === 'edit') { UISounds.back(); this.setState('top'); return true; }
    if (this.menuState === 'top') { UISounds.back(); this.setState('initial'); return true; }
    return true;
  },

  buildLogo() {
    this.vis = h('canvas.lz-vis');
    this.cookie = h('button.lz-cookie', { 'aria-label': 'Play', title: 'Play',
      onclick: () => {
        UISounds.click();
        if (this.menuState === 'initial') this.setState('top');
        else if (this.menuState === 'top') this.setState('play');
        else Screens.go('songselect', {}, { transition: 'zoom' });
      } },
      h('span.lz-cookie-disc', h('span.lz-cookie-text', 'ashtonk!', h('small', 'mania'))));
    this.cookie.addEventListener('pointerenter', () => UISounds.hover());
    return h('div.lz-logo', this.vis, this.cookie);
  },
  /** Logo visualiser (radial FFT bars) + beat pulse from the playing track's timing points. */
  loop() {
    const amps = new Float32Array(64);
    let lastBeat = -1, pulseT = 0;
    const tick = now => {
      this._raf = requestAnimationFrame(tick);
      const cv = this.vis;
      if (!cv.isConnected) return;
      const r = cv.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      const x = cv.getContext('2d');
      x.clearRect(0, 0, W, H);
      const an = AudioManager.analyser;
      if (an && Music.playing) {
        const d = this._fft || (this._fft = new Uint8Array(an.frequencyBinCount));
        an.getByteFrequencyData(d);
        for (let i = 0; i < amps.length; i++) amps[i] = Math.max(amps[i] * 0.86, d[i + 2] / 255);
      } else for (let i = 0; i < amps.length; i++) amps[i] *= 0.9;
      const cx = W / 2, cy = H / 2, inner = W * 0.285, maxLen = W * 0.21;
      const rot = now / 9000;
      x.fillStyle = 'rgba(255,255,255,0.2)';
      const bars = 200, bw = Math.max(1.5, inner * Math.PI * 2 / bars * 0.55);
      for (let i = 0; i < bars; i++) {
        const a = rot + i / bars * Math.PI * 2;
        const v = amps[(i * 7) % amps.length];
        const len = v * v * maxLen;
        if (len < 1) continue;
        x.save(); x.translate(cx, cy); x.rotate(a); x.fillRect(inner, -bw / 2, len, bw); x.restore();
      }
      // beat pulse
      const tm = Music.meta && Music.meta.timing;
      if (tm && Music.playing) {
        const t = Music.time, i = Math.max(0, bsearchLE(tm, t, 'time')), tp = tm[i];
        const beat = Math.floor((t - tp.time) / tp.beatLength), key = i * 100000 + beat;
        if (key !== lastBeat && t >= tp.time) {
          lastBeat = key; pulseT = now; this.onBeat(tp.beatLength);
          const kp = tm.kiai && tm.kiai.length ? tm.kiai[Math.max(0, bsearchLE(tm.kiai, t, 'time'))] : null;
          let amp = 0; for (let j = 0; j < 8; j++) amp = Math.max(amp, amps[j]);
          const kiai = !!(kp && kp.on && t >= kp.time);
          this.sideFlash(beat, tp, kiai, amp);
          // (lazer's logo pulses harder and flashes on each beat during kiai)
          this._kiai = kiai;
          if (kiai && Settings.get('ui.animSpeed')) this.cookie.animate([{ filter: 'brightness(1.3)' }, { filter: 'brightness(1)' }], { duration: tp.beatLength, easing: 'ease-in' });
        }
      } else if (now - pulseT > 600) { pulseT = now; this._kiai = false; this.onBeat(600); } // no beat to follow: sway at a steady pace
      // idle for a while: back to the big logo, as when the game opens
      if (this.menuState !== 'initial' && now - this._idleAt > this.IDLE_MS && !Overlays.stack.length && !SettingsPanel.o && !(NowPlaying.open)) this.setState('initial');
      const k = clamp((now - pulseT) / 260, 0, 1);
      this.cookie.style.transform = `scale(${1 + (this._kiai ? 0.055 : 0.035) * (1 - k) * (1 - k)})`;
    };
    this._raf = requestAnimationFrame(tick);
  },
  async startMenuMusic() {
    const id = Settings.get('last.map');
    let map = id && BeatmapManager.maps.get(id);
    if (!map || map.problems.length) { const all = BeatmapManager.playableMaps(); map = all[Math.floor(Math.random() * all.length)]; }
    if (!map) { Background.set(null); return; }
    const url = await BeatmapManager.bgURL(map) || await BeatmapManager.thumbURL(BeatmapManager.setById.get(map.setId));
    Background.set(url);
    if (Music.meta && Music.loaded && (Music.playing || MenuMusic.paused)) { Music.onEnded = () => MenuMusic.next(); return; }
    await MenuMusic.play(map);
  },
};

/** osu!lazer's triangles behind the main menu: triangles in shades of one colour drift upwards, and the colour
 *  follows the playing song's background (its average colour, saturated a little), fading over a second when the
 *  song changes. Drawn at half resolution, 30 times a second, and only while the menu is on screen. */
const MenuTriangles = {
  tris: [], col: [250, 0.45, 0.36], target: [250, 0.45, 0.36], running: false,
  mount() {
    this.cv = h('canvas.lz-tri', { 'aria-hidden': 'true' });
    this.running = true; this._last = 0;
    if (!this._sub) this._sub = Bus.on('bg:changed', url => this.fromImage(url));
    this.fromImage(Background.current);
    const tick = now => {
      if (!this.running) return;
      this._raf = requestAnimationFrame(tick);
      if (now - this._last < 33 || document.hidden) return;
      const dt = Math.min(100, now - (this._last || now)); this._last = now;
      this.draw(dt);
    };
    this._raf = requestAnimationFrame(tick);
    return this.cv;
  },
  stop() { this.running = false; cancelAnimationFrame(this._raf); },
  /** Average colour of the background image → the triangles' hue and saturation. */
  async fromImage(url) {
    if (!url) { this.target = [250, 0.45, 0.36]; return; }
    try {
      const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url; await img.decode();
      const c = document.createElement('canvas'); c.width = c.height = 12;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, 12, 12);
      const d = x.getImageData(0, 0, 12, 12).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { const w = 0.2 + Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]); r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w; n += w; }
      const [hh, ss] = rgbToHsl(r / n, g / n, b / n);
      if (Background.current === url) this.target = [hh, clamp(ss * 1.25 + 0.1, 0.18, 0.75), 0.36];
    } catch (e) { /* unreadable image: keep the colour */ }
  },
  draw(dt) {
    const cv = this.cv;
    if (!cv || !cv.isConnected) return;
    const W = Math.max(1, Math.round(cv.clientWidth / 2)), H = Math.max(1, Math.round(cv.clientHeight / 2));
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; this.tris = []; this._seeded = false; }
    // ease the colour towards the song's (hue the short way round the wheel)
    const k = Math.min(1, dt / 900), c = this.col, t = this.target;
    let dh = ((t[0] - c[0] + 540) % 360) - 180;
    c[0] = (c[0] + dh * k + 360) % 360; c[1] += (t[1] - c[1]) * k; c[2] += (t[2] - c[2]) * k;
    const want = Settings.get('graphics.performanceMode') ? 26 : 60;
    while (this.tris.length < want) this.tris.push(this.spawn(W, H, !this._seeded)); // (the first fill covers the screen)
    this._seeded = true;
    const x = cv.getContext('2d');
    x.fillStyle = `hsl(${c[0].toFixed(1)} ${(c[1] * 100 * 0.7).toFixed(1)}% ${(c[2] * 100 * 0.42).toFixed(1)}%)`;
    x.fillRect(0, 0, W, H);
    for (const tr of this.tris) {
      tr.y -= tr.v * dt;
      const s = tr.s;
      if (tr.y + s < 0) Object.assign(tr, this.spawn(W, H, false));
      x.fillStyle = `hsl(${c[0].toFixed(1)} ${(c[1] * 100).toFixed(1)}% ${(c[2] * 100 * tr.l).toFixed(1)}% / ${tr.a})`;
      x.beginPath(); x.moveTo(tr.x, tr.y); x.lineTo(tr.x + s * 0.577, tr.y + s); x.lineTo(tr.x - s * 0.577, tr.y + s); x.closePath(); x.fill();
    }
  },
  spawn(W, H, anywhere) {
    const s = (18 + Math.random() ** 2 * 110) * Math.max(0.6, H / 540);
    return { x: Math.random() * W, y: anywhere ? Math.random() * H : H + Math.random() * 40, s, v: (0.004 + 0.016 * (1 - s / 160)) * Math.max(0.6, H / 540), l: 0.55 + Math.random() * 0.9, a: (0.35 + Math.random() * 0.5).toFixed(2) };
  },
};
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  const hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [hh * 60, s, l];
}

/** Where menu music / song-select previews start: the beatmap's PreviewTime, or 40% in (as osu! does) when
 *  the map doesn't set one. */
function previewStart(map) { return map.previewTime > 0 ? map.previewTime : Math.round((map.length || 0) * 0.4); }
/** Red-line timing for the menu beat pulse (parsed after playback has started). */
async function beatTiming(map) {
  const parsed = await BeatmapManager.load(map.id).catch(() => null);
  if (!parsed) return null;
  const out = BeatmapParser.timing(parsed.bm).red.map(r => ({ time: r.time, beatLength: r.beatLength, meter: r.meter || 4 }));
  // kiai sections (bit 1 of a timing point's effects), for the menu's side flashes
  out.kiai = (parsed.bm.timingPoints || []).map(t => ({ time: t.time, on: !!(t.effects & 1) })).sort((a, b) => a.time - b.time);
  return out;
}

/** Background music (main menu / everywhere outside gameplay) with previous / pause / next. */
const MenuMusic = {
  paused: false, current: null, history: [],
  async play(map, { fromPreview = true } = {}) {
    if (!map) return;
    const tok = this._tok = {};
    try {
      await AudioManager.resume();
      const blob = await BeatmapManager.getFile(map.setId, map.audioFile);
      if (tok !== this._tok) return; // another track was requested meanwhile
      if (!blob) throw new Error('missing audio');
      Music.stream(blob, `${map.setId}/${map.audioFile}`, { setId: map.setId, mapId: map.id, timing: null });
      Music.play(fromPreview ? previewStart(map) : 0, { fadeIn: 600 });
      Music.onEnded = () => this.next();
      this.paused = false;
      this.setCurrent(map);
      beatTiming(map).then(timing => { if (tok === this._tok && Music.meta && Music.meta.mapId === map.id) Music.meta.timing = timing; });
    } catch (e) { console.warn('menu music', e); }
  },
  setCurrent(map) { this.current = map; Toolbar.setNowPlaying(map); Bus.emit('music:changed', map); },
  toggle() {
    // nothing loaded yet (preview audio off, or the first track never started): play starts one
    if (!Music.loaded && !Music.playing) {
      const sel = Screens.currentName === 'songselect' && BeatmapManager.maps.get(SongSelect.selectedId);
      if (sel && !sel.problems.length) this.play(sel); else this.next();
      return;
    }
    if (Music.playing) { Music.pause(); this.paused = true; }
    else if (Music.loaded) { Music.play(Music.pausedPos, { fadeIn: 250 }); this.paused = false; }
    Bus.emit('music:changed', this.current);
  },
  /** Switching tracks also switches the selected beatmap when song select is open (like lazer). */
  async go(map, fromPreview) {
    if (!map) return;
    Settings.set('last.map', map.id);
    if (Screens.currentName === 'songselect') { SongSelect.select(map.id); return; }
    Background.set(await BeatmapManager.bgURL(map));
    this.play(map, { fromPreview });
  },
  /** Next track: a shuffled run through every set, so a small library plays each song once before any repeats
   *  (picking at random kept landing on the same one or two). */
  async next() {
    const sets = BeatmapManager.sets.filter(s => s.maps.some(m => !m.problems.length));
    if (!sets.length) return;
    if (this.current) this.history.push(this.current.id);
    const have = new Set(sets.map(s => s.id));
    this.queue = (this.queue || []).filter(id => have.has(id) && (!this.current || id !== this.current.setId));
    if (!this.queue.length) {
      const ids = sets.map(s => s.id).filter(id => sets.length < 2 || !this.current || id !== this.current.setId);
      for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
      this.queue = ids;
    }
    const set = BeatmapManager.setById.get(this.queue.shift());
    this.go(set.maps.find(m => !m.problems.length), false);
  },
  async prev() {
    if (Music.playing && Music.time > 4000) { Music.play(0, { fadeIn: 150 }); return; }
    const id = this.history.pop();
    const map = id && BeatmapManager.maps.get(id);
    if (!map) { if (Music.loaded) Music.play(0, { fadeIn: 150 }); return; }
    this.go(map, false);
  },
};

/* ===== 13b-neru.js ===== */
/* Neru on the main menu: a picture of Neru standing in the bottom-left corner. It shows the image chosen in
 * Settings → Interface, otherwise neru.png / neru.webp / neru.gif / neru.jpg placed next to index.html (the
 * public/ folder). With no picture nothing is shown. Clicking her makes her hop. */

const NeruMascot = {
  FILES: ['neru.png', 'neru.webp', 'neru.gif', 'neru.jpg'],
  _probe: null, _blobURL: null,
  /** URL of the picture to show, or null. */
  async source() {
    const blob = await DB.kvGet('mascot.image', null).catch(() => null);
    if (blob instanceof Blob) {
      if (this._blobURL) URL.revokeObjectURL(this._blobURL);
      return (this._blobURL = URL.createObjectURL(blob));
    }
    const loads = src => new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = src; });
    if (!this._probe) this._probe = (async () => { for (const f of this.FILES) if (await loads(f)) return f; return null; })();
    return this._probe;
  },
  build() {
    const el = this.el = h('button.neru', { hidden: true, 'aria-label': 'Neru', onclick: e => { e.stopPropagation(); this.hop(); } });
    if (!Settings.get('ui.mascot')) return el;
    this.source().then(async u => {
      if (!u || this.el !== el) return;
      this.img = h('img.neru-img', { src: u, alt: '', draggable: 'false' });
      el.append(this.img);
      el.hidden = false;
      // the bundled Neru has a second, happy picture she switches to when clicked
      this.base = u; this.happy = null;
      if (!u.startsWith('blob:')) {
        const ok = await new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = 'neru-happy.png'; });
        if (ok && this.el === el) this.happy = 'neru-happy.png';
      }
    });
    return el;
  },
  hop() {
    if (!this.el) return;
    this.el.classList.remove('hop'); void this.el.offsetWidth; this.el.classList.add('hop');
    UISounds.click();
    if (this.happy && this.img) {
      this.img.src = this.happy;
      clearTimeout(this._back);
      this._back = setTimeout(() => { if (this.img) this.img.src = this.base; }, 1600);
    }
  },
  /** Use a picture the player chose (a File/Blob), or null to go back to the bundled one. */
  async setImage(file) {
    await DB.kvSet('mascot.image', file ? new Blob([await file.arrayBuffer()], { type: file.type || 'image/png' }) : null);
    this._probe = null;
    const old = document.querySelector('.home .neru');
    if (old) old.replaceWith(this.build());
  },
  stop() { clearTimeout(this._back); this.el = null; this.img = null; },
};

Bus.on('settings:changed', k => {
  if (k === 'ui.mascot' && Screens.currentName === 'home') { const old = document.querySelector('.home .neru'); if (old) old.replaceWith(NeruMascot.build()); }
});

/* ===== 14-screen-songselect.js ===== */
/* Song select — virtualized beatmap carousel, instant fuzzy search with filter syntax,
 * sorting & filters, live audio preview, beatmap info wedge and local leaderboard. */

const SORTS = [
  ['title', 'Title'], ['artist', 'Artist'], ['creator', 'Mapper'], ['stars', 'Star rating'], ['od', 'Difficulty (OD)'],
  ['bpm', 'BPM'], ['length', 'Length'], ['added', 'Date added'], ['lastPlayed', 'Last played'], ['playCount', 'Play count'],
  ['score', 'Best score'], ['accuracy', 'Best accuracy'],

const SongSelect = {

    this.searchInput.addEventListener('input', () => { this.query = this.searchInput.value; this.rebuild(true); });

        if (e.key === 'Escape' && this.searchInput.value) { this.searchInput.value = ''; this.query = ''; this.rebuild(true); e.stopPropagation(); e.preventDefault(); return; }
