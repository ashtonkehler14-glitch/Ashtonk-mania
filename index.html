  const b = h('button.lz-back', { onclick: () => { UISounds.back(); onClick(); }, title: 'Back (Esc)', 'aria-label': 'Back' }, h('span.lz-back-inner', icon('back'), 'back'));
  b.addEventListener('pointerenter', () => UISounds.hover());
  return b;
}

/** osu!-style volume control: Alt + mouse wheel adjusts master volume (Shift = music, Ctrl = effects). */
const VolumeOverlay = {
  el: null, hideT: 0,
  adjust(which, delta) {
    const key = which === 'music' ? 'audio.music' : which === 'effects' ? 'audio.effects' : 'audio.master';
    const v = clamp(Math.round((Settings.get(key) + delta) * 100) / 100, 0, 1);
    Settings.set(key, v);
    this.show();
  },
  show() {
    if (!this.el) { this.el = h('div.volume-overlay'); $('#app').appendChild(this.el); }
    clearEl(this.el).append(...[['Master', 'audio.master'], ['Music', 'audio.music'], ['Effects', 'audio.effects']].map(([l, k]) => {
      const v = Settings.get(k);
      return h('div.vo-row', h('div.vo-ring', { style: { '--p': (v * 100) + '%' } }, h('span', Math.round(v * 100))), h('div.vo-l', l));
    }));
    this.el.classList.add('show');
    clearTimeout(this.hideT);
    this.hideT = setTimeout(() => this.el.classList.remove('show'), 1400);
  },
  bind() {
    window.addEventListener('wheel', e => {
      if (!e.altKey) return;
      e.preventDefault();
      this.adjust(e.shiftKey ? 'music' : e.ctrlKey ? 'effects' : 'master', e.deltaY < 0 ? 0.05 : -0.05);
    }, { passive: false });
  },
};

/**
 * Keeps the interface the same physical size regardless of browser zoom (like a native client):
 * zoom shortcuts (Ctrl +/-/0, Ctrl + wheel, pinch) are blocked, and a zoom level that is already set
 * is detected (outer/inner window width, sanity-checked against the device pixel ratio) and undone by
 * laying #app out at the un-zoomed size and scaling it back down.
 */
const Zoom = {
  z: 1,
  LEVELS: [0.25, 0.3, 1 / 3, 0.5, 2 / 3, 0.75, 0.8, 0.9, 1, 1.1, 1.2, 1.25, 4 / 3, 1.5, 1.7, 1.75, 2, 2.4, 2.5, 3, 4, 5],
  BASE_DPR: [1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.625, 3, 3.5, 4],
  init() {
    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && ['Equal', 'Minus', 'NumpadAdd', 'NumpadSubtract', 'Digit0', 'Numpad0'].includes(e.code)) e.preventDefault();
    }, true);
    window.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false, capture: true });
    ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    window.addEventListener('resize', () => this.update());
    this.update();
  },
  detect() {
    const ow = window.outerWidth, iw = window.innerWidth;
    if (!ow || !iw) return 1;
    const raw = ow / iw;
    const lvl = this.LEVELS.reduce((a, b) => Math.abs(b - raw) < Math.abs(a - raw) ? b : a);
    if (lvl === 1 || Math.abs(lvl - raw) / lvl > 0.03) return 1; // side panels / devtools make the ratio meaningless
    const base = (window.devicePixelRatio || 1) / lvl;
    return this.BASE_DPR.some(b => Math.abs(b - base) < 0.06) ? lvl : 1;
  },
  update() {
    const z = this.detect();
    if (z === this.z) return;
    this.z = z;
    const r = document.documentElement.style;
    r.setProperty('--zoom', z); r.setProperty('--zoom-inv', 1 / z);
    $('#app').classList.toggle('zoomfix', z !== 1);
  },
  /** Canvas backing-store scale for sizes measured in layout px (clientWidth). */
  dpr() { return (window.devicePixelRatio || 1) / this.z; },
};

function toggleFullscreen(force) {
  const el = document.documentElement;
  const on = !!document.fullscreenElement;
  if (force === undefined) force = !on;
  if (force && !on) return (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : Promise.reject()).catch(() => Toast.err('Fullscreen unavailable', 'Your browser blocked fullscreen.'));
  if (!force && on) return document.exitFullscreen().catch(() => {});
  return Promise.resolve();
}

// ─────────────────────────────── ScreenManager ───────────────────────────────
const Screens = {
  registry: {},
  current: null, currentName: null,
  history: [],
  busy: false,
  register(name, screen) { this.registry[name] = screen; },
  async go(name, params = {}, { replace = false, transition = 'default' } = {}) {
    const next = this.registry[name];
    if (!next || this.busy) return;
    if (this.currentName === name && !params.force) { next.refresh && next.refresh(params); return; }
    this.busy = true;
    try {
      const prev = this.current, prevName = this.currentName;
      if (prev) {
        if (prev.canLeave && !(await prev.canLeave())) return;
        if (!replace && prevName && !prev.transient) this.history.push(prevName);
        if (this.history.length > 20) this.history.shift();
        const oldEl = prev.el;
        prev.leave && prev.leave();
        if (oldEl) {
          oldEl.classList.remove('enter', 'zoom', 'from-right');
          oldEl.classList.add('leave'); if (transition === 'zoom') oldEl.classList.add('zoom');
          setTimeout(() => oldEl.remove(), 220);
        }
      }
      this.current = next; this.currentName = name;
      const el = await next.enter(params);
      next.el = el;
      el.classList.add('screen', 'enter');
      if (transition === 'zoom') el.classList.add('zoom');
      if (transition === 'right') el.classList.add('from-right');
      $('#screens').appendChild(el);
      Toolbar.setActive(next.tab || name);
      $('#app').classList.toggle('in-game', !!next.inGame);
      Bus.emit('screen:changed', name);
    } finally { this.busy = false; }
  },
  back() {
    if (this.current && this.current.onBack && this.current.onBack() === true) return;
    let prev = this.history.pop();
    while (prev && (prev === this.currentName || this.registry[prev]?.transient)) prev = this.history.pop();
    UISounds.back();
    this.go(prev || 'home', {}, { replace: true });
  },
};

/* ===== 13-screen-home.js ===== */
/* Main menu (osu!lazer style): the logo sits in the middle of the screen; clicking it (or pressing
 * any key) opens a slanted button bar — Play → Solo / Multiplayer / Practice. Music keeps playing
 * in the background and can be controlled from the toolbar's now-playing panel. */

const HomeScreen = {
  tab: 'home',
  menuState: 'initial',
  enter() {
    this.logo = this.buildLogo();
    this.leftBtns = h('div.lz-buttons.lz-left');
    this.rightBtns = h('div.lz-buttons.lz-right');
    this.bar = h('div.lz-bar', h('div.lz-logo-slot', this.logo), this.leftBtns, this.rightBtns);
    const el = h('div.home.lz-menu', { dataset: { state: 'initial' } }, h('div.lz-stage', this.bar), NeruMascot.build());
    this.el = el;
    this.setState(Screens.history.length ? 'top' : 'initial', true);
    this.startMenuMusic();
    this.loop();
    return el;
  },
  leave() { cancelAnimationFrame(this._raf); NeruMascot.stop(); },

  /** Button definitions (colours are osu!lazer's main-menu colours). */
  menuButtons(state) {
    if (state === 'play') return {
      left: [['Back', 'back', '#555555', () => this.setState('top'), 'Esc']],
      right: [
        ['Solo', 'user', '#6644cc', () => Screens.go('songselect', {}, { transition: 'zoom' }), 'S'],
        ['Multi', 'multi', '#5e3fba', () => Screens.go('multiplayer'), 'M'],
        ['Practice', 'flag', '#5e3fba', () => Screens.go('songselect', { practice: true }, { transition: 'zoom' }), 'P'],
      ],
    };
    return {
      left: [],
      right: [
        ['Settings', 'gear', '#555555', () => SettingsPanel.open(), 'O'],
        ['Play', 'play', '#6644cc', () => this.setState('play'), 'P'],
        ['Browse', 'download', '#a5cc00', () => Screens.go('explore'), 'B'],
        ['Profile', 'user', '#ee3399', () => Screens.go('profile'), 'U'],
      ],
    };
  },
  setState(state, instant = false) {
    this.menuState = state;
    this.el.dataset.state = state;
    this.el.classList.toggle('lz-instant', instant);
    const mk = ([label, ic, color, fn, key]) => {
      const b = h('button.lz-btn', { style: { '--c': color }, 'aria-label': label, title: key ? `${label} (${key})` : label, onclick: () => { UISounds.click(); fn(); } },
        h('span.lz-inner', icon(ic), h('span.lz-label', label)));
      b.addEventListener('pointerenter', () => UISounds.hover());
      return b;
    };
    const d = this.menuButtons(state);
    clearEl(this.leftBtns).append(...d.left.map(mk));
    clearEl(this.rightBtns).append(...d.right.map(mk));
  },
  onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    if (this.menuState === 'initial' && !['Escape', 'Tab', 'Shift'].includes(e.key)) { UISounds.click(); this.setState('top'); return true; }
    const d = this.menuButtons(this.menuState);
    const hit = [...d.left, ...d.right].find(b => b[4] && b[4].length === 1 && e.code === 'Key' + b[4]);
    if (hit) { UISounds.click(); hit[3](); return true; }
    if (e.key === 'Enter') {
      if (document.activeElement && document.activeElement.classList.contains('lz-btn')) document.activeElement.click();
      else { UISounds.click(); if (this.menuState === 'top') this.setState('play'); else Screens.go('songselect', {}, { transition: 'zoom' }); }
      return true;
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const btns = $$('.lz-btn', this.el), i = btns.indexOf(document.activeElement);
      const n = btns[clamp(i + (e.key === 'ArrowRight' ? 1 : -1), 0, btns.length - 1)];
      if (n) { n.focus(); UISounds.hover(); }
      return true;
    }
    return false;
  },
  onBack() {
    if (this.menuState === 'play') { UISounds.back(); this.setState('top'); return true; }
    if (this.menuState === 'top') { UISounds.back(); this.setState('initial'); return true; }
    return true;
  },

  buildLogo() {
    this.vis = h('canvas.lz-vis');
    this.cookie = h('button.lz-cookie', { 'aria-label': 'Play', title: 'Play',
      onclick: () => {
        UISounds.click();
        if (this.menuState === 'initial') this.setState('top');
        else if (this.menuState === 'top') this.setState('play');
        else Screens.go('songselect', {}, { transition: 'zoom' });
      } },
      h('span.lz-cookie-disc', h('span.lz-cookie-text', 'ashtonk!', h('small', 'mania'))));
    this.cookie.addEventListener('pointerenter', () => UISounds.hover());
    return h('div.lz-logo', this.vis, this.cookie);
  },
  /** Logo visualiser (radial FFT bars) + beat pulse from the playing track's timing points. */
  loop() {
    const amps = new Float32Array(64);
    let lastBeat = -1, pulseT = 0;
    const tick = now => {
      this._raf = requestAnimationFrame(tick);
      const cv = this.vis;
      if (!cv.isConnected) return;
      const r = cv.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
      const x = cv.getContext('2d');
      x.clearRect(0, 0, W, H);
      const an = AudioManager.analyser;
      if (an && Music.playing) {
        const d = this._fft || (this._fft = new Uint8Array(an.frequencyBinCount));
        an.getByteFrequencyData(d);
        for (let i = 0; i < amps.length; i++) amps[i] = Math.max(amps[i] * 0.86, d[i + 2] / 255);
      } else for (let i = 0; i < amps.length; i++) amps[i] *= 0.9;
      const cx = W / 2, cy = H / 2, inner = W * 0.285, maxLen = W * 0.21;
      const rot = now / 9000;
      x.fillStyle = 'rgba(255,255,255,0.2)';
      const bars = 200, bw = Math.max(1.5, inner * Math.PI * 2 / bars * 0.55);
      for (let i = 0; i < bars; i++) {
        const a = rot + i / bars * Math.PI * 2;
        const v = amps[(i * 7) % amps.length];
        const len = v * v * maxLen;
        if (len < 1) continue;
        x.save(); x.translate(cx, cy); x.rotate(a); x.fillRect(inner, -bw / 2, len, bw); x.restore();
      }
      // beat pulse
      const tm = Music.meta && Music.meta.timing;
      if (tm && Music.playing) {
        const t = Music.time, i = Math.max(0, bsearchLE(tm, t, 'time')), tp = tm[i];
        const beat = Math.floor((t - tp.time) / tp.beatLength), key = i * 100000 + beat;
        if (key !== lastBeat && t >= tp.time) { lastBeat = key; pulseT = now; }
      }
      const k = clamp((now - pulseT) / 260, 0, 1);
      this.cookie.style.transform = `scale(${1 + 0.035 * (1 - k) * (1 - k)})`;
    };
    this._raf = requestAnimationFrame(tick);
  },
  async startMenuMusic() {
    const id = Settings.get('last.map');
    let map = id && BeatmapManager.maps.get(id);
    if (!map || map.problems.length) { const all = BeatmapManager.playableMaps(); map = all[Math.floor(Math.random() * all.length)]; }
    if (!map) { Background.set(null); return; }
    const url = await BeatmapManager.bgURL(map) || await BeatmapManager.thumbURL(BeatmapManager.setById.get(map.setId));
    Background.set(url);
    if (Music.meta && Music.loaded && (Music.playing || MenuMusic.paused)) { Music.onEnded = () => MenuMusic.next(); return; }
    await MenuMusic.play(map);
  },
};

/** Where menu music / song-select previews start: the beatmap's PreviewTime, or 40% in (as osu! does) when
 *  the map doesn't set one. */
function previewStart(map) { return map.previewTime > 0 ? map.previewTime : Math.round((map.length || 0) * 0.4); }
/** Red-line timing for the menu beat pulse (parsed after playback has started). */
async function beatTiming(map) {
  const parsed = await BeatmapManager.load(map.id).catch(() => null);
  return parsed ? BeatmapParser.timing(parsed.bm).red.map(r => ({ time: r.time, beatLength: r.beatLength })) : null;
}

/** Background music (main menu / everywhere outside gameplay) with previous / pause / next. */
const MenuMusic = {
  paused: false, current: null, history: [],
  async play(map, { fromPreview = true } = {}) {
    if (!map) return;
    const tok = this._tok = {};
    try {
      await AudioManager.resume();
      const blob = await BeatmapManager.getFile(map.setId, map.audioFile);
      if (tok !== this._tok) return; // another track was requested meanwhile
      if (!blob) throw new Error('missing audio');
      Music.stream(blob, `${map.setId}/${map.audioFile}`, { setId: map.setId, mapId: map.id, timing: null });
      Music.play(fromPreview ? previewStart(map) : 0, { fadeIn: 600 });
      Music.onEnded = () => this.next();
      this.paused = false;
      this.setCurrent(map);
      beatTiming(map).then(timing => { if (tok === this._tok && Music.meta && Music.meta.mapId === map.id) Music.meta.timing = timing; });
    } catch (e) { console.warn('menu music', e); }
  },
  setCurrent(map) { this.current = map; Toolbar.setNowPlaying(map); Bus.emit('music:changed', map); },
  toggle() {
    if (Music.playing) { Music.pause(); this.paused = true; }
    else if (Music.loaded) { Music.play(Music.pausedPos, { fadeIn: 250 }); this.paused = false; }
    Bus.emit('music:changed', this.current);
  },
  /** Switching tracks also switches the selected beatmap when song select is open (like lazer). */
  async go(map, fromPreview) {
    if (!map) return;
    Settings.set('last.map', map.id);
    if (Screens.currentName === 'songselect') { SongSelect.select(map.id); return; }
    Background.set(await BeatmapManager.bgURL(map));
    this.play(map, { fromPreview });
  },
  async next() {
    const sets = BeatmapManager.sets.filter(s => s.maps.some(m => !m.problems.length));
    if (!sets.length) return;
    if (this.current) this.history.push(this.current.id);
    const pool = sets.length > 1 && this.current ? sets.filter(s => s.id !== this.current.setId) : sets;
    const set = pool[Math.floor(Math.random() * pool.length)];
    this.go(set.maps.find(m => !m.problems.length), false);
  },
  async prev() {
    if (Music.playing && Music.time > 4000) { Music.play(0, { fadeIn: 150 }); return; }
    const id = this.history.pop();
    const map = id && BeatmapManager.maps.get(id);
    if (!map) { if (Music.loaded) Music.play(0, { fadeIn: 150 }); return; }
    this.go(map, false);
  },
};

/* ===== 13b-neru.js ===== */
/* Neru on the main menu: a picture of Neru standing in the bottom-left corner. It shows the image chosen in
 * Settings → Interface, otherwise neru.png / neru.webp / neru.gif / neru.jpg placed next to index.html (the
 * public/ folder). With no picture nothing is shown. Clicking her makes her hop. */

const NeruMascot = {
  FILES: ['neru.png', 'neru.webp', 'neru.gif', 'neru.jpg'],
  _probe: null, _blobURL: null,
  /** URL of the picture to show, or null. */
  async source() {
    const blob = await DB.kvGet('mascot.image', null).catch(() => null);
    if (blob instanceof Blob) {
      if (this._blobURL) URL.revokeObjectURL(this._blobURL);
      return (this._blobURL = URL.createObjectURL(blob));
    }
    const loads = src => new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = src; });
    if (!this._probe) this._probe = (async () => { for (const f of this.FILES) if (await loads(f)) return f; return null; })();
    return this._probe;
  },
  build() {
    const el = this.el = h('button.neru', { hidden: true, 'aria-label': 'Neru', onclick: e => { e.stopPropagation(); this.hop(); } });
    if (!Settings.get('ui.mascot')) return el;
    this.source().then(async u => {
      if (!u || this.el !== el) return;
      this.img = h('img.neru-img', { src: u, alt: '', draggable: 'false' });
      el.append(this.img);
      el.hidden = false;
      // the bundled Neru has a second, happy picture she switches to when clicked
      this.base = u; this.happy = null;
      if (!u.startsWith('blob:')) {
        const ok = await new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = 'neru-happy.png'; });
        if (ok && this.el === el) this.happy = 'neru-happy.png';
      }
    });
    return el;
  },
  hop() {
    if (!this.el) return;
    this.el.classList.remove('hop'); void this.el.offsetWidth; this.el.classList.add('hop');
    UISounds.click();
    if (this.happy && this.img) {
      this.img.src = this.happy;
      clearTimeout(this._back);
      this._back = setTimeout(() => { if (this.img) this.img.src = this.base; }, 1600);
    }
  },
  /** Use a picture the player chose (a File/Blob), or null to go back to the bundled one. */
  async setImage(file) {
    await DB.kvSet('mascot.image', file ? new Blob([await file.arrayBuffer()], { type: file.type || 'image/png' }) : null);
    this._probe = null;
    const old = document.querySelector('.home .neru');
    if (old) old.replaceWith(this.build());
  },
  stop() { clearTimeout(this._back); this.el = null; this.img = null; },
};

Bus.on('settings:changed', k => {
  if (k === 'ui.mascot' && Screens.currentName === 'home') { const old = document.querySelector('.home .neru'); if (old) old.replaceWith(NeruMascot.build()); }
});

/* ===== 14-screen-songselect.js ===== */
/* Song select — virtualized beatmap carousel, instant fuzzy search with filter syntax,
 * sorting & filters, live audio preview, beatmap info wedge and local leaderboard. */

const SORTS = [
  ['title', 'Title'], ['artist', 'Artist'], ['creator', 'Mapper'], ['stars', 'Star rating'], ['od', 'Difficulty (OD)'],
  ['bpm', 'BPM'], ['length', 'Length'], ['added', 'Date added'], ['lastPlayed', 'Last played'], ['playCount', 'Play count'],
  ['score', 'Best score'], ['accuracy', 'Best accuracy'],
];
const STATUS_FILTERS = [
  ['all', 'All'], ['favorites', 'Favorites'], ['recent', 'Recent'], ['played', 'Played'], ['unplayed', 'Unplayed'],
  ['passed', 'Passed'], ['failed', 'Failed'], ['pb', 'Has PB'], ['mods', 'Passed with current mods'],
];

const SongSelect = {
  tab: 'songselect',
  query: '',
  selectedId: null, expandedSet: null,
  rows: [], ROW_SET: 92, ROW_DIFF: 64,

  enter(params = {}) {
    this.practiceMode = !!params.practice;
    this.mpPick = !!params.mpPick && Multiplayer.inRoom();
    if (params.mapId) this.selectedId = params.mapId;
    else if (!this.selectedId) this.selectedId = Settings.get('last.map');
    const el = h('div.ss');
    this.el = el;
    this.searchInput = h('input.input', { type: 'search', placeholder: 'type to search', title: 'Filters: keys=7 stars>4 bpm>180 od>8 length<120 ln>30', value: this.query, 'aria-label': 'Search beatmaps', spellcheck: 'false' });
    this.searchInput.addEventListener('input', () => { this.query = this.searchInput.value; this.rebuild(true); });
    this.searchInput.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'Enter', 'F1', 'F2', 'F3', 'F4'].includes(e.key) || (e.key === 'Escape')) {
        if (e.key === 'Escape' && this.searchInput.value) { this.searchInput.value = ''; this.query = ''; this.rebuild(true); e.stopPropagation(); e.preventDefault(); return; }
        this.searchInput.blur();
      } else e.stopPropagation();
    });
    this.countEl = h('span.ss-count');
    const sel = (label, opts, cur, fn) => {
      const el = h('select.select', { 'aria-label': label, title: label }, ...opts.map(([v, l]) => h('option', { value: v, selected: cur === v }, l)));
      el.addEventListener('change', () => { UISounds.click(); fn(el.value); });
      return h('label.ss-sel', h('span', label), el);
    };
    const keysNow = (Settings.get('songselect.keys') || [])[0] || '';
    this.collSel = h('select.select', { 'aria-label': 'Collection' });
    this.fillCollections();
    this.collSel.addEventListener('change', () => { Settings.set('songselect.collection', this.collSel.value); UISounds.click(); this.rebuild(true); });
    const filters = h('div.ss-filter',
      h('div.ss-search', icon('search'), this.searchInput),
      h('div.ss-filter-row',
        sel('Sort', SORTS, Settings.get('songselect.sort'), v => { Settings.set('songselect.sort', v); this.rebuild(); }),
        sel('Show', STATUS_FILTERS, Settings.get('songselect.filter'), v => { Settings.set('songselect.filter', v); this.rebuild(true); }),
        sel('Keys', [['', 'All'], ...[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => [String(k), k === 9 ? '9K+' : k + 'K'])], String(keysNow), v => { Settings.set('songselect.keys', v ? [+v] : []); this.rebuild(true); }),
        h('label.ss-sel', h('span', 'Collection'), this.collSel),
        h('span.grow'), this.countEl));

    // left info
    this.info = h('div.ss-info');
    // right carousel
    this.inner = h('div.carousel-inner');
    this.scroller = h('div.carousel-scroll', { tabindex: '-1' }, this.inner);
    this.scroller.addEventListener('scroll', () => this.renderVisible(), { passive: true });
    this.carousel = h('div.carousel', this.scroller);
    this.emptyEl = h('div.ss-empty');
    this.carousel.appendChild(this.emptyEl);
    const right = h('div.ss-right', filters, this.carousel);

    // footer
    this.modsOn = h('div.mods-on');
    this.playBtn = h('button.ss-cookie', { onclick: () => this.play(), title: 'Play (Enter)', 'aria-label': 'Play' }, h('span.ss-cookie-disc', icon('play', 'fill')));
    const fb = (label, color, fn, key) => h('button.foot-btn', { style: { '--c': color }, onclick: fn, title: `${label} (${key})` }, h('span.fb-inner', label));
    const footer = h('div.ss-footer',
      backButton(() => Screens.back()),
      fb('Mods', '#ffcc22', () => ModSelect.open(), 'F1'),
      fb('Random', '#88b300', () => this.random(), 'F2'),
      fb('Options', '#aa66ff', e => this.options(e), 'F3'),
      this.modsOn, h('div.grow'), this.practiceMode ? h('span.tag.goldtag', 'Practice') : null, this.mpPick ? h('span.tag.accent', 'Choose the match beatmap') : null, this.playBtn);

    el.append(h('div.ss-main', this.info, right), footer);
    this._unsub = [
      Bus.on('library:changed', () => this.rebuild()),
      Bus.on('mods:changed', () => this.renderMods()),
      Bus.on('favorites:changed', () => this.rebuild()),
      Bus.on('collections:changed', () => { this.fillCollections(); this.rebuild(); }),
      Bus.on('scores:changed', () => { this.rebuild(); this.updateInfo(); }),
    ];
    this._ro = new ResizeObserver(() => this.renderVisible());
    this._ro.observe(this.scroller);
    this.renderMods();
    requestAnimationFrame(() => { this.rebuild(); this.scrollToSelected(false); });
    return el;
  },
  leave() {
    (this._unsub || []).forEach(f => f());
    this._ro && this._ro.disconnect();
    clearTimeout(this._previewT);
  },
  fillCollections() {
    clearEl(this.collSel);
    const cur = Settings.get('songselect.collection');
    this.collSel.append(h('option', { value: '' }, 'All collections'), ...Collections.list.map(c => h('option', { value: c.id, selected: c.id === cur }, `▸ ${c.name} (${c.hashes.length})`)));
  },
  renderMods() {
    if (!this.modsOn) return;
    const mods = Settings.get('songselect.mods') || [];
    clearEl(this.modsOn).append(...mods.map(m => ModSystem.badge(m)));
    if (mods.length) this.modsOn.append(h('span.muted', { style: { fontSize: '.8rem', marginLeft: '4px' } }, `${ModSystem.multiplier(mods).toFixed(2)}×`));
  },

  // ── filtering & sorting
  parseQuery(q) {
    const conds = [], words = [];
    const re = /(keys|key|k|stars|star|sr|bpm|length|len|od|hp|ln|lns|played|notes|creator|mapper|artist|title)\s*(<=|>=|=|<|>|:)\s*("[^"]*"|\S+)/gi;
    let rest = q.replace(re, (_, k, op, v) => { conds.push({ k: k.toLowerCase(), op, v: v.replace(/"/g, '').toLowerCase() }); return ' '; });
    for (const w of rest.toLowerCase().split(/\s+/)) if (w) words.push(w);
    return { conds, words };
  },
  mapMatches(m, pq) {
    for (const c of pq.conds) {
      const num = parseFloat(c.v);
      let val;
      switch (c.k) {
        case 'keys': case 'key': case 'k': val = m.keys; break;
        case 'stars': case 'star': case 'sr': val = m.stars; break;
        case 'bpm': val = m.bpm; break;
        case 'length': case 'len': val = m.length / 1000; break;
        case 'od': val = m.od; break;
        case 'hp': val = m.hp; break;
        case 'ln': case 'lns': val = m.lnRatio * 100; break;
        case 'notes': val = m.objectCount; break;
        case 'played': val = ScoreManager.playCount(m.hash); break;
        case 'creator': case 'mapper': if (!m.creator.toLowerCase().includes(c.v)) return false; continue;
        case 'artist': if (!(m.artist + ' ' + m.artistUnicode).toLowerCase().includes(c.v)) return false; continue;
        case 'title': if (!(m.title + ' ' + m.titleUnicode).toLowerCase().includes(c.v)) return false; continue;
      }
      if (!isFinite(num)) continue;
      const ok = c.op === '<' ? val < num : c.op === '>' ? val > num : c.op === '<=' ? val <= num : c.op === '>=' ? val >= num : Math.abs(val - num) < (c.k.startsWith('st') || c.k === 'sr' ? 0.5 : 0.5001);
      if (!ok) return false;
    }
    return true;
  },
  rebuild(keepScroll = false) {
    if (!this.el) return;
    const pq = this.parseQuery(this.query.trim());
    const keys = Settings.get('songselect.keys') || [];
    const status = Settings.get('songselect.filter');
    const collId = Settings.get('songselect.collection');
    const coll = collId ? Collections.get(collId) : null;
    const mods = Settings.get('songselect.mods') || [];
    const weekAgo = Date.now() - 7 * 86400000;
    const results = [];
    for (const set of BeatmapManager.sets) {
      if (status === 'favorites' && !Favorites.has(set.id)) continue;
      const hay = `${set.artist} ${set.artistUnicode} ${set.title} ${set.titleUnicode} ${set.creator} ${set.source} ${set.tags}`;
      let setScore = 0;
      if (pq.words.length) {
        setScore = 1;
        for (const w of pq.words) {
          let best = fuzzyScore(hay, w);
          for (const m of set.maps) best = Math.max(best, fuzzyScore(m.version, w) * 0.9);
          if (!best) { setScore = 0; break; }
          setScore += best;
        }
        if (!setScore) continue;
      }
      const maps = set.maps.filter(m => {
        if (m.problems.length) return false; // difficulties that can't be played (other modes, missing audio…) aren't listed
        if (pq.words.length && !pq.words.every(w => fuzzyScore(hay + ' ' + m.version, w) > 0)) return false;
        if (keys.length && !keys.some(k => k === 9 ? m.keys >= 9 : m.keys === k)) return false;
        if (coll && !coll.hashes.includes(m.hash)) return false;
        if (!this.mapMatches(m, pq)) return false;
        if (status !== 'all' && status !== 'favorites') {
          const pc = ScoreManager.playCount(m.hash), best = ScoreManager.best(m.hash);
          if (status === 'played' && !pc) return false;
          if (status === 'unplayed' && pc) return false;
          if (status === 'passed' && !best) return false;
          if (status === 'failed' && (!pc || best)) return false;
          if (status === 'pb' && !best) return false;
          if (status === 'recent' && ScoreManager.lastPlayed(m.hash) < weekAgo) return false;
          if (status === 'mods' && !ScoreManager.forMap(m.hash).some(s => s.passed && ModSystem.label(s.mods) === ModSystem.label(mods))) return false;
        }
        return true;
      });
      if (!maps.length) continue;
      results.push({ set, maps, score: setScore });
    }
    const sort = Settings.get('songselect.sort');
    const agg = (r, f, mode = 'max') => r.maps.reduce((a, m) => mode === 'max' ? Math.max(a, f(m)) : Math.min(a, f(m)), mode === 'max' ? -Infinity : Infinity);
    const cmp = {
      title: (a, b) => a.set.title.localeCompare(b.set.title), artist: (a, b) => a.set.artist.localeCompare(b.set.artist) || a.set.title.localeCompare(b.set.title),
      creator: (a, b) => a.set.creator.localeCompare(b.set.creator), stars: (a, b) => agg(a, m => m.stars) - agg(b, m => m.stars),
      od: (a, b) => agg(a, m => m.od) - agg(b, m => m.od), bpm: (a, b) => agg(a, m => m.bpm) - agg(b, m => m.bpm),
      length: (a, b) => agg(a, m => m.length) - agg(b, m => m.length), added: (a, b) => b.set.added - a.set.added,
      lastPlayed: (a, b) => agg(b, m => ScoreManager.lastPlayed(m.hash)) - agg(a, m => ScoreManager.lastPlayed(m.hash)),
      playCount: (a, b) => b.maps.reduce((x, m) => x + ScoreManager.playCount(m.hash), 0) - a.maps.reduce((x, m) => x + ScoreManager.playCount(m.hash), 0),
      score: (a, b) => agg(b, m => ScoreManager.best(m.hash)?.score || 0) - agg(a, m => ScoreManager.best(m.hash)?.score || 0),
      accuracy: (a, b) => agg(b, m => ScoreManager.best(m.hash)?.accuracy || 0) - agg(a, m => ScoreManager.best(m.hash)?.accuracy || 0),
    }[sort] || ((a, b) => a.set.title.localeCompare(b.set.title));
    results.sort((a, b) => (pq.words.length && sort === 'title' ? b.score - a.score : 0) || cmp(a, b) || a.set.title.localeCompare(b.set.title));
    this.results = results;
    // ensure selection is visible
    const allVisible = new Map();
    for (const r of results) for (const m of r.maps) allVisible.set(m.id, r);
    if (!this.selectedId || !allVisible.has(this.selectedId)) {
      const first = results[0];
      this.selectedId = first ? (first.maps.find(m => !m.problems.length) || first.maps[0]).id : null;
    }
    this.expandedSet = this.selectedId ? BeatmapManager.maps.get(this.selectedId)?.setId : null;
    this.layoutRows();
    const nDiffs = results.reduce((a, r) => a + r.maps.length, 0);
    this.countEl.textContent = `${fmtInt(nDiffs)} matching beatmap${nDiffs === 1 ? '' : 's'}`;
    this.renderEmpty();
    this.updateInfo();
    this.renderVisible(true);
    if (!keepScroll) this.scrollToSelected(false); else this.scrollToSelected(true);
  },
  layoutRows() {
    const rows = [];
    let y = 12;
    for (const r of this.results) {
      rows.push({ type: 'set', r, y, h: this.ROW_SET });
      y += this.ROW_SET;
      if (r.set.id === this.expandedSet) {
        for (const m of r.maps) { rows.push({ type: 'diff', r, m, y, h: this.ROW_DIFF }); y += this.ROW_DIFF; }
        y += 8;
      }
    }
    this.rows = rows;
    this.totalH = y + 200;
    this.inner.style.height = this.totalH + 'px';
    this.pool = this.pool || new Map();
  },
  renderEmpty() {
    clearEl(this.emptyEl);
    this.emptyEl.style.display = this.results.length ? 'none' : '';
    if (this.results.length) return;
    if (!BeatmapManager.sets.length) {
      this.emptyEl.append(h('div.box', h('h2', 'Your library is empty'),
        h('p', 'Drag & drop .osz files (or a folder of beatmaps) anywhere on this window, or import them here.'),
        h('div.row', { style: { justifyContent: 'center', marginTop: '14px' } },
          h('button.btn.primary', { onclick: () => importViaPicker('.osz,.osu,.osk,.amr,.json') }, icon('upload'), 'Import files'),
          h('button.btn', { onclick: () => importViaPicker('', true) }, icon('folder'), 'Import folder'))));
    } else {
      this.emptyEl.append(h('div.box', h('h2', 'No matches'), h('p', 'Nothing matches your search and filters.'),
        h('button.btn', { onclick: () => this.clearFilters() }, 'Clear filters')));
    }
  },
  clearFilters() {
    this.query = ''; this.searchInput.value = '';
    Settings.set('songselect.keys', []); Settings.set('songselect.filter', 'all'); Settings.set('songselect.collection', '');
    Screens.go('songselect', { force: true }, { replace: true });
  },
  renderVisible(force = false) {
    if (!this.rows) return;
    const st = this.scroller.scrollTop, vh = this.scroller.clientHeight || 600;
    const from = st - 200, to = st + vh + 200;
    const center = st + vh / 2;
    const needed = new Set();
    for (const row of this.rows) {
      if (row.y + row.h < from || row.y > to) continue;
      const key = row.type === 'set' ? 's:' + row.r.set.id : 'd:' + row.m.id;
      needed.add(key);
      let el = this.pool.get(key);
      if (!el || force) {
        if (el) el.remove();
        el = this.renderRow(row);
        this.pool.set(key, el);
        this.inner.appendChild(el);
      }
      const d = (row.y + row.h / 2 - center) / vh;
      el.style.transform = `translate(${Math.round(d * d * 70)}px, ${row.y}px)`;
    }
    for (const [k, el] of this.pool) if (!needed.has(k)) { el.remove(); this.pool.delete(k); }
  },
  renderRow(row) {
    const wrap = h('div.c-item', { style: { height: row.h + 'px' } });
    if (row.type === 'set') {
      const { set, maps } = row.r;
      const broken = maps.every(m => m.problems.length);
      const bg = h('div.sp-bg');
      BeatmapManager.thumbURL(set).then(u => { if (u) bg.style.backgroundImage = `url("${u}")`; });
      const btn = h(`button.set-panel${set.id === this.expandedSet ? '.expanded' : ''}${broken ? '.broken' : ''}`, {
        onclick: () => {
          UISounds.click();
          if (this.expandedSet === set.id) return;
          const pick = maps.find(m => !m.problems.length) || maps[0];
          this.select(pick.id);
        },
        oncontextmenu: e => { e.preventDefault(); this.options(e, maps[0]); },
      }, bg, h('div.sp-body',
        h('div.sp-t', set.title),
        h('div.sp-a', set.artist),
        h('div.sp-dots', ...maps.slice(0, 18).map(m => h('i', { style: { '--sc': starColour(m.stars) }, title: `[${m.version}] ${m.stars.toFixed(2)}★ ${m.keys}K` })),
          maps.length > 18 ? h('span.muted', { style: { fontSize: '.72rem' } }, `+${maps.length - 18}`) : null,
          broken ? h('span.tag.warn', 'Broken') : null)),
      Favorites.has(set.id) ? h('span.sp-fav', icon('heart', 'fill')) : null);
      btn.addEventListener('pointerenter', () => UISounds.hover());
      wrap.appendChild(btn);
    } else {
      const m = row.m;
      const best = ScoreManager.best(m.hash);
      const btn = h(`button.diff-panel${m.id === this.selectedId ? '.selected' : ''}${m.problems.length ? '.broken' : ''}`, {
        style: { '--sc': starColour(m.stars) },
        onclick: () => { if (this.selectedId === m.id) this.play(); else { UISounds.click(); this.select(m.id); } },
        oncontextmenu: e => { e.preventDefault(); this.select(m.id); this.options(e, m); },
        title: m.problems.length ? m.problems.join('\n') : '',
      }, h('span.dp-icon', { style: { '--sc': starColour(m.stars) }, title: `${m.stars.toFixed(2)}★` }, `${m.keys}K`),
      h('div.dp-main', h('div.dp-top', starBadge(m.stars), h('span.dp-v', m.version)), h('div.dp-s', `mapped by ${m.creator}`,
        m.problems.length ? h('span', { style: { color: '#ff9aa6' } }, ' · ' + m.problems[0]) : null)),
      best ? gradeEl(best.grade) : null);
      btn.addEventListener('pointerenter', () => UISounds.hover());
      wrap.appendChild(btn);
    }
    return wrap;
  },
  select(id, { scroll = true } = {}) {
    const m = BeatmapManager.maps.get(id);
    if (!m) return;
    const setChanged = this.expandedSet !== m.setId;
    this.selectedId = id;
    this.expandedSet = m.setId;
    Settings.set('last.map', id);
    this.layoutRows();
    this.renderVisible(true);
    if (scroll) this.scrollToSelected(true);
    this.updateInfo();
    if (setChanged || !Music.meta || Music.meta.setId !== m.setId) this.schedulePreview(m);
  },
  scrollToSelected(smooth) {
    const row = this.rows.find(r => r.type === 'diff' && r.m.id === this.selectedId) || this.rows.find(r => r.type === 'set' && r.r.set.id === this.expandedSet);
    if (!row) return;
    const vh = this.scroller.clientHeight || 600;
    const top = Math.max(0, row.y - vh / 2 + row.h / 2);
    this.scroller.scrollTo({ top, behavior: smooth && Settings.get('ui.animSpeed') > 0 ? 'smooth' : 'auto' });
    this.renderVisible();
  },
  // keyboard navigation
  flatMaps() { return this.results ? this.results.flatMap(r => r.maps) : []; },
  moveDiff(d) {
    const flat = this.flatMaps();
    if (!flat.length) return;
    const i = flat.findIndex(m => m.id === this.selectedId);
    const n = flat[clamp(i + d, 0, flat.length - 1)];
    if (n && n.id !== this.selectedId) { UISounds.hover(); this.select(n.id); }
  },
  moveSet(d) {
    if (!this.results || !this.results.length) return;
    const i = this.results.findIndex(r => r.set.id === this.expandedSet);
    const r = this.results[clamp(i + d, 0, this.results.length - 1)];
    if (!r || r.set.id === this.expandedSet) return;
    const cur = BeatmapManager.maps.get(this.selectedId);
    const target = cur ? r.maps.reduce((a, m) => Math.abs(m.stars - cur.stars) < Math.abs(a.stars - cur.stars) ? m : a, r.maps[0]) : r.maps[0];
    UISounds.click(); this.select(target.id);
  },
  random() {
    const flat = this.flatMaps().filter(m => !m.problems.length);
    if (!flat.length) return;
    UISounds.click();
    this.select(flat[Math.floor(Math.random() * flat.length)].id);
  },
  onKey(e) {
    if (e.target === this.searchInput) return false;
    switch (e.key) {
      case 'ArrowDown': this.moveDiff(1); return true;
      case 'ArrowUp': this.moveDiff(-1); return true;
      case 'ArrowRight': this.moveSet(1); return true;
      case 'ArrowLeft': this.moveSet(-1); return true;
      case 'PageDown': this.moveSet(5); return true;
      case 'PageUp': this.moveSet(-5); return true;
      case 'Enter': this.play(e.ctrlKey ? 'auto' : 'play'); return true;
      case 'F1': ModSelect.open(); return true;
      case 'F2': this.random(); return true;
      case 'F3': this.options(); return true;
      case 'F4': this.play('practice'); return true;
      case 'Delete': if (e.shiftKey) { this.deleteSet(); return true; } return false;
    }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && /\S/.test(e.key)) {
      this.searchInput.focus();
      return false; // let the character go into the box
    }
    if (e.key === 'Backspace' && this.query) { this.searchInput.focus(); return false; }
    return false;
  },
  onBack() {
    if (this.query) { this.query = ''; this.searchInput.value = ''; this.rebuild(true); return true; }
    return false;
  },

  // ── preview audio & background
  schedulePreview(m) {
    clearTimeout(this._previewT);
    this._previewT = setTimeout(() => this.preview(m), 60);
  },
  async preview(m) {
    const url = await BeatmapManager.bgURL(m) || await BeatmapManager.thumbURL(BeatmapManager.setById.get(m.setId));
    if (this.selectedId === m.id || BeatmapManager.maps.get(this.selectedId)?.setId === m.setId) Background.set(url);
    if (!Settings.get('audio.previewAudio') || m.problems.length) return;
    // a token per request: if the selection changes while this one is loading, it's dropped (otherwise a
    // slower earlier request could start the new song at the old song's preview point)
    const tok = this._previewTok = {};
    try {
      await AudioManager.resume();
      const blob = await BeatmapManager.getFile(m.setId, m.audioFile);
      if (tok !== this._previewTok || BeatmapManager.maps.get(this.selectedId)?.setId !== m.setId) return;
      if (!blob) return;
      Music.stream(blob, `${m.setId}/${m.audioFile}`, { setId: m.setId, mapId: m.id, timing: null });
      const start = previewStart(m);
      Music.play(start, { fadeIn: 400 });
      Music.onEnded = () => { if (Screens.currentName === 'songselect' && Music.meta && Music.meta.setId === m.setId) Music.play(start, { fadeIn: 600 }); };
      MenuMusic.setCurrent(m);
      beatTiming(m).then(timing => { if (tok === this._previewTok && Music.meta && Music.meta.setId === m.setId) Music.meta.timing = timing; });
      // decode the full track in the background once the player lingers, so pressing Play starts quickly
      clearTimeout(this._warmT);
      this._warmT = setTimeout(() => { if (tok === this._previewTok) TrackCache.get(m.setId, m.audioFile).catch(() => {}); }, 900);
    } catch (e) { console.warn('preview failed', e); }
  },

    const m = this.selectedId && BeatmapManager.maps.get(this.selectedId);

    const rate = ModSystem.rate(mods);

    const st = (ic, label, v) => h('span.w-stat', { title: label }, icon(ic), String(v));
    const wedge = h('div.wedge', bg, h('div.w-body',
      h('div.w-top', starBadge(m.stars), h('span.keys-tag', `${m.keys}K`), h('span.grow'), collBtn, favBtn),
      h('div.w-title', m.title), h('div.w-artist', m.artist),
      h('div.w-diff', h('b', m.version), h('span.muted', ' mapped by '), h('b', m.creator)),
      h('div.w-stats', st('clock', 'Length', fmtTime(m.length / rate)), st('music', 'BPM', bpm), st('target', 'Notes', fmtInt(m.noteCount)), st('list', 'Long notes', fmtInt(m.lnCount)))));
    const attr = (k, v, max) => h('div.attr', h('span.k', k), h('div.bar', h('i', { style: { width: clamp(v / max * 100, 0, 100) + '%' } })), h('span.v', typeof v === 'number' ? v.toFixed(1) : v));
    const details = h('div.ss-attrs', attr('Keys', m.keys, 10), attr('Accuracy', m.od, 10), attr('HP drain', m.hp, 10), attr('Star rating', m.stars, 10));
    const problems = m.problems.length ? h('div.ss-problem', icon('info'), h('div', h('b', 'This difficulty can\'t be played'), h('div.muted', m.problems.join(' · ')))) : null;
    const lb = h('div.lb', h('div.lb-head', h('span.lb-tab', 'Local ranking'), h('span.grow'), h('span.muted', plural(ScoreManager.playCount(m.hash), 'play'))));
    const list = h('div.lb-list');
    const scores = ScoreManager.forMap(m.hash).slice(0, 25);

    const who = ProfileManager.profile.name;
    scores.forEach((s, i) => {
      const row = h(`button.lb-row${best && s.id === best.id ? '.pb' : ''}`, { style: { animationDelay: `${i * 25}ms` }, onclick: () => { UISounds.click(); Screens.go('results', { score: s, fromList: true }, { transition: 'right' }); } },

/* ===== 15-screen-gameplay.js ===== */
/* Gameplay screen: owns a play session.
 *  TimingEngine: song time = Music.time (audio clock) − audio offset.
 *  InputManager: keyboard events are timestamped with KeyboardEvent.timeStamp and mapped onto the
 *                audio clock, so judgement never depends on frame timing.
 *  Rendering follows the clock at whatever refresh rate the display runs (optional limiter). */

const Game = {
  /** Launch gameplay. opts: {mapId, mods, mode: 'play'|'practice'|'replay', replay} */
  launch(opts) {
    if (Settings.get('input.fullscreenOnPlay') && !document.fullscreenElement) toggleFullscreen(true);
    Screens.go('gameplay', { ...opts, force: true }, { transition: 'zoom' });
  },
};

/** A blurred copy of an image (blob URL), cached. `amount` 0–1 ≈ osu!lazer's blur (up to 25px at 1080p). */
const _blurCache = new Map();
function blurredImage(url, amount) {
  const key = url + '|' + amount;
  if (_blurCache.has(key)) return _blurCache.get(key);
  const p = (async () => {
    const img = new Image(); img.src = url; await img.decode();
    const scale = Math.min(1, 960 / Math.max(1, img.naturalWidth)); // blurred anyway: half-ish resolution is plenty
    const w = Math.max(1, Math.round(img.naturalWidth * scale)), hh = Math.max(1, Math.round(img.naturalHeight * scale));
    const px = amount * 25 * (w / 1920) * 2;
    const c = document.createElement('canvas'); c.width = w; c.height = hh;
    const x = c.getContext('2d');
    x.filter = `blur(${px.toFixed(1)}px)`;
    const pad = px * 3; // draw oversized so the edges don't fade to transparent
    x.drawImage(img, -pad, -pad, w + pad * 2, hh + pad * 2);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
    return URL.createObjectURL(blob);
  })();
  _blurCache.set(key, p);
  while (_blurCache.size > 6) { const k = _blurCache.keys().next().value; _blurCache.get(k).then(u => URL.revokeObjectURL(u)).catch(() => {}); _blurCache.delete(k); }
  return p;
}

/** Gamepads are only polled while one is actually connected (navigator.getGamepads() isn't free). */
const GamepadWatch = {
  connected: 0,
  init() {
    addEventListener('gamepadconnected', () => { this.connected++; });
    addEventListener('gamepaddisconnected', () => { this.connected = Math.max(0, this.connected - 1); });
  },
};
GamepadWatch.init();

const PRACTICE_SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
const REPLAY_SPEEDS = [0.25, 0.5, 0.75, 1, 1.5, 2];
const FAIL_WIND_DOWN = 1.2; // seconds the song takes to wind down after a fail

/** Which health bar a play shows: the skin's own (top left, or beside the stage), osu!lazer's, the slim stage bar,
 *  or none. A skin without scorebar images gets the osu!lazer bar. */
function healthModeFor(layout) {
  if (!Settings.get('gameplay.showHealth')) return null;
  const hs = Settings.get('gameplay.healthStyle');
  if (hs === 'stage') return 'stage';
  if ((hs === 'skin' || hs === 'skinstage') && layout && layout.tex.scorebarColour) return hs;
  return 'lazer';
}

/** The skin's own health bar, as osu!lazer draws it (LegacyHealthDisplay): scorebar-bg in the top-left corner,
 *  scorebar-colour cut to the current health and eased towards it, and the ki / marker sprite riding the end of
 *  the fill (it bulges when health goes up). Legacy HUD art is authored for a 768-pixel-tall screen. */
class SkinHealthBar {
  constructor(L) {
    const t = L.tex;
    this.bg = t.scorebarBg || null; this.fill = t.scorebarColour; this.marker = t.scorebarMarker || null;
    this.ki = t.scorebarKi || []; this.newStyle = !!this.marker;
    // fill offset inside the background: (3, 10) or (7.5, 7.8) stable units × 1.6
    this.fx = this.bg ? (this.newStyle ? 12 : 4.8) : 0; this.fy = this.bg ? (this.newStyle ? 12.48 : 16) : 0;
    const marks = [this.marker, ...this.ki].filter(Boolean);
    this.pad = marks.length ? Math.max(...marks.map(m => Math.max(m.w, m.h))) * 0.7 : 0;
    this.el = h('canvas.hud-skinhp');
    this.shown = 1; this.value = 1; this.t = 0; this.bulgeT = -1e9; this.drawn = null; this.size = 0;
  }
  resize() {
    const H = (this.el.parentElement && this.el.parentElement.clientHeight) || innerHeight;
    const u = H / 768, dpr = Zoom.dpr();
    const w = Math.max(this.bg ? this.bg.w : 0, this.fx + this.fill.w) + this.pad, hh = Math.max(this.bg ? this.bg.h : 0, this.fy + this.fill.h) + this.pad;
    this.u = u; this.k = u * dpr;
    this.el.width = Math.ceil(w * this.k); this.el.height = Math.ceil(hh * this.k);
    this.el.style.width = (w * u) + 'px'; this.el.style.height = (hh * u) + 'px';
    this.size = H; this.drawn = null;
  }
  update(v, now) {
    v = clamp(v, 0, 1);
    if (!this.size || Math.abs(((this.el.parentElement && this.el.parentElement.clientHeight) || innerHeight) - this.size) > 1) this.resize();
    const dt = clamp(now - (this.t || now), 0, 200); this.t = now;
    if (v > this.value + 1e-6) this.bulgeT = now; // HealthChanged(increase): the marker bulges
    this.value = v;
    // osu!lazer: fill width = ValueAt(elapsed, width, target, 0, 200, OutQuint)
    const p = 1 - Math.pow(1 - dt / 200, 5);
    this.shown += (v - this.shown) * p;
    if (Math.abs(this.shown - v) < 1e-4) this.shown = v;
    const bulging = now - this.bulgeT < 160, animated = this.fill.frames.length > 1;
    const key = Math.round(this.shown * this.fill.w * this.k * 2);
    if (key === this.drawn && !bulging && !animated) return;
    this.drawn = key;
    // (a skin unloaded mid-draw leaves closed images behind: stop drawing instead of throwing every frame)
    try { this.draw(now); } catch (e) { this.update = () => {}; console.warn('health bar', e); }
  }
  draw(now) {
    const c = this.el.getContext('2d'), hp = this.shown;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.el.width, this.el.height);
    c.setTransform(this.k, 0, 0, this.k, 0, 0);
    if (this.bg) c.drawImage(this.bg.img, 0, 0, this.bg.w, this.bg.h);
    const f = this.fill.frameAt(now), fw = this.fill.w * hp;
    if (fw > 0.01) {
      c.drawImage(f, 0, 0, f.width * hp, f.height, this.fx, this.fy, fw, this.fill.h);
      // new-style fills darken below half health and turn red below 20% (LegacyHealthDisplay.getFillColour)
      if (this.newStyle && hp < 0.5) {
        c.save();
        c.globalCompositeOperation = 'source-atop';
        c.globalAlpha = hp < 0.2 ? 1 : (0.5 - hp) / 0.5;
        c.fillStyle = hp < 0.2 ? `rgb(${Math.round(255 * (0.2 - hp) / 0.2)},0,0)` : '#000';
        c.fillRect(this.fx, this.fy, fw, this.fill.h);
        c.restore();
      }
    }
    const m = this.newStyle ? this.marker : (hp < 0.2 ? this.ki[2] : hp < 0.5 ? this.ki[1] : this.ki[0]) || this.ki[0];
    if (m) {
      const el = now - this.bulgeT, sc = el < 150 ? 1.2 - 0.4 * (el / 150) : this.bulgeT > 0 ? 0.8 : 1;
      const mw = m.w * sc, mh = m.h * sc, mx = this.fx + fw, my = this.fy + (this.newStyle ? this.fill.h / 2 : 0);
      if (this.newStyle && hp >= 0.5) c.globalCompositeOperation = 'lighter';
      c.drawImage(m.frameAt(now), mx - mw / 2, my - mh / 2, mw, mh);
      c.globalCompositeOperation = 'source-over';
    }
  }
}

const GameplayScreen = {
  inGame: true, transient: true, tab: 'songselect',
  s: null, // session

  enter(params) {
    const el = h('div.gameplay');
    this.el = el; this.speedEl = null;
    this.bgEl = h('div.gp-bg'); this.dimEl = h('div.gp-dim');
    this.videoEl = h('video.gp-video', { muted: true, playsinline: true, preload: 'auto' }); this.videoEl.muted = true;
    this.canvas = h('canvas.gp-canvas');
    this.breakEl = h('div.gp-break', { hidden: true });
    this.hud = h('div.gp-hud');
    this.failEl = h('div.gp-fail');
    el.append(this.bgEl, this.videoEl, this.dimEl, this.canvas, this.failEl, this.breakEl, this.hud);
    this.renderer = new ManiaRenderer(this.canvas, { crop: true });
    this.params = params;
    this._tok = {};
    if (!params.quick) this.retryCount = 0;
    this.bgRec = BeatmapManager.maps.get(params.mapId) || null;
    el.classList.add('loading');
    this.loaderGone = false; this.loaderHold = false; this.loaderSkip = false;
    this.loaderEl = this.buildLoader(params);
    el.append(this.loaderEl);
    this.holdEl = h('div.hold-retry', h('span', icon('retry'), 'Hold R to retry'), h('i'));
    el.append(this.holdEl);
    if (this.bgRec) this.applyBackground();
    this._keydown = e => this.onKeyDown(e);
    this._keyup = e => this.onKeyUp(e);
    // losing focus pauses a solo play; a match can't pause, but keys held down would never see their keyup — let them go
    this._blur = () => { if (this.s && this.s.running) { if (!this.s.mp) this.pause(); else this.releaseAll(); } };
    window.addEventListener('keydown', this._keydown, true);
    window.addEventListener('keyup', this._keyup, true);
    window.addEventListener('blur', this._blur);
    this._audioSub = Bus.on('audio:state', st => { if (st !== 'running') this._blur(); });
    this._mm = () => { el.classList.add('show-cursor'); clearTimeout(this._mmT); this._mmT = setTimeout(() => el.classList.remove('show-cursor'), 1500); };
    el.addEventListener('pointermove', this._mm);
    this._settingsSub = Bus.on('settings:changed', k => { if (this.s && k !== 'gameplay.scrollSpeed' && (k.startsWith('gameplay.') || k.startsWith('skin.') || k === 'graphics.renderScale' || k === '*')) { this.renderer.resize(true); this.applyBackground(); }
      if (k === 'debug.overlay' && this.debugEl) this.debugEl.hidden = !Settings.get('debug.overlay'); });
    requestAnimationFrame(() => this.start(params).catch(e => { console.error(e); Toast.err('Could not start the beatmap', friendlyError(e)); Screens.go('songselect', {}, { replace: true }); }));
    return el;
  },
  leave() {
    this._tok = null;
    this.renderer && this.renderer.dispose();
    clearTimeout(this._retryHold);
    window.removeEventListener('keydown', this._keydown, true);
    if (this.videoEl) { this.videoEl.pause(); this.videoEl.removeAttribute('src'); this.videoEl.load(); }
    if (this._videoURL) { URL.revokeObjectURL(this._videoURL); this._videoURL = null; }
    window.removeEventListener('keyup', this._keyup, true);
    window.removeEventListener('blur', this._blur);
    this._audioSub && this._audioSub();
    cancelAnimationFrame(this._raf);
    this._settingsSub && this._settingsSub();
    if (this.s) { this.s.running = false; this.s = null; }
    Music.stop(150);
    this.closePause();
  },
  onBack() {
    if (!this.loaderGone) { if (!this.params.mp) this.quit(); return true; }
    if (this.s && this.s.mp) { this.mpQuit(); return true; }
    if (this.s) {
      if (this.s.running) this.pause();
      else if (this.pauseEl && !this.s.failed) this.resume();
      else if (this.replayBar && !this.s.finished) this.showPause('Paused'); // paused from the replay controls
    }
    return true;
  },

  async start(p) {
    const tok = this._tok;
    this.loaderStatus('Loading beatmap…', 0.1);
    const loaded = await BeatmapManager.load(p.mapId);
    if (this._tok !== tok) return;
    const { rec, bm } = loaded;
    const keys = BeatmapParser.keyCount(bm);
    const replay = p.replay || null;
    const mods = replay ? replay.mods : ModSystem.normalize(p.mods || []);
    const practice = p.mode === 'practice';
    const auto = mods.includes('AT');
    const modConfig = replay ? (replay.modConfig || {}) : (p.modConfig || ModSystem.config());
    let rate = replay ? replay.rate : ModSystem.rate(mods, modConfig);
    if (practice) rate = Settings.get('practice.speed') || 1;
    const preserve = (practice || !ModSystem.pitchShift(mods)) && Settings.get('audio.preservePitch');
    const skin = SkinManager.current;
    this.loaderStatus('Loading audio…', 0.3);
    const [layout, buffer] = await Promise.all([skin.mania(keys), TrackCache.get(rec.setId, rec.audioFile)]);
    if (this._tok !== tok) return;
    Music.stop(0);
    this.loaderStatus('Decoding audio…', 0.6);
    await Music.load(buffer, `${rec.setId}/${rec.audioFile}`, { setId: rec.setId, mapId: rec.id });
    if (this._tok !== tok) return;
    await Music.setRate(rate, preserve, f => this.loaderStatus(`Preparing audio… ${Math.round(f * 100)}%`, 0.7 + f * 0.25));
    if (this._tok !== tok) return;
    this.renderer.setLayout(layout);
    // health bar: the skin's own scorebar when it has one (and that's the chosen style), else osu!lazer's in the HUD
    this.healthMode = healthModeFor(layout);
    // the canvas draws the slim stage bar and the skin's bar beside the stage; the other two are part of the HUD
    this.renderer.healthMode = this.healthMode === 'stage' || this.healthMode === 'skinstage' ? this.healthMode : null;
    this.renderer.coverage = (mods.includes('HD') || mods.includes('FI')) ? modConfig.cover : 0.5;

    const seed = replay ? replay.seed : (Math.random() * 2 ** 31) | 0;
    const baseNotes = prepareNotes(loaded.notes, keys, mods, seed);
    // replays keep the judging rules they were recorded with (older ones predate the rules field: rules 1)
    const rules = replay ? (replay.rules || 1) : RULES;
    const windows = replay ? replay.windows : timingWindows({ od: bm.od, mods, mode: Settings.get('gameplay.judgementMode'), customOD: Settings.get('gameplay.customOD'), customMs: Settings.get('gameplay.windowsMs'), odOverride: modConfig.od, rules });
    const accuracyMode = replay ? replay.accuracyMode : Settings.get('gameplay.accuracyMode');
    const scrollMode = mods.includes('CS') ? 'constant' : Settings.get('gameplay.scrollMode');
    const scroll = new ScrollMap(BeatmapParser.scrollSegments(bm, { useSV: scrollMode !== 'constant', useBPM: scrollMode === 'sv' }));
    const endTime = baseNotes.length ? Math.max(...baseNotes.map(n => n.end)) : 0;
    const redTiming = BeatmapParser.timing(bm);

    const s = this.s = {
      rec, bm, keys, mods, rate, preserve, practice, auto, replay, seed, windows, accuracyMode, layout, scroll, baseNotes, modConfig, rules, speed: 1,
      endTime, redTiming,
      firstNote: baseNotes.length ? baseNotes[0].time : 0,
      held: new Array(keys).fill(false), keyMap: new Map(), keyLabels: [], down: Array.from({ length: keys }, () => new Set()),
      events: [], running: false, finished: false, failed: false, startedReal: performance.now(), playedReal: 0,
      mode: replay ? 'replay' : auto ? 'auto' : practice ? 'practice' : 'play',
      loopA: null, loopB: null, speed: rate, mp: p.mp || null, mapOffset: MapOffsets.get(rec.hash),
      debug: { inputs: 0, lastErr: null },
    };
    Settings.keybinds(keys).forEach((codes, col) => { codes.forEach(c => s.keyMap.set(c, col)); s.keyLabels[col] = keyLabel(codes[0]); });
    this.newEngine(practice ? null : undefined);
    if (auto || replay) {
      s.feed = replay ? replay.events : generateAutoInputs(s.engine.notes, keys).flat();
      s.feedIdx = 0;
    }
    this.applyBackground();
    this.buildHud();
    const leadIn = Math.max(Settings.get('gameplay.leadIn'), bm.audioLeadIn) * rate;
    const startPos = Math.min(0, s.firstNote - leadIn);
    s.skipTarget = s.firstNote - leadIn;
    s.startPos = startPos;
    s.stars = rate === 1 && rec.srVersion === SR_VERSION ? rec.stars : DifficultyCalculator.calculate(baseNotes, keys, rate);
    Toolbar.setNowPlaying(rec);
    Music.onEnded = null;
    const mpWait = s.mp ? this.mpWait(s) : null; // the synchronised countdown runs under the loader
    await this.loaderFinish(tok);
    if (this._tok !== tok || this.s !== s) return;
    if (mpWait) { await mpWait; if (this.s !== s) return; }
    Music.play(startPos, { fadeIn: startPos >= 0 ? 150 : 0 });
    s.running = true;
    this.lastRender = 0;
    this.loop();
  },

    return el;
  },
  loaderSlider(k, label, min, max, step, fmt, after) {
    const inp = h('input.slider', { type: 'range', min, max, step, value: Settings.get(k), 'aria-label': label });
    const v = h('b');
    const upd = () => { const x = parseFloat(inp.value); v.textContent = fmt(x); inp.style.setProperty('--p', ((x - min) / (max - min) * 100) + '%'); };
    inp.addEventListener('input', () => { Settings.set(k, parseFloat(inp.value)); upd(); after && after(); });
    inp.addEventListener('keydown', e => e.stopPropagation());
    upd();
    return h('label.pl-slider', h('span', label, v), inp);
  },
  /** Per-beatmap offset, with lazer's "calibrate using last play" when the last play here was early or late. */
  loaderOffset(rec) {
    const box = h('div.pl-group');
    const paint = () => {
      const cur = MapOffsets.get(rec.hash), sug = MapOffsets.suggestion(rec.hash);
      const inp = h('input.slider', { type: 'range', min: -100, max: 100, step: 1, value: clamp(cur, -100, 100), 'aria-label': 'Beatmap offset' });
      const v = h('b', `${cur > 0 ? '+' : ''}${cur}ms`);
      const upd = () => inp.style.setProperty('--p', ((parseFloat(inp.value) + 100) / 2) + '%');
      inp.addEventListener('input', () => { const x = parseInt(inp.value, 10); v.textContent = `${x > 0 ? '+' : ''}${x}ms`; upd(); });
      inp.addEventListener('change', () => { MapOffsets.set(rec.hash, parseInt(inp.value, 10)); if (this.s) this.s.mapOffset = MapOffsets.get(rec.hash); });
      inp.addEventListener('keydown', e => e.stopPropagation());
      upd();
      clearEl(box).append(...[h('div.pl-gt', 'Audio settings'),
        h('label.pl-slider', h('span', 'Beatmap offset', v), inp),
        sug != null ? h('button.btn.sm.pl-calib', { onclick: async () => {
          await MapOffsets.set(rec.hash, cur + sug); MapOffsets.last = null;
          if (this.s) this.s.mapOffset = MapOffsets.get(rec.hash);
          UISounds.click(); paint();
        } }, icon('clock'), `Calibrate using last play (${sug > 0 ? '+' : ''}${sug}ms)`) : null,

  loaderStatus(text, frac) {
    if (this.plStatus) this.plStatus.textContent = text;

  },
  /** Keep the loader up for a moment (shorter on retries) and while the player is in its settings. */
  async loaderFinish(tok) {
    const p = this.params, s = this.s;
    const min = p.quick ? 350 : 1600;
    this.loaderStatus('Ready!', 1);
    this.loaderEl.classList.add('ready');
    if (s && s.mp) {
      // everyone starts together: no holding or skipping — the loader leaves 1.5s before the synchronised start
      while (this._tok === tok && s.mp.startAt - performance.now() > 1500) {
        this.loaderStatus(`Match starts in ${Math.ceil((s.mp.startAt - performance.now()) / 1000)}…`, 1);
        await sleep(100);
      }
    } else {
      while (this._tok === tok && !this.loaderSkip && (performance.now() - this.loaderT0 < min || this.loaderHold)) await sleep(50);
    }
    if (this._tok !== tok) return;
    const el = this.loaderEl;
    el.classList.add('out');
    this.el.classList.remove('loading');
    this.loaderGone = true;
    setTimeout(() => el.remove(), 500);
  },

  newEngine(fromTime) {
    const s = this.s;
    let notes = s.baseNotes;
    if (fromTime != null) notes = notes.filter(n => n.time >= fromTime && (s.loopB == null || n.time <= s.loopB));
    s.engine = new GameplayEngine({ notes, keys: s.keys, windows: s.windows, rate: s.rate, mods: s.mods, hp: s.bm.hp, accuracyMode: s.accuracyMode, noFail: s.practice || !!s.mp || !!(s.replay && s.replay.noFail),
      breaks: s.bm.events.breaks, modConfig: s.modConfig, rules: s.rules });
    s.engine.onEvent(e => this.onEngineEvent(e));
    s.held.fill(false);
  },

  applyBackground() {
    const s = this.s, rec = s ? s.rec : this.bgRec;
    if (!rec) return;
    const show = Settings.get('gameplay.showBackground');
    this.baseDim = show ? Settings.get('gameplay.bgDim') : 1;
    this.dimEl.style.opacity = this.baseDim;
    const set = BeatmapManager.setById.get(rec.setId);
    const blur = Settings.get('gameplay.bgBlur');
    const tok = this._bgTok = {};
    (Settings.get('graphics.bgQuality') === 'low' ? BeatmapManager.thumbURL(set) : BeatmapManager.bgURL(rec)).then(async u => {
      // the blur is baked into a copy of the image once, so the GPU doesn't re-blur it every frame
      if (u && blur > 0) u = await blurredImage(u, blur).catch(() => u);
      if (this._bgTok === tok && this._tok) this.bgEl.style.backgroundImage = show && u ? `url("${u}")` : 'none';
    });
    if (s) this.loadVideo();
  },
  /** Background video (mp4/webm stored at import) kept in sync with the audio clock. */
  async loadVideo() {
    const s = this.s, v = s.bm.events.video;
    if (!v || !Settings.get('gameplay.video') || !Settings.get('gameplay.showBackground') || this._videoURL) return;
    const blob = await BeatmapManager.getFile(s.rec.setId, v.file || v);
    if (!blob || this.s !== s) return;
    this._videoURL = URL.createObjectURL(blob);
    this.videoEl.src = this._videoURL;
    this.videoOffset = v.offset || 0;
    this.videoEl.classList.add('on');
  },
  syncVideo(now) {
    const vid = this.videoEl, s = this.s;
    if (!this._videoURL || !vid) return;
    const target = (now - this.videoOffset) / 1000;
    if (target < 0 || !s.running) { if (!vid.paused) vid.pause(); if (target < 0 && vid.currentTime !== 0) vid.currentTime = 0; return; }
    vid.playbackRate = s.rate;
    if (vid.paused) { vid.currentTime = target; vid.play().catch(() => {}); return; }
    if (Math.abs(vid.currentTime - target) > 0.12) vid.currentTime = target;
  },

  buildHud() {
    const s = this.s;
    clearEl(this.hud);
    this._pq = this._pieQ = this._lead = this._canSkip = this._inBreak = this._progT = this._ppJudged = this._scT = undefined; this._lastSc = this._lastAcc = this._lastTT = undefined;
    this.scoreEl = h('div.sc', '0'); this.accEl = h('div.acc', '100.00%'); this.paceEl = h('div.pace');
    this.progEl = h('i');
    this.pieEl = h('div.hud-pie', { title: 'Song progress' });
    this.ppEl = h('div.hud-pp');
    const pd = Settings.get('gameplay.progressDisplay');
    this.hud.append(
      h('div.hud-progress', { style: { display: pd === 'bar' || pd === 'both' ? '' : 'none' } }, this.progEl),
      h('div.hud-score', this.scoreEl, h('div.hud-accrow', (pd === 'pie' || pd === 'both') ? this.pieEl : null, this.accEl), this.ppEl, this.paceEl),
      h('div.hud-mods', ...s.mods.map(m => ModSystem.badge(m))),
    );
    if (s.mode === 'replay' || s.mode === 'auto') {
      this.hud.append(h('div.hud-replay', h('span.dot'), s.mode === 'auto' ? 'AUTO' : `REPLAY · ${s.replay.player || 'Player'}`));
    }
    if (s.mp) { this.mpBoard = h('div.hud-mp'); this.hud.append(this.mpBoard); this._mpSent = 0; this._mpRows = null; this._oppShown = null; this._mpT = 0; this._mpDrawn = 0; }
    else this.buildLeaderboard();
    this.board().classList.toggle('lb-off', !Settings.get('gameplay.leaderboard'));
    // osu!lazer-style health bar (top left): the fill eases to the new value, and a red trail shows what a miss took
    this.hpEl = this._hpQ = this._hpLow = null;
    this.skinHp = null;
    if (this.healthMode === 'skin') {
      this.skinHp = new SkinHealthBar(s.layout);
      this.hud.append(this.skinHp.el);
    }
    if (this.healthMode === 'lazer') {
      this.hpFill = h('i.hp-fill'); this.hpTrail = h('i.hp-trail');
      this.hpEl = h('div.hud-hp', h('div.hp-track', this.hpTrail, this.hpFill));
      this.hud.append(this.hpEl);
    }
    this.skipBtn = h('button.btn.hud-skip', { onclick: () => this.skip(), style: { display: 'none' } }, icon('skip'), 'Skip', h('span.kbd', 'Space'));
    this.hud.append(this.skipBtn);
    // score and accuracy in the skin's own number font, when it has one
    this._scoreDigits = this._accDigits = null;
    const sf = s.layout && s.layout.scoreFont;
    if (sf) {
      const swap = el => { const d = skinDigits(sf, Math.round(parseFloat(getComputedStyle(el).fontSize) || 32) * 0.92); el.classList.add('skinned'); el.replaceChildren(d.el); return d; };
      requestAnimationFrame(() => { if (this.s !== s) return; this._scoreDigits = swap(this.scoreEl); this._accDigits = swap(this.accEl); this._lastSc = this._lastAcc = undefined; });
    }
    if (s.practice) this.buildPracticeBar();
    this.replayBar = null;
    if (s.feed && !s.practice && !s.mp) this.buildReplayBar();
    this.debugEl = h('div.debug-overlay', { hidden: !Settings.get('debug.overlay') });
    this.el.appendChild(this.debugEl);
  },

  // ─────────────────────────────── main loop ───────────────────────────────
  /** Global audio offset plus this beatmap's own offset, in ms. */
  offsetMs() { return Settings.get('audio.offset') + (this.s ? this.s.mapOffset || 0 : 0); },
  gameTime() {
    // after a fail the song winds down (1.2 s ramp to 30% speed, then stops): the playfield slows with it and
    // stays put, instead of running on at full speed and then jumping back once the music is stopped
    const f = this.s.failClock;
    if (f) { const e = Math.min(FAIL_WIND_DOWN, (performance.now() - f.real) / 1000); return f.t + this.s.rate * 1000 * (e - 0.35 * e * e / FAIL_WIND_DOWN); }
    return Music.time - this.offsetMs() * this.s.rate;
  },
  loop() {
    const frame = () => {
      this._raf = requestAnimationFrame(frame);
      const s = this.s;
      if (!s) return;
      const realNow = performance.now();
      const now = this.gameTime();
      const eng = s.engine;
      if (s.running) {
        // replay / auto input feed (exact recorded times)
        if (s.feed) {
          const ev = s.feed;
          while (s.feedIdx < ev.length && ev[s.feedIdx] <= now) {
            const t = ev[s.feedIdx], col = ev[s.feedIdx + 1], down = ev[s.feedIdx + 2] === 1;
            s.feedIdx += 3;
            s.held[col] = down;
            if (!down) this.renderer.onRelease(col, realNow);
            eng.input(col, down, t);
          }
          eng.advance(now);
        } else {
          const grace = 30 * s.rate;
          if (now - grace > eng.lastTime) eng.advance(now - grace);
        }
        this.checkEnd(now);
        this.updatePractice(now);
      }
      if (this.replayBar) this.updateReplayBar(now);
      const lim = Settings.get('graphics.fpsLimit');
      if (lim > 0 && realNow - this.lastRender < 1000 / lim - 0.6) return;
      this.lastRender = realNow;
      const L = s.layout;
      const timeRange = 11485 / Settings.get('gameplay.scrollSpeed');
      this.renderer.render({
        now, posNow: s.scroll.pos(now), scroll: s.scroll, pxPerMs: this.renderer.scrollLength / (timeRange * s.rate),
        engine: eng, held: s.held,
        hidden: s.mods.includes('HD') ? 'HD' : s.mods.includes('FI') ? 'FI' : null, realNow, keyLabels: s.keyLabels,
        percy: s.mods.includes('PC') ? s.modConfig.percy : 0,
      });
      this.updateHud(now);
      this.updateBreak(now);
      this.syncVideo(now);
      if (s.running && !s.feed && GamepadWatch.connected) this.pollGamepad();
      if (!this.debugEl.hidden) this.updateDebug(now, realNow);
      FPS.frame(realNow);
      void L;
    };
    frame();
  },

  updateHud(now) {
    const s = this.s, e = s.engine;
    // multiplayer: health can reach 0 without failing — from then on score and pp count half
    if (s.mp && !s.mpDied && e.health.value <= 0) {
      s.mpDied = true;
      this.hud.append(h('div.hud-mpdied', 'Health reached 0 — score and pp halved'));
    }
    // score / accuracy text at most ~20× a second: on dense charts they change every frame, and each text
    // change costs a style + layout pass
    const wall0 = performance.now();
    if (!(wall0 - (this._scT || 0) < 50)) {
      this._scT = wall0;
      const sc = Math.round((s.mp ? e.score.score : ScoreManager.value(e.score)) * this.mpFactor());
      if (sc !== this._lastSc) { this._lastSc = sc; if (this._scoreDigits) this._scoreDigits.set(fmtScore(sc)); else this.scoreEl.textContent = fmtScore(sc); }
      const acc = e.score.accuracy;
      if (acc !== this._lastAcc) { this._lastAcc = acc; if (this._accDigits) this._accDigits.set(fmtAcc(acc)); else this.accEl.textContent = fmtAcc(acc); }
    }
    const dur = s.endTime;
    const p = clamp((now - s.firstNote) / Math.max(1, dur - s.firstNote), 0, 1);
    // progress bar + osu!-style pie (green while counting down to the first note); DOM writes only when
    // the value moves by a visible step, so the HUD doesn't force a style pass every frame
    const lead = now < s.firstNote;
    const pieP = lead ? clamp(1 - (s.firstNote - now) / Math.max(1, s.firstNote - Math.min(0, s.startPos)), 0, 1) : p;
    // (progress and pie at most 4× a second — each write restyles the HUD, and they move slowly anyway)
    const wall = performance.now();
    if (lead !== this._lead || !(wall - (this._progT || 0) < 250)) {
      this._progT = wall;
      const pq = Math.round(p * 400), pieQ = Math.round(pieP * 200);
      if (pq !== this._pq) { this._pq = pq; this.progEl.style.transform = `scaleX(${pq / 400})`; }
      if (pieQ !== this._pieQ || lead !== this._lead) {
        this._pieQ = pieQ;
        this.pieEl.style.setProperty('--p', (pieQ / 2) + '%');
        if (lead !== this._lead) { this._lead = lead; this.pieEl.classList.toggle('lead', lead); }
      }
    }
    if (Settings.get('gameplay.showPp') && s.mode !== 'auto') {
      // live pp only changes when a note is judged
      if (e.score.judged !== this._ppJudged) {
        this._ppJudged = e.score.judged;
        const t = `${Math.round(this.livePp(e))}pp`;
        if (this.ppEl.textContent !== t) this.ppEl.textContent = t;
      }
    } else if (this.ppEl.textContent) this.ppEl.textContent = '';
    const canSkip = s.running && now < s.skipTarget - 1500 * s.rate && !s.practice;
    if (canSkip !== this._canSkip) { this._canSkip = canSkip; this.skipBtn.style.display = canSkip ? '' : 'none'; }
    if (s.mp) this.updateMp(e); else this.updateLeaderboard();
    if (this.skinHp) this.skinHp.update(e.health.value, performance.now());
    if (this.hpEl) {
      const q = Math.round(clamp(e.health.value, 0, 1) * 400);
      if (q !== this._hpQ) {
        this._hpQ = q;
        this.hpEl.style.setProperty('--hp', q / 400);
        const low = q < 120;
        if (low !== this._hpLow) { this._hpLow = low; this.hpEl.classList.toggle('low', low); }
      }
    }
    const pb = this._pb === undefined ? (this._pb = ScoreManager.best(s.rec.hash)) : this._pb;
    if (pb && s.mode === 'play') {
      const t = `PB ${fmtAcc(pb.accuracy)}`;
      if (this.paceEl.textContent !== t) this.paceEl.textContent = t;
    }
  },
  /** osu!lazer-style in-game leaderboard: this map's local top scores with your live score climbing through them. */
  buildLeaderboard() {
    const s = this.s;
    this.lbEl = h('div.hud-mp.hud-lb'); this.hud.append(this.lbEl);
    this._lbT = 0; this._lbMe = null;
    if (s.mode === 'auto' || s.practice) return;
    const skip = s.replay && s.replay.scoreId;
    const rows = ScoreManager.forMap(s.rec.hash).filter(x => x.id !== skip && x.passed).slice(0, 6);
    const mk = (name, sub, sc, me) => {
      const r = { pos: h('span.pos'), sub: h('span', sub), sc: h('span.sc', sc) };
      r.el = h(`div.hud-mp-row${me ? '.me' : ''}`, r.pos, h('div.nm', h('b', name), r.sub), r.sc);
      this.lbEl.append(r.el); return r;
    };
    this._lbRows = rows.map(x => Object.assign(mk(x.player || ProfileManager.profile.name, `${fmtAcc(x.accuracy)} · ${fmtInt(x.maxCombo)}x${x.mods && x.mods.length ? ' · ' + x.mods.join('') : ''}`, fmtScore(ScoreManager.value(x))), { score: ScoreManager.value(x) }));
    this._lbMe = mk(s.mode === 'replay' ? (s.replay.player || 'Player') : ProfileManager.profile.name, '', '0', true);
    this.updateLeaderboard(true);
  },
  updateLeaderboard(force) {
    const me = this._lbMe;
    if (!me) return;
    const t = performance.now();
    if (!force && t - this._lbT < 150) return;
    this._lbT = t;
    const e = this.s.engine, sc = ScoreManager.value(e.score);
    // ties go to the score that was set first
    const above = this._lbRows.filter(r => r.score >= sc).length;
    if (me._pos !== above + 1) {
      me._pos = above + 1; me.pos.textContent = above + 1; me.el.style.order = above * 2 + 1;
      this._lbRows.forEach((r, i) => { const p = i + 1 + (i >= above ? 1 : 0); r.pos.textContent = p; r.el.style.order = i * 2 + (i >= above ? 2 : 0); });
    }
    const sub = `${fmtAcc(e.score.accuracy)} · ${fmtInt(e.score.combo)}x`, st = fmtScore(sc);
    if (me._sub !== sub) { me._sub = sub; me.sub.textContent = sub; }
    if (me._st !== st) { me._st = st; me.sc.textContent = st; }
  },
  /** The board Tab toggles: the multiplayer standings, or the local leaderboard. */
  board() { return this.mpBoard && this.s.mp ? this.mpBoard : this.lbEl; },
  toggleLeaderboard() {
    const on = !Settings.get('gameplay.leaderboard');
    Settings.set('gameplay.leaderboard', on);
    this.board().classList.toggle('lb-off', !on);
    Toast.show(on ? 'Leaderboard shown' : 'Leaderboard hidden', 'Tab');
  },
  /** Multiplayer: send our live score (4×/s) and show both players, highest first (osu!lazer-style board). */
  updateMp(e) {
    const t = performance.now();
    if (t - this._mpSent > 250 && this.s.running) {
      this._mpSent = t;
      this._myPp = this.livePp(e) * this.mpFactor();
      Multiplayer.send({ t: 'score', score: Math.round(e.score.score * this.mpFactor()), acc: e.score.accuracy, combo: e.score.combo, hp: e.health.value, pp: this._myPp });
    }
    // the opponent's score arrives 4×/s; ease the displayed value towards it so it counts up smoothly
    const o = Multiplayer.opp;
    // matches are won on pp, so the board ranks and shows live pp (score underneath)
    const target = o ? (o.pp || 0) : 0;
    this._oppShown = this._oppShown == null ? target : this._oppShown + (target - this._oppShown) * Math.min(1, (t - (this._mpT || t)) / 180);
    this._mpT = t;
    if (t - (this._mpDrawn || 0) < 100) return;
    this._mpDrawn = t;
    if (!this._mpRows) {
      const opp = Multiplayer.opponent();
      const mk = (name, me) => { const r = { pos: h('span.pos'), sub: h('span'), sc: h('span.sc') }; r.el = h(`div.hud-mp-row${me ? '.me' : ''}`, r.pos, h('div.nm', h('b', name), r.sub), r.sc); return r; };
      this._mpRows = [mk(ProfileManager.profile.name, true), opp ? mk(opp.name, false) : null].filter(Boolean);
      this.mpBoard.append(...this._mpRows.map(r => r.el));
    }
    const vals = [[this._myPp || 0, Math.round(e.score.score * this.mpFactor()), e.score.accuracy], [this._oppShown, o ? o.score : 0, o ? o.acc : 1]];
    const first = vals[1] && this._mpRows[1] && (vals[1][0] > vals[0][0] || (vals[1][0] === vals[0][0] && vals[1][1] > vals[0][1])) ? 1 : 0;
    this._mpRows.forEach((r, i) => {
      const [pp, sc, acc] = vals[i];
      const pos = i === first ? 1 : 2;
      const sub = `${fmtScore(sc)} · ${fmtAcc(acc)}`, st = `${Math.round(pp)}pp`;
      if (r._pos !== pos) { r._pos = pos; r.pos.textContent = pos; r.el.style.order = pos; }
      if (r._sub !== sub) { r._sub = sub; r.sub.textContent = sub; }
      if (r._st !== st) { r._st = st; r.sc.textContent = st; }
    });
  },
  /** Score / pp multiplier for the "can't die in multiplayer" rule. */
  mpFactor() { return this.s && this.s.mpDied ? 0.5 : 1; },
  /** Wait for the synchronised start; everyone begins at the same moment. */
  async mpWait(s) {
    const el = h('div.mp-countdown');
    this.el.appendChild(el);
    while (this.s === s) {
      const left = s.mp.startAt - performance.now();
      if (left <= 0) break;
      const txt = left > 3000 ? 'Get ready…' : String(Math.ceil(left / 1000));
      if (txt !== el.textContent && left <= 3000) SkinManager.skinOnly(`count${txt}s`);
      el.textContent = txt;
      await sleep(Math.min(100, left));
    }
    el.remove();
  },
  async mpQuit() {
    const s = this.s;
    if (!s || s.finished) { Screens.go('multiplayer', {}, { replace: true }); return; }
    if (!(await Dialog.confirm('Quit match?', 'Quitting counts as a loss.', { ok: 'Quit', danger: true }))) return;
    if (this.s !== s) return;
    Multiplayer.send({ t: 'quit' });
    s.finished = true; s.running = false;
    Screens.go('multiplayer', {}, { replace: true });
  },

  changeScrollSpeed(d) {
    const v = clamp(Settings.get('gameplay.scrollSpeed') + d, 1, 40);
    Settings.set('gameplay.scrollSpeed', v);
    if (!this.speedEl) { this.speedEl = h('div.gp-speed'); this.el.appendChild(this.speedEl); }
    this.speedEl.textContent = `Scroll speed ${v} (${Math.round(11485 / v)}ms)`;
    this.speedEl.classList.remove('show'); void this.speedEl.offsetWidth; this.speedEl.classList.add('show');
    clearTimeout(this._speedT); this._speedT = setTimeout(() => this.speedEl && this.speedEl.classList.remove('show'), 1200);
  },

  /** Live pp: the pp this play is worth if the rest of the map is played at the current accuracy. */
  livePp(e) {
    const c = e.score.counts, judged = e.score.judged, total = e.totalJudgements;
