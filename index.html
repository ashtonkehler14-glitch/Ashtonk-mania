/* ===== 15-screen-gameplay.js ===== */
/* Gameplay screen: owns a play session.
 *  TimingEngine: song time = Music.time (audio clock) − audio offset.
 *  InputManager: keyboard events are timestamped with KeyboardEvent.timeStamp and mapped onto the
 *                audio clock, so judgement never depends on frame timing.
 *  Rendering follows the clock at whatever refresh rate the display runs (optional limiter). */

const Game = {
  /** Launch gameplay. opts: {mapId, mods, mode: 'play'|'practice'|'replay', replay} */
  launch(opts) {
    if (Settings.get('input.fullscreenOnPlay') && !document.fullscreenElement) toggleFullscreen(true);
    Screens.go('gameplay', { ...opts, force: true }, { transition: 'zoom' });
  },
};

const PRACTICE_SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];

const GameplayScreen = {
  inGame: true, transient: true, tab: 'songselect',
  s: null, // session

  enter(params) {
    const el = h('div.gameplay');
    this.el = el;
    this.bgEl = h('div.gp-bg'); this.dimEl = h('div.gp-dim');
    this.canvas = h('canvas.gp-canvas');
    this.hud = h('div.gp-hud');
    this.failEl = h('div.gp-fail');
    el.append(this.bgEl, this.dimEl, this.canvas, this.failEl, this.hud);
    this.hud.append(h('div.hud-center-msg', { style: { fontSize: '1.4rem' } }, LoadingMessages.pick('Preparing stage…')));
    this.renderer = new ManiaRenderer(this.canvas);
    this.params = params;
    this._keydown = e => this.onKeyDown(e);
    this._keyup = e => this.onKeyUp(e);
    this._blur = () => { if (this.s && this.s.running) this.pause(); };
    window.addEventListener('keydown', this._keydown, true);
    window.addEventListener('keyup', this._keyup, true);
    window.addEventListener('blur', this._blur);
    this._mm = () => { el.classList.add('show-cursor'); clearTimeout(this._mmT); this._mmT = setTimeout(() => el.classList.remove('show-cursor'), 1500); };
    el.addEventListener('pointermove', this._mm);
    this._settingsSub = Bus.on('settings:changed', k => { if (this.s && (k.startsWith('gameplay.') || k.startsWith('skin.') || k === 'graphics.renderScale' || k === '*')) { this.renderer.resize(true); this.applyBackground(); }
      if (k === 'debug.overlay' && this.debugEl) this.debugEl.hidden = !Settings.get('debug.overlay'); });
    requestAnimationFrame(() => this.start(params).catch(e => { console.error(e); Toast.err('Could not start the beatmap', e.message); Screens.go('songselect', {}, { replace: true }); }));
    return el;
  },
  leave() {
    window.removeEventListener('keydown', this._keydown, true);
    window.removeEventListener('keyup', this._keyup, true);
    window.removeEventListener('blur', this._blur);
    cancelAnimationFrame(this._raf);
    this._settingsSub && this._settingsSub();
    if (this.s) { this.s.running = false; this.s = null; }
    Music.stop(150);
    this.closePause();
  },
  onBack() { if (this.s) { if (this.s.running) this.pause(); else if (this.pauseEl && !this.s.failed) this.resume(); } return true; },

  async start(p) {
    const loaded = await BeatmapManager.load(p.mapId);
    const { rec, bm } = loaded;
    const keys = BeatmapParser.keyCount(bm);
    const replay = p.replay || null;
    const mods = replay ? replay.mods : ModSystem.normalize(p.mods || []);
    const practice = p.mode === 'practice';
    const auto = mods.includes('AT');
    let rate = replay ? replay.rate : ModSystem.rate(mods);
    if (practice) rate = Settings.get('practice.speed') || 1;
    const preserve = (practice || !ModSystem.pitchShift(mods)) && Settings.get('audio.preservePitch');
    const skin = SkinManager.current;
    const [layout, buffer] = await Promise.all([skin.mania(keys), TrackCache.get(rec.setId, rec.audioFile)]);
    Music.stop(0);
    await Music.load(buffer, `${rec.setId}/${rec.audioFile}`, { setId: rec.setId, mapId: rec.id });
    const msgEl = this.hud.querySelector('.hud-center-msg');
    await Music.setRate(rate, preserve, f => { if (msgEl) msgEl.textContent = `Preparing audio… ${Math.round(f * 100)}%`; });
    this.renderer.setLayout(layout);

    const seed = replay ? replay.seed : (Math.random() * 2 ** 31) | 0;
    const baseNotes = prepareNotes(loaded.notes, keys, mods, seed);
    const windows = replay ? replay.windows : timingWindows({ od: bm.od, mods, mode: Settings.get('gameplay.judgementMode'), customOD: Settings.get('gameplay.customOD'), customMs: Settings.get('gameplay.windowsMs') });
    const accuracyMode = replay ? replay.accuracyMode : Settings.get('gameplay.accuracyMode');
    const scrollMode = mods.includes('CS') ? 'constant' : Settings.get('gameplay.scrollMode');
    const scroll = new ScrollMap(BeatmapParser.scrollSegments(bm, { useSV: scrollMode !== 'constant', useBPM: scrollMode === 'sv' }));
    const endTime = baseNotes.length ? Math.max(...baseNotes.map(n => n.end)) : 0;
    const tpIdx = t => { const tps = bm.timingPoints; let i = bsearchLE(tps, t + 2, 'time'); return i >= 0 ? tps[i] : tps[0]; };
    const specs = baseNotes.map(n => (n.hsSpec = HitSounds.resolve(n, bm, tpIdx)));
    const bank = new SampleBank(rec.setId);
    await bank.preload(specs);
    const redTiming = BeatmapParser.timing(bm);

    const s = this.s = {
      rec, bm, keys, mods, rate, practice, auto, replay, seed, windows, accuracyMode, layout, scroll, baseNotes, specs, bank,
      barlines: BeatmapParser.barlines(bm, endTime), barIdx: 0, endTime, redTiming,
      firstNote: baseNotes.length ? baseNotes[0].time : 0,
      held: new Array(keys).fill(false), keyMap: new Map(), keyLabels: [],
      events: [], running: false, finished: false, failed: false, startedReal: performance.now(), playedReal: 0,
      mode: replay ? 'replay' : auto ? 'auto' : practice ? 'practice' : 'play',
      loopA: null, loopB: null, speed: rate,
      debug: { inputs: 0, lastErr: null },
    };
    Settings.keybinds(keys).forEach((codes, col) => { codes.forEach(c => s.keyMap.set(c, col)); s.keyLabels[col] = keyLabel(codes[0]); });
    this.newEngine(practice ? null : undefined);
    if (auto || replay) {
      s.feed = replay ? replay.events : generateAutoInputs(s.engine.notes, keys).flat();
      s.feedIdx = 0;
    }
    this.applyBackground();
    this.buildHud();
    const leadIn = Math.max(Settings.get('gameplay.leadIn'), bm.audioLeadIn) * rate;
    const startPos = Math.min(0, s.firstNote - leadIn);
    s.skipTarget = s.firstNote - leadIn;
    Toolbar.setNowPlaying(rec);
    Music.onEnded = null;
    Music.play(startPos, { fadeIn: startPos >= 0 ? 150 : 0 });
    s.running = true;
    this.lastRender = 0;
    this.loop();
  },

  newEngine(fromTime) {
    const s = this.s;
    let notes = s.baseNotes;
    if (fromTime != null) notes = notes.filter(n => n.time >= fromTime && (s.loopB == null || n.time <= s.loopB));
    s.engine = new GameplayEngine({ notes, keys: s.keys, windows: s.windows, rate: s.rate, mods: s.mods, hp: s.bm.hp, accuracyMode: s.accuracyMode, noFail: s.practice });
    s.engine.onEvent(e => this.onEngineEvent(e));
    s.held.fill(false);
    s.barIdx = 0;
  },

  applyBackground() {
    const s = this.s;
    if (!s) return;
    const show = Settings.get('gameplay.showBackground');
    this.dimEl.style.opacity = show ? Settings.get('gameplay.bgDim') : 1;
    this.bgEl.style.filter = Settings.get('gameplay.bgBlur') ? `blur(${Settings.get('gameplay.bgBlur')}px)` : '';
    this.bgEl.style.inset = Settings.get('gameplay.bgBlur') ? '-30px' : '0';
    const set = BeatmapManager.setById.get(s.rec.setId);
    (Settings.get('graphics.bgQuality') === 'low' ? BeatmapManager.thumbURL(set) : BeatmapManager.bgURL(s.rec)).then(u => {
      this.bgEl.style.backgroundImage = show && u ? `url("${u}")` : 'none';
    });
  },

  buildHud() {
    const s = this.s;
    clearEl(this.hud);
    this.scoreEl = h('div.sc', '0'); this.accEl = h('div.acc', '100.00%'); this.paceEl = h('div.pace');
    this.progEl = h('i'); this.timeEl = h('div.hud-time');
    this.hud.append(
      h('div.hud-progress', { style: { display: Settings.get('gameplay.progressBar') ? '' : 'none' } }, this.progEl),
      h('div.hud-score', this.scoreEl, this.accEl, this.paceEl),
      this.timeEl,
      h('div.hud-mods', ...s.mods.map(m => ModSystem.badge(m))),
      h('div.hud-meta', h('b', s.rec.title), ` — ${s.rec.artist}`, h('br'), `[${s.rec.version}] · ${s.keys}K · ${SkinManager.current.name}`),
    );
    if (s.mode === 'replay' || s.mode === 'auto') {
      this.hud.append(h('div.hud-replay', h('span.dot'), s.mode === 'auto' ? 'AUTO' : `REPLAY · ${s.replay.player || 'Player'}`));
    }
    this.skipBtn = h('button.btn.hud-skip', { onclick: () => this.skip(), style: { display: 'none' } }, icon('skip'), 'Skip', h('span.kbd', 'Space'));
    this.hud.append(this.skipBtn);
    if (s.practice) this.buildPracticeBar();
    this.debugEl = h('div.debug-overlay', { hidden: !Settings.get('debug.overlay') });
    this.el.appendChild(this.debugEl);
  },

  // ─────────────────────────────── main loop ───────────────────────────────
  gameTime() { return Music.time - Settings.get('audio.offset') * this.s.rate; },
  loop() {
    const frame = () => {
      this._raf = requestAnimationFrame(frame);
      const s = this.s;
      if (!s) return;
      const realNow = performance.now();
      const now = this.gameTime();
      const eng = s.engine;
      if (s.running) {
        // replay / auto input feed (exact recorded times)
        if (s.feed) {
          const ev = s.feed;
          while (s.feedIdx < ev.length && ev[s.feedIdx] <= now) {
            const t = ev[s.feedIdx], col = ev[s.feedIdx + 1], down = ev[s.feedIdx + 2] === 1;
            s.feedIdx += 3;
            s.held[col] = down;
            if (!down) this.renderer.onRelease(col, realNow);
            eng.input(col, down, t);
          }
          eng.advance(now);
        } else {
          const grace = 30 * s.rate;
          if (now - grace > eng.lastTime) eng.advance(now - grace);
        }
        this.checkEnd(now);
        this.updatePractice(now);
      }
      const lim = Settings.get('graphics.fpsLimit');
      if (lim > 0 && realNow - this.lastRender < 1000 / lim - 0.6) return;
      this.lastRender = realNow;
      const L = s.layout;
      const timeRange = 11485 / Settings.get('gameplay.scrollSpeed');
      this.renderer.render({
        now, posNow: s.scroll.pos(now), scroll: s.scroll, pxPerMs: this.renderer.hitY / (timeRange * s.rate) * 1,
        engine: eng, held: s.held, barlines: s.barlines, get barIdx() { return s.barIdx; }, set barIdx(v) { s.barIdx = v; },
        hidden: s.mods.includes('HD') ? 'HD' : s.mods.includes('FI') ? 'FI' : null, realNow, keyLabels: s.keyLabels,
      });
      this.updateHud(now);
      if (!this.debugEl.hidden) this.updateDebug(now, realNow);
      FPS.frame(realNow);
      void L;
    };
    frame();
  },

  updateHud(now) {
    const s = this.s, e = s.engine;
    const sc = e.score.score;
    if (sc !== this._lastSc) { this._lastSc = sc; this.scoreEl.textContent = fmtScore(sc); }
    const acc = e.score.accuracy;
    if (acc !== this._lastAcc) { this._lastAcc = acc; this.accEl.textContent = fmtAcc(acc); }
    const dur = s.endTime;
    const p = clamp((now - s.firstNote) / Math.max(1, dur - s.firstNote), 0, 1);
    this.progEl.style.width = (p * 100).toFixed(2) + '%';
    const tt = `${fmtTime(Math.max(0, now) / s.rate)} / ${fmtTime(dur / s.rate)}`;
    if (tt !== this._lastTT) { this._lastTT = tt; this.timeEl.textContent = tt; }
    const canSkip = s.running && now < s.skipTarget - 1500 * s.rate && !s.practice;
    this.skipBtn.style.display = canSkip ? '' : 'none';
    const pb = this._pb === undefined ? (this._pb = ScoreManager.best(s.rec.hash)) : this._pb;
    if (pb && s.mode === 'play') {
      const t = `PB ${fmtAcc(pb.accuracy)}`;
      if (this.paceEl.textContent !== t) this.paceEl.textContent = t;
    }
  },
  updateDebug(now, realNow) {
    const s = this.s, e = s.engine;
    const tp = s.redTiming.red[Math.max(0, bsearchLE(s.redTiming.red, now, 'time'))];
    const active = e.columns.reduce((a, c, i) => a + Math.max(0, Math.min(c.length, e.ptr[i] + 30) - e.ptr[i]), 0);
    const mem = performance.memory ? fmtBytes(performance.memory.usedJSHeapSize) : 'n/a';
    const W = e.W.map(w => (w / s.rate).toFixed(1));
    this.debugEl.textContent =
`ASHTONK!MANIA DEBUG
FPS          ${FPS.fps.toFixed(0)} (${FPS.frameMs.toFixed(2)}ms)
Audio time   ${(AudioManager.ctx.currentTime * 1000).toFixed(1)}ms  [${AudioManager.ctx.state}]
Out latency  ${((AudioManager.ctx.outputLatency || AudioManager.ctx.baseLatency || 0) * 1000).toFixed(1)}ms
Song pos     ${Music.time.toFixed(1)}ms
Game time    ${now.toFixed(1)}ms  (offset ${Settings.get('audio.offset')}ms, rate ${s.rate}x)
Last error   ${s.debug.lastErr == null ? '—' : s.debug.lastErr.toFixed(2) + 'ms'}
BPM          ${tp ? (60000 / tp.beatLength).toFixed(2) : '—'}
Scroll vel   ${s.scroll.velAt(now).toFixed(3)}x
Active notes ${active}  (remaining judgements ${e.remaining})
Input events ${e.inputCount}  recorded ${s.events.length / 3}
Windows ms   ${W.join(' / ')}
Health       ${(e.health.value * 100).toFixed(1)}%
Memory       ${mem}
Skin         ${SkinManager.current.name} (${s.layout.fromSkinIni ? 'skin.ini [Mania] ' + s.keys + 'K' : 'defaults'})`;
  },

  checkEnd(now) {
    const s = this.s, e = s.engine;
    if (s.finished) return;
    if (e.health.failed && !s.practice) { this.fail(now); return; }
    const done = e.finished && now > s.endTime + 400 * s.rate;
    const audioDone = !Music.playing && Music.pausedPos >= Music.duration - 5 && now > 0;
    if (s.practice) return;
    if (done || (audioDone && now > s.endTime)) {
      e.advance(Infinity);
      this.complete();
    }
  },

  // ─────────────────────────────── input ───────────────────────────────
  inputTime(e) {
    const s = this.s;
    const ctxT = AudioManager.perfToCtx(e.timeStamp || performance.now());
    return Music.timeAtCtx(ctxT) - Settings.get('audio.offset') * s.rate - Settings.get('input.latency') * s.rate;
  },
  onKeyDown(e) {
    if (Screens.current !== this) return;
    const s = this.s;
    if (Overlays.top()) return;
    if (e.code === 'Escape') { e.preventDefault(); e.stopPropagation(); if (!e.repeat) this.onBack(); return; }
    if (!s) return;
    if (e.code === 'Backquote' && !e.repeat) { e.preventDefault(); this._retryHold = setTimeout(() => this.retry(), 450); return; }
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyR') { e.preventDefault(); this.retry(); return; }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyD') return; // global debug toggle
    if (s.practice && this.practiceKey(e)) { e.preventDefault(); e.stopPropagation(); return; }
    const col = s.keyMap.get(e.code);
    if (col !== undefined) {
      e.preventDefault(); e.stopPropagation();
      if (e.repeat || !s.running || s.feed) return;
      this.press(col, true, this.inputTime(e));
      return;
    }
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); this.skip(); return; }
    if (e.code === 'F11') return;
    if (s.running && !e.ctrlKey && !e.metaKey && !e.altKey && e.code !== 'Tab') e.preventDefault();
  },
  onKeyUp(e) {
    if (Screens.current !== this) return;
    const s = this.s;
    if (e.code === 'Backquote') clearTimeout(this._retryHold);
    if (!s) return;
    const col = s.keyMap.get(e.code);
    if (col === undefined) return;
    e.preventDefault(); e.stopPropagation();
    if (!s.running || s.feed) { s.held[col] = false; return; }
    this.press(col, false, this.inputTime(e));
  },
  press(col, down, t) {
    const s = this.s, eng = s.engine;
    if (s.held[col] === down) return;
    t = Math.round(t * 100) / 100;
    if (t < eng.lastTime) t = eng.lastTime; // keeps live play and replay playback bit-identical
    s.held[col] = down;
    if (!down) this.renderer.onRelease(col, performance.now());
    if (!s.practice) s.events.push(t, col, down ? 1 : 0);
    eng.input(col, down, t);
  },
  releaseAll() {
    const s = this.s;
    if (!s) return;
    const t = this.gameTime();
    for (let c = 0; c < s.keys; c++) if (s.held[c] && !s.feed) this.press(c, false, t);
    if (s.feed) s.held.fill(false);
  },

  onEngineEvent(e) {
    const s = this.s;
    const realNow = performance.now();
    if (e.type === 'judgement') {
      this.renderer.onJudgement(e, realNow);
      if (e.err != null) s.debug.lastErr = e.err / s.rate;
      if (e.j === J.MISS && s.engine.score.comboBreaks && this._lastCombo >= 20) SkinManager.sample('combobreak').then(b => b && AudioManager.play(b));
      this._lastCombo = s.engine.score.combo;
    } else if (e.type === 'press') {
      if (Settings.get('audio.hitsounds')) {
        const col = s.engine.columns[e.col];
        let n = e.note;
        if (!n) n = col[col.length - 1];
        if (n && n.hsSpec) s.bank.play(n.hsSpec);
      }
    } else if (e.type === 'earlyRelease') {
      if (this._lastCombo >= 20) SkinManager.sample('combobreak').then(b => b && AudioManager.play(b));
      this._lastCombo = 0;
    }
  },

  skip() {
    const s = this.s;
    if (!s || !s.running) return;
    const now = this.gameTime();
    if (now >= s.skipTarget - 1000 * s.rate) return;
    UISounds.click();
    Music.play(s.skipTarget + Settings.get('audio.offset') * s.rate);
  },

  // ─────────────────────────────── pause / fail / complete ───────────────────────────────
  pause() {
    const s = this.s;
    if (!s || !s.running || s.finished) return;
    this.releaseAll();
    s.running = false;
    Music.pause();
    SkinManager.sample('pause-loop').then(() => {});
    this.showPause('Paused');
  },
  showPause(title, failed = false) {
    this.closePause();
    const s = this.s;
    const btns = [];
    if (!failed) btns.push(h('button.btn.primary', { onclick: () => this.resume() }, icon('play'), 'Continue'));
    btns.push(h('button.btn', { onclick: () => this.retry() }, icon('retry'), 'Retry'));
    if (failed && this.failedScore) btns.push(h('button.btn', { onclick: () => Screens.go('results', { score: this.failedScore, replay: this.failedReplay }, { replace: true }) }, icon('chart'), 'View results'));
    btns.push(h('button.btn.danger', { onclick: () => this.quit() }, icon('back'), 'Quit'));
    const el = h('div.pause-menu', h('div.pause-box', h(`h2${failed ? '.failed' : ''}`, title), ...btns,
      h('div.pb-sub', failed ? `${fmtAcc(s.engine.score.accuracy)} · ${fmtInt(s.engine.score.maxCombo)}x` : `${s.rec.title} [${s.rec.version}]`)));
    this.pauseEl = el;
    this.el.appendChild(el);
    this.el.classList.add('show-cursor');
    const first = el.querySelector('button'); first && first.focus();
    el.addEventListener('keydown', ev => {
      const b = $$('button', el), i = b.indexOf(document.activeElement);
      if (ev.key === 'ArrowDown') { b[(i + 1) % b.length].focus(); ev.preventDefault(); ev.stopPropagation(); }
      if (ev.key === 'ArrowUp') { b[(i - 1 + b.length) % b.length].focus(); ev.preventDefault(); ev.stopPropagation(); }
    });
  },
  closePause() { if (this.pauseEl) { this.pauseEl.remove(); this.pauseEl = null; } this.el && this.el.classList.remove('show-cursor'); },
  resume() {
    const s = this.s;
    if (!s || s.running || s.failed || s.finished) return;
    this.closePause();
    const cd = h('div.countdown', '3');
    this.el.appendChild(cd);
    let n = 3;
    const step = () => {
      if (!this.s || this.s !== s) { cd.remove(); return; }
      n--;
      if (n <= 0) { cd.remove(); s.running = true; Music.play(Music.pausedPos); return; }
      cd.textContent = String(n);
      this._cdT = setTimeout(step, 400);
    };
    this._cdT = setTimeout(step, 400);
  },
  retry() {
    clearTimeout(this._cdT);
    const p = this.params;
    Screens.go('gameplay', { ...p, force: true }, { replace: true });
  },
  quit() {
    clearTimeout(this._cdT);
    const s = this.s;
    if (s && s.mode === 'replay' && this.params.returnTo) { Screens.go('results', this.params.returnTo, { replace: true }); return; }
    Screens.go('songselect', { mapId: this.params.mapId }, { replace: true });
  },
  async fail(now) {
    const s = this.s;
    s.running = false; s.failed = true; s.finished = true;
    this.releaseAll();
    this.failEl.classList.add('on');
    const src = Music.source;
    if (src) {
      const t = AudioManager.ctx.currentTime;
      src.playbackRate.setValueAtTime(src.playbackRate.value, t);
      src.playbackRate.linearRampToValueAtTime(0.3, t + 1.2);
      Music.setVolume(0, 1200);
      setTimeout(() => Music.stop(0), 1300);
    }
    SkinManager.sample('failsound').then(b => b && AudioManager.play(b));
    if (s.mode === 'play') {
      const { score } = await this.saveScore(false, now);
      this.failedScore = score; this.failedReplay = this._unsavedReplay;
    }
    setTimeout(() => { if (this.s === s) this.showPause('Failed', true); }, 900);
  },
  async complete() {
    const s = this.s;
    s.finished = true; s.running = false;
    this.releaseAll();
    const summary = s.engine.summary();
    if (s.mode === 'play') {
      const { score, replay } = await this.saveScore(true);
      setTimeout(() => { if (this.s === s) Screens.go('results', { score, replay, fresh: true }, { replace: true, transition: 'zoom' }); }, 600);
    } else {
      const score = this.buildScore(true, summary);
      setTimeout(() => { if (this.s === s) Screens.go('results', { score, replay: s.mode === 'replay' ? s.replay : null, fresh: false, watched: s.mode }, { replace: true, transition: 'zoom' }); }, 600);
    }
  },
  buildScore(passed, summary) {
    const s = this.s;
    const grade = ScoreSystem.gradeFor(summary.accuracy, !passed, s.mods, summary.counts);
    return {
      id: 'sc-' + uid(), mapHash: s.rec.hash, mapId: s.rec.id, setId: s.rec.setId,
      title: s.rec.title, artist: s.rec.artist, version: s.rec.version, creator: s.rec.creator,
      keys: s.keys, stars: s.rate === 1 ? s.rec.stars : DifficultyCalculator.calculate(s.baseNotes, s.keys, s.rate),
      mods: s.mods, rate: s.rate, score: summary.score, accuracy: summary.accuracy, maxCombo: summary.maxCombo,
      counts: summary.counts, grade, passed, date: Date.now(),
      duration: Math.round(performance.now() - s.startedReal), player: s.replay ? s.replay.player : ProfileManager.profile.name,
      meanError: summary.meanError, unstableRate: summary.unstableRate, early: summary.early, late: summary.late,
      hitErrors: summary.hitErrors, totalJudgements: summary.totalJudgements, accuracyMode: s.accuracyMode,
      windows: s.windows, od: s.bm.od, replayId: null,
    };
  },
  async saveScore(passed) {
    const s = this.s;
    const summary = s.engine.summary();
    const score = this.buildScore(passed, summary);
    const replay = ReplayManager.build({
      map: s.rec, mods: s.mods, rate: s.rate, seed: s.seed, windows: s.windows, accuracyMode: s.accuracyMode, hp: s.bm.hp, keys: s.keys,
      events: s.events, summary: { ...summary, grade: score.grade }, scoreId: score.id, player: score.player, duration: score.duration,
    });
    await ScoreManager.add(score);
    const mode = Settings.get('replays.autosave');
    if ((mode === 'all' && passed) || (mode === 'pb' && score.isPB)) {
      await ReplayManager.save(replay);
      score.replayId = replay.id;
    }
    this._unsavedReplay = replay;
    return { score, replay };
  },

  // ─────────────────────────────── practice ───────────────────────────────
  buildPracticeBar() {
    const s = this.s;
    const tl = h('div.pr-timeline');
    const cv = h('canvas');
    this.prLoop = h('div.pr-loop', { style: { display: 'none' } });
    this.prHead = h('div.pr-head');
    tl.append(cv, this.prLoop, this.prHead);
    tl.addEventListener('pointerdown', ev => {
      const r = tl.getBoundingClientRect();
      const t = (ev.clientX - r.left) / r.width * s.endTime;
      this.practiceSeek(t);
    });
    const speedBtns = PRACTICE_SPEEDS.map(sp => h(`button.chip${Math.abs(sp - s.rate) < 1e-3 ? '.on' : ''}`, { onclick: () => this.practiceSpeed(sp) }, `${Math.round(sp * 100)}%`));
    this.prOffset = h('span.muted');
    this.prInfo = h('span.muted');
    const bar = h('div.practice-bar',
      tl,
      h('div.pr-controls',
        h('span', { style: { fontWeight: 900, color: 'var(--gold)' } }, 'PRACTICE'),
        h('button.btn.sm', { onclick: () => this.setLoop('A'), title: 'Set loop start ( [ )' }, 'Set A ', h('span.kbd', '[')),
        h('button.btn.sm', { onclick: () => this.setLoop('B'), title: 'Set loop end ( ] )' }, 'Set B ', h('span.kbd', ']')),
        h('button.btn.sm', { onclick: () => this.setLoop('clear'), title: 'Clear loop ( \\ )' }, 'Clear'),
        h('button.btn.sm', { onclick: () => this.restartSection(), title: 'Restart section (Backspace)' }, icon('retry'), 'Restart ', h('span.kbd', '⌫')),
        h('div.speed-group', ...speedBtns),
        h('button.btn.sm', { onclick: () => this.nudgeOffset(-5), title: 'Offset −5ms ( - )' }, '−'),
        this.prOffset,
        h('button.btn.sm', { onclick: () => this.nudgeOffset(5), title: 'Offset +5ms ( = )' }, '+'),
        h('span.grow'), this.prInfo));
    this.practiceBar = bar;
    this.hud.append(bar);
    this.placePracticeBar();
    this._prResize = () => this.placePracticeBar();
    window.addEventListener('resize', this._prResize);
    // density graph
    requestAnimationFrame(() => {
      const dpr = devicePixelRatio || 1;
      cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
      const x = cv.getContext('2d');
      const bins = new Array(Math.max(10, Math.floor(cv.width / (3 * dpr)))).fill(0);
      for (const n of s.baseNotes) bins[Math.min(bins.length - 1, Math.floor(n.time / s.endTime * bins.length))]++;
      const max = Math.max(...bins, 1);
      const bw = cv.width / bins.length;
      bins.forEach((v, i) => {
        const hh = v / max * cv.height * 0.9;
        x.fillStyle = `rgba(176,124,255,${0.35 + 0.5 * v / max})`;
        x.fillRect(i * bw, cv.height - hh, Math.max(1, bw - dpr), hh);
      });
    });
    this.updatePracticeLabels();
  },
  /** Dock the practice tools beside the stage when there is room, so they never cover the receptors. */
  placePracticeBar() {
    const bar = this.practiceBar, r = this.renderer;
    if (!bar || !bar.isConnected) { window.removeEventListener('resize', this._prResize); return; }
    r.resize();
    const ratio = this.canvas.clientWidth / Math.max(1, r.W);
    const left = r.stageX * ratio;
    const docked = left >= 330;
    bar.classList.toggle('docked', docked);
    bar.style.width = docked ? Math.min(480, left - 32) + 'px' : '';
  },
  updatePracticeLabels() {
    if (!this.prOffset) return;
    this.prOffset.textContent = `offset ${Settings.get('audio.offset')}ms`;
    const s = this.s;
    this.prInfo.textContent = s.loopA != null || s.loopB != null ? `loop ${fmtTime(s.loopA ?? 0)} → ${fmtTime(s.loopB ?? s.endTime)}` : 'click the timeline to seek';
    if (s.loopA != null || s.loopB != null) {
      const a = (s.loopA ?? 0) / s.endTime * 100, b = (s.loopB ?? s.endTime) / s.endTime * 100;
      Object.assign(this.prLoop.style, { display: '', left: a + '%', width: Math.max(0.3, b - a) + '%' });
    } else this.prLoop.style.display = 'none';
  },
  updatePractice(now) {
    const s = this.s;
    if (!s.practice || !this.prHead) return;
    this.prHead.style.left = clamp(now / s.endTime * 100, 0, 100) + '%';
    this.practiceBar.classList.toggle('dim', s.held.some(Boolean));
    if (s.loopB != null && now > s.loopB + 400 * s.rate) this.restartSection();
    if (s.loopB == null && now > s.endTime + 1000 * s.rate) this.practiceSeek(s.loopA ?? 0);
  },
  practiceKey(e) {
    const s = this.s;
    if (s.keyMap.has(e.code)) return false;
    switch (e.code) {
      case 'BracketLeft': this.setLoop('A'); return true;
      case 'BracketRight': this.setLoop('B'); return true;
      case 'Backslash': this.setLoop('clear'); return true;
      case 'Backspace': this.restartSection(); return true;
      case 'Minus': this.nudgeOffset(-5); return true;
      case 'Equal': this.nudgeOffset(5); return true;
      case 'ArrowLeft': this.practiceSeek(this.gameTime() - 5000 * s.rate); return true;
      case 'ArrowRight': this.practiceSeek(this.gameTime() + 5000 * s.rate); return true;
    }
    return false;
  },
  setLoop(which) {
    const s = this.s, t = this.gameTime();
    if (which === 'A') { s.loopA = clamp(t, 0, s.endTime); if (s.loopB != null && s.loopB <= s.loopA) s.loopB = null; }
    else if (which === 'B') { s.loopB = clamp(t, 0, s.endTime); if (s.loopA != null && s.loopA >= s.loopB) s.loopA = null; }
    else { s.loopA = null; s.loopB = null; }
    UISounds.click();
    this.updatePracticeLabels();
  },
  restartSection() { this.practiceSeek(this.s.loopA ?? 0); },
  practiceSeek(t) {
    const s = this.s;
    t = clamp(t, 0, s.endTime);
    const lead = 1200 * s.rate;
    this.newEngine(t);
    s.running = true;
    this.closePause();
    Music.play(t - lead + Settings.get('audio.offset') * s.rate);
  },
  async practiceSpeed(sp) {
    const s = this.s;
    const pos = this.gameTime();
    Settings.set('practice.speed', sp);
    Music.stop(0);
    s.running = false;
    const msg = h('div.hud-center-msg', 'Changing speed…');
    this.hud.append(msg);
    await Music.setRate(sp, Settings.get('audio.preservePitch'), f => msg.textContent = `Changing speed… ${Math.round(f * 100)}%`);
    msg.remove();
    s.rate = sp;
    $$('.speed-group .chip', this.practiceBar).forEach((b, i) => b.classList.toggle('on', Math.abs(PRACTICE_SPEEDS[i] - sp) < 1e-3));
    this.practiceSeek(s.loopA != null && pos < s.loopA ? s.loopA : Math.max(0, pos));
  },
  nudgeOffset(d) {
    Settings.set('audio.offset', clamp(Settings.get('audio.offset') + d, -300, 300));
    this.updatePracticeLabels();
  },
};

/** Loading messages with a rare Neru easter egg. */
const LoadingMessages = {
  pick(normal) { return Math.random() < 0.05 ? LOADING_NERU[Math.floor(Math.random() * LOADING_NERU.length)] : normal; },
};

/** Global frame statistics (FPS counter + debug). */
const FPS = {
  last: 0, fps: 0, frameMs: 0, acc: 0, n: 0,
  frame(now) {
    if (this.last) {
      const dt = now - this.last;
      this.frameMs = this.frameMs * 0.9 + dt * 0.1;
      this.acc += dt; this.n++;
      if (this.acc >= 500) {
        this.fps = this.n * 1000 / this.acc; this.acc = 0; this.n = 0;
        const el = $('#fps-counter');
        if (Settings.get('graphics.showFps')) { el.hidden = false; el.textContent = `${this.fps.toFixed(0)} fps · ${this.frameMs.toFixed(1)}ms`; } else el.hidden = true;
      }
    }
    this.last = now;
  },
};

/* ===== 16-screen-results.js ===== */
/* Results screen — grade, score, judgement breakdown, timing distribution & timing-over-time graphs,
 * personal-best tracking and replay actions. */

const ResultsScreen = {
  tab: 'songselect',
  enter(p) {
    this.p = p;
    const s = p.score;
    const map = BeatmapManager.mapByHash(s.mapHash);
    const el = h('div.results');
    if (map) BeatmapManager.bgURL(map).then(u => Background.set(u, { blur: Settings.get('graphics.menuBlur') + 6, dim: 0.35 }));
    const body = h('div.res-body');
    const grid = h('div.res-grid');
    const head = h('div.res-head',
      h('div', { style: { flex: '1', minWidth: '0' } },
        h('div.t', s.title), h('div.a', `${s.artist} · mapped by ${s.creator || '?'}`),
        h('div.d', `[${s.version}] · ${s.keys}K · played by ${s.player} · ${new Date(s.date).toLocaleString()}`)),
      starBadge(s.stars || 0),
      h('div.row', { style: { gap: '4px' } }, ...(s.mods || []).map(m => ModSystem.badge(m))),
      p.watched ? h('span.tag.accent', p.watched === 'auto' ? 'AUTO PLAY' : 'REPLAY') : null,
      !s.passed ? h('span.tag.warn', 'FAILED') : null);
    grid.append(head, this.gradeCard(s, p), this.rightCol(s));
    body.append(grid);
    const actions = this.actions(s, p, map);
    el.append(body, actions);
    if (p.fresh && s.passed) setTimeout(() => SkinManager.sample(s.accuracy >= 0.95 ? 'applause' : 'sectionpass').then(b => b && AudioManager.play(b, { volume: 0.6 })), 700);
    return el;
  },
  leave() { cancelAnimationFrame(this._cnt); },
  onKey(e) {
    if (e.code === 'KeyR' || (e.ctrlKey && e.code === 'KeyR')) { this.retry(); return true; }
    if (e.code === 'Enter' || e.code === 'Space') { this.retry(); return true; }
    return false;
  },
  onBack() { Screens.go('songselect', { mapId: this.p.score.mapId }, { replace: true }); return true; },
  retry() {
    const s = this.p.score;
    const map = BeatmapManager.mapByHash(s.mapHash);
    if (!map) { Toast.err('Beatmap not found', 'This beatmap is no longer in your library.'); return; }
    UISounds.click();
    Game.launch({ mapId: map.id, mods: this.p.watched === 'auto' ? s.mods : s.mods.filter(m => m !== 'AT'), mode: 'play' });
  },
  gradeCard(s, p) {
    const R = 100, C = 2 * Math.PI * R;
    const ring = h('div.res-ring');
    ring.innerHTML = `<svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="${R}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="14"/>
      <circle class="accring" cx="115" cy="115" r="${R}" fill="none" stroke="url(#rg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition: stroke-dashoffset calc(1200ms * var(--anim)) cubic-bezier(.16,1,.3,1)"/>
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9c2ff"/><stop offset=".7" stop-color="#8a4dff"/><stop offset="1" stop-color="#ffd54a"/></linearGradient></defs></svg>`;
    ring.append(gradeEl(s.grade));
    requestAnimationFrame(() => requestAnimationFrame(() => { const c = ring.querySelector('.accring'); if (c) c.style.strokeDashoffset = C * (1 - s.accuracy); }));
    const scoreEl = h('div.res-score', '0');
    const t0 = performance.now(), dur = 1100 * (Settings.get('ui.animSpeed') > 0 ? 1 / Settings.get('ui.animSpeed') : 0);
    const tick = () => {
      const k = dur ? clamp((performance.now() - t0) / dur, 0, 1) : 1;
      scoreEl.textContent = fmtScore(s.score * (1 - Math.pow(1 - k, 3)));
      if (k < 1) this._cnt = requestAnimationFrame(tick);
    };
    tick();
    const card = h('div.panel.glass.res-grade-card', ring, scoreEl);
    if (s.isPB && p.fresh) card.append(h('div.res-pb', '★ NEW PERSONAL BEST'));
    else if (s.prevBest && p.fresh && s.passed) card.append(h('div.muted', `Personal best: ${fmtScore(s.prevBest.score)} (${s.score >= s.prevBest.score ? '+' : ''}${fmtInt(s.score - s.prevBest.score)})`));
    const kv = (k, v, title) => h('div.stat', { title: title || '' }, h('div.k', k), h('div.v', v));
    card.append(h('div.res-kv',
      kv('Accuracy', fmtAcc(s.accuracy)), kv('Max combo', fmtInt(s.maxCombo) + 'x'), kv('Rate', `${s.rate || 1}×`),
      kv('Mean', `${(s.meanError || 0) >= 0 ? '+' : ''}${(s.meanError || 0).toFixed(1)}ms`, 'Average offset: positive = late'),
      kv('UR', (s.unstableRate || 0).toFixed(1), 'Unstable rate: standard deviation × 10'),
      kv('Early / Late', `${s.early || 0} / ${s.late || 0}`)));
    return card;
  },
  rightCol(s) {
    const col = h('div.res-right');
    const counts = s.counts || [0, 0, 0, 0, 0, 0];
    const total = Math.max(1, counts.reduce((a, b) => a + b, 0));
    const judge = h('div.panel.glass.res-judge', ...JUDGEMENTS.map((j, i) => {
      const bar = h('i', { style: { '--jc': j.color } });
      requestAnimationFrame(() => requestAnimationFrame(() => bar.style.width = (counts[i] / total * 100) + '%'));
      return h('div.jrow', h('div.jn', { style: { color: j.color } }, j.name), h('div.jc', fmtInt(counts[i])), h('div.jb', bar));
    }));
    col.append(judge);
    const errs = (s.hitErrors || []).filter(e => !e[3]);
    const W = (s.windows || timingWindows({ od: s.od ?? 8 })).slice();
    const hist = h('div.panel.glass.chart-card', h('h3', 'Hit distribution', h('span.grow'), h('span', `${errs.length} hits · mean ${(s.meanError || 0).toFixed(1)}ms · UR ${(s.unstableRate || 0).toFixed(1)}`)));
    const scatter = h('div.panel.glass.chart-card', h('h3', 'Timing over time', h('span.grow'), h('span', 'early ↑ · late ↓')));
    if (errs.length) {
      hist.append(Charts.histogram(errs.map(e => e[1]), W, s.meanError || 0));
      hist.append(h('div.chart-legend', h('span', { style: { '--c': 'var(--accent)' } }, 'Hits per 2ms bin (colour = judgement window)'), h('span', { style: { '--c': '#ffffff' } }, 'Centre (0ms)'), h('span', { style: { '--c': '#ffd54a' } }, 'Mean offset')));
      scatter.append(Charts.scatter(s.hitErrors, W));
      scatter.append(h('div.chart-legend', ...JUDGEMENTS.slice(0, 5).map(j => h('span', { style: { '--c': j.color } }, j.name))));
    } else {
      hist.append(h('div.empty', { style: { padding: '24px' } }, 'No timing data for this play.'));
      scatter.style.display = 'none';
    }
    col.append(hist, scatter);
    return col;
  },
  actions(s, p, map) {
    const replay = p.replay || null;
    const hasSaved = !!s.replayId || (replay && ReplayManager.list.some(r => r.id === replay.id));
    const bar = h('div.res-actions');
    const watch = h('button.btn', { onclick: () => this.watch() }, icon('film'), 'Watch replay');
    const save = h('button.btn', { onclick: async () => {
      if (!replay) return;
      await ReplayManager.save(replay);
      s.replayId = replay.id;
      Toast.ok('Replay saved', 'Find it in Replays.');
      save.disabled = true; save.textContent = 'Replay saved';
      bar.insertBefore(exp, save.nextSibling);
    } }, icon('save'), 'Save replay');
    const exp = h('button.btn.ghost', { onclick: async () => { const r = replay || await ReplayManager.get(s.replayId); if (r) ReplayManager.export(r); } }, icon('download'), 'Export .amr');
    bar.append(
      h('button.btn.ghost', { onclick: () => this.onBack() }, icon('back'), 'Back', h('span.kbd', 'Esc')),
      h('button.btn.primary', { onclick: () => this.retry(), disabled: !map }, icon('retry'), 'Retry', h('span.kbd', 'R')));
    if (replay || s.replayId) bar.append(watch);
    if (replay && !hasSaved && p.watched !== 'auto' && p.watched !== 'replay') bar.append(save);
    if (hasSaved || p.watched === 'replay') bar.append(exp);
    if (!map) bar.append(h('span.muted', 'Beatmap no longer in library'));
    bar.append(h('span.grow'), h('span.muted', { style: { fontSize: '.8rem' } }, `Accuracy mode: ${s.accuracyMode === 'v1' ? 'classic' : 'weighted'}`));
    return bar;
  },
  async watch() {
    const s = this.p.score;
    const replay = this.p.replay || (s.replayId && await ReplayManager.get(s.replayId));
    if (!replay) { Toast.err('No replay available'); return; }
    const map = BeatmapManager.mapByHash(replay.mapHash);
    if (!map) { Toast.err('Beatmap not found', 'Import the beatmap to watch this replay.'); return; }
    Game.launch({ mapId: map.id, mode: 'replay', replay, returnTo: { ...this.p } });
  },
};

/** Small canvas chart helpers with hover tooltips (single-series, thin marks, recessive grid). */
const Charts = {
  _setup(heightPx) {
    const wrap = h('div.chart-wrap');
    const cv = h('canvas', { style: { height: heightPx + 'px' } });
    const tip = h('div.chart-tip', { hidden: true });
    wrap.append(cv, tip);
    return { wrap, cv, tip };
  },
  _ctx(cv) {
    const dpr = devicePixelRatio || 1;
    const w = cv.clientWidth || 600, hh = cv.clientHeight || 160;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr);
    const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { x, w, h: hh };
  },
  _css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); },
  histogram(errs, W, mean) {
    const { wrap, cv, tip } = this._setup(170);
    const range = W[J.BAD], bin = 2;
    const nb = Math.ceil(range * 2 / bin);
    const bins = new Array(nb).fill(0);
    for (const e of errs) { const i = Math.floor((clamp(e, -range, range - 0.001) + range) / bin); bins[i]++; }
    const max = Math.max(...bins, 1);
    let geo = null;
    const draw = hover => {
      const { x, w, h: H } = this._ctx(cv);
      const pad = { l: 8, r: 8, t: 8, b: 20 };
      const pw = w - pad.l - pad.r, ph = H - pad.t - pad.b;
      const bw = pw / nb;
      geo = { pad, pw, ph, bw };
      x.strokeStyle = 'rgba(255,255,255,.06)'; x.lineWidth = 1;
      for (let k = 1; k <= 3; k++) { const y = pad.t + ph * (1 - k / 4); x.beginPath(); x.moveTo(pad.l, y); x.lineTo(w - pad.r, y); x.stroke(); }
      bins.forEach((v, i) => {
        if (!v) return;
        const c = -range + (i + 0.5) * bin;
        let j = 0; while (j < 5 && Math.abs(c) > W[j]) j++;
        const hh = Math.max(2, v / max * ph);
        x.fillStyle = JUDGEMENTS[Math.min(j, 4)].color;
        x.globalAlpha = hover === i ? 1 : 0.85;
        const bx = pad.l + i * bw + 1, bwid = Math.max(1, bw - 2);
        x.beginPath();
        x.roundRect ? x.roundRect(bx, pad.t + ph - hh, bwid, hh, [Math.min(4, bwid / 2), Math.min(4, bwid / 2), 0, 0]) : x.rect(bx, pad.t + ph - hh, bwid, hh);
        x.fill();
      });
      x.globalAlpha = 1;
      const zx = pad.l + pw / 2;
      x.fillStyle = '#fff'; x.fillRect(zx - 1, pad.t, 2, ph);
      const mx = pad.l + (mean + range) / (2 * range) * pw;
      x.fillStyle = '#ffd54a'; x.fillRect(mx - 1, pad.t, 2, ph);
      x.fillStyle = this._css('--muted') || '#999'; x.font = '700 11px Nunito, system-ui'; x.textAlign = 'center';
      x.fillText(`-${Math.round(range)}ms (early)`, pad.l + 44, H - 5); x.fillText('0', zx, H - 5); x.fillText(`+${Math.round(range)}ms (late)`, w - pad.r - 44, H - 5);
    };
    requestAnimationFrame(() => draw(-1));
    new ResizeObserver(() => draw(-1)).observe(cv);
    cv.addEventListener('pointermove', e => {
      if (!geo) return;
      const r = cv.getBoundingClientRect();
      const i = Math.floor((e.clientX - r.left - geo.pad.l) / geo.bw);
      if (i < 0 || i >= nb) { tip.hidden = true; draw(-1); return; }
      const lo = -range + i * bin;
      tip.hidden = false; tip.textContent = `${lo.toFixed(0)} to ${(lo + bin).toFixed(0)}ms: ${bins[i]} hit${bins[i] === 1 ? '' : 's'}`;
      tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
      draw(i);
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; draw(-1); });
    return wrap;
  },
  scatter(hitErrors, W) {
    const { wrap, cv, tip } = this._setup(170);
    const pts = hitErrors.filter(e => !e[3]);
    const range = W[J.BAD];
    const t0 = pts.length ? pts[0][0] : 0, t1 = pts.length ? pts[pts.length - 1][0] : 1;
    let geo = null;
    const draw = hi => {
      const { x, w, h: H } = this._ctx(cv);
      const pad = { l: 40, r: 8, t: 8, b: 8 };
      const pw = w - pad.l - pad.r, ph = H - pad.t - pad.b;
      geo = { pad, pw, ph };
      const Y = e => pad.t + ph / 2 + clamp(e, -range, range) / range * ph / 2;
      for (let j = 3; j >= 0; j--) {
        x.fillStyle = JUDGEMENTS[j].color; x.globalAlpha = 0.05;
        x.fillRect(pad.l, Y(-W[j]), pw, Y(W[j]) - Y(-W[j]));
      }
      x.globalAlpha = 1;
      x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(pad.l, Y(0) - 0.5, pw, 1);
      x.fillStyle = this._css('--muted') || '#999'; x.font = '700 10px Nunito, system-ui'; x.textAlign = 'right';
      x.fillText(`-${Math.round(range)}`, pad.l - 6, pad.t + 9); x.fillText('0', pad.l - 6, Y(0) + 3); x.fillText(`+${Math.round(range)}`, pad.l - 6, H - pad.b);
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const px = pad.l + (p[0] - t0) / Math.max(1, t1 - t0) * pw;
        x.fillStyle = JUDGEMENTS[p[2]].color;
        x.globalAlpha = hi === i ? 1 : 0.7;
        x.fillRect(px - 1.5, Y(p[1]) - 1.5, hi === i ? 5 : 3, hi === i ? 5 : 3);
      }
      x.globalAlpha = 1;
    };
    requestAnimationFrame(() => draw(-1));
    new ResizeObserver(() => draw(-1)).observe(cv);
    cv.addEventListener('pointermove', e => {
      if (!geo || !pts.length) return;
      const r = cv.getBoundingClientRect();
      const t = t0 + (e.clientX - r.left - geo.pad.l) / geo.pw * (t1 - t0);
      let best = 0, bd = Infinity;
      for (let i = 0; i < pts.length; i++) { const d = Math.abs(pts[i][0] - t); if (d < bd) { bd = d; best = i; } }
      const p = pts[best];
      tip.hidden = false; tip.textContent = `${fmtTime(p[0])} · ${p[1] > 0 ? '+' : ''}${p[1]}ms · ${JUDGEMENTS[p[2]].name}`;
      tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
      draw(best);
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; draw(-1); });
    return wrap;
  },
  /** Vertical bars over categories (stats page). data: [{label, value, tip}] */
  bars(data, { height = 180, color = null } = {}) {
    const { wrap, cv, tip } = this._setup(height);
    let geo = null;
    const draw = hi => {
      const { x, w, h: H } = this._ctx(cv);
      const pad = { l: 34, r: 6, t: 10, b: 22 };
      const pw = w - pad.l - pad.r, ph = H - pad.t - pad.b;
      const intData = data.every(d => Number.isInteger(d.value));
      let max = Math.max(1, ...data.map(d => d.value));
      if (intData) max = Math.max(4, Math.ceil(max / 4) * 4);
      const bw = pw / data.length;
      const maxBar = 56;
      geo = { pad, pw, ph, bw };
      x.strokeStyle = 'rgba(255,255,255,.06)'; x.fillStyle = this._css('--muted') || '#999'; x.font = '700 10px Nunito, system-ui'; x.textAlign = 'right';
      for (let k = 0; k <= 4; k++) {
        const y = pad.t + ph * (1 - k / 4);
        x.beginPath(); x.moveTo(pad.l, y); x.lineTo(w - pad.r, y); x.stroke();
        x.fillText(intData ? fmtInt(max * k / 4) : String(Math.round(max * k / 4 * 10) / 10), pad.l - 5, y + 3);
      }
      const col = color || this._css('--accent') || '#b07cff';
      data.forEach((d, i) => {
        const hh = d.value / max * ph;
        const bwid = Math.max(1, Math.min(maxBar, bw - 2)), bx = pad.l + i * bw + (bw - bwid) / 2;
        x.fillStyle = d.color || col; x.globalAlpha = hi === i ? 1 : 0.82;
        if (hh > 0) { x.beginPath(); x.roundRect ? x.roundRect(bx, pad.t + ph - hh, bwid, hh, [Math.min(4, bwid / 2), Math.min(4, bwid / 2), 0, 0]) : x.rect(bx, pad.t + ph - hh, bwid, hh); x.fill(); }
      });
      x.globalAlpha = 1; x.textAlign = 'center'; x.fillStyle = this._css('--muted') || '#999';
      const every = Math.ceil(data.length / 10);
      data.forEach((d, i) => { if (i % every === 0 || data.length <= 12) x.fillText(d.label, pad.l + (i + 0.5) * bw, H - 6); });
    };
    requestAnimationFrame(() => draw(-1));
    new ResizeObserver(() => draw(-1)).observe(cv);
    cv.addEventListener('pointermove', e => {
      if (!geo) return;
      const r = cv.getBoundingClientRect();
      const i = Math.floor((e.clientX - r.left - geo.pad.l) / geo.bw);
      if (i < 0 || i >= data.length) { tip.hidden = true; draw(-1); return; }
      tip.hidden = false; tip.textContent = data[i].tip || `${data[i].label}: ${data[i].value}`;
      tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
      draw(i);
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; draw(-1); });
    return wrap;
  },
  /** Line chart (single series). pts: [{x, y, tip}] */
  line(pts, { height = 180, yMin = null, yMax = null, fmtY = v => v } = {}) {
    const { wrap, cv, tip } = this._setup(height);
    let geo = null;
    const draw = hi => {
      const { x, w, h: H } = this._ctx(cv);
      const pad = { l: 46, r: 10, t: 10, b: 10 };
      const pw = w - pad.l - pad.r, ph = H - pad.t - pad.b;
      const ys = pts.map(p => p.y);
      const lo = yMin ?? Math.min(...ys), hi2 = yMax ?? Math.max(...ys);
      const span = Math.max(1e-6, hi2 - lo);
      const X = i => pad.l + (pts.length < 2 ? pw / 2 : i / (pts.length - 1) * pw);
      const Y = v => pad.t + ph * (1 - (v - lo) / span);
      geo = { pad, pw, X };
      x.strokeStyle = 'rgba(255,255,255,.06)'; x.fillStyle = this._css('--muted') || '#999'; x.font = '700 10px Nunito, system-ui'; x.textAlign = 'right';
      for (let k = 0; k <= 4; k++) { const v = lo + span * k / 4, y = Y(v); x.beginPath(); x.moveTo(pad.l, y); x.lineTo(w - pad.r, y); x.stroke(); x.fillText(fmtY(v), pad.l - 5, y + 3); }
      const acc = this._css('--accent') || '#b07cff';
      x.strokeStyle = acc; x.lineWidth = 2; x.lineJoin = 'round'; x.beginPath();
      pts.forEach((p, i) => i ? x.lineTo(X(i), Y(p.y)) : x.moveTo(X(i), Y(p.y))); x.stroke();
      pts.forEach((p, i) => {
        x.fillStyle = this._css('--panel-solid') || '#111'; x.beginPath(); x.arc(X(i), Y(p.y), hi === i ? 6 : 4, 0, Math.PI * 2); x.fill();
        x.fillStyle = acc; x.beginPath(); x.arc(X(i), Y(p.y), hi === i ? 4.5 : 3, 0, Math.PI * 2); x.fill();
      });
    };
    requestAnimationFrame(() => draw(-1));
    new ResizeObserver(() => draw(-1)).observe(cv);
    cv.addEventListener('pointermove', e => {
      if (!geo || !pts.length) return;
      const r = cv.getBoundingClientRect(), mx = e.clientX - r.left;
      let best = 0, bd = Infinity;
      pts.forEach((p, i) => { const d = Math.abs(geo.X(i) - mx); if (d < bd) { bd = d; best = i; } });
      tip.hidden = false; tip.textContent = pts[best].tip;
      tip.style.left = geo.X(best) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
      draw(best);
    });
    cv.addEventListener('pointerleave', () => { tip.hidden = true; draw(-1); });
    return wrap;
  },
};

function pageShell(title, sub, actions = []) {
  const body = h('div.screen-body');
  const page = h('div.page');
  page.append(h('div.screen-title', h('div', h('h1', title), sub ? h('div.sub', sub) : null), h('div.grow'), ...actions));
  body.append(page);
  return { el: h('div', body), page };
}

async function importViaPicker(accept, directory = false) {
  const files = await pickFiles({ accept, multiple: true, directory });
  if (files.length) await App.importFiles(files);
}

class SkinPreview {
  constructor(canvas) { this.canvas = canvas; this.renderer = new ManiaRenderer(canvas); this.running = false; }
  async show(skin, keys) {
    this.token = {};
    const tok = this.token;
    const layout = await skin.mania(keys);
    if (tok !== this.token) return;
    this.keys = keys;
    this.renderer.setLayout(layout);
    // demo pattern: stairs, chords, jacks and long notes
    const notes = [];
    let t = 800;
    for (let bar = 0; bar < 6; bar++) {
      for (let i = 0; i < keys; i++) notes.push({ col: i, time: t + i * 110, end: t + i * 110, isLN: false });
      t += keys * 110 + 150;
      notes.push({ col: 0, time: t, end: t + 700, isLN: true }, { col: keys - 1, time: t + 200, end: t + 900, isLN: true });
      if (keys > 2) notes.push({ col: Math.floor(keys / 2), time: t + 350, end: t + 350, isLN: false }, { col: Math.floor(keys / 2) - (keys > 3 ? 1 : 0), time: t + 350, end: t + 350, isLN: false });
      t += 1100;
    }
    notes.sort((a, b) => a.time - b.time || a.col - b.col);
    const fixed = [];
    const last = new Array(keys).fill(-1e9);
    for (const n of notes) { if (n.time <= last[n.col] + 30) continue; last[n.col] = n.end; fixed.push(n); }
    this.notes = fixed; this.end = t + 500;
    this.reset();
    if (!this.running) { this.running = true; this.loop(); }
  }
  reset() {
    this.engine = new GameplayEngine({ notes: this.notes, keys: this.keys, windows: timingWindows({ od: 8 }), noFail: true });
    this.engine.onEvent(e => { if (e.type === 'judgement') this.renderer.onJudgement(e, performance.now()); });
    this.feed = generateAutoInputs(this.engine.notes, this.keys);
    this.fi = 0; this.held = new Array(this.keys).fill(false); this.t0 = performance.now();
  }
  loop() {
    const frame = () => {
      if (!this.running) return;
      this._raf = requestAnimationFrame(frame);
      if (!this.engine) return;
      const now = performance.now() - this.t0;
      if (now > this.end) { this.reset(); return; }
      while (this.fi < this.feed.length && this.feed[this.fi][0] <= now) {
        const [tt, c, d] = this.feed[this.fi++];
        this.held[c] = !!d; if (!d) this.renderer.onRelease(c, performance.now());
        this.engine.input(c, !!d, tt);
      }
      this.engine.advance(now);
      this.renderer.render({ now, posNow: now, scroll: { pos: t => t, posAt: t => t }, pxPerMs: this.renderer.hitY / 520, engine: this.engine, held: this.held, barlines: null, hidden: null, realNow: performance.now() });
    };
    frame();
  }
  stop() { this.running = false; cancelAnimationFrame(this._raf); }
}

    const nav = h('div.sp-nav', ...sections.map(sec => h('button.icon-btn', { title: sec, 'aria-label': sec, dataset: { sec }, onclick: () => this.scrollTo(sec) }, icon(SECTION_ICONS[sec] || 'gear'))));
    const search = h('input.input.sp-search', { type: 'search', placeholder: 'Search settings…', 'aria-label': 'Search settings' });
    const scroll = h('div.sp-scroll');
    const panel = h('div.settings-panel', { role: 'dialog', 'aria-label': 'Settings' }, nav,
      h('div.sp-main', h('div.sp-head', h('div.row', h('h2', 'Settings'), h('span.grow'), h('button.icon-btn', { title: 'Close (Esc)', onclick: () => this.close() }, icon('x'))),
        h('div.sub', 'Changes apply instantly and are saved locally.'), search), scroll));
    this.scrollEl = scroll; this.nav = nav;
    this.build('');
    search.addEventListener('input', () => this.build(search.value.trim().toLowerCase()));
    search.addEventListener('keydown', e => { if (e.key !== 'Escape') e.stopPropagation(); });
    scroll.addEventListener('scroll', () => this.syncNav());
    this.o = makeOverlay(panel, { onClose: () => { this.o = null; KeyConfig.stop(); } });
    if (section) requestAnimationFrame(() => this.scrollTo(section));
  },
  close() { if (this.o) { UISounds.back(); this.o.close(); } },
  scrollTo(sec) {
    const el = this.scrollEl && this.scrollEl.querySelector(`[data-section="${sec}"]`);
    if (el) this.scrollEl.scrollTo({ top: el.offsetTop - 8, behavior: 'smooth' });
  },
  syncNav() {
    const secs = $$('.sp-section', this.scrollEl);
    let cur = secs[0]?.dataset.section;
    for (const s of secs) if (s.offsetTop - this.scrollEl.scrollTop < 80) cur = s.dataset.section;
    $$('[data-sec]', this.nav).forEach(b => b.classList.toggle('active', b.dataset.sec === cur));
  },
  build(q) {
    this.q = q;
    const scroll = this.scrollEl;
    clearEl(scroll);
    const bySec = new Map();
    for (const it of SETTINGS_SCHEMA) {
      if (!it.s) continue;
      if (q && !(`${it.s} ${it.g} ${it.l} ${it.hint || ''}`.toLowerCase().includes(q))) continue;
      if (!bySec.has(it.s)) bySec.set(it.s, new Map());
      const g = bySec.get(it.s);
      if (!g.has(it.g)) g.set(it.g, []);
      g.get(it.g).push(it);
    }
    for (const [sec, groups] of bySec) {
      const secEl = h('div.sp-section', { dataset: { section: sec } }, h('h3', icon(SECTION_ICONS[sec] || 'gear'), sec));
      for (const [g, items] of groups) {
        secEl.append(h('div.sp-group', g));
        for (const it of items) secEl.append(this.row(it));
      }
      scroll.append(secEl);
    }
    if (!bySec.size) scroll.append(h('div.empty', 'No settings match your search.'));
    scroll.append(h('div.sp-footer', `${APP_NAME} v${APP_VERSION} · local-first, no account needed `,
      h('span.neru-mark', { title: 'tuned with a little yellow', onclick: e => { neruSparkBurst(e.target, 6); } }, '✦')));
    this.syncNav();
  },
  row(it) {
    const val = () => Settings.get(it.k);
    const isDefault = () => JSON.stringify(Settings.get(it.k)) === JSON.stringify(it.d);
    const reset = h('button.icon-btn.reset', { title: 'Reset to default', onclick: () => { Settings.set(it.k, structuredClone(it.d)); rebuild(); } }, icon('retry'));
    const updReset = () => reset.classList.toggle('show', !isDefault());
    const lbl = h('div.lbl', it.l, it.hint ? h('div.hint', it.hint) : null);
    let row;
    const rebuild = () => { const n = this.row(it); row.replaceWith(n); };
    if (it.when && !it.when()) return h('div', { hidden: true });
    switch (it.t) {
      case 'bool': {
        const t = h(`button.toggle${val() ? '.on' : ''}`, { role: 'switch', 'aria-checked': String(!!val()), 'aria-label': it.l, onclick: () => {
          const v = !val(); Settings.set(it.k, v); t.classList.toggle('on', v); t.setAttribute('aria-checked', String(v)); UISounds.play(v ? 'check-on' : 'check-off'); updReset();
        } });
        row = h('div.set-row', lbl, h('div.ctl', reset, t));
        break;
      }
      case 'range': {
        const s = h('input.slider', { type: 'range', min: it.min, max: it.max, step: it.step, value: val(), 'aria-label': it.l });
        const v = h('span.val');
        const upd = () => { const x = parseFloat(s.value); v.textContent = it.fmt ? it.fmt(x) : x; s.style.setProperty('--p', ((x - it.min) / (it.max - it.min) * 100) + '%'); };
        s.addEventListener('input', () => { Settings.set(it.k, parseFloat(s.value)); upd(); updReset(); });
        s.addEventListener('keydown', e => e.stopPropagation());
        upd();
        row = h('div.set-row.col', h('div.row', lbl, v, reset), h('div.ctl', s,
          it.calibrate ? h('button.btn.sm', { onclick: () => Calibration.open() }, 'Calibrate') : null));
        break;
      }
      case 'select': {
        const sel = h('select.select', { 'aria-label': it.l }, ...it.o.map(([k, l]) => h('option', { value: k, selected: String(val()) === String(k) }, l)));
        sel.addEventListener('change', () => {
          Settings.set(it.k, it.num ? Number(sel.value) : sel.value); UISounds.click(); updReset();
          if (SETTINGS_SCHEMA.some(x => x.when && x.s === it.s)) { const st = this.scrollEl.scrollTop; this.build(this.q || ''); this.scrollEl.scrollTop = st; }
        });
        row = h('div.set-row', lbl, h('div.ctl', reset, sel));
        break;
      }
      case 'text': {
        const inp = h('input.input', { value: val(), style: { width: '100%' } });
        inp.addEventListener('change', () => { Settings.set(it.k, inp.value); updReset(); });
        inp.addEventListener('keydown', e => e.stopPropagation());
        row = h('div.set-row.col', h('div.row', lbl, reset), h('div.ctl', inp));
        break;
      }
      case 'keybinds': row = h('div.set-row.col', lbl, KeyConfig.build()); break;
      case 'skin': {
        const sel = h('select.select', { 'aria-label': 'Skin' }, ...SkinManager.list().map(s => h('option', { value: s.id, selected: s.id === SkinManager.current.id }, s.name)));
        sel.addEventListener('change', async () => { await SkinManager.select(sel.value); Toast.ok('Skin selected', SkinManager.current.name); });
        row = h('div.set-row', lbl, h('div.ctl', sel, h('button.btn.sm', { onclick: () => { this.close(); Screens.go('skins'); } }, 'Browse')));
        break;
      }
      case 'data': row = h('div.set-row.col', lbl, DataPanel.build()); break;
      default: row = h('div');
    }
    updReset();
    return row;
  },
};

// ─────────────────────────────── Key configuration ───────────────────────────────
const KeyConfig = {
  keys: 4, listening: null, addMode: false, root: null,
  build() {
    const root = h('div.keycfg');
    this.root = root;
    this.render();
    return root;
  },
  stop() {
    if (this._kd) { window.removeEventListener('keydown', this._kd, true); window.removeEventListener('keyup', this._ku, true); this._kd = null; }
    this.listening = null;
  },
  render() {
    const root = this.root;
    if (!root) return;
    clearEl(root);
    const binds = Settings.keybinds(this.keys);
    // conflicts: same code used by more than one lane
    const count = new Map();
    binds.forEach(codes => codes.forEach(c => count.set(c, (count.get(c) || 0) + 1)));
    const conflicts = new Set([...count].filter(([, n]) => n > 1).map(([c]) => c));
    const types = maniaColumnTypes(this.keys);
    root.append(h('div.keycfg-modes', ...Array.from({ length: MAX_KEYS }, (_, i) => i + 1).map(k => h(`button.chip${k === this.keys ? '.on' : ''}`, { onclick: () => { this.keys = k; this.listening = null; this.render(); } }, `${k}K`))));
    const lanes = h('div.keycfg-lanes');
    binds.forEach((codes, i) => {
      const lane = h(`button.lane-key${this.listening === i ? '.listening' : ''}${codes.some(c => conflicts.has(c)) ? '.conflict' : ''}${types[i] === 'S' ? '.special' : ''}`, {
        dataset: { lane: i }, title: 'Click: rebind · Right-click / Shift+click: add an extra key',
        onclick: e => { this.listen(i, e.shiftKey); },
        oncontextmenu: e => { e.preventDefault(); this.listen(i, true); },
      }, h('span.ln', String(i + 1)), this.listening === i ? '…' : keyLabel(codes[0]), codes.length > 1 ? h('span.alt', codes.slice(1).map(keyLabel).join(' ')) : null);
      lanes.append(lane);
    });
    root.append(lanes);
    let help = this.listening !== null
      ? `Press a key for lane ${this.listening + 1}${this.addMode ? ' (adding an extra binding)' : ''} · Backspace clears extras · Esc cancels`
      : 'Click a lane, then press a key. Shift+click or right-click to add multiple keys to one lane.';
    const warn = conflicts.size ? `Conflict: ${[...conflicts].map(keyLabel).join(', ')} bound to multiple lanes.` : '';
    root.append(h(`div.keycfg-help${warn ? '.warn' : ''}`, warn || help));
    root.append(h('div.row', { style: { justifyContent: 'center' } },
      h('button.btn.sm', { onclick: () => { Settings.setKeybinds(this.keys, structuredClone(DEFAULT_KEYBINDS[this.keys])); this.render(); } }, `Reset ${this.keys}K`),
      h('button.btn.sm.ghost', { onclick: async () => { if (await Dialog.confirm('Reset all keybinds?', 'Every key mode goes back to its default layout.')) { Settings.set('input.keybinds', structuredClone(DEFAULT_KEYBINDS)); this.render(); } } }, 'Reset all')));
    this.attach();
  },
  listen(i, add) { this.listening = i; this.addMode = add; UISounds.click(); this.render(); },
  attach() {
    if (this._kd) return;
    this._kd = e => {
      if (!this.root || !this.root.isConnected) { this.stop(); return; }
      const binds = Settings.keybinds(this.keys);
      // visualization
      binds.forEach((codes, i) => { if (codes.includes(e.code)) this.root.querySelector(`[data-lane="${i}"]`)?.classList.add('pressed'); });
      if (this.listening === null) return;
      e.preventDefault(); e.stopPropagation();
      if (e.code === 'Escape') { this.listening = null; this.render(); return; }
      const lane = this.listening;
      if (e.code === 'Backspace') { binds[lane] = binds[lane].slice(0, 1); }
      else if (e.code === 'Backquote') { Toast.show('That key is reserved', 'Hold ` to quick-retry during gameplay.'); return; }
      else if (this.addMode) { if (!binds[lane].includes(e.code)) binds[lane].push(e.code); }
      else binds[lane] = [e.code, ...binds[lane].slice(1).filter(c => c !== e.code)];
      Settings.setKeybinds(this.keys, binds);
      UISounds.play('check-on');
      this.listening = lane + 1 < this.keys && !this.addMode ? lane + 1 : null;
      this.render();
    };
    this._ku = e => {
      if (!this.root) return;
      const binds = Settings.keybinds(this.keys);
      binds.forEach((codes, i) => { if (codes.includes(e.code)) this.root.querySelector(`[data-lane="${i}"]`)?.classList.remove('pressed'); });
    };
    window.addEventListener('keydown', this._kd, true);
    window.addEventListener('keyup', this._ku, true);
  },
};

// ─────────────────────────────── Offset calibration ───────────────────────────────
const Calibration = {
  open() {
    AudioManager.resume();
    const beat = h('div.calib-beat', 'TAP');
    const info = h('div.muted', 'Tap Space (or click) in time with the clicks. 16 taps are averaged.');
    const res = h('div', { style: { fontWeight: 900, fontSize: '1.2rem', minHeight: '1.5em' } });
    const body = h('div.calib', beat, info, res);
    const BPM = 120, period = 60 / BPM;
    const ctx = AudioManager.ctx;
    const click = AudioManager.synth('click-short-confirm');
    const start = ctx.currentTime + 0.5;
    let n = 0, stopped = false;
    const errs = [];
    const schedule = () => {
      if (stopped) return;
      while (start + n * period < ctx.currentTime + 0.3) {
        AudioManager.play(click, { when: start + n * period, volume: 1.2 });
        const tBeat = start + n * period;
        setTimeout(() => { beat.classList.add('on'); setTimeout(() => beat.classList.remove('on'), 90); }, Math.max(0, (tBeat - AudioManager.now()) * 1000));
        n++;
      }
      setTimeout(schedule, 60);
    };
    schedule();
    const tap = ts => {
      const t = AudioManager.perfToCtx(ts);
      const k = Math.round((t - start) / period);
      if (k < 1) return;
      errs.push((t - (start + k * period)) * 1000);
      const recent = errs.slice(-16);
      const mean = recent.reduce((a, b) => a + b, 0) / recent.length;
      res.textContent = `${recent.length} taps · average ${mean >= 0 ? '+' : ''}${mean.toFixed(1)}ms`;
      this.suggest = Math.round(mean);
    };
    const kd = e => { if (e.code === 'Space') { e.preventDefault(); e.stopPropagation(); if (!e.repeat) tap(e.timeStamp); } };
    window.addEventListener('keydown', kd, true);
    beat.addEventListener('pointerdown', e => tap(e.timeStamp));
    const o = Dialog.custom('Audio offset calibration', body, [
      { label: 'Cancel' },
      { label: 'Apply', primary: true, onClick: () => { if (this.suggest != null) { Settings.set('audio.offset', clamp(this.suggest, -300, 300)); Toast.ok('Offset applied', `${this.suggest}ms`); if (SettingsPanel.o) SettingsPanel.build(''); } } },
    ]);
    const origClose = o.close;
    o.close = () => { stopped = true; window.removeEventListener('keydown', kd, true); origClose(); };
  },
};

/* ===== 19-multiplayer.js ===== */
/* Multiplayer architecture (not exposed in the UI yet — no server exists).
 * The state model is transport-agnostic so a WebSocket/WebRTC transport can be dropped in later
 * without touching single-player code. Gameplay already produces everything a room needs:
 * deterministic input streams (replays) and per-judgement score updates. */

const RoomState = { OPEN: 'open', COUNTDOWN: 'countdown', PLAYING: 'playing', RESULTS: 'results' };

class MultiplayerTransport {
  /** @param {(msg:object)=>void} onMessage */
  connect(onMessage) { throw new Error('No multiplayer transport configured'); }
  send(msg) { throw new Error('not connected'); }
  close() {}
}

class MultiplayerRoom extends Emitter {
  constructor({ id, name, host, transport }) {
    super();
    this.id = id; this.name = name; this.hostId = host;
    this.transport = transport;
    this.state = RoomState.OPEN;
    this.players = new Map();     // id -> {id, name, ready, spectating, score, accuracy, combo, health, finished}
    this.map = null;              // {hash, title, version}
    this.mods = [];
    this.countdownEnd = 0;        // shared wall-clock (ms) at which audio starts
  }
  join(player) { this.players.set(player.id, { ready: false, spectating: false, score: 0, accuracy: 1, combo: 0, health: 1, finished: false, ...player }); this.emit('players'); }
  leave(id) { this.players.delete(id); if (id === this.hostId) this.hostId = this.players.keys().next().value || null; this.emit('players'); }
  setReady(id, ready) { const p = this.players.get(id); if (p) { p.ready = ready; this.emit('players'); } }
  setSpectating(id, v) { const p = this.players.get(id); if (p) { p.spectating = v; this.emit('players'); } }
  selectMap(map, mods = []) { this.map = map; this.mods = mods; for (const p of this.players.values()) p.ready = false; this.emit('map'); }
  get allReady() { const act = [...this.players.values()].filter(p => !p.spectating); return act.length > 0 && act.every(p => p.ready); }
  /** Host starts a synchronized countdown; every client schedules Music.play relative to countdownEnd. */
  startCountdown(ms = 5000, now = Date.now()) {
    if (!this.allReady) return false;
    this.state = RoomState.COUNTDOWN; this.countdownEnd = now + ms; this.emit('countdown', this.countdownEnd);
    return true;
  }
  begin() { this.state = RoomState.PLAYING; for (const p of this.players.values()) { p.finished = false; p.score = 0; } this.emit('start'); }
  /** Live score update (from GameplayEngine judgements) — used for the in-game scoreboard. */
  updateScore(id, { score, accuracy, combo, health }) {
    const p = this.players.get(id); if (!p) return;
    Object.assign(p, { score, accuracy, combo, health }); this.emit('scores', this.scoreboard());
  }
  finish(id, result) { const p = this.players.get(id); if (p) { p.finished = true; p.result = result; } if ([...this.players.values()].every(x => x.spectating || x.finished)) { this.state = RoomState.RESULTS; this.emit('results', this.scoreboard()); } }
  scoreboard() { return [...this.players.values()].filter(p => !p.spectating).sort((a, b) => b.score - a.score); }
  /** Spectating: a spectator receives the player's input events and feeds them into a replay-mode GameplayEngine. */
  relayInputs(id, events) { this.emit('inputs', { id, events }); }
}

    Screens.register('stats', StatsScreen);
    Screens.register('replays', ReplaysScreen);
    Screens.register('skins', SkinsScreen);
    this.bindGlobal();
    await Screens.go('home');
    await sleep(250);
    $('#loading-screen').classList.add('done');
    this.globalLoop();
    Bus.on('profile:changed', () => Toolbar.updateProfile());
    Bus.on('skin:changed', s => Toast.show('Skin changed', s.name));
    window.AshtonkMania = { App, DB, Settings, BeatmapManager, SkinManager, ScoreManager, ReplayManager, Music, AudioManager, Screens, GameplayScreen, SongSelect, BeatmapParser, Collections, Favorites };
  },

  /** First launch: a skin placed next to index.html (skins/default.osk or skins/Kori 3.0.osk) is installed and
   *  selected automatically, so a local copy of the client can ship with its gameplay skin preinstalled. */
  async installBundledSkin(say) {
    if (SkinManager.skins.length || !/^https?:/.test(location.protocol)) return;
    for (const name of ['skins/default.osk', 'skins/Kori 3.0.osk', 'skins/kori.osk']) {
      try {
        const r = await fetch(encodeURI(name), { cache: 'no-store' });
        if (!r.ok) continue;
        say('Installing bundled skin…');
        const meta = await SkinManager.importOsk(new File([await r.blob()], name.split('/').pop()));
        await SkinManager.select(meta.id, { silent: true });
        return;
      } catch (e) { /* not bundled */ }
    }
  },

  bindGlobal() {
    const resume = () => AudioManager.resume();
    window.addEventListener('pointerdown', resume, { capture: true });
    window.addEventListener('keydown', resume, { capture: true });
    window.addEventListener('pointermove', e => Background.parallax(e), { passive: true });
    window.addEventListener('keydown', e => this.onKey(e));
    window.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea')) e.preventDefault(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && Screens.current === GameplayScreen) GameplayScreen.pause(); });
    // hover sounds for all buttons
    document.addEventListener('pointerover', e => { const b = e.target.closest && e.target.closest('.btn, .chip, .tb-btn, .side-item, .lb-row, .list-row button'); if (b && !b.contains(e.relatedTarget)) UISounds.hover(); });
    // drag & drop
    let depth = 0;
    const ov = $('#drop-overlay');
    const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
    window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; ov.classList.add('show'); });
    window.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) ov.classList.remove('show'); });
    window.addEventListener('drop', async e => {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0; ov.classList.remove('show');
      if (Screens.current === GameplayScreen && GameplayScreen.s && GameplayScreen.s.running) { Toast.show('Finish or pause your play before importing'); return; }
      const files = await filesFromDataTransfer(e.dataTransfer);
      this.importFiles(files);
    });
  },

  neruBuf: '',
  onKey(e) {
    const top = Overlays.top();
    if (top) {
      if (top.onKey && top.onKey(e)) { e.preventDefault(); return; }
      if (e.key === 'Escape') { e.preventDefault(); top.close(); return; }
      if (e.target.closest && e.target.closest('input, textarea, select')) return;
    }
    // global shortcuts
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyO') { e.preventDefault(); SettingsPanel.toggle(); return; }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyD') { e.preventDefault(); const v = !Settings.get('debug.overlay'); Settings.set('debug.overlay', v); Toast.show(v ? 'Debug overlay enabled' : 'Debug overlay disabled', 'Ctrl+Shift+D'); return; }
    if (e.altKey && e.code === 'Enter') { e.preventDefault(); toggleFullscreen(); return; }
    if (Screens.current === GameplayScreen) return; // gameplay handles its own input (capture listener)
    if (top) return;
    const inField = e.target.closest && e.target.closest('input, textarea, select');
    if (!inField && e.key.length === 1) {
      this.neruBuf = (this.neruBuf + e.key.toLowerCase()).slice(-4);
      if (this.neruBuf === 'neru') { this.neruBuf = ''; this.neruEgg(); }
    }
    if (Screens.current && Screens.current.onKey && Screens.current.onKey(e)) { e.preventDefault(); return; }
    if (inField) return;
    if (e.key === 'Escape') { e.preventDefault(); Screens.back(); return; }
  },

  neruEgg() {
    neruSparkBurst(document.querySelector('.tb-logo') || document.body, 16);
    UISounds.play('neru-chime');
    const found = localStorage.getItem('am.neru') === '1';
    try { localStorage.setItem('am.neru', '1'); } catch (e) { /* ignore */ }
    Toast.show(found ? '✦ Neru waves again.' : '✦ Neru was here.', found ? 'Still yellow. Still texting.' : 'Unlocked hint: try the Neru theme (Settings → Interface) and the Neru avatar in your profile.', { type: 'neru', timeout: 6000 });
  },

  async importFiles(files) {
    if (!files || !files.length) return;
    await AudioManager.resume();
    const pill = h('div.import-pill', h('span.spinner'), h('span', 'Importing…'));
    $('#app').appendChild(pill);
    const off = Bus.on('import:status', m => { if (m) pill.lastChild.textContent = m; });
    let report;
    try { report = await BeatmapManager.importFiles(files); }
    catch (e) { report = { sets: [], skins: [], replays: [], errors: [e.message], warnings: [] }; }
    finally { off(); pill.remove(); }
    this.lastReport = report;
    Bus.emit('import:report', report);
    const parts = [];
    if (report.sets.length) parts.push(`${report.sets.length} beatmap set${report.sets.length === 1 ? '' : 's'} (${report.sets.reduce((a, s) => a + s.maps.length, 0)} difficulties)`);
    if (report.skins.length) parts.push(`skin ${report.skins.map(s => s.name).join(', ')}`);
    if (report.replays.length) parts.push(`${report.replays.length} replay${report.replays.length === 1 ? '' : 's'}`);
    if (report.data) parts.push('data backup');
    if (parts.length) Toast.ok('Imported ' + parts.join(', '), report.warnings.length ? `${report.warnings.length} difficult${report.warnings.length === 1 ? 'y' : 'ies'} can't be played — see Beatmaps.` : '');
    if (report.errors.length) Toast.err(`Import problem${report.errors.length === 1 ? '' : 's'}`, report.errors.slice(0, 6).join('\n') + (report.errors.length > 6 ? `\n…and ${report.errors.length - 6} more` : ''));
    if (report.skins.length) await SkinManager.select(report.skins[report.skins.length - 1].id);
    if (report.data) Toolbar.updateProfile();
    const firstSet = report.sets.find(s => s.maps.some(m => !m.problems.length));
    if (firstSet) {
      const map = firstSet.maps.find(m => !m.problems.length);
      SongSelect.selectedId = map.id;
      Settings.set('last.map', map.id);
      if (Screens.currentName === 'songselect') SongSelect.select(map.id);
      else if (Screens.currentName === 'home') Screens.go('songselect', { mapId: map.id }, { transition: 'zoom' });
    }
    return report;
  },

  globalLoop() {
    const dbg = h('div.debug-overlay', { hidden: true });
    $('#app').appendChild(dbg);
    let lastDbg = 0;
    const tick = now => {
      requestAnimationFrame(tick);
      if (Screens.current === GameplayScreen) { dbg.hidden = true; return; }
      FPS.frame(now);
      const on = Settings.get('debug.overlay');
      dbg.hidden = !on;
      if (on && now - lastDbg > 250) {
        lastDbg = now;
        const ctx = AudioManager.ctx;
        dbg.textContent =
`ASHTONK!MANIA DEBUG  (Ctrl+Shift+D)
Screen       ${Screens.currentName}
FPS          ${FPS.fps.toFixed(0)} (${FPS.frameMs.toFixed(2)}ms)
Audio        ${ctx ? ctx.state : 'n/a'} · ${ctx ? ctx.sampleRate + 'Hz' : ''} · out ${ctx ? ((ctx.outputLatency || ctx.baseLatency || 0) * 1000).toFixed(1) : 0}ms
Music        ${Music.playing ? 'playing' : 'stopped'} @ ${Music.time.toFixed(0)}ms / ${Music.duration.toFixed(0)}ms
Library      ${BeatmapManager.sets.length} sets · ${BeatmapManager.maps.size} diffs
Scores       ${ScoreManager.scores.length} · replays ${ReplayManager.list.length}
Skin         ${SkinManager.current.name}${SkinManager.prefer2x() ? ' (@2x)' : ''}
DPR          ${devicePixelRatio} · ${innerWidth}×${innerHeight}
Memory       ${performance.memory ? fmtBytes(performance.memory.usedJSHeapSize) : 'n/a'}`;
      }
    };
    requestAnimationFrame(tick);
  },
};

window.addEventListener('DOMContentLoaded', () => App.boot());

</script>
</body>
</html>
