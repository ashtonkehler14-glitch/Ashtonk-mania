.ex-set-diff { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 8px; border-radius: 8px; border: 0; background: rgba(255, 255, 255, .05); color: var(--text-2); font-size: .76rem; font-weight: 700; transition: background var(--t-fast), color var(--t-fast), box-shadow var(--t-fast); }
.ex-set-diff i { width: 8px; height: 18px; border-radius: 4px; background: var(--sc); }
.ex-set-diff:hover { background: rgba(255, 255, 255, .1); color: var(--text); }
.ex-set-diff.on { background: rgba(255, 255, 255, .14); color: var(--text); box-shadow: inset 0 -2px 0 var(--sc); }
.ex-set-body { padding: 16px 26px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 28px; }
.ex-set-dname { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 1.1rem; }
.ex-set-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
.ex-set-stats > div { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: rgba(0, 0, 0, .25); }
.ex-set-stats .i { grid-row: 1 / 3; width: 20px; height: 20px; color: var(--accent-3); }
.ex-set-stats span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.ex-set-stats b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.ex-set-attrs { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.ex-attr { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-size: .82rem; }
.ex-attr span { color: var(--text-2); }
.ex-attr .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.ex-attr .bar i { display: block; height: 100%; border-radius: inherit; background: #fff; transition: width var(--t-med) var(--ease-out); }
.ex-attr:last-child .bar i { background: #ffd966; }
.ex-attr b { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 700px) { .ex-set-body { grid-template-columns: 1fr; } .ex-set-t { font-size: 1.35rem; } }
.ex-status { padding: 18px 0 30px; text-align: center; }
.ex-loading { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; color: var(--text-2); }
.ex-error { text-align: left; padding: 16px 18px; border-color: rgba(255, 74, 92, .45); max-width: 760px; margin: 0 auto; }
.ex-error pre { white-space: pre-wrap; color: var(--text-2); font-size: .8rem; margin: 8px 0 0; }
.ex-error .ex-retry { margin-top: 12px; }
.ex-error p { margin: 8px 0 0; color: var(--text-2); }
.ex-error details { margin-top: 10px; font-size: .8rem; color: var(--text-3, var(--text-2)); }
.ex-error summary { cursor: pointer; }
.ex-source { font-size: .8rem; }
.ex-sentinel { height: 1px; }

/* ── mod config / gameplay extras */
.gp-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
.gp-video.on { display: block; }
.gp-hud.hidden-hud > *:not(.hud-replay) { visibility: hidden; }


/* ── back button (osu!lazer: pink, slanted, bottom-left) */
.lz-back { --c: var(--accent); position: relative; height: 50px; min-width: 130px; border: 0; padding: 0 22px 0 18px; margin-left: -30px; margin-right: 6px; background: var(--c); color: #fff; font-size: .95rem; transform: skewX(-12deg); transition: min-width var(--t-med) var(--ease-out), background var(--t-fast); }
.lz-back:hover, .lz-back:focus-visible { min-width: 160px; background: #ee4f96; outline: none; }
.lz-back-inner { display: inline-flex; align-items: center; gap: 8px; transform: skewX(12deg); padding-left: 24px; }
.page-back { position: absolute; left: 0; bottom: 0; z-index: 5; }

/* ── lazer-style results ring & mod panels */

@keyframes spin { to { transform: rotate(360deg); } }

/* ── main menu (osu!lazer): centred logo; clicking it slides the button bar out to the right */
.lz-menu { padding-top: var(--toolbar-h); }
.lz-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.lz-bar { position: relative; width: 100%; height: 100px; display: flex; align-items: center; justify-content: center; }
.lz-bar::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .55); transition: transform var(--t-med) var(--ease-out), opacity var(--t-med); }
.lz-menu[data-state="initial"] .lz-bar::before { transform: scaleY(0); opacity: 0; }
.lz-menu { --shift: 280px; }
.lz-menu[data-state="play"] { --shift: 210px; }
.lz-logo-slot { position: relative; z-index: 2; flex: none; width: 190px; height: 100px; display: grid; place-items: center; transform: translateX(calc(var(--shift) * -1)); transition: width var(--t-slow) var(--ease-out), transform var(--t-slow) var(--ease-out); }
.lz-menu[data-state="initial"] .lz-logo-slot { transform: none; }
.lz-menu[data-state="initial"] .lz-logo-slot { width: 440px; }
.lz-logo { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; transform: translate(-50%, -50%); transition: width var(--t-slow) var(--ease-out), height var(--t-slow) var(--ease-out); }
.lz-menu[data-state="initial"] .lz-logo { width: 560px; height: 560px; }
.lz-vis { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.lz-cookie { position: absolute; inset: 21%; border: 0; padding: 0; border-radius: 50%; background: transparent; will-change: transform; }
.lz-cookie-disc { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: #ff66ab; border: 7px solid #fff; box-shadow: 0 6px 30px rgba(0, 0, 0, .45);
  transition: transform var(--t-med) var(--ease-out), filter var(--t-fast), border-width var(--t-slow) var(--ease-out); }
.lz-menu[data-state="initial"] .lz-cookie-disc { border-width: 15px; }
.lz-cookie-disc::before { content: ""; position: absolute; inset: 0; opacity: .5;
  background: linear-gradient(60deg, transparent 46%, rgba(255, 255, 255, .12) 46% 54%, transparent 54%) 0 0 / 28% 48%,
              linear-gradient(-60deg, transparent 46%, rgba(0, 0, 0, .06) 46% 54%, transparent 54%) 14% 24% / 28% 48%,
              radial-gradient(circle at 50% 30%, #ff85bd, #e6428e 80%); }
.lz-cookie:hover .lz-cookie-disc { transform: scale(1.06); }
.lz-cookie:active .lz-cookie-disc { transform: scale(.97); filter: brightness(.95); }
.lz-cookie { container-type: size; }
.lz-cookie-text { position: relative; display: flex; flex-direction: column; align-items: center; line-height: .9; color: #fff; font-weight: 600; letter-spacing: -.02em; font-size: 17cqw; white-space: nowrap; text-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
.lz-cookie-text small { font-size: .5em; font-weight: 700; letter-spacing: .12em; opacity: .9; margin-top: .25em; }
.lz-buttons { position: relative; z-index: 1; display: flex; height: 100%; align-items: stretch; transition: opacity var(--t-med); }
.lz-menu[data-state="initial"] .lz-buttons { opacity: 0; pointer-events: none; }
.lz-left { position: absolute; right: calc(50% + var(--shift) + 95px); top: 0; bottom: 0; }
.lz-right { position: absolute; left: calc(50% - var(--shift) + 95px); top: 0; bottom: 0; }
.lz-menu[data-state="initial"] .lz-left, .lz-menu[data-state="initial"] .lz-right { display: none; }
.lz-btn { --c: #555; position: relative; flex: none; width: 140px; margin-right: -1px; border: 0; padding: 0; background: var(--c); color: #fff; transform: skewX(-12deg); transition: width var(--t-med) var(--ease-out), filter var(--t-fast); animation: lzIn var(--t-med) var(--ease-out) both; }
.lz-right .lz-btn:nth-child(2) { animation-delay: calc(30ms * var(--anim)); } .lz-right .lz-btn:nth-child(3) { animation-delay: calc(60ms * var(--anim)); }
.lz-right .lz-btn:nth-child(4) { animation-delay: calc(90ms * var(--anim)); }
@keyframes lzIn { from { opacity: 0; transform: skewX(-12deg) translateX(-30px); } }
.lz-btn:hover, .lz-btn:focus-visible { width: 170px; filter: brightness(1.12); outline: none; }
.lz-btn:active { filter: brightness(.9); }
.lz-inner { position: absolute; inset: 0; transform: skewX(12deg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: .95rem; }
.lz-inner .i { width: 30px; height: 30px; }
.lz-menu.lz-instant * { transition: none !important; animation: none !important; }

/* ── profile (osu!lazer user profile) */
/* ── profile — osu!lazer's UserProfileOverlay (Pink scheme via .ov): cover + avatar + name, a centre strip with the
   level badge, the detail area (performance, accuracy, rank counts, stat list), a sticky section tab bar, sections */
.pf-header, .pf-tabs { --pf-pad: max(50px, calc((calc(100 * var(--vw)) - 1400px) / 2)); }
.pf-header { margin: -24px -50px 0; }
.pf-top { position: relative; height: 230px; overflow: hidden; }
.pf-cover { position: absolute; inset: 0; background: linear-gradient(120deg, hsl(var(--o-h) 45% 35%), hsl(var(--o-h) 35% 18%)) center / cover; }
.pf-cover.img { filter: saturate(1.05); }
.pf-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .1), rgba(0, 0, 0, .55) 75%, var(--od5)); }
.pf-top-in { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 22px; padding: 0 var(--pf-pad) 18px; }
.pf-avatar { flex: none; border-radius: 22px; cursor: pointer; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); transition: transform var(--t-fast); }
.pf-avatar:hover { transform: scale(1.03); }
.pf-id { min-width: 0; padding-bottom: 6px; }
.pf-name { display: flex; align-items: center; gap: 6px; font-size: 1.9rem; font-weight: 600; line-height: 1.1; text-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
.pf-name .icon-btn { opacity: .6; }
.pf-name .icon-btn:hover { opacity: 1; }
.pf-tags { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.pf-tag { padding: 2px 10px; border-radius: 99px; background: var(--ohl); color: var(--ob6); font-size: .72rem; font-weight: 700; }
.pf-since { color: var(--oc2); font-size: .85rem; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
.pf-centre { display: flex; align-items: center; gap: 8px; padding: 10px var(--pf-pad); background: var(--od5); }
.pf-chip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; border-radius: 99px; background: var(--ob4); font-size: .85rem; font-weight: 600; }
.pf-chip .i { width: 13px; height: 13px; color: var(--ohl); }
.pf-level { display: flex; align-items: center; gap: 12px; }
/* LevelBadge: a gold hexagon with the level in it */
.pf-hex { position: relative; width: 44px; height: 48px; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(160deg, #ffe07a, #e0a400); }
.pf-hex::before { content: ""; position: absolute; inset: 3px; clip-path: inherit; background: var(--od6); }
.pf-hex span { position: relative; font-weight: 700; font-size: 1.05rem; }
.pf-lvl { display: flex; align-items: center; gap: 10px; font-size: .78rem; color: var(--oc2); }
.pf-lvl-bar { width: 200px; height: 5px; border-radius: 5px; background: var(--ob6); overflow: hidden; }
.pf-lvl-bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #ffe07a, #ffcc22); }
.pf-detail { display: flex; gap: 30px; flex-wrap: wrap; padding: 22px var(--pf-pad) 24px; background: var(--ob4); }
.pf-detail-l { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 18px; }
.pf-bigs { display: flex; gap: 40px; }
.pf-big span { display: block; font-size: .8rem; color: var(--oc2); }
.pf-big b { font-size: 2rem; font-weight: 300; line-height: 1.15; }
.pf-ranks { display: flex; gap: 22px; }
.pf-rank { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .85rem; }
.pf-rank .rank-pill { min-width: 40px; height: 20px; font-size: .8rem; }
.pf-detail-r { display: grid; grid-template-columns: auto auto; gap: 6px 26px; align-content: start; padding: 14px 22px; border-radius: 10px; background: var(--ob5); }
.pf-dl { display: contents; }
.pf-dl span { font-size: .8rem; color: var(--oc2); }
.pf-dl b { font-size: .85rem; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.pf-tabs { position: sticky; top: 0; z-index: 3; display: flex; gap: 22px; margin: 0 -50px 8px; padding: 0 var(--pf-pad); background: var(--od4); box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.pf-sec { scroll-margin-top: 56px; padding: 20px 0 10px; }
.pf-sec + .pf-sec { border-top: 2px solid var(--ob6); }
.pf-sec > h2 { margin: 0 0 14px; font-size: 1.5rem; font-weight: 400; }
.pf-subsec { margin-bottom: 18px; }
.pf-subsec > h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 1rem; font-weight: 700; }
.pf-count { padding: 1px 9px; border-radius: 99px; background: var(--ob6); color: var(--oc2); font-size: .75rem; font-weight: 600; }
.pf-chart { padding: 14px 16px; border-radius: 10px; background: var(--ob4); }
.pf-scores { display: flex; flex-direction: column; gap: 4px; }
.pf-score { position: relative; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 0 0 14px; border: 0; border-radius: 8px; overflow: hidden; background: var(--ob4); color: var(--text); text-align: left; cursor: pointer; transition: background var(--t-fast); }
.pf-score:hover { background: var(--ob3); }
.pf-score .rank-pill { min-width: 38px; height: 18px; font-size: .74rem; }
.pf-score .main { flex: 1; min-width: 0; }
.pf-score .t { font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-score .t .a { color: var(--oc2); opacity: .75; font-size: .8rem; }
.pf-score .s { display: flex; gap: 10px; margin-top: 1px; font-size: .75rem; }
.pf-score .s .v { color: #ffcc22; font-weight: 600; }
.pf-score .s .d { color: var(--oc2); opacity: .6; }
.pf-mods { display: flex; gap: 3px; }
.pf-acc { min-width: 64px; text-align: right; color: #ffcc22; font-weight: 600; font-size: .9rem; }
.pf-weight { min-width: 90px; display: flex; flex-direction: column; align-items: flex-end; font-size: .72rem; color: var(--oc2); }
.pf-weight b { font-size: .85rem; color: #fff; font-weight: 600; }
/* the pp sits in a darker block with lazer's slanted left edge */
.pf-ppblock { position: relative; align-self: stretch; min-width: 96px; display: grid; place-items: center; padding: 0 18px 0 26px; color: var(--ohl); font-weight: 700; }
.pf-ppblock::before { content: ""; position: absolute; inset: 0 -20px 0 0; z-index: 0; background: var(--ob5); transform: skewX(-11.31deg); transform-origin: bottom left; }
.pf-ppblock > * { position: relative; }
.pf-ppblock small { font-size: .7em; margin-left: 1px; opacity: .8; }
.pf-ppblock.failed { color: #ff6b77; font-size: .8rem; }
.pf-ppblock.failed::after { content: ""; }
.pf-empty { color: var(--muted); padding: 16px 4px; }
@media (max-width: 700px) { .pf-header { margin: -16px -16px 0; } .pf-tabs { margin: 0 -16px 8px; } .pf-header, .pf-tabs { --pf-pad: 16px; } .pf-top { height: 190px; } .pf-top .pf-avatar { width: 84px !important; height: 84px !important; font-size: 2.2rem !important; } .pf-weight, .pf-mods { display: none; } .pf-lvl-bar { width: 90px; } }
.lib-summary { color: var(--muted); font-size: .85rem; }

.res-more { border-radius: 10px; }
.res-more > summary { cursor: pointer; padding: 10px 14px; border-radius: 8px; background: rgba(0, 0, 0, .35); color: var(--text-2); font-size: .9rem; list-style: none; }
.res-more > summary::before { content: "▸ "; }
.res-more[open] > summary::before { content: "▾ "; }
.res-more[open] > summary { margin-bottom: 16px; }
.res-more > .chart-card + .chart-card { margin-top: 16px; }

/* ── osu!lazer control styling (flat, borderless, lighter type) */
.btn { height: 36px; border-radius: 6px; border: 0; background: rgba(255, 255, 255, .09); font-weight: 600; font-size: .88rem; }
.btn:hover { background: rgba(255, 255, 255, .16); border: 0; }
.btn.primary { background: var(--accent); box-shadow: none; }
.btn.primary:hover { filter: brightness(1.1); box-shadow: none; }
.btn.danger { background: rgba(237, 17, 33, .18); color: #ff8d95; }
.btn.danger:hover { background: rgba(237, 17, 33, .3); }
.btn.lg { height: 44px; border-radius: 8px; }
.icon-btn { border-radius: 6px; }
.icon-btn:hover { background: rgba(255, 255, 255, .1); }
.icon-btn.on { color: var(--accent); }
.chip { border: 0; background: rgba(255, 255, 255, .07); font-weight: 600; }
.chip:hover { background: rgba(255, 255, 255, .13); }
.chip.on { background: var(--accent); color: #fff; box-shadow: none; }
.input, .select { border-radius: 6px; border: 1px solid transparent; background-color: rgba(0, 0, 0, .35); font-weight: 400; }
.input:hover, .select:hover { border-color: rgba(255, 255, 255, .15); }
.input:focus, .select:focus { border-color: rgba(255, 255, 255, .3); box-shadow: none; }
.panel { border: 0; border-radius: 10px; box-shadow: none; }
.big-stat { border-radius: 8px; }
.stat { border: 0; border-radius: 8px; }
.toggle { width: 40px; height: 20px; background: rgba(255, 255, 255, .15); }
.toggle::after { top: 3px; left: 3px; width: 14px; height: 14px; background: #fff; }
.toggle.on::after { transform: translateX(20px); }
.set-row .lbl .hint { font-weight: 400; }
.set-row .val { color: var(--text-2); font-weight: 400; }
.toast { border: 0; border-radius: 8px; background: #302e38; }
.dialog { border: 0; border-radius: 10px; background: #302e38; }
.menu { border: 0; border-radius: 8px; background: #302e38; }
.menu button { font-weight: 400; }
.menu button:hover, .menu button:focus-visible { background: rgba(255, 255, 255, .09); }
.screen-title h1 { font-weight: 600; }
.list-row { border: 0; border-radius: 8px; }
.side-item { border-radius: 6px; }
.set-row .lbl { min-width: 140px; }
.set-row .ctl .select { max-width: 210px; text-overflow: ellipsis; }
/* browser-zoom compensation (see Zoom in 12-ui-core.js) */
#app.zoomfix { right: auto; bottom: auto; width: calc(100vw * var(--zoom)); height: calc(100vh * var(--zoom)); transform: scale(var(--zoom-inv)); transform-origin: 0 0; }

/* ── multiplayer (lobby, room, in-game board) */
.mp { padding-top: var(--toolbar-h); }
.mp-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
.mp-lobby { max-width: 980px; width: 100%; margin: 0 auto; padding: 40px 24px 90px; }
.mp-lobby h1 { margin: 0; font-weight: 600; font-size: 2rem; }
.mp-sub { color: var(--muted); margin-top: 4px; }
.mp-note { margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: rgba(255, 204, 34, .12); color: #ffe38a; font-size: .9rem; }
.mp-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 24px; }
.mp-card { display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 10px; background: var(--panel-solid); }
.mp-card-ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(var(--accent-rgb), .18); color: var(--accent); }
.mp-card-ico .i { width: 22px; height: 22px; }
.mp-card-t { font-size: 1.15rem; font-weight: 600; margin-top: 4px; }
.mp-card-s { color: var(--muted); font-size: .85rem; flex: 1; }
.mp-card .btn { align-self: flex-start; }
.mp-code { width: 150px; text-transform: uppercase; letter-spacing: .2em; font-weight: 600; }
.mp-code::placeholder { letter-spacing: .06em; font-weight: 500; }
.mp-status { margin-top: 18px; display: flex; align-items: center; gap: 10px; color: var(--text-2); min-height: 24px; }
.mp-err { color: #ff8d95; white-space: pre-line; }
.mp-room { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 20px 24px 12px; max-width: 1400px; width: 100%; margin: 0 auto; }
.mp-head { display: flex; align-items: center; gap: 14px; }
.mp-room-label { color: var(--muted); font-size: .8rem; }
.mp-room-code { font-size: 1.8rem; font-weight: 600; letter-spacing: .12em; }
.mp-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
@media (max-width: 1000px) { .mp-grid { grid-template-columns: 1fr; } }
.mp-left { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.mp-map { position: relative; min-height: 180px; border-radius: 10px; overflow: hidden; background: var(--panel-3); }
.mp-map-bg { position: absolute; inset: 0; background: center / cover; opacity: .7; }
.mp-map-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .85) 30%, rgba(0, 0, 0, .35)); }
.mp-map-body { position: relative; padding: 20px 22px; display: flex; flex-direction: column; gap: 4px; min-height: 180px; justify-content: flex-end; }
.mp-map-t { font-size: 1.5rem; font-weight: 600; }
.mp-map-a { color: #ddd; }
.mp-map-d { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.mp-map-actions { display: flex; gap: 8px; margin-top: 12px; }
.mp-warn { color: #ffcc22; font-size: .85rem; }
.mp-players, .mp-chat { border-radius: 10px; background: var(--panel-solid); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.mp-players h3, .mp-chat h3 { margin: 0 0 2px; font-size: .9rem; font-weight: 600; color: var(--text-2); }
.mp-player { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(255, 255, 255, .04); }
.mp-player.ready { box-shadow: inset 3px 0 0 #88b300; }
.mp-player.empty { color: var(--muted); }
.mp-player .avatar { border-radius: 50%; box-shadow: none; }
.mp-avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .06); }
.mp-pname { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.mp-host { font-size: .65rem; padding: 2px 6px; border-radius: 4px; background: var(--gold); color: #000; font-weight: 700; letter-spacing: .05em; }
.mp-state { font-size: .8rem; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, .08); color: var(--text-2); }
.mp-state.on { background: #88b300; color: #fff; }
.mp-state.warn { background: rgba(255, 204, 34, .15); color: #ffcc22; }

.mp-chat-list { flex: 1; min-height: 120px; overflow: auto; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.mp-msg b { color: var(--accent-3); font-weight: 600; margin-right: 8px; }
.mp-msg.sys { color: var(--muted); font-size: .8rem; }
.mp-footer { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 24px; background: rgba(0, 0, 0, .8); flex: none; }
.mp-ready, .mp-start { height: 44px; min-width: 180px; padding: 0 24px; border: 0; border-radius: 8px; font-size: 1rem; font-weight: 600; color: #fff; background: #88b300; transition: filter var(--t-fast), transform var(--t-fast); }
.mp-ready.on { background: #555; }
.mp-start { background: var(--accent); }
.mp-ready:hover, .mp-start:hover { filter: brightness(1.12); }
.mp-ready:active, .mp-start:active { transform: scale(.97); }
.mp-ready[disabled], .mp-start[disabled] { opacity: .4; pointer-events: none; }
.mp:has(.mp-footer) .page-back { bottom: 5px; } /* centred in a room's 60px footer */
.mp-results { border-radius: 10px; padding: 14px 16px; background: var(--panel-solid); display: flex; flex-direction: column; gap: 6px; animation: wedgeIn var(--t-med) var(--ease-out); }
.mp-results.won { box-shadow: inset 0 3px 0 #88b300; }
.mp-results.lost { box-shadow: inset 0 3px 0 #ed1121; }
.mp-results.draw { box-shadow: inset 0 3px 0 var(--gold); }
.mp-verdict { display: flex; align-items: center; justify-content: space-between; font-size: 1.4rem; font-weight: 600; }
.mp-res-row { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-radius: 8px; background: rgba(255, 255, 255, .04); }
.mp-res-row.win { background: rgba(136, 179, 0, .15); }
.mp-res-row .grade { font-size: 1.5rem; width: 34px; text-align: center; }
.mp-res-row .main { flex: 1; }
.mp-res-row .s { color: var(--muted); font-size: .8rem; }
.mp-res-score { font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.hud-mp { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; width: 230px; }
.hud-mp-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, .5); transition: transform var(--t-med) var(--ease-out); }
.hud-mp-row.me { background: rgba(var(--accent-rgb), .35); }
.hud-mp-row .pos { width: 16px; color: #bbb; font-size: .8rem; }
.hud-mp-row .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hud-mp-row .nm b { font-weight: 600; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-mp-row .nm span { font-size: .68rem; color: #ccc; }
.hud-mp-row .sc { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .9rem; }
.hud-mp { transition: opacity var(--t-med) ease, transform var(--t-med) var(--ease-out); }
.hud-mp.lb-off { opacity: 0; transform: translate(-24px, -50%); pointer-events: none; }
.hud-lb { width: 210px; }
/* the skin's own health bar (osu!lazer LegacyHealthDisplay): top-left corner */
.hud-skinhp { position: absolute; left: 0; top: 0; pointer-events: none; }
/* osu!lazer (Argon) health bar */
.hud-hp { --hp: 1; position: absolute; left: 22px; top: 22px; width: min(calc(34 * var(--vw)), 380px); pointer-events: none; }
.hp-track { position: relative; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .1); box-shadow: 0 0 0 1px rgba(0, 0, 0, .25), inset 0 0 0 1px rgba(255, 255, 255, .05); }
.hp-fill, .hp-trail { position: absolute; inset: 0; border-radius: inherit; transform-origin: left center; transform: scaleX(var(--hp)); will-change: transform; }
.hp-fill { background: linear-gradient(90deg, rgba(var(--accent-rgb), .95), #fff 92%); box-shadow: 0 0 10px rgba(var(--accent-rgb), .75), 0 0 2px #fff; transition: transform 180ms var(--ease-out), background 300ms; }
.hp-trail { background: #ff5577; opacity: .9; transition: transform 520ms ease-in 320ms; }
.hud-hp.low .hp-fill { background: linear-gradient(90deg, #ff3355, #ff9f8f); box-shadow: 0 0 12px rgba(255, 60, 90, .8); animation: hpLow 500ms ease-in-out infinite alternate; }
@keyframes hpLow { to { opacity: .6; } }
.hud-lb:empty { display: none; }
.hud-lb .hud-mp-row { background: rgba(0, 0, 0, .42); padding: 5px 10px; }
.hud-lb .hud-mp-row .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-lb .hud-mp-row.me { background: rgba(var(--accent-rgb), .38); box-shadow: 0 0 14px rgba(var(--accent-rgb), .3); }
.mp-countdown { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 4rem; font-weight: 600; color: #fff; text-shadow: 0 4px 30px rgba(0, 0, 0, .6); pointer-events: none; z-index: 5; }
/* overflow: clip (not hidden) so focus()/scrollIntoView can never scroll the whole client out of place */
#app, #screens, .screen { overflow: clip; }

/* in game nothing behind the playfield is drawn: the blurred menu background and hidden toolbar cost GPU time every frame */
#app.in-game #bg-layer, #app.in-game #toolbar, #app.in-game .np-panel { visibility: hidden; }
.hud-mp { display: flex; }

/* ── mod select (osu!lazer ModSelectOverlay) */
.modsel { position: absolute; left: 0; right: 0; bottom: 0; height: min(620px, calc(82 * var(--vh))); display: flex; flex-direction: column; background: #1c1b21; box-shadow: 0 -10px 40px rgba(0, 0, 0, .5); animation: sheetIn var(--t-med) var(--ease-out) both; }
.modsel.out { animation: sheetOut calc(180ms * var(--anim)) ease both; }
@keyframes sheetIn { from { transform: translateY(100%); } }
@keyframes sheetOut { to { transform: translateY(100%); } }
.modsel-head { display: flex; align-items: center; gap: 12px; padding: 22px 32px 16px; background: #24222a; }
.modsel-head h2 { margin: 0; font-weight: 600; font-size: 1.6rem; }
.modsel-sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }
.modsel-stat { display: flex; flex-direction: column; align-items: flex-end; padding: 6px 14px; border-radius: 8px; background: rgba(0, 0, 0, .3); min-width: 120px; }
.modsel-stat span { font-size: .7rem; color: var(--muted); }
.modsel-stat b { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.modsel-stat.up b { color: #b2ff66; } .modsel-stat.down b { color: #ff8d95; }
.modsel-cols { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 16px 32px; overflow-x: auto; overflow-y: hidden; align-items: stretch; }
.modcol { flex: 0 0 300px; display: flex; flex-direction: column; min-height: 0; border-radius: 10px; background: #2a2830; overflow: hidden; }
.modcol-h { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; background: var(--c); color: #111; font-weight: 600; font-size: .9rem; }
.modcol-n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: rgba(0, 0, 0, .75); color: var(--c); font-size: .72rem; display: grid; place-items: center; }
.modcol-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.modcol-list.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 44px), transparent); }
.mod-p { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 6px 12px 6px 8px; border: 0; border-radius: 8px; background: #34313c; color: var(--text); text-align: left; transition: background var(--t-fast), transform var(--t-fast); }
.mod-p:hover { background: #3f3b48; }
.mod-p:active { transform: scale(.98); }
.mod-p.on { background: var(--c); color: #111; }
.mod-p.on:hover { filter: brightness(1.06); }
.mod-p.blocked { opacity: .45; }
.mod-ac { flex: none; width: 50px; height: 26px; display: grid; place-items: center; border-radius: 6px; transform: skewX(-12deg); background: rgba(0, 0, 0, .35); color: var(--c); font-weight: 700; font-size: .78rem; letter-spacing: .02em; }
.mod-ac span { transform: skewX(12deg); }
.mod-p.on .mod-ac { background: rgba(0, 0, 0, .8); color: var(--c); }
.mod-txt { display: flex; flex-direction: column; min-width: 0; }
.mod-txt b { font-weight: 600; font-size: .92rem; }
.mod-txt span { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mod-p.on .mod-txt span { color: rgba(0, 0, 0, .65); }
.mod-config { flex-basis: 340px; }
.mod-config .modcol-list { gap: 2px; padding: 10px 14px; }
.modsel-foot { display: flex; align-items: center; gap: 10px; height: 54px; padding-right: 32px; background: #111014; flex: none; }
.modsel-foot .lz-back { margin-right: 6px; }
.modsel-hint { color: var(--muted); font-size: .78rem; margin-right: 8px; }
@media (max-width: 900px) { .modsel-hint { display: none; } .modsel-head, .modsel-cols { padding-left: 16px; padding-right: 16px; } }
.mp-side { border-radius: 10px; background: var(--panel-solid); display: flex; flex-direction: column; min-height: 320px; overflow: hidden; }
.mp-tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); flex: none; }
.mp-tab { color: var(--text); padding: 8px 12px; font-weight: 600; font-size: .9rem; border-bottom: 2px solid var(--accent); margin-bottom: -1px; }
.mp-tabpane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }
.mp-tabpane[hidden] { display: none; }
.mp-msg.suggest { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; background: rgba(var(--accent-rgb), .12); }
.mp-msg.suggest i { color: var(--text); font-style: normal; font-weight: 600; }
.mp-msg.suggest .btn { margin-left: auto; }
.gp-speed { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); padding: 8px 18px; border-radius: 99px; background: rgba(0, 0, 0, .7); font-weight: 600; font-size: 1rem; pointer-events: none; opacity: 0; transition: opacity var(--t-med); z-index: 5; }
.gp-speed.show { opacity: 1; transition-duration: 60ms; }

/* settings rows never overflow sideways */
.set-row .lbl { min-width: 0; flex: 1 1 110px; }
.set-row .ctl { flex: 0 1 auto; min-width: 0; }
.set-row .ctl .select { max-width: 190px; min-width: 0; }

/* ── break overlay (osu!lazer BreakOverlay) */
.gp-break { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; opacity: 0; transition: opacity 400ms ease; z-index: 3; }
.gp-break.show { opacity: 1; }
.brk-count { font-size: 3.2rem; font-weight: 300; font-variant-numeric: tabular-nums; text-shadow: 0 2px 20px rgba(0, 0, 0, .6); }
.brk-bar { display: flex; align-items: center; gap: 14px; width: min(520px, calc(60 * var(--vw))); }
.brk-track { flex: 1; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.brk-track i { display: block; height: 100%; background: #fff; transform-origin: 50% 50%; box-shadow: 0 0 12px rgba(255, 255, 255, .6); }
.brk-arrow { font-size: 2rem; font-weight: 300; color: rgba(255, 255, 255, .8); animation: brkArrow 1s ease-in-out infinite; }
.brk-arrow.r { animation-name: brkArrowR; }
@keyframes brkArrow { 50% { transform: translateX(6px); opacity: .4; } }
@keyframes brkArrowR { 50% { transform: translateX(-6px); opacity: .4; } }
.gp-break.show .brk-bar { animation: brkIn 500ms var(--ease-out) both; }
@keyframes brkIn { from { transform: scaleX(.6); opacity: 0; } }
.brk-info { display: flex; gap: 28px; padding: 8px 22px; border-radius: 10px; background: rgba(0, 0, 0, .45); }
.brk-info > div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.brk-info span { font-size: .7rem; color: #bbb; letter-spacing: .06em; text-transform: uppercase; }
.brk-info b { font-weight: 600; font-size: 1.15rem; }
.brk-info .grade { font-size: 1.4rem; }

/* ── FPS counter (osu!lazer style, bottom right) */
#fps-counter { position: absolute; right: 8px; bottom: 8px; z-index: 80; display: flex; align-items: baseline; gap: 8px; padding: 4px 10px; border-radius: 6px; background: rgba(0, 0, 0, .7); color: #fff; pointer-events: none; font-variant-numeric: tabular-nums; box-shadow: inset 0 -2px 0 var(--fc, #88b300); }
#fps-counter[hidden] { display: none; }
#fps-counter[data-lvl="ok"] { --fc: #ffcc22; }
#fps-counter[data-lvl="bad"] { --fc: #ed1121; }
#fps-counter .fc-fps b { font-size: 1rem; font-weight: 600; color: var(--fc, #88b300); }
#fps-counter .fc-fps small { font-size: .65rem; margin-left: 2px; color: #bbb; }
#fps-counter i { font-style: normal; font-size: .7rem; color: #bbb; }
.mp-map-status { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: .85rem; color: var(--text-2); flex-wrap: wrap; }
.mp-temp { color: var(--blue); }
.mp-diff { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: .8rem; color: var(--muted); }
.mp-mods { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: .8rem; }
.mp-modline { display: flex; align-items: center; gap: 5px; }
.mp-modlabel { color: var(--muted); margin-right: 3px; }
.mp-none { color: var(--text-2); font-weight: 600; }
.mp-vote { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: rgba(var(--accent-rgb), .18); font-size: .85rem; animation: wedgeIn var(--t-med) var(--ease-out); }
.mp-vote .i { color: var(--accent); }
.mp-pdiff .mod-badge, .mp-pdiff > span:not(:first-child) { margin-left: 4px; }
.hud-skip.voted { opacity: .75; }
.skip-votes { margin-left: 4px; font-variant-numeric: tabular-nums; opacity: .85; }
.mp-diff .select { height: 32px; max-width: 320px; font-size: .85rem; }
.mp-pdiff { font-size: .75rem; color: var(--muted); margin-top: 1px; }
.ex-mp { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 14px; border-radius: 8px; background: rgba(var(--accent-rgb), .15); color: var(--text); font-size: .9rem; }
.ex-mp .i { color: var(--accent); }
.setup-pfp { display: flex; align-items: center; gap: 14px; }
.av-picker { display: flex; flex-direction: column; gap: 14px; }
.av-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.av-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, .04); color: var(--text-2); font-size: .78rem; font-weight: 600; box-shadow: inset 0 0 0 2px transparent; transition: background var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast) var(--ease-out); }
.av-tile img { width: 72px; height: 72px; border-radius: 30%; object-fit: cover; display: block; }
.av-tile:hover { background: rgba(255, 255, 255, .09); transform: translateY(-2px); }
.av-tile.on { box-shadow: inset 0 0 0 2px var(--accent); color: var(--text); }
.av-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.dialog:has(.av-picker) { width: min(560px, calc(calc(100 * var(--vw)) - 32px)); }
.ex-totop { position: absolute; right: 28px; bottom: 28px; z-index: 5; width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .1); display: grid; place-items: center; background: rgba(18, 16, 24, .92); color: var(--text-2); box-shadow: 0 8px 24px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(16px) scale(.9); pointer-events: none; transition: opacity var(--t-med), transform var(--t-med) var(--ease-out), box-shadow var(--t-fast), color var(--t-fast), border-color var(--t-fast); }
.ex-totop .i { width: 26px; height: 26px; stroke-width: 2.6; }
.ex-totop.show { opacity: 1; transform: none; pointer-events: auto; }
.ex-totop.show:hover { color: #fff; border-color: rgba(var(--accent-rgb), .7); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .18), 0 0 22px rgba(var(--accent-rgb), .7), 0 8px 24px rgba(0, 0, 0, .5); transform: translateY(-2px); }
.hud-mpfailed { position: absolute; left: 50%; top: 10%; transform: translateX(-50%); padding: 3px 12px; border-radius: 6px; background: rgba(237, 17, 33, .8); font-weight: 800; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; pointer-events: none; animation: mpFailed 600ms var(--ease-out) both; }
@keyframes mpFailed { from { opacity: 0; transform: translate(-50%, -6px); } to { opacity: .9; transform: translate(-50%, 0); } }
/* ── First-run setup (minimal wizard) */
.setup { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(820px, calc(calc(100 * var(--vw)) - 32px)); height: min(600px, calc(calc(100 * var(--vh)) - 32px)); display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; background: #22212a; box-shadow: 0 30px 90px rgba(0, 0, 0, .6); animation: dlgIn var(--t-med) var(--ease-out) both; text-align: left; }
.setup.out { animation: dlgOut var(--t-fast) ease both; }
.setup-head { flex: none; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 28px 0; }
.setup-head h2 { margin: 0; font-size: 1.6rem; font-weight: 700; text-align: center; }
.setup-progress { display: flex; gap: 6px; }
.setup-progress i { width: 26px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .12); transition: background var(--t-med), width var(--t-med) var(--ease-out); }

.setup-body { flex: 1; min-height: 0; overflow: auto; padding: 22px 32px; display: flex; flex-direction: column; gap: 14px; }
.setup-body.anim { animation: setupIn var(--t-slow) var(--ease-out) both; }
@keyframes setupIn { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 36px)); } }
.setup-foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 24px; }
.setup-foot .ob-err { margin: 0 8px 0 0; }
.setup-next { min-width: 130px; height: 42px; font-size: .95rem; }
.setup-next .i { order: 2; }
.setup-step-welcome, .setup-step-ask, .setup-step-device, .setup-step-look { align-items: center; justify-content: center; text-align: center; }
.setup-logo { position: relative; width: 130px; height: 130px; flex: none; container-type: size; animation: setupLogo 2.4s ease-in-out infinite; }
.setup-logo.small { width: 96px; height: 96px; }
.setup-logo .lz-cookie-disc { border-width: 6px; }
@keyframes setupLogo { 50% { transform: scale(1.04); } }
.setup-lead { max-width: 480px; margin: 0; color: var(--text-2); font-size: 1.05rem; line-height: 1.5; }
.setup .ob-name { width: min(380px, 100%); height: 52px; font-size: 1.25rem; text-align: center; }
.setup-label { align-self: stretch; font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.setup-choices { display: grid; gap: 14px; width: 100%; }
.setup-choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 560px; }
.setup-choice { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px 18px 22px; border-radius: 14px; border: 0; background: #2c2a34; color: var(--text); text-align: center; box-shadow: inset 0 0 0 2px transparent; transition: background var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast) var(--ease-out); }
.setup-choice:hover { background: #34313d; transform: translateY(-2px); }
.setup-choice.on, .setup-choice.primary { box-shadow: inset 0 0 0 2px var(--accent); }
.setup-choice.on { background: rgba(var(--accent-rgb), .16); }
.setup-choice-ic { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; background: rgba(255, 255, 255, .07); color: var(--accent); margin-bottom: 6px; }
.setup-choice-ic .i { width: 30px; height: 30px; }
.setup-choice.on .setup-choice-ic, .setup-choice.primary .setup-choice-ic { background: var(--accent); color: #fff; }
.setup-choice-t { font-size: 1.2rem; font-weight: 700; }
.setup-choice-s { font-size: .85rem; color: var(--muted); }
.setup-check { position: absolute; right: 12px; top: 12px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; opacity: 0; transform: scale(.5); transition: opacity var(--t-fast), transform var(--t-med) var(--ease-out); }
.setup-check .i { width: 15px; height: 15px; stroke-width: 3; }
.on > .setup-check { opacity: 1; transform: none; }
.setup-swatches { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.setup-swatch { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 8px; min-width: 84px; border-radius: 14px; border: 0; background: transparent; color: var(--text-2); font-weight: 600; font-size: .85rem; transition: background var(--t-fast); }
.setup-swatch i { width: 48px; height: 48px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px transparent; transition: box-shadow var(--t-fast), transform var(--t-fast) var(--ease-out); }
.setup-swatch:hover { background: rgba(255, 255, 255, .05); }
.setup-swatch:hover i { transform: scale(1.06); }
.setup-swatch.on { color: var(--text); }
.setup-swatch.on i { box-shadow: 0 0 0 3px #22212a, 0 0 0 6px var(--c); }
.setup-step-look .setup-slider { width: min(420px, 100%); }
.setup-seg { display: inline-flex; padding: 3px; border-radius: 8px; background: rgba(0, 0, 0, .3); gap: 2px; flex-wrap: wrap; }
.setup-seg button { height: 32px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); font-weight: 600; font-size: .85rem; transition: background var(--t-fast), color var(--t-fast); }
.setup-seg button:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
.setup-seg button.on { background: var(--accent); color: #fff; }
.setup-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0 0; }
.setup-row-t { font-weight: 600; font-size: .92rem; }
.setup-split { display: grid; grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); gap: 22px; min-height: 0; flex: 1; }
.setup-pv { position: relative; min-height: 320px; border-radius: 12px; overflow: hidden; background: #000; }
.setup-pv canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.setup-pv-bg { position: absolute; inset: -30px; background: center / cover no-repeat; }
.setup-pv-dim { position: absolute; inset: 0; background: #000; }
.setup-controls { display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow: auto; }
.setup-slider { display: flex; flex-direction: column; gap: 4px; }
.setup-slider .val { font-weight: 700; color: var(--accent-3); font-size: .9rem; font-variant-numeric: tabular-nums; }
.setup-hint { font-size: .78rem; color: var(--muted); margin-top: -6px; }
.setup-skins { display: flex; flex-direction: column; gap: 6px; }
.setup-skinitem { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 44px 10px 12px; border-radius: 10px; border: 0; background: rgba(255, 255, 255, .04); color: var(--text); text-align: left; box-shadow: inset 0 0 0 2px transparent; transition: background var(--t-fast), box-shadow var(--t-fast); }
.setup-skinitem:hover { background: rgba(255, 255, 255, .08); }
.setup-skinitem.on { background: rgba(var(--accent-rgb), .14); box-shadow: inset 0 0 0 2px var(--accent); }
.setup-skinitem .setup-check { top: 50%; margin-top: -12px; }
.setup-skin-ic { width: 36px; height: 36px; flex: none; border-radius: 8px; display: grid; place-items: center; background: rgba(255, 255, 255, .07); color: var(--accent); }
.setup-skin-t { display: flex; flex-direction: column; min-width: 0; }
.setup-skin-t b { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.setup-skin-t small { font-size: .75rem; color: var(--muted); }
.setup-skinitem.import { background: transparent; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .1); }
.setup-skinitem.import:hover { box-shadow: inset 0 0 0 2px rgba(var(--accent-rgb), .6); }
.setup-custom { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: rgba(0, 0, 0, .2); }
.setup-custom .setup-label { margin-top: 2px; }
.setup-custom .setup-row { align-self: stretch; }
input[type=range].slider.setup-hue::-webkit-slider-runnable-track { height: 8px; background: linear-gradient(90deg, hsl(0, 80%, 69%), hsl(60, 80%, 69%), hsl(120, 80%, 69%), hsl(180, 80%, 69%), hsl(240, 80%, 69%), hsl(300, 80%, 69%), hsl(360, 80%, 69%)); }
input[type=range].slider.setup-hue::-webkit-slider-thumb { margin-top: -4px; border-color: #fff; background: transparent; }
