// ─────────────────────────────── Mod select ───────────────────────────────
const ModSelect = {
  o: null,
  open() {
    if (this.o) { this.close(); return; }
    UISounds.click();
    const sheet = h('div.modsel', { role: 'dialog', 'aria-label': 'Mod select' });
    this.sheet = sheet;
    this.render();
    this.o = makeOverlay(sheet, {
      onClose: () => { this.o = null; Bus.emit('mods:changed'); },
      onKey: e => {
        if (e.key === 'F1' || e.key === 'Enter') { this.close(); return true; }
        if (e.key === 'Backspace') { Settings.set('songselect.mods', []); this.render(); return true; }
        const m = MODS.find(x => x.key === e.code);
        if (m && !e.ctrlKey && !e.metaKey) { this.toggle(m.id); return true; }
        return false;
      },
    });
  },
  close() { if (this.o) this.o.close(); },
  toggle(id) {
    const cur = Settings.get('songselect.mods') || [];
    const next = ModSystem.toggle(cur, id);
    Settings.set('songselect.mods', next);
    UISounds.play(next.includes(id) ? 'check-on' : 'check-off');
    if (this.o && this.sheet) this.render(); // (also callable with the panel closed)
    Bus.emit('mods:changed');
  },
  /** osu!lazer mod type colours. */
  GROUP_COLOURS: { reduction: '#b2ff66', increase: '#ff6666', conversion: '#8c66ff', automation: '#66ccff', fun: '#ff66ab' },
  render() {
    const sheet = this.sheet;
    const scrollX = this.colsEl ? this.colsEl.scrollLeft : 0;
    // each toggle redraws the sheet: keep every column where it was scrolled (it used to jump back to the top)
    const tops = this.colsEl ? [...this.colsEl.querySelectorAll('.modcol-list')].map(l => l.scrollTop) : [];
    const hadCfg = !!(this.colsEl && this.colsEl.querySelector('.mod-config'));
    clearEl(sheet);
    const cur = Settings.get('songselect.mods') || [];
    const mult = ModSystem.multiplier(cur), rate = ModSystem.rate(cur);
    const setMods = v => { Settings.set('songselect.mods', v); this.render(); Bus.emit('mods:changed'); };
    sheet.append(h('div.modsel-head',
      h('div', h('h2', 'Mod Select'), h('div.modsel-sub', 'Mods change the way the game plays. Some affect your score multiplier.')),
      h('span.grow'),
      rate !== 1 ? h('div.modsel-stat', h('span', 'Speed'), h('b', `${rate}×`)) : null,
      h(`div.modsel-stat${mult > 1 ? '.up' : mult < 1 ? '.down' : ''}`, h('span', 'Score multiplier'), h('b', `${mult.toFixed(2)}×`))));
    const cols = h('div.modsel-cols');
    for (const [gid, gname] of MOD_GROUPS) {
      const mods = MODS.filter(x => x.group === gid);
      const n = mods.filter(m => cur.includes(m.id)).length;
      const col = h('div.modcol', { style: { '--c': this.GROUP_COLOURS[gid] || '#aaa' } },
        h('div.modcol-h', h('span', gname), n ? h('span.modcol-n', String(n)) : null));
      const list = h('div.modcol-list');
      for (const m of mods) {
        const on = cur.includes(m.id);
        const blocked = !on && cur.some(x => m.incompatible.includes(x) || (MOD_BY_ID.get(x)?.incompatible || []).includes(m.id));
        const panel = h(`button.mod-p${on ? '.on' : ''}${blocked ? '.blocked' : ''}`, {
          'aria-pressed': String(on), onclick: () => this.toggle(m.id),
          title: `${m.name} (${keyLabel(m.key)}) · ${m.mult.toFixed(2)}×${blocked ? ` · replaces ${cur.filter(x => m.incompatible.includes(x) || (MOD_BY_ID.get(x)?.incompatible || []).includes(m.id)).join(', ')}` : ''}`,
        }, h('span.mod-ac', modIcon(m.id, 44)), h('span.mod-txt', h('b', m.name, h('small.mod-id', m.id)), h('span', m.desc)));
        panel.addEventListener('pointerenter', () => UISounds.hover());
        list.append(panel);
      }
      col.append(list);
      cols.append(col);
      // fade the bottom edge while there are more mods below (so a cut-off row reads as "scroll for more")
      const edge = () => list.classList.toggle('more', list.scrollHeight - list.scrollTop - list.clientHeight > 4);
      list.addEventListener('scroll', edge, { passive: true });
      requestAnimationFrame(edge);
    }
    const cfgMods = cur.filter(id => MOD_BY_ID.get(id)?.config);
    if (cfgMods.length) cols.append(this.configPanel(cfgMods));
    this.colsEl = cols;
    sheet.append(cols, h('div.modsel-foot',
      backButton(() => this.close()),
      h('button.btn', { disabled: !cur.length, onclick: () => setMods([]) }, 'Deselect all'),
      h('span.grow'),
      h('span.modsel-hint', 'Tip: every mod has a letter shortcut (hover to see it) · Backspace clears'),
      h('button.btn.primary', { onclick: () => this.close() }, 'Done')));
    cols.scrollLeft = scrollX;
    [...cols.querySelectorAll('.modcol-list')].forEach((l, i) => { if (tops[i]) l.scrollTop = tops[i]; });
    // the Customise column is added past the right edge on smaller screens: bring it into view when it appears
    if (cfgMods.length && !hadCfg) requestAnimationFrame(() => { if (cols.scrollWidth > cols.clientWidth) cols.scrollTo({ left: cols.scrollWidth, behavior: Settings.get('ui.animSpeed') > 0 ? 'smooth' : 'auto' }); });
    // lazer's columns scroll sideways with the wheel when they don't all fit (a column with more mods still scrolls itself)
    cols.addEventListener('wheel', e => {
      if (cols.scrollWidth <= cols.clientWidth + 1 || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      const list = e.target.closest && e.target.closest('.modcol-list');
      if (list && list.scrollHeight > list.clientHeight + 1) return;
      cols.scrollLeft += e.deltaY; e.preventDefault();
    }, { passive: false });
  },
  /** Sliders for mods with settings (Accuracy Challenge, Difficulty Adjust, Song Speed, Hidden/Fade In, Percy). */
  configPanel(ids) {
    const cfg = ModSystem.config();
    const set = (k, v) => { Settings.set('mods.config', { ...ModSystem.config(), [k]: v }); Bus.emit('mods:changed'); };
    const slider = (label, k, min, max, step, fmt) => {
      const s = h('input.slider', { type: 'range', min, max, step, value: cfg[k] });
      const val = h('span.val', fmt(+cfg[k]));
      const upd = () => { s.style.setProperty('--p', ((s.value - min) / (max - min) * 100) + '%'); val.textContent = fmt(+s.value); };
      s.addEventListener('input', () => { upd(); set(k, +s.value); });
      s.addEventListener('keydown', e => e.stopPropagation());
      upd();
      return h('div.set-row.col', h('div.row', h('div.lbl', label), val), h('div.ctl', s));
    };
    const rows = [];
    if (ids.includes('AC')) rows.push(slider('Accuracy Challenge — minimum accuracy', 'acc', 0.6, 0.99, 0.01, v => `${Math.round(v * 100)}%`));
    if (ids.includes('DA')) rows.push(slider('Difficulty Adjust — overall difficulty (OD)', 'od', 0, 10, 0.1, v => v.toFixed(1)), slider('Difficulty Adjust — HP drain', 'hp', 0, 10, 0.1, v => v.toFixed(1)));
    if (ids.includes('RT')) rows.push(slider('Song Speed — playback rate', 'rate', 0.5, 2, 0.05, v => `${v.toFixed(2)}×`));
    if (ids.includes('HD') || ids.includes('FI')) rows.push(slider(`${ids.includes('HD') ? 'Hidden' : 'Fade In'} — lane coverage`, 'cover', 0.1, 0.9, 0.05, v => `${Math.round(v * 100)}%`));
    if (ids.includes('PC')) rows.push(slider('Percy — long note tail cut-off', 'percy', 0, 500, 10, v => `${v}ms`));
    return h('div.modcol.mod-config', { style: { '--c': '#ffcc22' } }, h('div.modcol-h', h('span', 'Customise')), h('div.modcol-list', ...rows));
  },
};


/* ===== 18b-setup.js ===== */
/* First-run setup — osu!lazer's first-run wizard, shown the first time the client opens (and from Settings →
 * Maintenance → "Run first-run setup"): your name, bringing over a Web-Osu-Mania backup (lazer's "import from
 * osu!stable" page), your device, size and picture, scroll speed and background, and a skin. It isn't skippable,
 * but every page is quick; each choice applies at once (the previews are live) and stays editable in Settings. */

/** Render scale that keeps the playfield canvas at (at most) one pixel per CSS pixel — the cheapest setting
 *  that still looks sharp on a Chromebook's high-DPI panel. */
const lowEndRenderScale = () => clamp(Math.round(20 / (window.devicePixelRatio || 1)) / 20, 0.5, 1);

const SETUP_DEVICES = {
  pc: { label: 'PC', sub: 'Desktop or gaming laptop', icon: 'pc',
    values: () => ({ 'graphics.performanceMode': false, 'graphics.particles': true, 'graphics.effects': true, 'gameplay.hitLighting': true, 'skin.effects': true, 'gameplay.comboEffects': true,
      'graphics.bgQuality': 'high', 'gameplay.video': true, 'graphics.renderScale': 1, 'graphics.menuBlur': 12, 'ui.parallax': true }) },
  chromebook: { label: 'Chromebook', sub: 'School Chromebook or older laptop', icon: 'laptop',
    values: () => ({ 'graphics.performanceMode': true, 'graphics.bgQuality': 'low', 'gameplay.video': false, 'graphics.renderScale': lowEndRenderScale(),
      'graphics.menuBlur': 12, 'ui.parallax': false }) },
};

const SETUP_NOTE_STYLES = [['bars', 'Bars'], ['circles', 'Circles'], ['diamonds', 'Diamonds'], ['arrows', 'Arrows']];

const Onboarding = {
  STEPS: [
    { id: 'welcome', title: 'Welcome!' },
    { id: 'wom', title: 'Coming from Web-Osu-Mania?', short: 'Import' },
    { id: 'device', title: 'What are you playing on?', short: 'Device' },
    { id: 'look', title: 'Make it yours', short: 'Appearance' },
    { id: 'gameplay', title: 'How notes move', short: 'Gameplay' },
    { id: 'skin', title: 'Pick a skin', short: 'Skin' },
  ],

  /** Runs the wizard. Resolves once it is finished or skipped. `again`: opened from Settings (name is kept). */
  run({ again = false } = {}) {
    if (this.o) return this.done;
    this.done = new Promise(resolve => {
      this.resolve = resolve;
      this.again = again;
      this.i = 0;
      this.dir = 1;
      this.womAnswer = this.womDone = this.womStatus = null;
      this.animate = true;
      this.el = h('div.onboarding.setup', { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Setup' });
      this.o = makeOverlay(this.el, {
        dismissable: false,
        onKey: e => {
          if (e.key === 'Escape') return true; // closed with its own buttons only
          if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button, input, select'))) { this.next(); return true; }
          return false;
        },
      });
      this.render();
    });
    return this.done;
  },

  get step() { return this.STEPS[this.i]; },
  get last() { return this.i === this.STEPS.length - 1; },

  render() {
    this.stopPreview();
    const st = this.step;
    const body = h(`div.setup-body.setup-step-${st.id}${this.animate ? '.anim' : ''}`, { style: { '--dir': this.dir } }, ...[].concat(this['step_' + st.id]()));
    this.animate = false;
    const showNav = true;
    // lazer's WizardOverlay: the overlay header, the step, then sheared Back and a wide Next "(next step)" button
    const nx = this.STEPS[this.i + 1];
    this.nextBtn = showNav ? h('button.setup-next', { onclick: () => this.next() }, h('span', this.last ? 'Finish' : nx && nx.short ? `Next (${nx.short})` : 'Next')) : null;
    clearEl(this.el).append(
      h('div.setup-ovhead', h('div.setup-ovt', 'first-run setup'), h('div.setup-ovs', 'set up Ashtonk!mania to suit you')),
      h('div.setup-head',
        h('h2', st.id === 'welcome' ? 'Welcome to Ashtonk!mania' : st.title),
        this.i > 0 ? h('div.setup-progress', ...this.STEPS.slice(1).map((s, k) => h(`i${k + 1 === this.i ? '.on' : k + 1 < this.i ? '.past' : ''}`)))
          : null),
      body,
      h('div.setup-foot',
        this.i > 0 && showNav ? h('button.setup-back', { onclick: () => this.go(this.i - 1) }, h('span', icon('back'), 'Back')) : null,
        this.err = h('div.ob-err'),
        this.nextBtn));
    this.afterRender && this.afterRender();
    this.afterRender = null;
  },

  async go(k) {
    if (k === this.i || k < 0 || k >= this.STEPS.length) return;
    if (k > this.i && !(await this.commit())) return;
    this.dir = k > this.i ? 1 : -1;
    this.i = k;
    this.animate = true;
    UISounds.click();
    this.render();
  },
  next() {
    if (this.last) this.finish();
    else this.go(this.i + 1);
  },
  /** Validate / save the current step before moving on. */
  async commit() {
    if (this.step.id === 'welcome') {
      const n = this.nameEl.value.trim();
      if (!n) { this.err.textContent = 'Type a name first.'; this.nameEl.focus(); return false; }
      if (n !== ProfileManager.profile.name) await ProfileManager.setName(n);
      Toolbar.updateProfile();
    }
    return true;
  },
  /** Close and land on the main menu. */
  async finish() {
    if (!(await this.commit())) return;
    const p = ProfileManager.profile;
    const first = !p.onboarded;
    p.onboarded = true;
    await ProfileManager.save();
    await Settings.flush();
    Toolbar.updateProfile();
    this.stopPreview();
    UISounds.click();
    const o = this.o;
    this.o = null;
    o.close();
    if (Screens.currentName !== 'home') Screens.go('home');
    if (first) Toast.show(`Welcome, ${p.name}!`, 'Change anything later in Settings (Ctrl+O).');
    this.resolve();
  },

  // ─────────────────────────────── steps ───────────────────────────────
  logo(cls = '') { return h(`div.setup-logo${cls}`, h('span.lz-cookie-disc', h('span.lz-cookie-text', 'ashtonk!', h('small', 'mania')))); },

  step_welcome() {
    const p = ProfileManager.profile;
    this.nameEl = h('input.input.ob-name', { value: p.onboarded || this.again ? p.name : '', placeholder: 'Your name', maxlength: 24, 'aria-label': 'Your name', autocomplete: 'nickname' });
    this.nameEl.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); this.next(); } });
    this.nameEl.addEventListener('input', () => { this.err.textContent = ''; });
    this.afterRender = () => setTimeout(() => this.nameEl && this.nameEl.focus(), 60);
    return [this.logo(), h('p.setup-lead', 'What should we call you?'), this.nameEl];
  },

  /** osu!lazer's "import from osu!stable" page, for Web-Osu-Mania: its backup brings keybinds, settings, beatmaps,
   *  scores and collections across in one go. */
  step_wom() {
    const yes = this.womAnswer === 'yes';
    const choice = (v, ic, t, sub) => h(`button.setup-choice${this.womAnswer === v ? '.on' : ''}`, { dataset: { id: v }, onclick: () => {
      UISounds.click(); this.womAnswer = v;
      if (v === 'no') { this.next(); return; }
      this.render();
    } }, h('span.setup-choice-ic', icon(ic)), h('span.setup-choice-t', t), h('span.setup-choice-s', sub), h('span.setup-check', icon('check')));
    const out = [
      h('p.setup-lead', 'Did you play Web-Osu-Mania before?'),
      h('div.setup-choices.two', choice('yes', 'upload', 'Yes', 'Bring my keybinds and beatmaps'), choice('no', 'sparkle', 'No', 'I\'m new here'))];
    if (yes) out.push(h('div.setup-wom',
      this.womDone
        ? h('div.setup-wom-done', icon('check'), h('span', `Imported ${this.womDone}. Your keybinds and settings are in place — check them on the next pages.`))
        : [h('ol.setup-wom-steps',
            h('li', 'In Web-Osu-Mania, open ', h('b', 'Settings → Backup & Restore'), '.'),
            h('li', 'Tick ', h('b', 'Settings & Keybinds'), ', ', h('b', 'Stored Beatmaps'), ' and ', h('b', 'Collections'), ' (scores too, if you like) and export. Songs in your collections are downloaded for you.'),
            h('li', 'Import the .zip it saves here.')),
          this.womStatus ? h('div.setup-wom-busy', h('span.spinner'), this.womStatus)
            : h('button.btn.primary.setup-wom-btn', { onclick: () => this.importWom() }, icon('upload'), 'Import my Web-Osu-Mania backup')]));
    return out;
  },
  async importWom() {
    const [f] = await pickFiles({ accept: '.zip', multiple: false });
    if (!f || !this.o) return;
    this.womStatus = 'Reading backup…'; this.render();
    try {
      const r = await WomImport.run(f, { onStatus: m => { if (m && this.o) { this.womStatus = m; const el = this.el.querySelector('.setup-wom-busy'); if (el) el.lastChild.textContent = m; } } });
      this.womDone = WomImport.summary(r);
      if (r.errors.length) Toast.err('Some of it couldn\'t be imported', r.errors.slice(0, 5).join('\n'));
      UISounds.play('check-on');
    } catch (e) { Toast.err('Couldn\'t import the backup', friendlyError(e)); }
    this.womStatus = null;
    if (this.o && this.step.id === 'wom') this.render();
  },

  step_device() {
    const cur = Settings.values['setup.device'];
    const pick = id => {
      for (const [k, v] of Object.entries(SETUP_DEVICES[id].values())) Settings.set(k, v);
      Settings.set('setup.device', id);
      UISounds.play('check-on');
      this.render();
      setTimeout(() => { if (this.o && this.step.id === 'device') this.next(); }, 350);
    };
    return [h('div.setup-choices.two', ...Object.entries(SETUP_DEVICES).map(([id, o]) =>
      h(`button.setup-choice${cur === id ? '.on' : ''}`, { dataset: { id }, onclick: () => pick(id) },
        h('span.setup-choice-ic', icon(o.icon)), h('span.setup-choice-t', o.label), h('span.setup-choice-s', o.sub), h('span.setup-check', icon('check')))))];
  },

  step_look() {
    return [
      h('div.setup-label', 'Size'),
      this.slider('ui.scale', 'Interface size', 0.75, 1.5, 0.05, v => `${Math.round(v * 100)}%`, null, 'change'),
      h('div.setup-label', 'Profile picture'),
      h('div.setup-pfp', ProfileManager.avatarEl(56), h('button.btn.sm.setup-pfp-btn', { onclick: () => {
        const off = Bus.on('avatar:changed', () => { off(); if (this.o && this.step.id === 'look') this.render(); });
        AvatarPicker.open();
      } }, icon('user'), 'Choose a picture')),
    ];
  },

  step_gameplay() {
    const bg = h('div.setup-pv-bg', { style: { backgroundImage: `url("${this.previewArt()}")` } });
    const dim = h('div.setup-pv-dim');
    const canvas = h('canvas');
    const pv = h('div.setup-pv', bg, dim, canvas);
    const applyBg = () => {
      const w = pv.clientWidth || 360;
      bg.style.filter = `blur(${(Settings.get('gameplay.bgBlur') * 50 * w / 1920 * 2.2).toFixed(1)}px)`;
      dim.style.opacity = Settings.get('gameplay.bgDim');
    };
    const dirSeg = h('div.setup-seg', ...[['down', 'Down'], ['up', 'Up']].map(([v, l]) =>
      h(`button${Settings.get('gameplay.scrollDirection') === v ? '.on' : ''}`, { onclick: e => {
        Settings.set('gameplay.scrollDirection', v); UISounds.click();
        for (const b of e.currentTarget.parentNode.children) b.classList.toggle('on', b === e.currentTarget);
        this.preview && this.preview.renderer.resize(true);
      } }, l)));
    this.afterRender = () => {
      applyBg();
      this.preview = new SkinPreview(canvas, { scrollSpeed: true });
      requestAnimationFrame(() => this.preview && this.preview.show(SkinManager.current, 4));
    };
    return [h('div.setup-split', pv,
      h('div.setup-controls',
        this.slider('gameplay.scrollSpeed', 'Scroll speed', 1, 40, 1, v => String(v)),
        h('div.setup-hint', 'Higher is faster. 22 is a good start.'),
        this.slider('gameplay.bgDim', 'Background dim', 0, 1, 0.01, v => `${Math.round(v * 100)}%`, applyBg),
        this.slider('gameplay.bgBlur', 'Background blur', 0, 1, 0.05, v => `${Math.round(v * 100)}%`, applyBg),
        h('div.setup-slider', h('div.row', h('span.setup-row-t', 'Notes fall'), h('span.grow'), dirSeg))))];
  },

  step_skin() {
    const canvas = h('canvas');
    const pv = h('div.setup-pv.skin', canvas);
    const side = h('div.setup-controls');
    const show = () => { if (this.preview) requestAnimationFrame(() => this.preview && this.preview.show(SkinManager.current, 4)); };
    const choose = async id => {
      if (this.preview) this.preview.renderer.layout = null; // the old skin's images are freed on switch
      await SkinManager.select(id, { silent: true }); UISounds.click(); paint(); show(); };
    const paint = () => {
      const cur = SkinManager.current.id;
      const kori = SkinManager.skins.find(s => /kori/i.test(s.name));
      // the skins that come with the game first (Kori, then Chemuss), then Custom, then the player's own
      const chemuss = SkinManager.skins.find(s => /chemuss/i.test(s.name));
      const others = SkinManager.skins.filter(s => s !== kori && s !== chemuss);
      const card = (id, name, sub, ic) => h(`button.setup-skinitem${cur === id ? '.on' : ''}`, { dataset: { id }, onclick: () => choose(id) },
        h('span.setup-skin-ic', icon(ic)), h('span.setup-skin-t', h('b', name), h('small', sub)), h('span.setup-check', icon('check')));
      clearEl(side).append(
        h('div.setup-skins',
          kori ? card(kori.id, 'Kori', 'The default skin', 'sparkle') : null,
          chemuss ? card(chemuss.id, 'Chemuss mixed edit', 'Orb notes, made for 4K', 'sparkle') : null,
          card('default', 'Custom', 'Choose the note shape and colour', 'brush'),
          ...others.map(s => card(s.id, s.name, 'Imported', 'brush')),
          h('button.setup-skinitem.import', { onclick: () => this.importSkins(paint, show) }, h('span.setup-skin-ic', icon('upload')), h('span.setup-skin-t', h('b', 'Import a skin'), h('small', '.osk file from osu!')))),
        ...(cur === 'default' ? [this.customSkinOptions(() => { paint(); show(); })] : []));
    };
    const offSkins = Bus.on('skins:changed', () => { if (this.step.id === 'skin') { paint(); show(); } });
    this.cleanup.push(offSkins);
    paint();
    this.afterRender = () => { this.preview = new SkinPreview(canvas, { scrollSpeed: true }); show(); };
    return [h('div.setup-split', pv, side)];
  },

  /** The Custom (built-in) skin's options — Web-Osu-Mania's note styles and single-hue colouring. */
  customSkinOptions(refresh) {
    const style = Settings.get('skin.noteStyle'), hue = Settings.get('skin.hue');
    const hueSlider = h('input.slider.setup-hue', { type: 'range', min: 0, max: 360, step: 1, value: hue < 0 ? 270 : hue, 'aria-label': 'Note colour' });
    hueSlider.addEventListener('change', () => { Settings.set('skin.hue', +hueSlider.value); refresh(); });
    hueSlider.addEventListener('keydown', e => e.stopPropagation());
    const t = h(`button.toggle${Settings.get('skin.darkerHolds') ? '.on' : ''}`, { role: 'switch', 'aria-label': 'Darker hold notes', onclick: () => {
      Settings.set('skin.darkerHolds', !Settings.get('skin.darkerHolds')); UISounds.click(); refresh(); } });
    return h('div.setup-custom',
      h('div.setup-label', 'Note shape'),
      h('div.setup-seg', ...SETUP_NOTE_STYLES.map(([v, l]) => h(`button${style === v ? '.on' : ''}`, { onclick: () => { Settings.set('skin.noteStyle', v); UISounds.click(); refresh(); } }, l))),
      h('div.setup-label', 'Note colour'),
      h('div.setup-seg', h(`button${hue < 0 ? '.on' : ''}`, { onclick: () => { Settings.set('skin.hue', -1); UISounds.click(); refresh(); } }, 'Match my colour'),
        h(`button${hue >= 0 ? '.on' : ''}`, { onclick: () => { Settings.set('skin.hue', +hueSlider.value); UISounds.click(); refresh(); } }, 'Pick a colour')),
      hue >= 0 ? hueSlider : null,
      h('div.setup-row', h('span.setup-row-t', 'Darker hold notes'), t));
  },

  async importSkins(paint, show) {
    const files = await pickFiles({ accept: '.osk,.zip', multiple: true });
    if (!files.length) return;
    let last = null;
    for (const f of files) {
      try { last = await SkinManager.importOsk(f); Toast.ok('Skin imported', last.name); }
      catch (e) { Toast.err(`Couldn't import ${f.name}`, friendlyError(e)); }
    }
    if (last) { if (this.preview) this.preview.renderer.layout = null; await SkinManager.select(last.id, { silent: true }); }
    if (this.step.id === 'skin') { paint(); show(); }
  },

  // ─────────────────────────────── helpers ───────────────────────────────
  slider(k, label, min, max, step, fmt, after, evt = 'input') {
    const s = h('input.slider', { type: 'range', min, max, step, value: Settings.get(k), 'aria-label': label });
    const v = h('span.val');
    const upd = () => { const x = parseFloat(s.value); v.textContent = fmt(x); s.style.setProperty('--p', ((x - min) / (max - min) * 100) + '%'); };
    s.addEventListener('input', () => { if (evt === 'input') Settings.set(k, parseFloat(s.value)); upd(); after && after(); });
    if (evt === 'change') s.addEventListener('change', () => Settings.set(k, parseFloat(s.value)));
    s.addEventListener('keydown', e => e.stopPropagation());
    upd();
    return h('div.setup-slider', h('div.row', h('span.setup-row-t', label), h('span.grow'), v), s);
  },
  cleanup: [],
  stopPreview() {
    if (this.preview) { this.preview.stop(); this.preview = null; }
    for (const f of this.cleanup.splice(0)) try { f(); } catch { /* ignore */ }
  },
  /** A generated "beatmap background" for the gameplay preview, so dim and blur are visible even before any
   *  beatmap is installed. Cached as a data URL. */
  previewArt() {
    if (this._art) return this._art;
    const c = document.createElement('canvas'); c.width = 640; c.height = 360;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 640, 360);
    g.addColorStop(0, '#2b1055'); g.addColorStop(0.55, '#7a2d8c'); g.addColorStop(1, '#ff6a88');
    x.fillStyle = g; x.fillRect(0, 0, 640, 360);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 26; i++) {
      const r = 8 + rnd() * 46;
      x.fillStyle = `hsla(${280 + rnd() * 80}, 90%, ${60 + rnd() * 25}%, ${0.25 + rnd() * 0.5})`;
      x.beginPath(); x.arc(rnd() * 640, rnd() * 360, r, 0, Math.PI * 2); x.fill();
    }
    x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 3;
    for (let i = 0; i < 7; i++) { x.beginPath(); x.moveTo(-40 + i * 110, 360); x.lineTo(120 + i * 110, 0); x.stroke(); }
    x.fillStyle = '#fff'; x.font = '700 54px sans-serif'; x.textAlign = 'center';
    x.fillText('ashtonk!mania', 320, 200);
    this._art = c.toDataURL('image/jpeg', 0.85);
    return this._art;
  },
};

/* ===== 18c-wom-import.js ===== */
/* Web-Osu-Mania backups — the .zip from WOM's Settings → Backup & Restore — brought into Ashtonk!mania:
 * the stored beatmaps (beatmapFiles/*.osz), settings and keybinds (settings.json), high scores (highScores.json)
 * and collections (collections.json, or the older savedBeatmapSets.json). WOM's .womr replays and custom sounds
 * have no counterpart here, so scores arrive without their replays. */

const WomImport = {
  /** Does this zip look like a WOM backup (rather than a beatmap or skin archive)? */
  looksLike(zip) {
    return zip.entries.some(e => /^(settings|highScores|collections|storedBeatmapSets|savedBeatmapSets)\.json$/.test(e.name) || /^beatmapFiles\/\d+/.test(e.name));
  },
  /** WOM's zustand stores are saved as {state, version}; older ones as the bare object. */
  state(text) { const o = JSON.parse(text); return o && typeof o === 'object' && 'state' in o ? o.state : o; },

  /** Import a backup file. Returns what came across: {sets, scores, settings, collections, skipped, errors}. */
  async run(file, { onStatus = () => {} } = {}) {
    const zip = new ZipReader(await file.arrayBuffer());
    if (!this.looksLike(zip)) throw new Error('This isn\'t a Web-Osu-Mania backup. In Web-Osu-Mania, open Settings → Backup & Restore and export one.');
    const out = { sets: [], scores: 0, settings: false, collections: 0, skipped: 0, errors: [] };
    const byName = new Map(zip.entries.map(e => [e.name, e]));
    const json = async name => byName.has(name) ? this.state(await zip.readText(byName.get(name))) : null;

    // beatmaps first: scores and collections point at them
    const osz = zip.entries.filter(e => /^beatmapFiles\/\d+.*\.osz$/i.test(e.name));
    const report = { sets: [], skins: [], replays: [], errors: [], warnings: [] };
    for (let i = 0; i < osz.length; i++) {
      const e = osz[i], setId = Number(/^beatmapFiles\/(\d+)/.exec(e.name)[1]);
      onStatus(`Importing beatmaps… ${i + 1}/${osz.length}`);
      try {
        const f = new File([await zip.read(e)], e.name.split('/').pop(), { type: 'application/zip' });
        const sets = await BeatmapManager.importOsz(f, report);
        for (const s of sets) if (!s.onlineId || s.onlineId < 0) { s.onlineId = setId; await DB.put('sets', { ...s, maps: undefined }); }
        out.sets.push(...sets);
      } catch (err) { out.errors.push(`${e.name.split('/').pop()}: ${friendlyError(err)}`); }
    }
    out.errors.push(...report.errors);
    if (out.sets.length) Bus.emit('library:changed');

    onStatus('Importing settings…');
    try { const st = await json('settings.json'); if (st) out.settings = this.applySettings(st); } catch (err) { out.errors.push(`settings.json: ${friendlyError(err)}`); }

    // collections before scores: their songs that aren't in the backup are downloaded, so scores can land on them too
    try {
      const cols = await json('collections.json');
      const saved = await json('savedBeatmapSets.json');
      const all = { ...(cols && typeof cols === 'object' ? cols : {}) };
      if (saved && Array.isArray(saved.savedBeatmapSets)) all.Saved = saved.savedBeatmapSets;
      out.collections = await this.importCollections(all, out, onStatus);
    } catch (err) { out.errors.push(`collections: ${friendlyError(err)}`); }

    onStatus('Importing scores…');
    try { const hs = await json('highScores.json'); if (hs) Object.assign(out, await this.importScores(hs.highScores || hs, out)); } catch (err) { out.errors.push(`highScores.json: ${friendlyError(err)}`); }
    onStatus(null);
    return out;
  },

  /** The WOM settings that mean the same thing here (volumes, scroll, background, offset, keys, a few toggles). */
  applySettings(w) {
    const num = (v, lo, hi) => typeof v === 'number' && isFinite(v) ? clamp(v, lo, hi) : null;
    const set = (k, v) => { if (v !== null && v !== undefined) Settings.set(k, v); };
    set('audio.master', num(w.volume, 0, 1));
    set('audio.music', num(w.musicVolume, 0, 1));
    set('audio.effects', num(w.sfxVolume, 0, 1));
    set('audio.offset', num(w.audioOffset, -300, 300)); // (same sign: positive makes notes arrive later)
    set('gameplay.scrollSpeed', num(w.scrollSpeed, 1, 40) && Math.round(w.scrollSpeed)); // the same scale as WOM's
    set('gameplay.bgDim', num(w.backgroundDim, 0, 1));
    set('gameplay.bgBlur', num(w.backgroundBlur, 0, 1));
    if (typeof w.upscroll === 'boolean') set('gameplay.scrollDirection', w.upscroll ? 'up' : 'down');
    if (typeof w.show300g === 'boolean') set('gameplay.showMax', w.show300g);
    if (typeof w.showFpsCounter === 'boolean') set('graphics.showFps', w.showFpsCounter);
    if (typeof w.performanceMode === 'boolean') set('graphics.performanceMode', w.performanceMode);
    if (typeof w.preferMetadataInOriginalLanguage === 'boolean') set('ui.unicodeMetadata', w.preferMetadataInOriginalLanguage);
    // keybinds: WOM's keyModes[keyCount - 1][column] = [first key, second key] (KeyboardEvent.code, like ours)
    const km = w.keybinds && Array.isArray(w.keybinds.keyModes) ? w.keybinds.keyModes : null;
    if (km) {
      const binds = { ...Settings.get('input.keybinds') };
      km.forEach((cols, i) => {
        if (!Array.isArray(cols) || cols.length !== i + 1) return;
        const b = cols.map(c => (Array.isArray(c) ? c : [c]).filter(k => typeof k === 'string' && k).slice(0, 2));
        if (b.every(c => c.length)) binds[i + 1] = b;
      });
      Settings.set('input.keybinds', binds);
    }
    return true;
  },

  /** WOM mod names → ours (and the playback rate they imply). */
  mods(list) {
    const mods = [], names = { 'Easy': 'EZ', 'No Fail': 'NF', 'Half Time': 'HT', 'Hard Rock': 'HR', 'Sudden Death': 'SD', 'Perfect': 'PF', 'Perfect (SS)': 'PSS',
      'Double Time': 'DT', 'Autoplay': 'AT', 'Random': 'RD', 'Mirror': 'MR', 'Constant Speed': 'CS', 'Hold Off': 'NLN' };
    let rate = 1;
    for (const m of Array.isArray(list) ? list : []) {
      if (typeof m !== 'string') continue;
      if (names[m]) mods.push(names[m]);
      else if (m.startsWith('Accuracy Challenge')) mods.push('AC');
      else if (m.startsWith('Fade In')) mods.push('FI');
      else if (m.startsWith('Fade Out')) mods.push('HD');
      else if (m.startsWith('Percy')) mods.push('PC');
      else if (/Override/.test(m)) mods.push('DA');
      else if (m.startsWith('Song Speed')) { const r = parseFloat(m.split(':')[1]); if (r > 0) { rate = r; mods.push('RT'); } }
    }
    if (mods.includes('DT')) rate = 1.5;
    if (mods.includes('HT')) rate = 0.75;
    return { mods: [...new Set(mods)], rate };
  },

  /** highScores[setId][beatmapId] = [{timestamp, mods, results, replayId}] → scores on the matching difficulties. */
  async importScores(hs, out) {
    let scores = 0, skipped = 0;
    const have = new Set(ScoreManager.scores.map(s => s.id));
    for (const [setId, maps] of Object.entries(hs || {})) {
      for (const [mapId, list] of Object.entries(maps || {})) {
        const set = BeatmapManager.sets.find(s => s.onlineId === Number(setId));
        const map = BeatmapManager.sets.flatMap(s => s.maps).find(m => m.onlineId === Number(mapId)) || (set && set.maps.length === 1 ? set.maps[0] : null);
        for (const h of Array.isArray(list) ? list : [list]) {
          const r = h && h.results;
          if (!r) continue;
          if (!map) { skipped++; continue; }
          const id = `sc-wom-${h.replayId || h.timestamp || uid()}`;
          if (have.has(id)) continue;
          const counts = [r[320], r[300], r[200], r[100], r[50], r[0]].map(n => Math.max(0, Math.round(Number(n) || 0)));
          const acc = Number(r.accuracy) > 1 ? Number(r.accuracy) / 100 : Number(r.accuracy) || OsuMath.accuracy(counts);
          const { mods, rate } = this.mods(h.mods);
          const stars = map.stars || 0;
          const score = {
            id, mapHash: map.hash, mapId: map.id, setId: map.setId,
            title: map.title, artist: map.artist, version: map.version, creator: map.creator,
            keys: map.keys, stars, mods, rate, score: Math.round(Number(r.score) || 0), accuracy: acc, maxCombo: Math.round(Number(r.maxCombo) || 0),
            counts, grade: ScoreSystem.gradeFor(acc, false, mods, counts), passed: true, date: Number(h.timestamp) || Date.now(),
            player: ProfileManager.profile.name, replayId: null, imported: 'wom', srVersion: SR_VERSION,
          };
          score.pp = mods.includes('AT') ? 0 : OsuMath.pp(stars, counts, mods);
          await DB.put('scores', score);
          ScoreManager.scores.push(score); have.add(id);
          scores++;
        }
      }
    }
    if (scores) { ScoreManager.scores.sort((a, b) => a.date - b.date); ScoreManager._reindex(); Bus.emit('scores:changed'); }
    return { scores, skipped: out.skipped + skipped };
  },

  /** WOM collections hold online beatmap sets: any that aren't in the library yet are downloaded (from the same
   *  mirrors as the beatmap listing), then each collection is made here with the same name. */
  async importCollections(all, out, onStatus = () => {}) {
    const have = id => BeatmapManager.sets.find(s => s.onlineId === Number(id));
    const missing = new Map();
    for (const sets of Object.values(all)) if (Array.isArray(sets)) for (const ws of sets) {
      const id = Number(ws && ws.id);
      if (id > 0 && !have(id) && !missing.has(id)) missing.set(id, { id, title: String(ws.title || ''), artist: String(ws.artist || ''), creator: String(ws.creator || '') });
    }
    if (missing.size && navigator.onLine === false) out.errors.push(`${plural(missing.size, 'song')} from your collections couldn't be downloaded: you're offline`);
    else {
      let i = 0, failed = 0;
      for (const set of missing.values()) {
        onStatus(`Downloading songs from your collections… ${++i}/${missing.size}`);
        try { const r = await OnlineBeatmaps.downloadAndImport(set, null, { quiet: true }); out.sets.push(...r.sets); out.downloaded = (out.downloaded || 0) + 1; }
        catch (err) { failed++; if (failed <= 3) out.errors.push(`${set.artist} - ${set.title}: ${friendlyError(err)}`); }
      }
      if (failed > 3) out.errors.push(`…and ${failed - 3} more songs couldn't be downloaded`);
    }
    let n = 0;
    for (const [name, sets] of Object.entries(all)) {
      if (!Array.isArray(sets)) continue;
      const hashes = [];
      for (const ws of sets) { const local = ws && have(ws.id); if (local) hashes.push(...local.maps.map(m => m.hash)); }
      let c = Collections.list.find(x => x.name === name);
      if (!c) { if (!hashes.length && !sets.length) continue; c = await Collections.create(name); }
      c.hashes = [...new Set([...c.hashes, ...hashes])];
      n++;
    }
    if (n) await Collections.save();
    return n;
  },

  /** A short "what came across" line for toasts and the setup screen. */
  summary(r) {
    const parts = [];
    if (r.sets.length) parts.push(plural(r.sets.length, 'beatmap set') + (r.downloaded ? ` (${r.downloaded} downloaded for your collections)` : ''));
    if (r.scores) parts.push(plural(r.scores, 'score'));
    if (r.collections) parts.push(plural(r.collections, 'collection'));
    if (r.settings) parts.push('settings and keybinds');
    return parts.length ? parts.join(', ') : 'nothing new';
  },

  /** Pick a backup and import it, with the usual import pill and a toast. */
  async pickAndImport() {
    const [f] = await pickFiles({ accept: '.zip', multiple: false });
    if (f) return this.importFile(f);
    return null;
  },
  async importFile(f) {
    await AudioManager.resume();
    const pill = h('div.import-pill', h('span.spinner'), h('span', 'Reading backup…'));
    $('#app').appendChild(pill);
    try {
      const r = await this.run(f, { onStatus: m => { if (m) pill.lastChild.textContent = m; } });
      Toast.ok('Web-Osu-Mania backup imported', WomImport.summary(r) + (r.skipped ? ` (${plural(r.skipped, 'score')} for beatmaps that weren't in the backup were left out)` : ''));
      if (r.errors.length) Toast.err('Some of it couldn\'t be imported', r.errors.slice(0, 5).join('\n'));
      if (r.sets.length) App.keepStorage && App.keepStorage();
      return r;
    } catch (e) {
      Toast.err('Couldn\'t import the backup', friendlyError(e));
      return null;
    } finally { pill.remove(); }
  },
};

/* ===== 19-multiplayer.js ===== */
/* Online multiplayer (osu!lazer-style rooms of up to 8, Head to Head or Team Versus, and Quick Play). Talks to the
 * Worker's Durable Objects over a WebSocket (/api/mp/room/<code>); see worker/multiplayer.js for the protocol and rules. */

/** Mods that change the song's speed: in multiplayer they apply to the whole room, once everyone accepts. */
const MP_SPEED_MODS = ['DT', 'NC', 'HT', 'DC', 'RT'];

const Multiplayer = {
  ws: null, room: null, me: null, code: null, quick: false,
  chat: [], opps: new Map(), lastResults: null, rtt: 80, _keep: 0,
  qpEndAt: 0,        // when the current Quick Play phase ends (performance.now() time)
  temp: new Set(),   // beatmap sets downloaded automatically for this room (removed again when leaving)
  fetch: null,       // {onlineSetId, progress, error, done} — the automatic download of the room's beatmap
  myDiffId: null,    // the difficulty (local map id) this player chose from the room's beatmap set

  available() { return /^https?:$/.test(location.protocol); },
  // (while reconnecting after a dropped connection the room stays on screen)
  inRoom() { return !!(this.room && (this.ws || this.reconnecting)); },
  isHost() { return !!this.room && this.room.host === this.me; },
  opponent() { return this.room ? this.room.players.find(p => p.id !== this.me) || null : null; },
  isQP() { return !!(this.room && this.room.qp); },
  isRP() { return !!(this.room && this.room.rp); },
  /** A player's usual star rating (the median of their recent passed plays), so Quick Play pools suit the lobby. */
  skillSR() {
    const stars = ScoreManager.recent(30).filter(s => s.passed).map(s => { const m = BeatmapManager.mapByHash(s.mapHash); return m ? m.stars : 0; }).filter(x => x > 0).sort((a, b) => a - b);
    return stars.length ? stars[Math.floor(stars.length / 2)] : 2.5;
  },
  self() { return this.room ? this.room.players.find(p => p.id === this.me) || null : null; },

  async api(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `Server error (${r.status})`);
    return d;
  },
  /** Open a room: regular (osu!-style head to head, up to 16) or ranked (1v1 Ranked Play), public or private. */
  async create({ ranked = false, isPublic = true, keys = 4 } = {}) {
    const { code } = await this.api('api/mp/new');
    return this.connect(code, true, false, false, ranked ? { mode: 'rp', keys, public: isPublic, skill: RankedSkill.get() } : { public: isPublic });
  },
  join(code) { return this.connect(String(code).trim().toUpperCase(), false, false, false, { skill: RankedSkill.get() }); },

  connect(code, create, quick = false, rejoin = false, opts = {}) {
    if (!rejoin) this.leave(true);
    return new Promise((resolve, reject) => {
      const u = new URL(`api/mp/room/${encodeURIComponent(code)}`, location.href);
      u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
      let ws;
      try { ws = new WebSocket(u); } catch (e) { reject(e); return; }
      this.ws = ws; this.code = code; this.quick = quick; this.opps = new Map(); this.opts = opts;
      if (!rejoin) { this.chat = []; this.lastResults = null; }
      let settled = false;
      const fail = msg => { if (!settled) { settled = true; reject(new Error(msg)); } };
      ws.onopen = () => { ws.send(JSON.stringify({ t: 'hello', name: ProfileManager.profile.name, avatar: ProfileManager.sharedAvatar || '', create, sr: this.skillSR(), ...opts })); this.ping(); };
      ws.onmessage = ev => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.t === 'welcome') { this.me = m.you; this.room = m.room; this.qpClock(m.room); settled = true; resolve(); this.startKeepAlive(); this.autoFetch(); Bus.emit('mp:changed'); return; }
        if (m.t === 'error' && m.fatal) { fail(m.msg); return; }
        this.onMessage(m);
      };
      ws.onerror = () => fail('Couldn\'t reach the multiplayer server.');
      ws.onclose = () => {
        fail('Connection closed.');
        if (this.ws !== ws) return; // left on purpose
        const wasIn = !!this.room;
        this.ws = null; this.stopKeepAlive();
        // dropped: quietly keep trying to get back in (the only notice is "Reconnected")
        if (wasIn) { this.startReconnect(); Bus.emit('mp:changed'); }
      };
    });
  },
  /** Rejoin the room after the connection dropped, retrying with backoff until it works or the player leaves.
   *  The server sees a fresh join, so this player's beatmap, difficulty and mods are sent again afterwards. */
  startReconnect() {
    if (this.reconnecting) return;
    const me = this.self();
    const rc = this.reconnecting = { code: this.code, quick: this.quick, opts: this.opts || {}, tries: 0, create: false, mods: (me && me.mods) || [], diff: this.myDiffId, timer: 0 };
    const attempt = async () => {
      if (this.reconnecting !== rc) return;
      try {
        await this.connect(rc.code, rc.create, rc.quick, true, rc.opts);
        if (this.reconnecting !== rc) return;
        this.reconnecting = null;
        this.syncHasMap();
        if (rc.mods.length) this.send({ t: 'mods', mods: rc.mods });
        if (rc.diff) this.chooseDiff(rc.diff);
        Toast.ok('Reconnected to the room', rc.code);
        Bus.emit('mp:changed');
      } catch (e) {
        if (this.reconnecting !== rc) return;
        // a Quick Play round moved on without us: there's no way back in
        if ((rc.opts.mode === 'qp' || rc.opts.mode === 'rp') && /already started|full/i.test(e.message)) { this.leave(); Toast.err(`Lost the ${rc.opts.mode === 'rp' ? 'Ranked Play' : 'Quick Play'} match`, 'The connection dropped and the match went on without you.'); return; }
        if (/not found/i.test(e.message)) rc.create = true; // everyone left meanwhile: open it again under the same code
        rc.tries++;
        rc.timer = setTimeout(attempt, Math.min(10000, 1000 * 2 ** Math.min(rc.tries, 4)));
      }
    };
    rc.timer = setTimeout(attempt, 600);
  },
  leave(silent = false) {
    if (this.reconnecting) { clearTimeout(this.reconnecting.timer); this.reconnecting = null; }
    this.stopKeepAlive();
    this.myDiffId = null; this.fetch = null;
    if (this.temp.size) this.cleanupTemp();
    if (this.quick && this.code && this.room && this.room.players.length < 2) this.api('api/mp/quick/cancel', { code: this.code }).catch(() => {});
    const ws = this.ws;
    // the room list may still carry the room we just left for a moment: the lobby hides it if we were alone in it
    if (this.room) this.lastLeft = { code: this.room.code, alone: this.room.players.length <= 1, at: Date.now() };
    this.ws = null; this.room = null; this.me = null; this.opps = new Map();
    if (ws) { try { ws.close(1000, 'leave'); } catch { /* already closed */ } }
    if (!silent) Bus.emit('mp:changed');
  },
  send(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
  ping() { this._pingAt = performance.now(); this.send({ t: 'ping', c: this._pingAt }); },
  startKeepAlive() {
    this.stopKeepAlive();
    this._keep = setInterval(() => {
      this.ping();
      if (this.quick && this.room && this.room.players.length < 2) this.api('api/mp/quick/keep', { code: this.code }).catch(() => {});
    }, 15000);
  },
  stopKeepAlive() { clearInterval(this._keep); this._keep = 0; },

  onMessage(m) {
    switch (m.t) {
      case 'room': {
        const had = this.room ? this.room.players.length : 0;
        const key = map => map ? map.hash || 'o' + map.onlineId : null, prev = key(this.room && this.room.map);
        this.room = m.room;
        this.qpClock(m.room);
        if (key(m.room.map) !== prev) this.myDiffId = null;
        this.syncHasMap();
        this.autoFetch();
        if (m.room.players.length > had && had) UISounds.click();
        Bus.emit('mp:changed');
        break;
      }
      case 'chat': this.chat.push(m); if (this.chat.length > 200) this.chat.shift(); Bus.emit('mp:chat', m); break;
      case 'pong': if (m.c === this._pingAt) this.rtt = performance.now() - m.c; break;
      case 'opp': this.opps.set(m.id, m); break;
      case 'qpPool': this.buildPool(m); break;
      case 'abort':
        // Ranked Play: the other player left the song — the round is ours, back to the room
        if (m.by !== this.me && Screens.currentName === 'gameplay' && GameplayScreen.s && GameplayScreen.s.mp && !GameplayScreen.s.finished) {
          const s = GameplayScreen.s; s.finished = true; s.running = false;
          Music.stop(150);
          Toast.show(`${m.name || 'Your opponent'} left the song`, 'You win the round.');
          Screens.go('multiplayer', {}, { replace: true });
        }
        break;
      case 'start': this.launch(m); break;
      case 'skipvote': if (typeof GameplayScreen !== 'undefined') GameplayScreen.mpSkipVotes(m); break;
      case 'skip': if (typeof GameplayScreen !== 'undefined') GameplayScreen.mpSkip(); break;
      case 'results':
        this.lastResults = m.results;
        if (Screens.currentName === 'gameplay' && GameplayScreen.s && GameplayScreen.s.mp && !GameplayScreen.s.finished) {
          const won = m.results.winner === this.me;
          Toast.show(won ? 'Everyone else left — you win!' : 'Match ended', 'Finish the map or press Esc to return to the room.');
        }
        Bus.emit('mp:changed');
        break;
      case 'error': Toast.err(m.msg); break;
    }
  },

  /** The room's beatmap in the local library (by hash, else by osu! beatmap id). */
  localMap(map = this.room && this.room.map) {
    if (!map) return null;
    const byHash = BeatmapManager.mapByHash(map.hash);
    if (byHash && !byHash.problems.length) return byHash;
    if (map.onlineId > 0) for (const m of BeatmapManager.maps.values()) if (m.onlineId === map.onlineId && !m.problems.length) return m;
    return null;
  },
  /** The difficulty this player will play: their own pick from the room's set, else the host's. */
  myMap() {
    const local = this.localMap();
    if (!local) return null;
    const d = this.myDiffId && BeatmapManager.maps.get(this.myDiffId);
    return d && d.setId === local.setId && !d.problems.length ? d : local;
  },
  chooseDiff(mapId) {
    const d = BeatmapManager.maps.get(mapId), local = this.localMap();
    if (!d || !local || d.setId !== local.setId) return;
    this.myDiffId = d.id === local.id ? null : d.id;
    this.send({ t: 'diff', diff: this.myDiffId ? { version: d.version, stars: d.stars, keys: d.keys } : null });
    Bus.emit('mp:changed');
  },

  /** Download the room's beatmap straight away when this player doesn't have it. It's installed only for the
   *  room: `cleanupTemp()` removes it when they leave (unless they choose to keep it). */
  autoFetch() {
    const map = this.room && this.room.map;
    if (!map || (this.isHost() && !this.isQP() && !this.isRP()) || this.localMap(map) || !(map.onlineSetId > 0)) return;
    if (this.fetch && this.fetch.onlineSetId === map.onlineSetId && !this.fetch.error) return;
    const f = this.fetch = { onlineSetId: map.onlineSetId, progress: 0 };
    const before = new Set(BeatmapManager.sets.map(x => x.id));
    let last = 0;
    OnlineBeatmaps.downloadAndImport({ id: map.onlineSetId, title: map.title, artist: map.artist }, p => {
      f.progress = p;
      if (performance.now() - last > 150) { last = performance.now(); Bus.emit('mp:fetch', f); }
    }, { quiet: true }).then(report => {
      for (const set of report.sets) if (!before.has(set.id)) this.temp.add(set.id);
      this.saveTemp();
      f.done = true;
      if (this.fetch === f) Bus.emit('mp:changed');
    }).catch(e => { f.error = e.message; if (this.fetch === f) Bus.emit('mp:changed'); });
  },
  isTemp(map = this.room && this.room.map) { const l = this.localMap(map); return !!(l && this.temp.has(l.setId)); },
  keepTemp() { const l = this.localMap(); if (l) { this.temp.delete(l.setId); this.saveTemp(); Toast.ok('Kept in your library', `${l.artist} - ${l.title}`); Bus.emit('mp:changed'); } },
  saveTemp() { DB.kvSet('mp.tempSets', [...this.temp]).catch(() => {}); },
  /** Remove beatmaps that were only installed for a room (also run at startup, in case the tab was closed). */
  async cleanupTemp() {
    const ids = new Set([...this.temp, ...(await DB.kvGet('mp.tempSets', []).catch(() => []))]);
    this.temp.clear();
    await DB.kvSet('mp.tempSets', []).catch(() => {});
    for (const id of ids) {
      if (!BeatmapManager.setById.has(id)) continue;
      if (Music.meta && Music.meta.setId === id) Music.stop(0);
      await BeatmapManager.removeSet(id).catch(e => console.warn('temp cleanup', e));
    }
  },
  syncHasMap() {
    const me = this.self();
    if (!me || !this.room.map) return;
    const has = !!this.localMap();
    if (has !== me.hasMap) this.send({ t: 'hasMap', has });
  },
  /** This player's own mods; a speed mod (DT, HT…) in the list is proposed to the room instead. */
  setMods(list) {
    const speed = list.filter(x => MP_SPEED_MODS.includes(x)).slice(0, 1);
    this.send({ t: 'mods', mods: list.filter(x => !MP_SPEED_MODS.includes(x) && x !== 'AT') });
    const r = this.room, cur = r ? r.mods || [] : [];
    const pending = r && r.vote ? r.vote.mods : null;
    const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
    if (!same(speed, cur) && !(pending && same(speed, pending))) this.send({ t: 'rate', mods: speed, modConfig: ModSystem.config() });
  },
  vote(yes) { this.send({ t: 'vote', yes }); },
  selectMap(m, mods) {
    const set = BeatmapManager.setById.get(m.setId);
    this.send({ t: 'map', map: { hash: m.hash, title: m.title, artist: m.artist, version: m.version, creator: m.creator, keys: m.keys, stars: m.stars, length: m.length,
      onlineSetId: set && set.onlineId > 0 ? set.onlineId : -1, onlineId: m.onlineId > 0 ? m.onlineId : -1 }, mods: mods.filter(x => x !== 'AT'), modConfig: ModSystem.config() });
  },
  launch(m) {
    if (Array.isArray(m.players) && !m.players.includes(this.me)) { Toast.show('Sitting this round out', 'You didn\'t have the beatmap in time — you\'re back in next round.'); return; }
    const local = this.localMap(m.map) && this.myMap();
    if (!local) { Toast.err('Missing beatmap', 'You need the beatmap to play this match.'); this.send({ t: 'quit' }); return; }
    this.opps = new Map();
    const startAt = performance.now() + m.delay - this.rtt / 2;
    // the room's speed mod (everyone accepted it) plus this player's own mods
    const mods = ModSystem.normalize([...(m.mods || []), ...((m.playerMods && m.playerMods[this.me]) || [])]);
    Game.launch({ mapId: local.id, mods, modConfig: m.modConfig ? { ...ModSystem.config(), ...m.modConfig } : null, mode: 'play', mp: { startAt, players: m.players || null } });
  },
  qpClock(room) { const g = room && (room.qp || room.rp); this.qpEndAt = g && g.left ? performance.now() + g.left - this.rtt / 2 : 0; },
  /** Quick Play host: this round's pool — ranked maps for the lobby's key count around its typical star rating from
   *  the online listing, topped up from this player's own library (offline, or when the search finds too few). */
  async buildPool(m) {
    // Ranked Play sends the deck's star range (between both players' levels); Quick Play a typical star rating
    const keys = m.keys === 7 ? 7 : 4, sr = m.sr > 0 ? m.sr : this.skillSR(), want = clamp(m.count || 5, 1, 20);
    const lo = m.lo > 0 ? m.lo : Math.max(0, sr - 0.75), hi = m.hi > 0 ? m.hi : sr + 0.75, pool = [], seen = new Set();
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    try {
      const page = Math.floor(Math.random() * 4);
      const one = p => OnlineBeatmaps.search({ q: '', status: 'ranked', keys: [keys], minStars: lo, maxStars: hi, page: p, nsfw: false }).catch(() => ({ sets: [] }));
      const search = Promise.all(want > 8 ? [one(page), one(page + 1)] : [one(page)]).then(ds => ({ sets: ds.flatMap(d => d.sets || []) }));
      const d = await Promise.race([search, new Promise((_, rej) => setTimeout(() => rej(new Error('search timed out')), 8000))]);
      for (const set of shuffle([...(d.sets || [])])) {
        const diffs = set.diffs.filter(x => x.keys === keys && x.stars >= lo && x.stars <= hi && x.id > 0);
        if (!diffs.length || seen.has(set.id)) continue;
        seen.add(set.id);
        const x = diffs[Math.floor(Math.random() * diffs.length)];
        pool.push({ hash: '', title: set.title, artist: set.artist, version: x.version, creator: set.creator, keys, stars: x.stars, length: (x.length || 0) * 1000, onlineSetId: set.id, onlineId: x.id });
        if (pool.length >= want) break;
      }
    } catch (e) { console.warn('Quick Play pool: online search failed', e); }
    if (pool.length < Math.min(3, want)) {
      const local = [...BeatmapManager.maps.values()].filter(x => x.keys === keys && !x.problems.length).sort((a, b) => Math.abs(a.stars - sr) - Math.abs(b.stars - sr));
      for (const x of shuffle(local.slice(0, Math.max(12, want + 4)))) {
        const set = BeatmapManager.setById.get(x.setId);
        const onlineSetId = set && set.onlineId > 0 ? set.onlineId : -1;
        if (seen.has(onlineSetId > 0 ? onlineSetId : 'l' + x.setId)) continue;
        seen.add(onlineSetId > 0 ? onlineSetId : 'l' + x.setId);
        pool.push({ hash: x.hash, title: x.title, artist: x.artist, version: x.version, creator: x.creator, keys, stars: x.stars, length: x.length, onlineSetId, onlineId: x.onlineId > 0 ? x.onlineId : -1 });
        if (pool.length >= want) break;
      }
    }
    const g = this.room && (this.room.qp || this.room.rp);
    if (pool.length && g && g.round === m.round) this.send({ t: 'pool', maps: pool });
  },
  pick(i) { this.send({ t: 'pick', i }); },
  setSettings(o) { this.send({ t: 'settings', settings: o }); },
  setTeam(t) { this.send({ t: 'team', team: t }); },
  /** Invite link for the current room: opening it joins the room directly. */
  inviteLink() {
    const u = new URL(location.href);
    u.search = ''; u.hash = '';
    u.searchParams.set('join', this.room.code);
    return u.toString();
  },
  async invite() {
    const link = this.inviteLink(), text = `Join my Ashtonk!mania room (${this.room.code})`;
    // the share sheet where there is one (phones, some desktops), otherwise copy the link
    if (navigator.share) { try { await navigator.share({ title: 'Ashtonk!mania', text, url: link }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(link); Toast.ok('Invite link copied', 'Send it to your friend — opening it joins this room.'); }
    catch { Dialog.prompt('Invite link', link, { ok: 'Done' }); }
  },
  /** Opened from an invite link (?join=CODE): join that room once the game has started. */
  async joinFromLink() {
    const code = new URLSearchParams(location.search).get('join');
    if (!code) return;
    const u = new URL(location.href); u.searchParams.delete('join'); history.replaceState(null, '', u);
    if (!/^[A-Za-z0-9]{4,8}$/.test(code) || !this.available()) return;
    await Screens.go('multiplayer');
    try { await this.join(code); Toast.ok('Joined the room', code.toUpperCase()); }
    catch (e) { Toast.err('Couldn\'t join the room', friendlyError(e)); }
  },
  finish(score, forfeit = false) {
    this.send({ t: 'finish', result: { score: score.score, accuracy: score.accuracy, maxCombo: score.maxCombo, counts: score.counts, grade: score.grade, passed: score.passed, pp: score.pp, forfeit } });
  },
};

/** Ranked Play skill level (in stars, kept on this device): Beginner, Intermediate or Advanced. The deck is dealt
 *  between both players' levels. Until one is chosen it's the nearest level to the player's recent passes. */
const RankedSkill = {
  LEVELS: [['Beginner', 1.5, 'Easy maps to learn on'], ['Intermediate', 3, 'You can pass most normal maps'], ['Advanced', 4.5, 'Hard maps are your thing']],
  nearest(v) { return this.LEVELS.reduce((a, b) => Math.abs(b[1] - v) < Math.abs(a[1] - v) ? b : a); },
  get() {
    let v = NaN;
    try { v = +localStorage.getItem('am.rp.skill'); } catch { /* private mode */ }
    return this.nearest(v >= 0.5 && v <= 10 ? v : Multiplayer.skillSR())[1];
  },
  set(v) { v = this.nearest(v)[1]; try { localStorage.setItem('am.rp.skill', String(v)); } catch { /* private mode */ } return v; },
  name(v) { return this.nearest(v)[0]; },
  /** Three segmented choices; onChange(stars) after each change. */
  picker(value, onChange) {
    const el = h('div.rk-seg', { role: 'radiogroup', 'aria-label': 'Skill level' });
    const paint = () => clearEl(el).append(...this.LEVELS.map(([l, s, d]) => h(`button.rk-opt${this.nearest(value)[1] === s ? '.on' : ''}`, { role: 'radio', 'aria-checked': String(this.nearest(value)[1] === s), title: d,
      onclick: () => { if (this.nearest(value)[1] === s) return; UISounds.click(); value = s; onChange(value); paint(); } }, h('b', l), h('span', `~${s}★`))));
    paint();
    return el;
  },
};

/** Who's online, for invites: one WebSocket to the Worker (/api/mp/presence) for the whole session, which
 *  reconnects on its own. Players show as in the menus, in a room or playing. */
const Presence = {
  ws: null, me: null, players: [], retry: 0, started: false,
  start() {
    if (this.started || !Multiplayer.available()) return;
    this.started = true;
    // only where the Worker serves multiplayer (a plain static copy has no /api)
    fetch('api/health', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.multiplayer) this.connect(); }).catch(() => {});
    const push = () => this.pushStatus();
    Bus.on('mp:changed', push); Bus.on('profile:changed', push); Bus.on('screen:changed', push);
  },
  status() { return Screens.currentName === 'gameplay' ? 'playing' : Multiplayer.inRoom() ? 'room' : 'menu'; },
  connect() {
    const u = new URL('api/mp/presence', location.href);
    u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws;
    try { ws = new WebSocket(u); } catch { this.later(); return; }
    this.ws = ws;
    ws.onopen = () => {
      this.retry = 0;
      this._sent = this.status(); this._name = ProfileManager.profile.name; this._av = ProfileManager.sharedAvatar || '';
      // cid: this tab, so a reconnect replaces its old entry instead of leaving a ghost behind
      if (!this.cid) this.cid = Math.random().toString(36).slice(2, 12);
      ws.send(JSON.stringify({ t: 'hello', name: this._name, status: this._sent, avatar: this._av, cid: this.cid }));
      // every 10 s: tells the server we're still here (silent players drop off the list) and, while someone's
      // looking at who's online, asks for the list again
      clearInterval(this._ping); this._ping = setInterval(() => this.send({ t: this.watching() ? 'list' : 'ping' }), 10000);
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === 'welcome') this.me = m.you;
      else if (m.t === 'online') { this.players = Array.isArray(m.players) ? m.players : []; Bus.emit('presence:changed'); }
      else if (m.t === 'invite') this.onInvite(m);
      else if (m.t === 'invited') Bus.emit('presence:invited', m.to);
      else if (m.t === 'error') Toast.err(m.msg);
    };
    ws.onclose = () => {
      if (this.ws !== ws) return;
      this.ws = null; this.players = []; clearInterval(this._ping);
      Bus.emit('presence:changed');
      this.later();
    };
  },
  later() { clearTimeout(this._t); this._t = setTimeout(() => this.connect(), Math.min(60000, 2000 * 2 ** this.retry++)); },
  send(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
  pushStatus() {
    const st = this.status(), name = ProfileManager.profile.name, av = ProfileManager.sharedAvatar || '';
    if (st === this._sent && name === this._name && av === this._av) return;
    this._sent = st; this._name = name; this._av = av;
    this.send({ t: 'status', status: st, name, avatar: av });
  },
  others() { return this.players.filter(p => p.id !== this.me); },
  /** Is a list of online players on screen (the invite dialog)? */
  watching() { return !!document.querySelector('.inv-list'); },
  refresh() { this.send({ t: 'list' }); },
  /** A player's picture: their chosen preset / uploaded thumbnail when they share one, else their initial. */
  avatarEl(p, size = 44) {
    const a = p && typeof p.avatar === 'string' ? p.avatar : '';
    const url = a.startsWith('preset:') ? AvatarPresets.url(a.slice(7)) : a.startsWith('file:') ? 'avatars/' + encodeURIComponent(a.slice(5)) : a.startsWith('data:image/') ? a : null;
    if (url) return h('img.avatar', { src: url, alt: '', style: { width: size + 'px', height: size + 'px' }, onerror: e => e.target.replaceWith(this.avatarEl({ name: p.name }, size)) });
    return h('div.avatar.avatar-mono', { style: { width: size + 'px', height: size + 'px', fontSize: Math.round(size * 0.45) + 'px' } }, (p && p.name || '?').slice(0, 1).toUpperCase());
  },
  invite(id) { if (Multiplayer.inRoom()) this.send({ t: 'invite', to: id, code: Multiplayer.room.code }); },
  async onInvite(m) {
    const from = m.from && m.from.name || 'Someone';
    if (Multiplayer.inRoom() && Multiplayer.room.code === m.code) return;
    if (Screens.currentName === 'gameplay') {
      // nothing pops up mid-play (as lazer holds notifications back): the invite is asked once the play is over
      this._pendingInvite = { m, at: Date.now() };
      if (!this._inviteOff) this._inviteOff = Bus.on('screen:changed', name => {
        const p = this._pendingInvite;
        if (name === 'gameplay' || !p) return;
        this._pendingInvite = null;
        if (Date.now() - p.at < 5 * 60000) setTimeout(() => this.onInvite(p.m), 700);
      });
      return;
    }
    UISounds.play('check-on');
    const ok = await Dialog.confirm(`${from} invited you!`, `Join their multiplayer room (${m.code})?${Multiplayer.inRoom() ? ' You\'ll leave your current room.' : ''}`, { ok: 'Join', cancel: 'Not now' });
    if (!ok) return;

  /** lazer's lounge: the open custom rooms, refreshed every few seconds while the lobby is on screen. */
  async pollRooms() {
    clearTimeout(this._roomsT);
    const el = this.roomsEl;
    if (!el || !el.isConnected || Multiplayer.inRoom()) return;
    let rooms = null;
    try { const r = await fetch('api/mp/rooms', { cache: 'no-store' }); rooms = r.ok ? (await r.json()).rooms : null; } catch { rooms = null; }
    if (!el.isConnected || Multiplayer.inRoom()) return;
    const left = Multiplayer.lastLeft;
    if (rooms && left && left.alone && Date.now() - left.at < 60000) rooms = rooms.filter(r => !(r.code === left.code && r.players <= 1));
    // rows that haven't changed since the last poll (every 3s) are kept as they are: rebuilding them replayed their
    // slide-in and reloaded their covers, so the whole list blinked
    const prevRows = this._roomRows || new Map(), nextRows = new Map();
    const sigOf = r => JSON.stringify([r.name, r.players, r.size, r.state, r.ranked, r.keys, r.skill, r.host, r.avatar, r.map && [r.map.onlineSetId, r.map.title, r.map.version, r.map.stars]]);
    const listSig = rooms ? rooms.map(r => r.code + sigOf(r)).join('|') : 'x';

    this._roomsSig = listSig;

      const sig = sigOf(r), old = prevRows.get(r.code);

      const bg = h('div.mp-rbg');
      if (r.map && r.map.onlineSetId > 0) bg.style.backgroundImage = `url("${OnlineBeatmaps.coverURL(r.map.onlineSetId, 'card')}")`;
      const full = r.players >= r.size, playing = r.state === 'playing';
      const row = h(`button.mp-room-row${playing ? '.playing' : ''}`, { disabled: full || playing, onclick: async () => {
        UISounds.click(); row.disabled = true;
        try { await Multiplayer.join(r.code); } catch (e) { Toast.err('Couldn\'t join', friendlyError(e)); row.disabled = false; this.pollRooms(); }
      } }, bg, h('div.mp-rshade'),
        h(`span.mp-rstate${playing ? '.on' : ''}${r.ranked ? '.ranked' : ''}`, r.ranked ? (playing ? 'Ranked Play · playing' : 'Ranked Play') : playing ? 'Playing' : 'Open'),
        h('div.mp-rbody', h('div.mp-rname', r.name),
          r.ranked ? h('div.mp-rmap', h('span', `1v1 Ranked Play · ${r.keys || 4}K${r.skill ? ` · ${RankedSkill.name(r.skill)} (~${r.skill}★)` : ''}`))
            : h('div.mp-rmap', r.map ? [starBadge(r.map.stars), h('span', `${r.map.artist} - ${r.map.title} [${r.map.version}]`), h('span.keys-tag', `${r.map.keys}K`)] : h('span.muted', 'No beatmap picked yet')),
          h('div.mp-rmeta', h('span', r.ranked ? 'Beatmap cards · HP · you pick your level when you join' : 'Head to Head · highest score wins'))),
        h('div.mp-rplayers', Presence.avatarEl({ name: r.host, avatar: r.avatar }, 32), h('b', `${r.players}/${r.size}`)),
        h('span.mp-rjoin', full ? 'Full' : playing ? 'In a match' : 'Join'));
      row.addEventListener('pointerenter', () => UISounds.hover());
      // (the slide-in class goes once it has played: moving a row back in would otherwise replay it)
      row.classList.add('anim'); row.addEventListener('animationend', () => row.classList.remove('anim'), { once: true });
      nextRows.set(r.code, { sig, row });

    this._roomRows = nextRows;

  // ── room: the chat panel is built once per room and survives updates, so a half-typed message is

  renderRoom() {
    const r = Multiplayer.room;

    this.refreshRoom();
  },
  buildRoom() {
    const r = Multiplayer.room;
