const OsuMath = {
  /** OD after EZ / HR (osu! applies these to the difficulty value, not to the windows). */
  odAfterMods(od, mods = [], override = null) {
    if (mods.includes('EZ')) return od / 2;
    if (mods.includes('HR')) return Math.min(od * 1.4, 10);
    if (override != null) return override;
    return od;
  },
  hpAfterMods(hp, mods = [], override = null) {
    if (mods.includes('EZ')) return hp / 2;
    if (mods.includes('HR')) return Math.min(hp * 1.4, 10);
    if (override != null) return override;
    return hp;
  },

  /** osu!mania ScoreV2-table hit windows (ms, real time): [MAX, 300, 200, 100, 50, miss]. */
  hitWindows(od) {
    return [
      od <= 5 ? 22.4 - 0.6 * od : 24.9 - 1.1 * od,
      64 - 3 * od, 97 - 3 * od, 127 - 3 * od, 151 - 3 * od, 188 - 3 * od,
    ];
  },

  /** Displayed accuracy (MAX weighted 305). counts: [MAX,300,200,100,50,miss] */
  accuracy(c) {
    const n = c[0] + c[1] + c[2] + c[3] + c[4] + c[5];
    if (!n) return 1;
    return (305 * c[0] + 300 * c[1] + 200 * c[2] + 100 * c[3] + 50 * c[4]) / (305 * n);
  },
  /** Classic accuracy (MAX == 300). */
  accuracyV1(c) {
    const n = c[0] + c[1] + c[2] + c[3] + c[4] + c[5];
    if (!n) return 1;
    return (300 * (c[0] + c[1]) + 200 * c[2] + 100 * c[3] + 50 * c[4]) / (300 * n);
  },
  /** Accuracy used by pp (MAX weighted 320). */
  ppAccuracy(c) {
    const n = c[0] + c[1] + c[2] + c[3] + c[4] + c[5];
    if (!n) return 1;
    return (320 * c[0] + 300 * c[1] + 200 * c[2] + 100 * c[3] + 50 * c[4]) / (320 * n);
  },

  /** Performance points (ManiaPerformanceCalculator). starRating must already include rate mods. */
  pp(starRating, counts, mods = []) {
    const totalHits = counts.reduce((a, b) => a + b, 0);
    if (!totalHits) return 0;
    const acc = this.ppAccuracy(counts);
    let value = 8 * Math.pow(Math.max(starRating - 0.15, 0.05), 2.2) * Math.max(0, 5 * acc - 4) * (1 + 0.1 * Math.min(1, totalHits / 1500));
    if (mods.includes('NF')) value *= 0.75;
    if (mods.includes('EZ')) value *= 0.5;
    return value;
  },
  /** Profile total pp: best score per map, weighted 0.95^i, plus the play-count bonus osu! adds. */
  totalPp(ppList) {
    const sorted = ppList.filter(p => p > 0).sort((a, b) => b - a);
    let total = 0, w = 1;
    for (const p of sorted) { total += p * w; w *= 0.95; }
    const bonus = 416.6667 * (1 - Math.pow(0.995, Math.min(sorted.length, 1000)));
    return { total: total + bonus, weighted: total, bonus };
  },

  /** Letter grade (osu!lazer ManiaScoreProcessor.RankFromScore): SS = only MAX / 300 hits; then 95 / 90 / 80 / 70%
   *  and up for S / A / B / C. */
  grade(acc, counts, failed = false, hidden = false) {
    if (failed) return 'F';
    if (counts && counts[2] + counts[3] + counts[4] + counts[5] === 0) return hidden ? 'XH' : 'SS';
    if (acc >= 0.95) return hidden ? 'SH' : 'S';
    if (acc >= 0.9) return 'A';
    if (acc >= 0.8) return 'B';
    if (acc >= 0.7) return 'C';
    return 'D';
  },

  // https://github.com/ppy/osu/blob/master/osu.Game/Beatmaps/IBeatmapDifficultyInfo.cs
  difficultyRange(d, min, mid, max) {
    if (d > 5) return mid + (max - mid) * (d - 5) / 5;
    if (d < 5) return mid + (mid - min) * (d - 5) / 5;
    return mid;
  },
};

/** ScoreV1 (osu!mania) with the hit-bonus mechanic. Values indexed like J (MAX..miss). */
const SCORE_V1 = {
  value: [320, 300, 200, 100, 50, 0],
  bonusValue: [32, 32, 16, 8, 4, 0],
  bonusChange: [2, 1, -8, -24, -44, -100],
};

/** Legacy mania health: calibrates hpMultiplierNormal by simulating a perfect play, then applies
 *  per-judgement increases (hold-tail misses cost half). */
function computeHpMultiplier(notes, hp, breaks = [], rawHp = hp) {
  const lowestHpEver = OsuMath.difficultyRange(hp, 0.975, 0.8, 0.3);
  const lowestHpEnd = OsuMath.difficultyRange(hp, 0.99, 0.9, 0.4);
  const hpRecoveryAvailable = OsuMath.difficultyRange(hp, 0.04, 0.02, 0);
  let hpMultiplierNormal = 1;
  if (!notes.length) return 1;
  const heads = notes.slice().sort((a, b) => a.time - b.time);
  const drainStart = heads[0].time;
  const increaseFor = (j, hold) => healthIncrease(j, rawHp, hold, hpMultiplierNormal);
  let testDrop = 0.00025;
  for (let guard = 0; guard < 4000; guard++) {
    let currentHp = 1, currentHpUncapped = 1, lastTime = drainStart, currentBreak = 0, fail = false, count = 0;
    const reduce = amt => { currentHpUncapped = Math.max(0, currentHpUncapped - amt); currentHp = Math.max(0, currentHp - amt); };
    const increase = hold => { const a = increaseFor(J.MARV, hold); currentHpUncapped += a; currentHp = Math.max(0, Math.min(1, currentHp + a)); };
    for (const h of heads) {
      count++;
      while (currentBreak < breaks.length && breaks[currentBreak].end <= h.time) { lastTime = h.time; currentBreak++; }
      reduce(testDrop * (h.time - lastTime));
      lastTime = h.end;
      if (currentHp <= lowestHpEver) { fail = true; testDrop *= 0.96; break; }
      const reduction = testDrop * (h.end - h.time);
      const overkill = Math.max(0, reduction - currentHp);
      reduce(reduction);
      if (h.isLN) { increase(true); increase(true); }
      if (overkill > 0 && currentHp - overkill <= lowestHpEver) { fail = true; testDrop *= 0.96; break; }
      if (!h.isLN) increase(false);
    }
    if (!fail && currentHp < lowestHpEnd) { fail = true; testDrop *= 0.94; hpMultiplierNormal *= 1.01; }
    const recovery = (currentHpUncapped - 1) / Math.max(1, count);
    if (!fail && recovery < hpRecoveryAvailable) { fail = true; testDrop *= 0.96; hpMultiplierNormal *= 1.01; }
    if (!fail && !isFinite(hpMultiplierNormal)) return 1;
    if (!fail) return hpMultiplierNormal;
  }
  return hpMultiplierNormal;
}
function healthIncrease(j, hp, hold, mult = 1) {
  switch (j) {
    case J.MISS: return hold ? -(hp + 1) * 0.00375 : -(hp + 1) * 0.0075;
    case J.BAD: return -(hp + 1) * 0.0016;
    case J.GOOD: return 0;
    case J.GREAT: return mult * (0.004 - hp * 0.0004);
    case J.PERF: return mult * (0.005 - hp * 0.0005);
    default: return mult * (0.0055 - hp * 0.0005);
  }
}

/** Star rating: port of osu!lazer's ManiaDifficultyCalculator (Strain skill). */
const ManiaStarRating = {
  DIFFICULTY_MULTIPLIER: 0.018, INDIVIDUAL_DECAY_BASE: 0.125, OVERALL_DECAY_BASE: 0.3,
  DECAY_WEIGHT: 0.9, SECTION_LENGTH: 400, RELEASE_THRESHOLD: 30,

  calculate(notes, keys, rate = 1) {
    if (notes.length < 2) return 0;
    const hos = notes.map(n => ({ startTime: n.time / rate, endTime: (n.isLN ? n.end : n.time) / rate, column: n.col }))
      .sort((a, b) => Math.round(a.startTime) - Math.round(b.startTime));
    const objs = this._diffObjects(hos, keys);
    return this._strain(objs, keys) * this.DIFFICULTY_MULTIPLIER;
  },
  _diffObjects(hos, keys) {
    const objects = [], perCol = Array.from({ length: keys }, () => []);
    for (let i = 1; i < hos.length; i++) {
      const cur = hos[i], last = hos[i - 1];
      const col = perCol[cur.column] || (perCol[cur.column] = []);
      const prevInCol = col[col.length - 1] || null;
      const prevs = new Array(keys).fill(null);
      if (objects.length) {
        const p = objects[objects.length - 1];
        for (let j = 0; j < keys; j++) prevs[j] = p.prevs[j];
        prevs[p.column] = p;
      }
      const o = {
        index: objects.length, startTime: cur.startTime, endTime: cur.endTime, deltaTime: cur.startTime - last.startTime,
        column: cur.column, columnStrainTime: prevInCol ? cur.startTime - prevInCol.startTime : cur.startTime, prevs,
      };
      objects.push(o); col.push(o);
    }
    return objects;
  },
  _strain(objects, keys) {
    const decay = (v, dt, base) => v * Math.pow(base, dt / 1000);
    const bigger = (a, b, d) => a - b > d;
    const logistic = (x, mid, mul, max = 1) => max / (1 + Math.exp(mul * (mid - x)));
    const indiv = new Array(keys).fill(0);
    let highestIndiv = 0, overall = 1, currentStrain = 0, sectionPeak = 0, sectionEnd = 0;
    const peaks = [];
    for (const cur of objects) {
      if (cur.index === 0) sectionEnd = Math.ceil(cur.startTime / this.SECTION_LENGTH) * this.SECTION_LENGTH;
      while (cur.startTime > sectionEnd) {
        peaks.push(sectionPeak);
        const prev = cur.index > 0 ? objects[cur.index - 1] : null;
        const prevStart = prev ? prev.startTime : cur.startTime;
        sectionPeak = decay(highestIndiv, sectionEnd - prevStart, this.INDIVIDUAL_DECAY_BASE) + decay(overall, sectionEnd - prevStart, this.OVERALL_DECAY_BASE);
        sectionEnd += this.SECTION_LENGTH;
      }
      currentStrain *= Math.pow(1, cur.deltaTime / 1000);
      // individual strain
      let holdFactor = 1;
      for (const p of cur.prevs) {
        if (p && bigger(p.endTime, cur.endTime, 1) && bigger(cur.startTime, p.startTime, 1)) { holdFactor = 1.25; break; }
      }
      indiv[cur.column] = decay(indiv[cur.column], cur.columnStrainTime, this.INDIVIDUAL_DECAY_BASE) + 2 * holdFactor;
      highestIndiv = cur.deltaTime <= 1 ? Math.max(highestIndiv, indiv[cur.column]) : indiv[cur.column];
      // overall strain
      let overlapping = false, closestEnd = Math.abs(cur.endTime - cur.startTime), hf = 1, holdAdd = 0;
      for (const p of cur.prevs) {
        if (!p) continue;
        overlapping = overlapping || (bigger(p.endTime, cur.startTime, 1) && bigger(cur.endTime, p.endTime, 1) && bigger(cur.startTime, p.startTime, 1));
        if (bigger(p.endTime, cur.endTime, 1) && bigger(cur.startTime, p.startTime, 1)) hf = 1.25;
        closestEnd = Math.min(closestEnd, Math.abs(cur.endTime - p.endTime));
      }
      if (overlapping) holdAdd = logistic(closestEnd, this.RELEASE_THRESHOLD, 0.27);
      overall = decay(overall, cur.deltaTime, this.OVERALL_DECAY_BASE) + (1 + holdAdd) * hf;
      currentStrain += highestIndiv + overall - currentStrain;
      sectionPeak = Math.max(currentStrain, sectionPeak);
    }
    peaks.push(sectionPeak);
    let diff = 0, w = 1;
    for (const p of peaks.filter(x => x > 0).sort((a, b) => b - a)) { diff += p * w; w *= this.DECAY_WEIGHT; }
    return diff;
  },
};

/* ===== 10-renderer.js ===== */
/* Renderer — Canvas 2D mania stage renderer driven by the TimingEngine clock.
 * All skin geometry is expressed in osu! "480-space" units and scaled by (canvas height / 480),
 * matching how skin.ini [Mania] values are authored. Nothing here decides judgements. */

class ScrollMap {
  constructor(segs) { this.segs = segs; this.i = 0; }
  pos(t) {
    const s = this.segs;
    let i = this.i;
    if (i >= s.length) i = s.length - 1;
    if (t < s[i].time) { i = bsearchLE(s, t, 'time'); if (i < 0) i = 0; }
    else while (i + 1 < s.length && s[i + 1].time <= t) i++;
    this.i = i;
    const g = s[i];
    return g.pos + (t - g.time) * g.vel;
  }
  /** Stateless variant (does not disturb the cached cursor). */
  posAt(t) { let i = bsearchLE(this.segs, t, 'time'); if (i < 0) i = 0; const g = this.segs[i]; return g.pos + (t - g.time) * g.vel; }
  velAt(t) { let i = bsearchLE(this.segs, t, 'time'); if (i < 0) i = 0; return this.segs[i].vel; }
}

class ManiaRenderer {
  /** crop: size the canvas to just the stage (plus room for the health bar / key display) instead of the whole
   *  screen, so each frame clears, fills and composites far fewer pixels. The canvas's parent is the screen. */
  constructor(canvas, { crop = false } = {}) {
    this.canvas = canvas;
    this.crop = crop; this.cropX = 0;
    this._spr = new WeakMap(); this._tx = 0; this._noteRefW = 0;
    if (crop && typeof ResizeObserver !== 'undefined' && canvas.parentElement) {
      // cache the screen size instead of reading clientWidth every frame (that can force a layout)
      this._ro = new ResizeObserver(es => { const r = es[es.length - 1].contentRect; this._hostW = r.width; this._hostH = r.height; });
      this._ro.observe(canvas.parentElement);
    }
    this.ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
    this.layout = null;
    this.effects = [];          // lighting + particles
    this.judgementFx = null;
    this.comboBump = 0;
    this.lastCombo = 0;
    this.keyLight = [];         // release time per column for stage light fade
    this.fontCache = new Map();
    this.healthMode = 'stage';  // 'stage' | 'skin' | null (drawn by the HUD instead)
  }
  setLayout(layout) {
    this.layout = layout;
    this._spr = new WeakMap(); this._noteRefW = 0;
    this.keyLight = new Array(layout.keys).fill(-1e9);
    this.effects = []; this.judgementFx = null; this._lastN = []; this._pN = 0; this._missFx = [];
    this.resize(true);
  }
  dispose() { if (this._ro) this._ro.disconnect(); this._ro = null; }
  /** Distance a note scrolls during one "time range" (scroll speed): osu!lazer scales the time range with the skin's
   *  hit position, so on screen the speed is the same whatever the HitPosition — 402 of 480 units, the default. */
  get scrollLength() { return 402 * (this.s || this.H / 480 || 1); }
  resize(force = false) {
    const c = this.canvas;
    const dpr = Zoom.dpr() * Settings.get('graphics.renderScale');
    if (this.crop) {
      const host = c.parentElement;
      const cw = this._hostW ?? (host ? host.clientWidth : c.clientWidth), ch = this._hostH ?? (host ? host.clientHeight : c.clientHeight);
      const w = Math.max(1, Math.round(cw * dpr)), hh = Math.max(1, Math.round(ch * dpr));
      if (!force && w === this.W && hh === this.H && dpr === this._dpr) return;
      this._dpr = dpr; this.W = w; this.H = hh;
      this._geom();
      let x0 = 0, x1 = w;
      if (this.layout && Number.isFinite(this.stageX)) {
        x0 = clamp(Math.floor(this.stageX - 40 * this.s), 0, w - 1);
        x1 = clamp(Math.ceil(this.stageX + this.stageW + 72 * this.s), x0 + 1, w);
      }
      this.cropX = x0;
      c.width = x1 - x0; c.height = hh;
      c.style.left = (x0 / dpr) + 'px'; c.style.right = 'auto'; c.style.width = ((x1 - x0) / dpr) + 'px';
      return;
    }
    const w = Math.max(1, Math.round(c.clientWidth * dpr)), hh = Math.max(1, Math.round(c.clientHeight * dpr));
    if (!force && w === c.width && hh === c.height) return;
    c.width = w; c.height = hh;
    this.W = w; this.H = hh;
    this._geom();
  }
  _geom() {
    this._spr = new WeakMap(); this._noteRefW = 0; // sizes change: drop the pre-scaled sprites
    const L = this.layout;
    if (!L) return;
    const s = this.H / 480;
    this.s = s;
    // osu!stable/lazer size legacy skin textures in a 768-unit-tall space (POSITION_SCALE_FACTOR 1.6):
    // a texture pixel is H/768 screen pixels, while column widths/positions are in 480-space.
    this.u = this.H / 768;
    this.legacy = !L.skin.builtin;
    const lw = Settings.get('gameplay.laneWidth');
    this.colW = L.columnWidth.map(w => w * s * lw);
    this.colX = [];
    let x = 0;
    for (let i = 0; i < L.keys; i++) {
      this.colX.push(x);
      x += this.colW[i] + (i < L.keys - 1 ? ((L.columnSpacing[i] || 0) + Settings.get('gameplay.laneSpacing')) * s * lw : 0);
    }
    this.stageW = x;
    const pos = Settings.get('gameplay.stagePosition');
    this.stageX = pos === 'skin' ? L.columnStart * s * (this.W / this.H > 4 / 3 ? 1 : 1)
      : pos === 'left' ? this.W * 0.12 : pos === 'right' ? this.W * 0.88 - this.stageW : (this.W - this.stageW) / 2;
    this.stageX += Settings.get('gameplay.stageOffset') / 100 * this.W;
    this.hitY = clamp((clamp(L.hitPosition, 240, 480) + Settings.get('gameplay.hitPositionOffset')) * s, 40 * s, this.H - 4);
    this.up = Settings.get('gameplay.scrollDirection') === 'up' || L.upsideDown;
  }
  /** Map a down-scroll rect to the actual direction and draw an image. */
  _img(img, x, yTop, w, h, flipY = false) {
    if (!img || w <= 0 || h <= 0) return;
    if (this.up) yTop = this.H - yTop - h;
    if (flipY) {
      const c = this.ctx;
      c.save(); c.translate(x, yTop + h); c.scale(1, -1); c.drawImage(img, 0, 0, w, h); c.restore();
      return;
    }
    this.ctx.drawImage(img, x, yTop, w, h);
  }
  _rect(x, yTop, w, h) { if (this.up) yTop = this.H - yTop - h; this.ctx.fillRect(x, yTop, w, h); }
  _noteH(tex, i) {
    const L = this.layout;
    if (!tex) return 0;
    // note height follows the narrowest column (or WidthForNoteHeightScale) so every column's notes match
    const w = this._noteRefW || (this._noteRefW = L.widthForNoteHeightScale > 0 ? L.widthForNoteHeightScale * this.s * Settings.get('gameplay.laneWidth') : Math.min(...this.colW));
    return tex.h * (w / tex.w);
  }
  /** A copy of `img` pre-scaled to exactly w×h device pixels (optionally flipped), cached per image and size.
   *  Drawing it 1:1 at a whole-pixel position is much cheaper than resampling the texture for every note. */
  _sprite(img, w, h, flip) {
    const W = Math.max(1, Math.round(w)), Hh = Math.max(1, Math.round(h));
    let m = this._spr.get(img);
    if (!m) { m = new Map(); this._spr.set(img, m); }
    const key = W * 16384 + Hh * 2 + (flip ? 1 : 0);
    let c = m.get(key);
    if (!c) {
      c = document.createElement('canvas'); c.width = W; c.height = Hh;
      const x = c.getContext('2d');
      if (flip) { x.translate(0, Hh); x.scale(1, -1); }
      x.drawImage(img, 0, 0, W, Hh);

  /** Like _img for fixed-size textures (notes, keys): drawn from a pre-scaled sprite, snapped to whole pixels. */
  _spriteImg(img, x, yTop, w, h, flipY = false) {
    if (!img || w <= 0 || h <= 0) return;
    if (this.up) yTop = this.H - yTop - h;
    const tx = this._tx; // translation from stage space to device pixels
    this.ctx.drawImage(this._sprite(img, w, h, flipY), Math.round(x + tx) - tx, Math.round(yTop));
  }

  /** Render a frame. g: {now, posNow, scroll:ScrollMap, pxPerMs, engine, held[], hidden:'HD'|'FI'|null, realNow} */
  render(g) {
    const L = this.layout;
    if (!L) return;
    this.resize();
    const ctx = this.ctx, s = this.s, K = L.keys, H = this.H;
    const realNow = g.realNow ?? performance.now();
    ctx.setTransform(1, 0, 0, 1, -this.cropX, 0);
    ctx.clearRect(this.cropX, 0, this.canvas.width, H);
    ctx.save();
    ctx.translate(this.stageX, 0);
    this._tx = this.stageX - this.cropX;

    // column backgrounds, snapped to whole device pixels: adjacent columns then share an exact edge instead of
    // two anti-aliased half-covered pixels, which let the background show through as thin vertical seams
    const sx = this.stageX;
    for (let i = 0; i < K; i++) {
      const x0 = Math.round(sx + this.colX[i]) - sx, x1 = Math.round(sx + this.colX[i] + this.colW[i]) - sx;
      ctx.fillStyle = rgba(L.colours.column[i], Settings.get('gameplay.stageOpacity'));
      ctx.fillRect(x0, 0, x1 - x0, H);
    }
    const dim = Settings.get('skin.dim');
    if (dim > 0) { ctx.fillStyle = `rgba(0,0,0,${dim})`; ctx.fillRect(0, 0, this.stageW, H); }
    // column lines
    if (L.columnLineWidth.some(w => w > 0)) {
      ctx.fillStyle = rgba(L.colours.columnLine, 0.5);
      for (let i = 0; i <= K; i++) {
        const w = (L.columnLineWidth[i] || 0) * s * 0.5;
        if (w <= 0) continue;
        const x = i < K ? this.colX[i] : this.stageW;
        ctx.fillRect(x - w / 2, 0, w, this.hitY);
      }
    }
    const pxPerMs = g.pxPerMs;
    const noteOffset = Settings.get('gameplay.noteOffset') * s;
    const yOf = pos => this.hitY + noteOffset - (pos - g.posNow) * pxPerMs;
    // stage light (key press glow)
    if (Settings.get('skin.effects')) {
      for (let i = 0; i < K; i++) {
        const t = L.tinted.stageLight[i];
        if (!t) continue;
        let a = 0;
        if (g.held[i]) a = 1; else { const dt = realNow - this.keyLight[i]; if (dt < 120) a = 1 - dt / 120; }
        if (a <= 0) continue;
        ctx.globalAlpha = a;
        const h = t.h * (this.legacy ? this.u : s);
        const bottom = (L.lightPosition + Settings.get('gameplay.hitPositionOffset')) * s;
        this._img(t.frameAt(realNow), this.colX[i], bottom - h, this.colW[i], h);
        ctx.globalAlpha = 1;
      }

    if (L.tex.stageHint) {
      const t = L.tex.stageHint, h = t.h * (this.legacy ? this.u : s);
      this._img(t.img, 0, this.hitY - h / 2, this.stageW, h);
    }

      for (let i = 0; i < K; i++) {
        const t = g.held[i] ? (L.tex.keyD[i] || L.tex.key[i]) : L.tex.key[i];
        if (!t) continue;

          // legacy keys: stretched to the column width, authored height kept (anchored to the bottom)
          const h = t.h * this.u;
          this._spriteImg(t.img, this.colX[i], H - h, this.colW[i], h);
        } else {
          // built-in keys: receptor (25% down the texture) centred on where notes are hit
          const h = t.h * (this.colW[i] / t.w);
          const nh = this._noteH(L.tex.note[i], i);
          const top = this.hitY - nh / 2 - h * 0.25;
          this._spriteImg(t.img, this.colX[i], top, this.colW[i], Math.max(h, H - top));
        }
      }
    };

    // notes
    if (g.engine) this._drawNotes(g, yOf, realNow);

    if (L.judgementLine) {
      ctx.fillStyle = rgba(L.colours.judgementLine, 0.9);
      this._rect(0, this.hitY - Math.max(1, s * 0.5), this.stageW, Math.max(1, s * 0.5));
    }
    if (!L.keysUnderNotes) drawKeys();
    // stage sides / bottom
    const us = this.legacy ? this.u : s;
    if (L.tex.stageLeft) { const t = L.tex.stageLeft, w = t.w * us; ctx.drawImage(t.img, -w, 0, w, H); }
    if (L.tex.stageRight) { const t = L.tex.stageRight, w = t.w * us; ctx.drawImage(t.img, this.stageW, 0, w, H); }
    if (L.tex.stageBottom) {
      const t = L.tex.stageBottom, w = t.w * us, h = t.h * us;
      this._img(t.img, (this.stageW - w) / 2, H - h, w, h);
    }
    // lighting
    if (Settings.get('gameplay.hitLighting')) this._drawLighting(g, realNow);
    this._drawParticles(realNow);
    // judgement & combo
    if (g.engine) {
      this._drawJudgement(realNow);
      this._drawCombo(g.engine.score.combo, realNow);
    }
    ctx.restore();
    if (g.engine) {
      // (the osu!lazer-style bar is part of the HUD, not the canvas)
      if (this.healthMode === 'stage') this._drawHealth(g.engine.health.value);
      else if (this.healthMode === 'skinstage') this._drawSkinHealth(g.engine.health.value);
      if (Settings.get('input.keyOverlay')) this._drawKeyOverlay(g);
    }
  }

  /** Hidden / Fade In lane cover: `coverage` is the fraction of the lane (above the receptors) that is covered. */
  _noteAlpha(y, hidden) {
    if (!hidden) return 1;
    const f = y / this.hitY, c = clamp(this.coverage ?? 0.5, 0.1, 0.9), fade = 0.12;
    if (hidden === 'HD') return clamp((1 - c - f) / fade + 1, 0, 1);
    return clamp((f - c) / fade, 0, 1);
  }

  /** Hidden / Fade In for long notes: the note is drawn once per horizontal band of the lane, each band clipped
   *  and given that band's opacity, so the covered part of the lane hides the body too (one opacity for the
   *  whole note let a visible head drag its body through the cover). */
  _coverBands(hidden) {
    const hY = this.hitY, c = clamp(this.coverage ?? 0.5, 0.1, 0.9), fade = 0.12, steps = 10, out = [];
    const r0 = (hidden === 'HD' ? 1 - c : c) * hY, r1 = r0 + fade * hY;
    for (let k = 0; k < steps; k++) {
      const a = (k + 0.5) / steps;
      out.push([r0 + (r1 - r0) * k / steps, r0 + (r1 - r0) * (k + 1) / steps, hidden === 'HD' ? 1 - a : a]);

    return out;
  }
  _drawNotes(g, yOf, realNow) {
    const L = this.layout, ctx = this.ctx, eng = g.engine, K = L.keys, sc = g.scroll;
    const top = -this.H * 0.1;
    const bands = g.hidden ? this._coverBands(g.hidden) : null;
    for (let c = 0; c < K; c++) {
      const col = eng.columns[c];
      const x = this.colX[c], w = this.colW[c];
      const texN = L.tex.note[c], texH = L.tex.noteH[c], texL = L.tex.noteL[c], texT = L.tex.noteT[c];
      const nh = texN ? this._noteH(texN, c) : 0;
      for (let i = eng.ptr[c]; i < col.length; i++) {
        const n = col[i];
        if (n.state === NS.DONE || (n.state === NS.MISSED && !n.isLN)) continue;
        // scroll positions don't change during a play: computed once per note
        if (n._sc !== sc) { n._sc = sc; n._hp = sc.pos(n.time); n._tp = n.isLN ? sc.posAt(g.percy ? Math.max(n.time, n.end - g.percy) : n.end) : 0; }
        let yHead = yOf(n._hp);
        if (yHead < top && !n.isLN) break;
        if (n.isLN) {
          const yTail = yOf(n._tp);
          if (yTail > this.H + 50 && n.state !== NS.HOLDING) continue;
          if (yHead < top && yTail < top) break;
          if (n.state === NS.HOLDING) yHead = Math.min(yHead, this.hitY);
          const mult = n.state === NS.DROPPED || n.state === NS.MISSED ? 0.45 : 1;
          const draw = () => {
            const hh = this._noteH(texH || texN, c);
            const th = texT ? this._noteH(texT, c) : 0;
            // body runs from the head's centre to the tail's centre; the tail cap is drawn flipped over the
            // body end in down-scroll (legacy skins author tails as "caps" that round the body off)
            const bodyTop = yTail - th / 2, bodyBottom = yHead - hh / 2;
            if (texL && bodyBottom > bodyTop) this._drawBody(texL, x, w, bodyTop, bodyBottom, L.noteBodyStyle[c], realNow);
            if (texT && yTail - th < yHead - hh / 2) this._spriteImg(texT.frameAt(realNow), x, yTail - th, w, th, !this.up);
            if (texH || texN) this._spriteImg((texH || texN).frameAt(realNow), x, yHead - hh, w, hh);
          };
          if (!bands) { ctx.globalAlpha = mult; draw(); ctx.globalAlpha = 1; continue; }
          const y0 = yTail - (texT ? this._noteH(texT, c) : 0), y1 = yHead;
          for (const [b0, b1, a] of bands) {
            const lo = Math.max(b0, y0), hi = Math.min(b1, y1);
            if (hi <= lo || a <= 0) continue;
            ctx.save();
            ctx.beginPath(); ctx.rect(x - 1, this.up ? this.H - b1 : b0, w + 2, b1 - b0); ctx.clip();
            ctx.globalAlpha = a * mult; draw();
            ctx.restore();
          }

          if (yHead > this.H + 60) continue;
          const a = this._noteAlpha(yHead, g.hidden) * (n.state === NS.MISSED ? 0.5 : 1);
          if (a <= 0) continue;
          ctx.globalAlpha = a;
          if (texN) this._spriteImg(texN.frameAt(realNow), x, yHead - nh, w, nh);
          ctx.globalAlpha = 1;
        }
      }
    }
    // missed notes fading out (lazer: FadeOut(150, Easing.In))
    const mf = this._missFx;
    if (mf && mf.length) {
      let keep = 0;
      for (let i = 0; i < mf.length; i++) {
        const f = mf[i], el = realNow - f.t0;
        if (el >= 150 || f.n.col >= K) continue;
        mf[keep++] = f;
        const n = f.n, c = n.col, texN = L.tex.note[c];
        if (!texN) continue;
        if (n._sc !== sc) { n._sc = sc; n._hp = sc.pos(n.time); n._tp = 0; }
        const y = yOf(n._hp), nh = this._noteH(texN, c);
        if (y - nh > this.H) continue;
        const k = el / 150;
        ctx.globalAlpha = (1 - k * k) * this._noteAlpha(y, g.hidden) * 0.9;
        this._spriteImg(texN.frameAt(realNow), this.colX[c], y - nh, this.colW[c], nh);
      }
      mf.length = keep;
      ctx.globalAlpha = 1;
    }
  }
  _drawBody(tex, x, w, top, bottom, style, realNow) {
    const img = tex.frameAt(realNow);
    const len = bottom - top;
    if (style === 0) { this._img(img, x, top, w, len); return; }
    const th = Math.max(2, tex.h * (w / tex.w));
    const ctx = this.ctx;
    ctx.save();
    const clipY = this.up ? this.H - bottom : top;
    ctx.beginPath(); ctx.rect(x, clipY, w, len); ctx.clip();
    if (style === 2) { for (let y = bottom - th; y > top - th; y -= th) this._img(img, x, y, w, th); }
    else { for (let y = top; y < bottom; y += th) this._img(img, x, y, w, th); }
    ctx.restore();
  }

  // ── effects
  onJudgement(e, realNow) {
    const L = this.layout;
    if (!L) return;
    // osu!lazer: a missed note keeps scrolling while it fades out over 150 ms instead of vanishing
    if (e.j === J.MISS && !e.note.isLN) (this._missFx || (this._missFx = [])).push({ n: e.note, t0: realNow });
    // culling: a new hit light replaces the column's previous one (dense streams used to stack them)
    if (e.j !== J.MISS && Settings.get('gameplay.hitLighting') && (!e.note.isLN || e.tail)) {
      const fx = { type: 'N', col: e.col, t0: realNow };
      (this._lastN || (this._lastN = []))[e.col] = fx;
      this.effects.push(fx);
    }
    if (Settings.get('gameplay.showJudgements') && (e.j !== J.MARV || Settings.get('gameplay.showMax'))) {
      const thr = Settings.get('gameplay.earlyLate');
      const el = thr > 0 && e.err != null && e.j !== J.MARV && Math.abs(e.err) >= thr ? (e.err < 0 ? 'EARLY' : 'LATE') : null;
      this.judgementFx = { j: e.j, t0: realNow, el };
    }
    if (Settings.get('graphics.particles') && e.j <= J.GREAT) {
      // at most ~96 particles alive at once, however dense the chart
      const n = Math.min(e.j === J.MARV ? 7 : 4, Math.max(0, 96 - (this._pN || 0)));
      this._pN = (this._pN || 0) + n;
      for (let k = 0; k < n; k++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
        const sp = (0.25 + Math.random() * 0.45) * this.s;
        this.effects.push({ type: 'P', col: e.col, t0: realNow, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          color: rgba(L.colours.light[e.col]), life: 380 + Math.random() * 200 });
      }
    }
  }
  onRelease(col, realNow) { this.keyLight[col] = realNow; }

  _drawLighting(g, realNow) {
    const L = this.layout, ctx = this.ctx, s = this.s;
    ctx.globalCompositeOperation = 'lighter';
    // hold lighting
    const eng = g.engine;
    if (eng) for (let c = 0; c < L.keys; c++) {
      if (!eng.holding[c]) continue;
      const t = L.tinted.lightingL[c];
      if (!t) continue;
      const w = this._lightW(t, c, L.lightingLWidth), hh = t.h * (w / t.w);
      const cx = this.colX[c] + this.colW[c] / 2;
      this._img(t.frameAt(realNow), cx - w / 2, this.hitY - hh / 2, w, hh);
    }
    // hit lighting (effects are compacted in place: no new array every frame)
    let keep = 0;
    const fx = this.effects;
    for (let i = 0; i < fx.length; i++) {
      const e = fx[i];
      if (e.type !== 'N') { fx[keep++] = e; continue; }
      if (this._lastN && this._lastN[e.col] !== e) continue; // superseded by a newer hit in this column
      const t = L.tinted.lightingN[e.col];
      if (!t) continue;
      const el = realNow - e.t0;
      const multi = t.frames.length > 1;
      const dur = multi ? t.frames.length / t.fps * 1000 : 180;
      if (el > dur) continue;
      const w0 = this._lightW(t, e.col, L.lightingNWidth);
      const sc = multi ? 1 : 1 + el / dur * 0.25;
      const w = w0 * sc, hh = t.h * (w0 / t.w) * sc;
      ctx.globalAlpha = multi ? 1 : 1 - el / dur;
      const cx = this.colX[e.col] + this.colW[e.col] / 2;
      this._img(t.frameAt(el, false), cx - w / 2, this.hitY - hh / 2, w, hh);
      ctx.globalAlpha = 1;
      fx[keep++] = e;
    }
    fx.length = keep;
    ctx.globalCompositeOperation = 'source-over';
  }
  /** Hit/hold lighting width. Legacy skins follow lazer: texture size × (LightingNWidth or column width) / 30. */
  _lightW(t, c, widths) {
    const L = this.layout;
    if (this.legacy) {
      const cw = widths[c] > 0 ? widths[c] : L.columnWidth[c] * Settings.get('gameplay.laneWidth');
      return t.w * this.u * cw / 30;
    }
    return widths[c] > 0 ? widths[c] * this.s : t.w * this.s;
  }
  _drawParticles(realNow) {
    const ctx = this.ctx;
    const fx = this.effects;
    let keep = 0;
    for (let i = 0; i < fx.length; i++) {
      const e = fx[i];
      if (e.type !== 'P') { fx[keep++] = e; continue; }
      const el = realNow - e.t0;
      if (el > e.life) continue;
      const x = this.colX[e.col] + this.colW[e.col] / 2 + e.vx * el;
      let y = this.hitY + e.vy * el + 0.0006 * this.s * el * el;
      if (this.up) y = this.H - y;
      ctx.globalAlpha = 1 - el / e.life;
      ctx.fillStyle = e.color;
      const r = (e.star ? 3.2 : 2) * this.s * 0.5 * (1 - el / e.life * 0.5);
      if (e.star) {
        ctx.beginPath();
        for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + el / 200, rr = k % 2 ? r * 0.4 : r * 1.6; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
        ctx.fill();
      } else ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.globalAlpha = 1;
      fx[keep++] = e;
    }
    fx.length = keep;
    this._pN = 0; for (let i = 0; i < keep; i++) if (fx[i].type === 'P') this._pN++;
  }
  _drawJudgement(realNow) {
    const fx = this.judgementFx;
    if (!fx) return;
    const L = this.layout, el = realNow - fx.t0;
    const t = L.judgement[JUDGEMENTS[fx.j].id];
    if (!t) return;
    const total = t.frames.length > 1 ? Math.max(t.frames.length / t.fps * 1000, 300) : 360;
    if (el > total) { this.judgementFx = null; return; }

    const pop = t.frames.length > 1 ? 1 : (el < 60 ? 1.1 - 0.1 * (el / 60) : 1);
    const k = (this.legacy ? this.u : this.s * 0.8) * 0.6 * sk * pop;
    const w = t.w * k, hh = t.h * k;

    this.ctx.globalAlpha = el > total - 100 ? (total - el) / 100 : 1;
    this._img(t.frameAt(el, false), this.stageW / 2 - w / 2, y - hh / 2, w, hh);
    if (fx.el) {
      const ctx = this.ctx, size = Math.round(6.5 * this.s);
      ctx.font = `900 ${size}px Torus, Outfit, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const yy = this.up ? this.H - (y + hh / 2 + size) : y + hh / 2 + size * 0.9;
      ctx.lineWidth = Math.max(2, size / 5); ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(fx.el, this.stageW / 2, yy);
      ctx.fillStyle = fx.el === 'EARLY' ? '#6cc6ff' : '#ff8a6c'; ctx.fillText(fx.el, this.stageW / 2, yy);
    }
    this.ctx.globalAlpha = 1;
  }
  _drawCombo(combo, realNow) {
    if (combo !== this.lastCombo) { if (combo > this.lastCombo) this.comboBump = realNow; this.lastCombo = combo; }
    if (combo < 2) return;
    const L = this.layout, ctx = this.ctx, s = this.s;
    const el = realNow - this.comboBump;
    const bump = Settings.get('gameplay.comboEffects') && el < 90 ? 1 + 0.12 * (1 - el / 90) : 1;
    const y = L.comboPosition * s;
    const cx = this.stageW / 2;
    const sk = Settings.get('skin.scale');
    const text = String(combo);
    if (L.font) {
      const glyphs = text.split('').map(ch => L.font.glyphs[ch]).filter(Boolean);
      const hh = glyphs[0].h * (this.legacy ? this.u : s * 0.8) * sk * bump;
      const widths = glyphs.map(gl => gl.w * (hh / gl.h));
      const ov = L.font.overlap * (this.legacy ? this.u : s * 0.8) * sk;
      const total = widths.reduce((a, b) => a + b, 0) - ov * (glyphs.length - 1);
      let x = cx - total / 2;
      glyphs.forEach((gl, k) => { this._img(gl.img, x, y - hh / 2, widths[k], hh); x += widths[k] - ov; });
      return;
    }
    const size = Math.round(26 * s * sk * bump);
    ctx.font = `800 ${size}px Torus, Outfit, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const yy = this.up ? this.H - y : y;
    ctx.lineWidth = Math.max(2, size / 8); ctx.strokeStyle = 'rgba(0,0,0,.7)';

  }
  /** Health: a slim bar beside the stage running from near the top down to the bottom of the screen.
   *  The value eases smoothly, glows in the accent colour and turns red (with a gentle pulse) when low. */
  _drawHealth(v) {

    const dt = Math.min(100, now - (this._hpT || now)); this._hpT = now;

    const len = bottom - top, r = w / 2;
    const bar = (y0, y1) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y0, w, y1 - y0, [r, r, 0, 0]) : ctx.rect(x, y0, w, y1 - y0); ctx.fill(); };
    // track
    ctx.fillStyle = 'rgba(255,255,255,.08)'; bar(top, bottom);
    if (hp <= 0) return;
    const low = hp < 0.3;
    const y = bottom - len * hp;
    const accent = this._hpAccent || (this._hpAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff66ab');
    const c1 = low ? '#ff5a6e' : accent, c2 = low ? '#ff9a6e' : '#ffffff';
    const pulse = low ? 0.55 + 0.45 * Math.abs(Math.sin(now / 220)) : 1;
    // soft glow (a wider translucent bar is much cheaper than shadowBlur)
    ctx.globalAlpha = 0.18 * pulse; ctx.fillStyle = c1;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - w, y - w, w * 3, bottom - y + w, [w * 1.5, w * 1.5, 0, 0]) : ctx.rect(x - w, y - w, w * 3, bottom - y + w); ctx.fill();
    ctx.globalAlpha = 1;
    const grd = ctx.createLinearGradient(0, y, 0, bottom);
    grd.addColorStop(0, c2); grd.addColorStop(0.08, c1); grd.addColorStop(1, c1);
    ctx.fillStyle = grd; bar(y, bottom);
    // bright head
    ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.9 * pulse;
    ctx.beginPath(); ctx.arc(x + r, y + r, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /** The skin's scorebar, as osu!stable draws it in mania: turned upright beside the stage, filling upwards. */
  _drawSkinHealth(v) {
    const L = this.layout, col = L.tex.scorebarColour, bg = L.tex.scorebarBg;
    if (!col) return;
    const ctx = this.ctx, now = performance.now();
    const dt = Math.min(100, now - (this._hpT || now)); this._hpT = now;
    this._hp = this._hp == null ? v : this._hp + (v - this._hp) * Math.min(1, dt / 120);
    const hp = clamp(this._hp, 0, 1);
    const ref = bg || col;
    // screen px per skin px: the bar spans most of the height at most, and stays inside the room beside the stage
    const k = Math.min(this.s, this.H * 0.94 / ref.w, 66 * this.s / ref.h);
    ctx.save();
    ctx.translate(Math.round(this.stageX + this.stageW + 2 * this.s), this.H);
    ctx.rotate(-Math.PI / 2);
    if (bg) ctx.drawImage(bg.img, 0, 0, bg.w * k, bg.h * k);
    // fill offset inside the background (osu!: 4.8,16 for old-style skins, 12,12.5 with a scorebar-marker)
    const [ox, oy] = !bg ? [0, 0] : L.scorebarNewStyle ? [12, 12.5] : [4.8, 16];
    if (hp > 0) {
      const f = col.frameAt(now);
      ctx.drawImage(f, 0, 0, f.width * hp, f.height, ox * k, oy * k, col.w * k * hp, col.h * k);
    }
    ctx.restore();
  }
  _drawKeyOverlay(g) {
    const ctx = this.ctx, s = this.s, K = this.layout.keys;
    const size = 14 * s, gap = 2 * s;
    const x0 = this.stageX + this.stageW + 14 * s, y0 = this.H * 0.5;
    ctx.font = `700 ${Math.round(size * 0.36)}px Torus, Outfit, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < K; i++) {
      const y = y0 + i * (size + gap);
      ctx.fillStyle = g.held[i] ? rgba(this.layout.colours.light[i], 0.85) : 'rgba(20,12,34,.75)';
      ctx.fillRect(x0, y, size * 2.2, size);
      ctx.fillStyle = g.held[i] ? '#000' : '#ddd';
      ctx.fillText(`${g.keyLabels?.[i] || i + 1}  ${g.engine.pressCounts[i]}`, x0 + size * 1.1, y + size / 2);
    }
  }
}

/* ===== 11-managers.js ===== */
/* ScoreManager, ReplayManager, StatisticsManager, ProfileManager, CollectionManager, Favorites, DataManager. */

const ScoreManager = {
  scores: [],                // all, newest last
  byHash: new Map(),         // mapHash -> scores[]
  async init() {
    this.scores = (await DB.getAll('scores')).sort((a, b) => a.date - b.date);
    this._reindex();
  },
  _reindex() {
    this.byHash.clear();
    for (const s of this.scores) {
      if (!this.byHash.has(s.mapHash)) this.byHash.set(s.mapHash, []);
      this.byHash.get(s.mapHash).push(s);
    }
  },
  /** The score shown and compared: osu!lazer's standardised score when that's the chosen display (scores set
   *  before it existed keep their classic one), else the classic ScoreV1 score. Works on saved scores and live ones. */
  value(s) { return Settings.get('gameplay.scoring') === 'standardised' && s.scoreStd != null ? s.scoreStd : s.score; },
  forMap(hash) { return (this.byHash.get(hash) || []).slice().sort((a, b) => this.value(b) - this.value(a) || b.accuracy - a.accuracy); },
  best(hash) { const l = this.forMap(hash).filter(s => s.passed); return l[0] || null; },
  playCount(hash) { return (this.byHash.get(hash) || []).length; },
  lastPlayed(hash) { const l = this.byHash.get(hash); return l && l.length ? l[l.length - 1].date : 0; },
  recent(n = 20) { return this.scores.slice(-n).reverse(); },
  /** pp of a score (osu!mania formula). Older scores without stored pp are computed on demand. */
  ppOf(s) {
    if (!s || !s.passed || (s.mods || []).includes('AT')) return 0;
    if (typeof s.pp === 'number' && s.srVersion === SR_VERSION) return s.pp;
    const m = typeof BeatmapManager !== 'undefined' ? BeatmapManager.mapByHash(s.mapHash) : null;
    const stars = (s.rate || 1) === 1 && m && m.srVersion === SR_VERSION ? m.stars : (s.stars || 0);
    return OsuMath.pp(stars, s.counts || [0, 0, 0, 0, 0, 0], s.mods || []);
  },
  /** Best pp per beatmap (osu! counts one score per map toward the total). */
  bestPpPerMap(scores = this.scores) {
    const best = new Map();
    for (const s of scores) {
      const pp = this.ppOf(s);
      if (pp > 0 && (!best.has(s.mapHash) || best.get(s.mapHash).pp < pp)) best.set(s.mapHash, { pp, score: s });
    }
    return [...best.values()].sort((a, b) => b.pp - a.pp);
  },
  totalPp(scores = this.scores) { return OsuMath.totalPp(this.bestPpPerMap(scores).map(x => x.pp)); },
  /** Total pp after each play, for the profile/statistics history graph. */
  ppHistory() {
    const out = [], best = new Map();
    for (const s of this.scores) {
      const pp = this.ppOf(s);
      if (pp > (best.get(s.mapHash) || 0)) best.set(s.mapHash, pp);
      else if (!pp) continue;
      out.push({ date: s.date, pp: OsuMath.totalPp([...best.values()]).total, title: s.title, version: s.version });
    }
    return out;
  },
  async add(score) {
    const prev = this.best(score.mapHash);
    score.isPB = score.passed && (!prev || this.value(score) > this.value(prev));
    score.prevBest = prev ? { score: prev.score, scoreStd: prev.scoreStd, accuracy: prev.accuracy, grade: prev.grade, pp: this.ppOf(prev) } : null;
    score.totalPpBefore = this.totalPp().total;
    await DB.put('scores', score);
    this.scores.push(score);
    this._reindex();
    score.totalPpAfter = this.totalPp().total;
    await DB.put('scores', score);
    Bus.emit('scores:changed');
    return score;
  },
  async remove(id) {
    await DB.del('scores', id);
    this.scores = this.scores.filter(s => s.id !== id); this._reindex(); Bus.emit('scores:changed');
  },
  async clear() { await DB.clear('scores'); this.scores = []; this._reindex(); Bus.emit('scores:changed'); },
};

const ReplayManager = {
  list: [],
  async init() { this.list = (await DB.getAll('replays')).sort((a, b) => b.date - a.date); },
  build({ map, mods, rate, seed, windows, accuracyMode, hp, keys, events, summary, scoreId, player, duration, modConfig = {}, noFail = false, rules = RULES }) {
    return {
      app: APP_NAME, kind: 'replay', format: 1, id: 'rp-' + uid(), date: Date.now(),
      mapHash: map.hash, mapId: map.id, title: map.title, artist: map.artist, version: map.version, creator: map.creator,
      keys, mods, rate, seed, windows, accuracyMode, hp, player, duration, modConfig, noFail,
      rules, // judging rules (see 09-gameplay.js); replays without it were recorded under rules 1
      events, // flat [t, col, down, t, col, down, ...] in song ms
      summary: { score: summary.score, scoreStd: summary.scoreStd, accuracy: summary.accuracy, maxCombo: summary.maxCombo, counts: summary.counts, grade: summary.grade },
      scoreId: scoreId || null,
    };
  },
  async save(rep) {
    await DB.put('replays', rep);
    this.list = [rep, ...this.list.filter(r => r.id !== rep.id)];
    if (rep.scoreId) {
      const s = ScoreManager.scores.find(x => x.id === rep.scoreId);
      if (s && s.replayId !== rep.id) { s.replayId = rep.id; await DB.put('scores', s); }
    }
    Bus.emit('replays:changed');
    return rep;
  },
  async get(id) { return DB.get('replays', id); },
  async remove(id) { await DB.del('replays', id); this.list = this.list.filter(r => r.id !== id); Bus.emit('replays:changed'); },
  async clear() { await DB.clear('replays'); this.list = []; Bus.emit('replays:changed'); },
  export(rep) { downloadJSON(rep, `${rep.artist} - ${rep.title} [${rep.version}] (${new Date(rep.date).toISOString().slice(0, 10)}).amr`.replace(/[\\/:*?"<>|]/g, '_')); },
  validate(obj) {
    if (!obj || obj.app !== APP_NAME || obj.kind !== 'replay' || !Array.isArray(obj.events) || obj.events.length % 3 !== 0) throw new Error('Not a valid Ashtonk!mania replay');
    if (!Array.isArray(obj.windows) || obj.windows.length !== 6) throw new Error('Replay is missing timing windows');
    return obj;
  },
  async importFile(f) { return this.importObject(JSON.parse(await f.text())); },
  async importObject(obj) { this.validate(obj); return this.save({ ...obj, imported: true }); },
};

const Favorites = {

/** Per-beatmap offset (osu!lazer's "beatmap offset"), added to the global audio offset for one difficulty.
 *  Positive = you hit late on this map (its notes arrive later). */
const MapOffsets = {
  map: {},
  last: null, // { hash, mean, hits } — the most recent finished play, for "calibrate using last play"
  async init() { const m = await DB.kvGet('map.offsets', {}); this.map = m && typeof m === 'object' ? m : {}; },
  get(hash) { return (hash && this.map[hash]) || 0; },
  async set(hash, ms) {
    if (!hash) return;
    ms = clamp(Math.round(ms), -300, 300);
    if (ms) this.map[hash] = ms; else delete this.map[hash];
    Bus.emit('mapoffset:changed', hash, ms);
    await DB.kvSet('map.offsets', this.map);
  },
  /** The offset change the last play on `hash` suggests (its mean hit error), or null if there isn't enough data. */
  suggestion(hash) {
    const l = this.last;
    if (!l || l.hash !== hash || l.hits < 30 || Math.abs(l.mean) < 2) return null;
    return Math.round(l.mean);
  },
};

const Collections = {
  list: [],
  async init() {
    this.list = await DB.kvGet('collections', null);
    if (!this.list) { this.list = [{ id: uid(), name: 'Practice', hashes: [], created: Date.now() }]; await this.save(); }
  },
  async save() { await DB.kvSet('collections', this.list); Bus.emit('collections:changed'); },
  async create(name) { const c = { id: uid(), name: name.trim() || 'New collection', hashes: [], created: Date.now() }; this.list.push(c); await this.save(); return c; },
  async rename(id, name) { const c = this.get(id); if (c) { c.name = name.trim() || c.name; await this.save(); } },
  async remove(id) { this.list = this.list.filter(c => c.id !== id); await this.save(); },
  get(id) { return this.list.find(c => c.id === id); },
  has(id, hash) { const c = this.get(id); return !!(c && c.hashes.includes(hash)); },
  async toggle(id, hash) {
    const c = this.get(id); if (!c) return;
    if (c.hashes.includes(hash)) c.hashes = c.hashes.filter(x => x !== hash); else c.hashes.push(hash);
    await this.save();
    return c.hashes.includes(hash);
  },
  containing(hash) { return this.list.filter(c => c.hashes.includes(hash)); },
};

const ProfileManager = {
  profile: null,
  async init() {

    if (!this.profile) { this.profile = { name: 'Player', avatar: 'default', created: Date.now(), banner: 'kori', onboarded: false }; await this.save(); }

  },
  async save() { await DB.kvSet('profile', this.profile); Bus.emit('profile:changed'); },
  async setName(n) { this.profile.name = n.trim().slice(0, 24) || 'Player'; await this.save(); },
  async setAvatar(kind, blob) {
    this.profile.avatar = kind;
    if (kind === 'custom' && blob) { const t = await makeThumbnail(blob, 256); await DB.put('files', t || blob, 'profile/avatar'); }
    await this.loadAvatar(); await this.save();
  },
  avatarURL: null,
  async loadAvatar() {
    if (this.avatarURL && this.avatarURL.startsWith('blob:')) URL.revokeObjectURL(this.avatarURL);
    this.avatarURL = null;
    const a = this.profile.avatar || 'default';
    if (a === 'custom') {
      const b = await DB.get('files', 'profile/avatar');
      if (b) this.avatarURL = URL.createObjectURL(b);
    } else if (a.startsWith('preset:')) this.avatarURL = AvatarPresets.url(a.slice(7));
    else if (a.startsWith('file:')) this.avatarURL = 'avatars/' + encodeURIComponent(a.slice(5));
  },
  /** Avatar element (custom image or monogram). */
  avatarEl(size = 40) {
    const p = this.profile;
    const el = h('div.avatar', { style: { width: size + 'px', height: size + 'px' } });
    if (p.avatar !== 'default' && this.avatarURL) el.style.backgroundImage = `url("${this.avatarURL}")`;
    else { el.classList.add('avatar-mono'); el.textContent = (p.name || 'A').slice(0, 1).toUpperCase(); el.style.fontSize = size * 0.45 + 'px'; }
    return el;
  },
  /** XP & level derived from local scores. */
  xpInfo() {
    let xp = 0;
    for (const s of ScoreManager.scores) {
      const hits = s.counts ? s.counts.slice(0, 5).reduce((a, b) => a + b, 0) : 0;
      xp += Math.round(hits * 0.5 + (s.passed ? 50 + s.accuracy * 100 * Math.max(1, s.stars || 1) : 10));
    }
    let level = 1, need = 500, acc = 0;
    while (xp >= acc + need) { acc += need; level++; need = Math.round(500 * Math.pow(level, 1.35)); }
    return { xp, level, into: xp - acc, need, progress: (xp - acc) / need };
  },
};

const StatisticsManager = {
  compute() {
    const sc = ScoreManager.scores;
    const passed = sc.filter(s => s.passed);
    const st = {
      plays: sc.length, passed: passed.length, failed: sc.filter(s => !s.passed).length,
      playtime: sc.reduce((a, s) => a + (s.duration || 0), 0),
      notes: sc.reduce((a, s) => a + (s.counts ? s.counts.slice(0, 5).reduce((x, y) => x + y, 0) : 0), 0),
      misses: sc.reduce((a, s) => a + (s.counts ? s.counts[5] : 0), 0),
      avgAcc: passed.length ? passed.reduce((a, s) => a + s.accuracy, 0) / passed.length : 0,
      highestScore: sc.reduce((a, s) => Math.max(a, s.score), 0),
      highestCombo: sc.reduce((a, s) => Math.max(a, s.maxCombo), 0),
      bestGrade: null, grades: {}, keyModes: {}, perDay: [], accTrend: [], judgements: [0, 0, 0, 0, 0, 0],
    };
    const order = ['XH', 'SS', 'SH', 'S', 'A', 'B', 'C', 'D', 'F'];
    for (const s of sc) {
      st.grades[s.grade] = (st.grades[s.grade] || 0) + 1;
      const k = st.keyModes[s.keys] || (st.keyModes[s.keys] = { plays: 0, passed: 0, accSum: 0, best: 0, playtime: 0 });
      k.plays++; k.playtime += s.duration || 0;
      if (s.passed) { k.passed++; k.accSum += s.accuracy; k.best = Math.max(k.best, s.score); }
      if (s.counts) s.counts.forEach((c, i) => st.judgements[i] += c);
    }
    for (const g of order) if (st.grades[g] && g !== 'F') { st.bestGrade = g; break; }
    const day = 86400000, today = Math.floor(Date.now() / day);
    for (let d = 29; d >= 0; d--) st.perDay.push({ day: today - d, plays: 0 });
    for (const s of sc) { const idx = Math.floor(s.date / day) - (today - 29); if (idx >= 0 && idx < 30) st.perDay[idx].plays++; }
    st.accTrend = passed.slice(-60).map(s => ({ date: s.date, acc: s.accuracy, title: s.title, version: s.version }));
    return st;
  },
};

const DataManager = {
  async exportAll() {
    const obj = {
      app: APP_NAME, kind: 'backup', version: APP_VERSION, date: Date.now(),
      settings: Settings.export(), profile: ProfileManager.profile, favorites: [...Favorites.set],
      collections: Collections.list, scores: await DB.getAll('scores'), replays: await DB.getAll('replays'),
      note: 'Beatmap and skin files are not included; re-import your .osz/.osk files after restoring.',
    };
    downloadJSON(obj, `ashtonk-mania-backup-${new Date().toISOString().slice(0, 10)}.json`);
  },
  exportSettings() {
    downloadJSON({ app: APP_NAME, kind: 'settings', version: APP_VERSION, date: Date.now(), settings: Settings.export() }, 'ashtonk-mania-settings.json');
  },
  async importAll(obj) {
    if (!obj || obj.app !== APP_NAME) throw new Error('Not an Ashtonk!mania data file');
    if (obj.settings) await Settings.import(obj.settings);
    if (obj.kind === 'settings') return;
    if (obj.profile) { ProfileManager.profile = { ...ProfileManager.profile, ...obj.profile }; await ProfileManager.save(); }
    if (Array.isArray(obj.favorites)) { for (const f of obj.favorites) Favorites.set.add(f); await DB.kvSet('favorites', [...Favorites.set]); }
    if (Array.isArray(obj.collections)) {
      for (const c of obj.collections) {
        const ex = Collections.list.find(x => x.id === c.id || x.name === c.name);
        if (ex) ex.hashes = [...new Set([...ex.hashes, ...(c.hashes || [])])]; else Collections.list.push(c);
      }
      await Collections.save();
    }
    if (Array.isArray(obj.scores)) await DB.putMany(obj.scores.filter(s => s && s.id).map(s => ({ store: 'scores', value: s })));
    if (Array.isArray(obj.replays)) await DB.putMany(obj.replays.filter(r => r && r.id).map(r => ({ store: 'replays', value: r })));
    await ScoreManager.init(); await ReplayManager.init();
    Bus.emit('scores:changed'); Bus.emit('replays:changed'); Bus.emit('favorites:changed');
  },
  async resetEverything() {
    DB.db && DB.db.close(); DB.db = null;
    await new Promise(r => { const q = indexedDB.deleteDatabase(DB.name); q.onsuccess = q.onerror = q.onblocked = () => r(); });
    location.reload();
  },
};

/** A small chibi bust portrait as an SVG string (100×100). */
function avatarSVG(c, { bg = ['#2a2a3a', '#15151f'], expr = 'open' } = {}) {
  const skin = '#ffe9de', line = '#3a2418';
  let back = '';
  if (c.style === 'twintails') back = `<path d="M22 28 C4 40 2 76 10 104 L26 104 C22 80 22 54 30 36 Z" fill="${c.hairS}"/><path d="M78 28 C96 40 98 76 90 104 L74 104 C78 80 78 54 70 36 Z" fill="${c.hairS}"/>`;

    + `<path d="M11 50 q5 -4 10 0 M79 50 q5 -4 10 0 M12 66 q4 -4 9 0 M79 66 q4 -4 9 0" stroke="${c.hairH}" stroke-width="1.6" fill="none" opacity=".7"/>`;

  const eye = (x, kind) => kind === 'shut'

  const eyes = expr === 'happy' ? eye(39, 'shut') + eye(61, 'shut') : expr === 'wink' ? eye(39, 'open') + eye(61, 'shut') : eye(39, 'open') + eye(61, 'open');
  const mouth = expr === 'open' ? `<path d="M45.5 64 Q50 70 54.5 64 Z" fill="#b0404a" stroke="${line}" stroke-width="1.2" stroke-linejoin="round"/>`
    : `<path d="M45 64 Q50 68 55 64" stroke="${line}" stroke-width="2" fill="none" stroke-linecap="round"/>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/></linearGradient></defs>
<rect width="100" height="100" fill="url(#g)"/>
<circle cx="18" cy="18" r="10" fill="#fff" opacity=".08"/><circle cx="86" cy="80" r="16" fill="#fff" opacity=".06"/>

<ellipse cx="50" cy="44" rx="33" ry="31" fill="${c.hairS}"/>

const AvatarPresets = {
  _urls: new Map(),
  url(id) {
    if (this._urls.has(id)) return this._urls.get(id);
    const p = AVATAR_PRESETS.find(x => x.id === id);
    if (!p) return null;
    const u = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(avatarSVG(CHARACTERS[p.char], p));
    this._urls.set(id, u);
    return u;
  },
  /** Extra pictures from public/avatars/avatars.json (cached for the session). */
  extra() {
    if (!this._extra) this._extra = fetch('avatars/avatars.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : []).then(a => Array.isArray(a)
      ? a.filter(x => x && typeof x.file === 'string' && /^[\w .()-]+\.(png|jpe?g|webp|gif|svg)$/i.test(x.file)).map(x => ({ file: x.file, name: String(x.name || x.file), url: 'avatars/' + encodeURIComponent(x.file) }))
      : []).catch(() => []);
    return this._extra;
  },
};

/** Star rating colour ramp. */
function starColour(sr) {
  const stops = [[0, '#4290fb'], [1.25, '#4fc0ff'], [2, '#4fffd5'], [2.5, '#7cff4f'], [3.3, '#f6f05c'], [4.2, '#ff8068'], [4.9, '#ff4e6f'], [5.8, '#c645b8'], [6.7, '#6563de'], [7.7, '#18158e'], [9, '#000000']];
  if (sr >= 9) return '#000000';
  let i = 0; while (i < stops.length - 2 && sr > stops[i + 1][0]) i++;
  const [a, ca] = stops[i], [b, cb] = stops[i + 1];
  const t = clamp((sr - a) / (b - a), 0, 1);
  const p = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16));
  const x = p(ca), y = p(cb);
  return '#' + x.map((v, k) => Math.round(lerp(v, y[k], t)).toString(16).padStart(2, '0')).join('');
}
/** Text drawn with a skin's number font (score-0.png … score-comma, -dot, -percent, -x) on a canvas that sits
 *  where the text was. Characters the font doesn't have are skipped. The canvas only ever grows (in steps) and
 *  the digits are aligned inside it, so a score changing 20 times a second doesn't re-layout the page each time. */
function skinDigits(font, cssH, { align = 'right' } = {}) {
  const c = h('canvas.skin-digits');
  c.width = 1; c.height = 1;
  let last = null;
  const set = text => {
    text = String(text);
    if (text === last) return;
    last = text;
    const glyphs = [...text].map(ch => font.glyphs[ch]).filter(Boolean);
    const dpr = Zoom.dpr(), H = Math.max(1, Math.round(cssH * dpr));
    const ref = font.glyphs['0'] || glyphs[0];
    const x = c.getContext('2d');
    if (!ref || !glyphs.length) { x.clearRect(0, 0, c.width, c.height); return; }
    const k = H / ref.h, ov = font.overlap * k;
    const widths = glyphs.map(g => g.w * k);
    const W = Math.max(1, Math.ceil(widths.reduce((a, b) => a + b, 0) - ov * (glyphs.length - 1)));
    if (c.height !== H || W > c.width) {
      c.width = Math.ceil(W / 32) * 32; c.height = H;
      c.style.height = cssH + 'px'; c.style.width = (c.width / dpr) + 'px';
    } else x.clearRect(0, 0, c.width, c.height);
    let px = align === 'right' ? c.width - W : align === 'center' ? Math.round((c.width - W) / 2) : 0;
    glyphs.forEach((g, i) => { const gh = g.h * k; x.drawImage(g.img, px, H - gh, widths[i], gh); px += widths[i] - ov; });
  };
  return { el: c, set };
}

function makeOverlay(contentEl, { backdrop = true, onClose, onKey, animOutClass = 'out', dismissable = true } = {}) {

/** Context menu: items [{label, icon, onClick, checked, sep, header}] */
function showMenu(x, y, items) {
  const menu = h('div.menu', { role: 'menu' });
  for (const it of items) {
    if (it.sep) { menu.appendChild(h('div.sep')); continue; }
    if (it.header) { menu.appendChild(h('div.hdr', it.header)); continue; }
    menu.appendChild(h('button', { role: 'menuitem', onclick: () => { UISounds.click(); o.close(); it.onClick && it.onClick(); } },
      it.icon ? icon(it.icon) : null, it.label, it.checked ? h('span.check', '✓') : null));
  }
  const o = makeOverlay(menu, { backdrop: false });
  const closer = e => { if (!menu.contains(e.target)) { o.close(); document.removeEventListener('pointerdown', closer, true); } };
  setTimeout(() => document.addEventListener('pointerdown', closer, true), 0);
  requestAnimationFrame(() => {
    const r = menu.getBoundingClientRect();
    menu.style.left = clamp(x, 8, innerWidth - r.width - 8) * Zoom.z + 'px';
    menu.style.top = clamp(y, 8, innerHeight - r.height - 8) * Zoom.z + 'px';
    const f = menu.querySelector('button'); f && f.focus();

    const btns = $$('button', menu); const i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { btns[(i + 1) % btns.length].focus(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { btns[(i - 1 + btns.length) % btns.length].focus(); e.preventDefault(); }
  });
  return o;
}
