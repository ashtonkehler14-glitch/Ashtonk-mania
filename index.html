    if (!buffer || !this.ctx || this.ctx.state !== 'running') return null;
    const src = this.ctx.createBufferSource();
    src.buffer = buffer; src.playbackRate.value = rate;
    const g = this.ctx.createGain(); g.gain.value = volume;
    let node = src;
    if (pan && this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = pan; src.connect(p); node = p; }
    node.connect(g); g.connect(bus === 'ui' ? this.uiBus : bus === 'music' ? this.musicBus : this.fxBus);
    src.start(when || 0);
    return src;
  },

  /** Synthesized fallback sounds for the default skin (used only when no skin sound exists). */
  _synthCache: new Map(),
  synth(name) {
    this.init();
    if (this._synthCache.has(name)) return this._synthCache.get(name);
    const sr = this.ctx.sampleRate;
    const make = (dur, fn) => {
      const b = this.ctx.createBuffer(1, Math.max(1, Math.floor(sr * dur)), sr);
      const d = b.getChannelData(0);
      let seed = 1;
      const noise = () => { seed = (seed * 16807) % 2147483647; return seed / 1073741823.5 - 1; };
      for (let i = 0; i < d.length; i++) d[i] = fn(i / sr, noise);
      return b;
    };
    let buf = null;
    const env = (t, a, d) => (t < a ? t / a : Math.exp(-(t - a) / d));
    if (/hitnormal/.test(name)) buf = make(0.09, (t, n) => (Math.sin(2 * Math.PI * 1800 * t) * 0.25 + n() * 0.35) * env(t, 0.001, 0.012) * 0.6);
    else if (/hitwhistle/.test(name)) buf = make(0.25, t => Math.sin(2 * Math.PI * (2200 + 300 * t) * t) * env(t, 0.005, 0.08) * 0.25);
    else if (/hitfinish/.test(name)) buf = make(0.6, (t, n) => (n() * 0.5 + Math.sin(2 * Math.PI * 520 * t) * 0.2) * env(t, 0.002, 0.18) * 0.35);
    else if (/hitclap/.test(name)) buf = make(0.15, (t, n) => n() * env(t, 0.001, 0.03) * 0.4);
    else if (name === 'combobreak') buf = make(0.35, t => Math.sin(2 * Math.PI * (420 - 500 * t) * t) * env(t, 0.005, 0.1) * 0.35);
    else if (name === 'click-short') buf = make(0.03, t => Math.sin(2 * Math.PI * 3200 * t) * env(t, 0.0005, 0.006) * 0.18);
    else if (name === 'click-short-confirm' || name === 'menuclick' || name === 'menuhit') buf = make(0.12, t => (Math.sin(2 * Math.PI * 880 * t) + Math.sin(2 * Math.PI * 1320 * t) * 0.5) * env(t, 0.002, 0.03) * 0.22);
    else if (name === 'menuback' || name === 'click-close') buf = make(0.12, t => Math.sin(2 * Math.PI * (900 - 2400 * t) * t) * env(t, 0.002, 0.035) * 0.22);
    else if (name === 'check-on') buf = make(0.08, t => Math.sin(2 * Math.PI * 1500 * t) * env(t, 0.001, 0.02) * 0.2);
    else if (name === 'check-off') buf = make(0.08, t => Math.sin(2 * Math.PI * 1000 * t) * env(t, 0.001, 0.02) * 0.2);
    else if (name === 'failsound') buf = make(1.4, t => Math.sin(2 * Math.PI * (330 - 160 * t) * t) * env(t, 0.01, 0.5) * 0.3);
    else if (name === 'sectionpass' || name === 'applause') buf = make(0.7, t => (Math.sin(2 * Math.PI * 660 * t) * (t < 0.15 ? 1 : 0) + Math.sin(2 * Math.PI * 990 * t) * (t >= 0.15 ? 1 : 0)) * env(t, 0.005, 0.2) * 0.2);
    else if (name === 'sectionfail') buf = make(0.6, t => Math.sin(2 * Math.PI * (400 - 200 * t) * t) * env(t, 0.005, 0.2) * 0.2);
    else if (/^count[123]s$|^gos$/.test(name)) buf = make(0.15, t => Math.sin(2 * Math.PI * (name === 'gos' ? 1320 : 880) * t) * env(t, 0.002, 0.05) * 0.25);
    else if (name === 'neru-chime') buf = make(0.9, t => [1318.5, 1661.2, 1975.5].reduce((a, f, i) => a + (t > i * 0.08 ? Math.sin(2 * Math.PI * f * (t - i * 0.08)) * env(t - i * 0.08, 0.004, 0.25) : 0), 0) * 0.12);
    this._synthCache.set(name, buf);
    return buf;
  },
};

/** Pitch-preserving time stretch (WSOLA). Used for DT/HT and practice speeds when "preserve pitch" is on. */
const TimeStretch = {
  cache: new Map(), // key -> AudioBuffer (small LRU)
  async stretch(buffer, rate, key, onProgress) {
    const ck = `${key}|${rate}`;
    if (this.cache.has(ck)) { const b = this.cache.get(ck); this.cache.delete(ck); this.cache.set(ck, b); return b; }
    const sr = buffer.sampleRate, chs = buffer.numberOfChannels, len = buffer.length;
    const N = Math.round(sr * 0.046) & ~1, Hs = N >> 1, tol = Math.round(sr * 0.012);
    const inp = []; for (let c = 0; c < chs; c++) inp.push(buffer.getChannelData(c));
    const mono = new Float32Array(len);
    for (let c = 0; c < chs; c++) { const d = inp[c]; for (let i = 0; i < len; i++) mono[i] += d[i] / chs; }
    const outLen = Math.ceil(len / rate) + N;
    const out = []; for (let c = 0; c < chs; c++) out.push(new Float32Array(outLen));
    const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
    let prev = 0, k = 0, lastYield = performance.now();
    const frames = Math.floor((outLen - N) / Hs);
    for (; k < frames; k++) {
      const outPos = k * Hs;
      const nominal = Math.round(outPos * rate);
      if (nominal + N + tol >= len) break;
      let best = nominal;
      if (k > 0) {
        const target = prev + Hs;
        let bestC = -Infinity;
        const lo = Math.max(0, nominal - tol), hi = nominal + tol;
        for (let cand = lo; cand <= hi; cand += 8) {
          let c = 0; for (let i = 0; i < Hs; i += 8) c += mono[target + i] * mono[cand + i];
          if (c > bestC) { bestC = c; best = cand; }
        }
        const b0 = best; bestC = -Infinity;
        for (let cand = Math.max(0, b0 - 7); cand <= b0 + 7; cand++) {
          let c = 0; for (let i = 0; i < Hs; i += 2) c += mono[target + i] * mono[cand + i];
          if (c > bestC) { bestC = c; best = cand; }
        }
      }
      for (let c = 0; c < chs; c++) {
        const s = inp[c], o = out[c];
        for (let i = 0; i < N; i++) o[outPos + i] += s[best + i] * win[i];
      }
      prev = best;
      if (performance.now() - lastYield > 30) {
        onProgress && onProgress(k / frames);
        await new Promise(r => setTimeout(r, 0));
        lastYield = performance.now();
      }
    }
    const res = AudioManager.ctx.createBuffer(chs, outLen, sr);
    for (let c = 0; c < chs; c++) res.copyToChannel ? res.copyToChannel(out[c], 0) : res.getChannelData(c).set(out[c]);
    this.cache.set(ck, res);
    while (this.cache.size > 3) this.cache.delete(this.cache.keys().next().value);
    return res;
  },
};

/** Music track playback with an exact song-position clock (ms). */
const Music = {
  buffer: null, stretched: null, key: null,
  source: null, gain: null,
  rate: 1, preservePitch: false,
  startCtx: 0, startPos: 0, pausedPos: 0,
  playing: false, loop: false, loopStart: 0,
  meta: null,            // {setId, mapId, timing} of the currently loaded track (for UI beat sync)
  onEnded: null,

  async load(buffer, key, meta) {
    AudioManager.init();
    if (this.key !== key) this.stop(0);
    this.buffer = buffer; this.key = key; this.meta = meta || null;
    this.stretched = null;
  },
  get duration() { return this.buffer ? this.buffer.duration * 1000 : 0; },

  /** Prepare playback rate. preservePitch -> WSOLA-stretched buffer, otherwise resampling (pitch shifts). */
  async setRate(rate, preservePitch, onProgress) {
    this.rate = rate; this.preservePitch = preservePitch && Math.abs(rate - 1) > 1e-3;
    this.stretched = this.preservePitch ? await TimeStretch.stretch(this.buffer, rate, this.key, onProgress) : null;
  },

  /** Current song position in ms (can be negative during lead-in). */
  get time() {
    if (!this.playing) return this.pausedPos;
    return this.startPos + (AudioManager.now() - this.startCtx) * 1000 * this.rate;
  },
  /** Song position at a given audio-clock time (seconds). */
  timeAtCtx(ctxT) { return this.playing ? this.startPos + (ctxT - this.startCtx) * 1000 * this.rate : this.pausedPos; },

  /** Start playing at song position `pos` ms (negative = delay). */
  play(pos = 0, { fadeIn = 0, volume = 1, loop = false } = {}) {
    if (!this.buffer) return;
    AudioManager.init();
    this._kill();
    const ctx = AudioManager.ctx;
    const src = ctx.createBufferSource();
    const g = ctx.createGain();
    src.buffer = this.stretched || this.buffer;
    src.playbackRate.value = this.stretched ? 1 : this.rate;
    src.connect(g); g.connect(AudioManager.musicBus);
    const ctxNow = ctx.currentTime;
    const lead = 0.03; // schedule slightly ahead so the start time is exact
    const when = ctxNow + lead + Math.max(0, -pos / 1000 / this.rate);
    const bufPos = Math.max(0, pos) / 1000 / (this.stretched ? this.rate : 1);
    if (fadeIn > 0) { g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(volume, when + fadeIn / 1000); }
    else g.gain.value = volume;
    if (loop) { src.loop = true; src.loopStart = 0; src.loopEnd = src.buffer.duration; }
    src.start(when, Math.min(bufPos, src.buffer.duration));
    // map: song position `max(pos,0)` is heard at audio time `when`
    this.startCtx = when; this.startPos = Math.max(0, pos);
    if (pos < 0) { this.startPos = pos; this.startCtx = ctxNow + lead; }
    this.source = src; this.gain = g; this.playing = true; this.loop = loop;
    src.onended = () => { if (this.source === src) { this.playing = false; this.pausedPos = this.duration; this.onEnded && this.onEnded(); } };
  },
  pause() {
    if (!this.playing) return;
    this.pausedPos = this.time;
    this._kill();
    this.playing = false;
  },
  stop(fadeOut = 0) {
    const src = this.source, g = this.gain;
    this.source = null; this.gain = null; this.playing = false;
    if (!src) return;
    src.onended = null;
    if (fadeOut > 0 && g) {
      const t = AudioManager.ctx.currentTime;
      g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + fadeOut / 1000);
      try { src.stop(t + fadeOut / 1000 + 0.02); } catch (e) { /* ignore */ }
    } else { try { src.stop(); } catch (e) { /* ignore */ } }
  },
  _kill() { this.stop(0); },
  setVolume(v, ms = 150) {
    if (!this.gain) return;
    const t = AudioManager.ctx.currentTime;
    this.gain.gain.cancelScheduledValues(t); this.gain.gain.setValueAtTime(this.gain.gain.value, t);
    this.gain.gain.linearRampToValueAtTime(v, t + ms / 1000);
  },
};

/** Loads & caches decoded beatmap audio (small LRU so browsing song select stays fast). */
const TrackCache = {
  map: new Map(),
  async get(setId, audioFile) {
    const key = `${setId}/${audioFile}`.toLowerCase();
    if (this.map.has(key)) { const v = this.map.get(key); this.map.delete(key); this.map.set(key, v); return v; }
    const p = (async () => {
      const blob = await BeatmapManager.getFile(setId, audioFile);
      if (!blob) throw new Error(`Missing audio: ${audioFile}`);
      return AudioManager.decode(await blob.arrayBuffer());
    })();
    this.map.set(key, p);
    p.catch(() => this.map.delete(key));
    while (this.map.size > 4) this.map.delete(this.map.keys().next().value);
    return p;
  },
};

/** UI sound effects (hover/click/back…) taken from the active skin when present. */
const UISounds = {
  buffers: new Map(),
  reset() { this.buffers.clear(); },
  /** Skins name UI sounds differently across versions; try each alias in the skin before the synthesized default. */
  ALIASES: {
    'click-short': ['click-short', 'menu-freeplay-hover'],
    'click-short-confirm': ['click-short-confirm', 'menuclick', 'menuhit'],
    'menuback': ['menuback', 'back-button-click', 'menu-back-click', 'click-close'],
  },
  async _get(name) {
    if (this.buffers.has(name)) return this.buffers.get(name);
    const p = (async () => {
      const skin = SkinManager.current;
      if (skin && !skin.builtin) {
        for (const alias of this.ALIASES[name] || [name]) {
          if (skin.has(alias)) { const b = await skin.sound(alias).catch(() => null); if (b) return b; }
        }
      }
      return SkinManager.sample(name).catch(() => null);
    })();
    this.buffers.set(name, p);
    return p;
  },
  async play(name, vol = 1) {
    if (!Settings.get('audio.uiSounds') || !AudioManager.ctx || AudioManager.ctx.state !== 'running') return;
    const b = await this._get(name);
    if (b) AudioManager.play(b, { bus: 'ui', volume: vol });
  },
  hover() { const now = performance.now(); if (now - (this._lh || 0) < 40) return; this._lh = now; this.play('click-short', 0.6); },
  click() { this.play('click-short-confirm'); },
  back() { this.play('menuback'); },
};

function keyLabel(code) {
  if (!code) return '—';
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return 'Num' + code.slice(6);
  return ({
    Space: 'Space', Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', BracketLeft: '[', BracketRight: ']',
    Backslash: '\\', Minus: '-', Equal: '=', Backquote: '`', ShiftLeft: 'LShift', ShiftRight: 'RShift', ControlLeft: 'LCtrl',
    ControlRight: 'RCtrl', AltLeft: 'LAlt', AltRight: 'RAlt', CapsLock: 'Caps', Tab: 'Tab', Enter: 'Enter', ArrowLeft: '←',
    ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', MetaLeft: 'LMeta', MetaRight: 'RMeta', IntlBackslash: '\\',
  })[code] || code;
}

const Settings = {
  values: {},
  schema: new Map(SETTINGS_SCHEMA.map(s => [s.k, s])),
  _saveT: 0,
  async load() {
    const stored = await DB.kvGet('settings', {});
    this.values = stored && typeof stored === 'object' ? stored : {};
    this.applyUI();
  },
  get(k) {
    if (k in this.values) return this.values[k];
    const s = this.schema.get(k);
    return s ? (typeof s.d === 'object' && s.d !== null ? structuredClone(s.d) : s.d) : undefined;
  },
  async set(k, v) {
    this.values[k] = v;
    Bus.emit('settings:changed', k, v);
    if (k.startsWith('audio.')) AudioManager.applyVolumes();
    if (k.startsWith('ui.') || k === 'graphics.effects') this.applyUI();
    clearTimeout(this._saveT);
    this._saveT = setTimeout(() => DB.kvSet('settings', this.values).catch(e => console.error(e)), 250);
  },
  async flush() { clearTimeout(this._saveT); await DB.kvSet('settings', this.values); },
  reset(k) { delete this.values[k]; Bus.emit('settings:changed', k, this.get(k)); this.set(k, this.get(k)); },
  export() { return structuredClone(this.values); },
  async import(obj) { if (obj && typeof obj === 'object') { this.values = { ...obj }; await this.flush(); this.applyUI(); AudioManager.applyVolumes(); Bus.emit('settings:changed', '*'); } },

  keybinds(keys) {
    const all = this.get('input.keybinds') || {};
    const kb = all[keys] || DEFAULT_KEYBINDS[keys] || [];
    const out = [];
    for (let i = 0; i < keys; i++) out.push((kb[i] && kb[i].length) ? [...kb[i]] : [...(DEFAULT_KEYBINDS[keys]?.[i] || [])]);
    return out;
  },
  setKeybinds(keys, binds) {
    const all = { ...(this.get('input.keybinds') || {}) };
    all[keys] = binds; this.set('input.keybinds', all);
  },

  applyUI() {
    const r = document.documentElement;
    r.style.setProperty('--ui-scale', this.get('ui.scale'));
    const sp = this.get('ui.animSpeed');
    r.style.setProperty('--anim', sp <= 0 ? 0 : (1 / sp));
    r.dataset.theme = this.get('ui.theme');
    r.classList.toggle('no-effects', !this.get('graphics.effects'));
    r.classList.toggle('no-anim', sp <= 0);
  },
};

/* ===== 07-beatmap-manager.js ===== */
/* BeatmapManager — library, importing (.osz / .osu / folders / drag & drop), validation, file access.
 * Also: BeatmapProvider architecture (local provider now; online providers can plug in later). */

const BeatmapManager = {
  sets: [],                 // set records
  maps: new Map(),          // id -> map record
  setById: new Map(),

  async init() {
    const [sets, maps] = await Promise.all([DB.getAll('sets'), DB.getAll('maps')]);
    this.sets = sets; this.setById = new Map(sets.map(s => [s.id, s]));
    this.maps = new Map(maps.map(m => [m.id, m]));
    for (const s of this.sets) s.maps = s.mapIds.map(id => this.maps.get(id)).filter(Boolean).sort((a, b) => a.stars - b.stars);
  },
  playableMaps() { return [...this.maps.values()].filter(m => !m.problems.length); },
  mapByHash(hash) { for (const m of this.maps.values()) if (m.hash === hash) return m; return null; },

  async getFile(setId, path) {
    const set = this.setById.get(setId);
    if (!set) return null;
    const real = set.fileIndex[normPath(path).toLowerCase()];
    return real ? DB.get('files', `${setId}/${real}`) : null;
  },
  hasFile(setId, path) { const s = this.setById.get(setId); return !!(s && path && s.fileIndex[normPath(path).toLowerCase()]); },
  async thumbURL(set) {
    if (!set || !set.thumb) return null;
    const cached = BlobURLs.map.get(`thumb:${set.id}`);
    if (cached) return cached;
    const b = await DB.get('files', `${set.id}/__thumb.jpg`);
    return BlobURLs.get(`thumb:${set.id}`, b);
  },
  async bgURL(map) {
    if (!map || !map.bgFile) return null;
    const key = `bg:${map.setId}/${map.bgFile}`;
    if (BlobURLs.map.has(key)) return BlobURLs.map.get(key);
    const b = await this.getFile(map.setId, map.bgFile);
    return BlobURLs.get(key, b);
  },

  /** Load and parse a difficulty for gameplay. */
  async load(mapId) {
    const rec = this.maps.get(mapId);
    if (!rec) throw new Error('Beatmap not found');
    const blob = await this.getFile(rec.setId, rec.osuPath);
    if (!blob) throw new Error('Beatmap file missing from storage');
    const bm = BeatmapParser.parse(await blob.text());
    return { rec, set: this.setById.get(rec.setId), bm, notes: BeatmapParser.toManiaNotes(bm) };
  },

  // ─────────────────────────────── importing ───────────────────────────────
  /** Import anything the user dropped / picked. Returns a report. */
  async importFiles(files) {
    const report = { sets: [], skins: [], replays: [], errors: [], warnings: [], data: false };
    const loose = [];
    for (const f of files) {
      const name = f.relPath || f.webkitRelativePath || f.name;
      const ext = fileExt(f.name);
      try {
        if (ext === 'osz') { Bus.emit('import:status', `Importing ${f.name}…`); report.sets.push(...await this.importOsz(f, report)); }
        else if (ext === 'osk') { Bus.emit('import:status', `Importing skin ${f.name}…`); report.skins.push(await SkinManager.importOsk(f)); }
        else if (ext === 'amr') { report.replays.push(await ReplayManager.importFile(f)); }
        else if (ext === 'json' && !name.includes('/')) {
          const obj = JSON.parse(await f.text());
          if (obj && obj.app === APP_NAME && obj.kind === 'replay') report.replays.push(await ReplayManager.importObject(obj));
          else if (obj && obj.app === APP_NAME) { await DataManager.importAll(obj); report.data = true; }
          else report.errors.push(`${f.name}: not an ${APP_NAME} data file`);
        }
        else loose.push({ path: normPath(name), file: f });
      } catch (e) {
        console.warn(e); report.errors.push(`${f.name}: ${e.message}`);
      }
    }
    // Loose files / folders: group by directory that contains .osu files
    if (loose.length) {
      const dirs = new Map();
      for (const l of loose) {
        const i = l.path.lastIndexOf('/');
        const dir = i < 0 ? '' : l.path.slice(0, i);
        if (!dirs.has(dir)) dirs.set(dir, []);
        dirs.get(dir).push(l);
      }
      // attach files in sub-folders (e.g. sb/, samples/) to the nearest ancestor that has .osu files
      const osuDirs = [...dirs.keys()].filter(d => dirs.get(d).some(l => l.path.toLowerCase().endsWith('.osu')));
      const groups = new Map(osuDirs.map(d => [d, []]));
      for (const l of loose) {
        const owner = osuDirs.filter(d => d === '' || l.path.startsWith(d + '/')).sort((a, b) => b.length - a.length)[0];
        if (owner !== undefined) groups.get(owner).push(l);
      }
      if (!osuDirs.length) report.errors.push(`No .osu, .osz or .osk files found among ${loose.length} file(s)`);
      for (const [dir, list] of groups) {
        const entries = list.map(l => ({
          name: dir ? l.path.slice(dir.length + 1) : l.path,
          size: l.file.size,
          read: async () => new Uint8Array(await l.file.arrayBuffer()),
        }));
        try {
          Bus.emit('import:status', `Importing folder ${dir || '(files)'}…`);
          report.sets.push(...await this._importEntries(entries, dir.split('/').pop() || 'Imported files', report));
        } catch (e) { report.errors.push(`${dir || 'files'}: ${e.message}`); }
      }
    }
    Bus.emit('import:status', null);
    if (report.sets.length) Bus.emit('library:changed');
    return report;
  },

  async importOsz(file, report) {
    let zip;
    try { zip = new ZipReader(await file.arrayBuffer()); }
    catch (e) { throw new Error(`Corrupt archive (${e.message})`); }
    const entries = zip.entries.map(e => ({ name: e.name, size: e.usize, read: () => zip.read(e) }));
    return this._importEntries(entries, file.name.replace(/\.osz$/i, ''), report);
  },

  /** Core import: entries = [{name, size, read()}] relative to the beatmap folder. */
  async _importEntries(entries, sourceName, report) {
    entries = entries.filter(e => !/(^|\/)(__macosx|\.ds_store|thumbs\.db)/i.test(e.name));
    const osuEntries = entries.filter(e => e.name.toLowerCase().endsWith('.osu'));
    if (!osuEntries.length) throw new Error('No .osu difficulties found');
    const lowerIndex = new Map(entries.map(e => [e.name.toLowerCase(), e]));
    const available = new Set(lowerIndex.keys());
    const parsed = [];
    for (const e of osuEntries) {
      try {
        const bytes = await e.read();
        const text = new TextDecoder('utf-8').decode(bytes);
        const bm = BeatmapParser.parse(text);
        parsed.push({ entry: e, text, bm, hash: await hashHex(bytes) });
      } catch (err) {
        report && report.errors.push(`${sourceName} / ${e.name}: ${err instanceof BeatmapError ? err.message : 'Invalid .osu file (' + err.message + ')'}`);
      }
    }
    if (!parsed.length) throw new Error('No readable difficulties');
    // Group difficulties into sets (usually one per archive, but folders may mix)
    const bySet = new Map();
    for (const p of parsed) {
      const md = p.bm.metadata;
      const onlineId = parseInt(md.BeatmapSetID || '-1', 10);
      const keySrc = onlineId > 0 ? `osu-${onlineId}` : `${md.Artist || ''}|${md.Title || ''}|${md.Creator || ''}`.toLowerCase();
      if (!bySet.has(keySrc)) bySet.set(keySrc, []);
      bySet.get(keySrc).push(p);
    }
    const out = [];
    for (const [keySrc, diffs] of bySet) out.push(await this._storeSet(keySrc, diffs, entries, lowerIndex, available, sourceName, report));
    return out;
  },

  async _storeSet(keySrc, diffs, entries, lowerIndex, available, sourceName, report) {
    const setId = 'set-' + (await hashHex(keySrc)).slice(0, 16);
    const existing = this.setById.get(setId);
    const md = diffs[0].bm.metadata;
    // which files do we keep? .osu, audio, backgrounds, samples (wav/ogg/mp3 hitsounds), skip video & big storyboards
    const needed = new Set();
    let storyboard = false, video = false;
    for (const d of diffs) {
      needed.add(d.entry.name.toLowerCase());
      if (d.bm.audioFile) needed.add(d.bm.audioFile.toLowerCase());
      if (d.bm.events.background) needed.add(d.bm.events.background.file.toLowerCase());
      if (d.bm.events.storyboard) storyboard = true;
      if (d.bm.events.video) video = true;
      for (const ho of d.bm.hitObjects) { const f = ho.sample && ho.sample[4]; if (f) needed.add(normPath(f).toLowerCase()); }
    }
    for (const e of entries) {
      const n = e.name.toLowerCase(), ext = fileExt(n);
      if (ext === 'osb') storyboard = true;
      if (['wav', 'ogg', 'mp3'].includes(ext) && !n.includes('/') && e.size < 2e6) needed.add(n);
    }
    const fileIndex = existing ? { ...existing.fileIndex } : {};
    const items = [];
    for (const n of needed) {
      const e = lowerIndex.get(n);
      if (!e) continue;
      const data = await e.read();
      items.push({ store: 'files', key: `${setId}/${e.name}`, value: new Blob([data], { type: mimeFor(e.name) }) });
      fileIndex[n] = e.name;
      if (items.length >= 20) await DB.putMany(items.splice(0));
    }
    if (items.length) await DB.putMany(items);

    // difficulties
    const mapRecords = [];
    for (const d of diffs) {
      const { bm } = d;
      const v = validateBeatmap(bm, available);
      let stats = null;
      if (!v.problems.length) {
        try { stats = BeatmapParser.analyse(bm); } catch (e) { v.problems.push(e.message); }
      }
      const m = bm.metadata;
      const rec = {
        id: 'map-' + d.hash.slice(0, 16), hash: d.hash, setId,
        onlineId: parseInt(m.BeatmapID || '-1', 10),
        title: m.Title || 'Unknown title', titleUnicode: m.TitleUnicode || m.Title || '',
        artist: m.Artist || 'Unknown artist', artistUnicode: m.ArtistUnicode || m.Artist || '',
        creator: m.Creator || 'Unknown', version: m.Version || 'Normal', source: m.Source || '', tags: m.Tags || '',
        osuPath: d.entry.name, audioFile: bm.audioFile, bgFile: bm.events.background ? bm.events.background.file : null,
        previewTime: bm.previewTime, mode: bm.mode, keys: BeatmapParser.keyCount(bm),
        od: bm.od, hp: bm.hp, problems: v.problems, warnings: v.warnings,
        added: existing?.added || Date.now(),
        ...(stats || { stars: 0, bpm: 0, bpmMin: 0, bpmMax: 0, length: 0, drainLength: 0, noteCount: 0, lnCount: 0, objectCount: 0, lnRatio: 0, nps: 0, firstNote: 0, lastNote: 0 }),
      };
      if (v.problems.length && report) report.warnings.push(`${rec.artist} - ${rec.title} [${rec.version}]: ${v.problems.join('; ')}`);
      mapRecords.push(rec);
    }
    // thumbnail from first background available
    let thumb = existing?.thumb || false;
    const bgRec = mapRecords.find(r => r.bgFile && fileIndex[r.bgFile.toLowerCase()]);
    if (bgRec && !thumb) {
      try {
        const e = lowerIndex.get(bgRec.bgFile.toLowerCase());
        const t = await makeThumbnail(new Blob([await e.read()]), 640);
        if (t) { await DB.put('files', t, `${setId}/__thumb.jpg`); thumb = true; }
      } catch (e) { /* ignore */ }
    }
    const mapIds = new Set(existing ? existing.mapIds : []);
    for (const r of mapRecords) mapIds.add(r.id);
    const set = {
      id: setId, onlineId: parseInt(md.BeatmapSetID || '-1', 10),
      title: md.Title || 'Unknown title', titleUnicode: md.TitleUnicode || md.Title || '',
      artist: md.Artist || 'Unknown artist', artistUnicode: md.ArtistUnicode || md.Artist || '',
      creator: md.Creator || 'Unknown', source: md.Source || '', tags: md.Tags || '',
      mapIds: [...mapIds], fileIndex, thumb, storyboard, video,
      added: existing?.added || Date.now(), sourceName,
    };
    await DB.putMany([{ store: 'sets', value: set }, ...mapRecords.map(r => ({ store: 'maps', value: r }))]);
    for (const r of mapRecords) this.maps.set(r.id, r);
    set.maps = set.mapIds.map(id => this.maps.get(id)).filter(Boolean).sort((a, b) => a.stars - b.stars);
    if (existing) this.sets[this.sets.indexOf(existing)] = set; else this.sets.push(set);
    this.setById.set(setId, set);
    BlobURLs.drop(`thumb:${setId}`); BlobURLs.drop(`bg:${setId}/`);
    return set;
  },

  async removeSet(setId) {
    const set = this.setById.get(setId);
    if (!set) return;
    for (const id of set.mapIds) { await DB.del('maps', id); this.maps.delete(id); }
    await DB.del('sets', setId);
    await DB.delPrefix('files', `${setId}/`);
    this.sets = this.sets.filter(s => s !== set);
    this.setById.delete(setId);
    BlobURLs.drop(`thumb:${setId}`); BlobURLs.drop(`bg:${setId}/`);
    Bus.emit('library:changed');
  },
  async clearAll() {
    await DB.clear('sets'); await DB.clear('maps');
    const keys = await DB.getAllKeys('files');
    for (const k of keys) if (!String(k).startsWith('skin:')) await DB.del('files', k);
    this.sets = []; this.maps.clear(); this.setById.clear();
    Bus.emit('library:changed');
  },
  async exportOsz(setId) {
    const set = this.setById.get(setId);
    if (!set) return;
    const files = [];
    for (const real of Object.values(set.fileIndex)) {
      const b = await DB.get('files', `${setId}/${real}`);
      if (b) files.push({ name: real, data: new Uint8Array(await b.arrayBuffer()) });
    }
    downloadBlob(writeZip(files), `${set.artist} - ${set.title}.osz`.replace(/[\\/:*?"<>|]/g, '_'));
  },
};

/** Walk a DataTransfer (supports dropped folders via webkitGetAsEntry). */
async function filesFromDataTransfer(dt) {
  const out = [];
  const items = dt.items ? Array.from(dt.items) : [];
  const entries = items.map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return Array.from(dt.files || []);
  const walk = async (entry, path) => {
    if (entry.isFile) {
      const f = await new Promise((res, rej) => entry.file(res, rej));
      f.relPath = path + f.name;
      out.push(f);
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const e of batch) await walk(e, path + entry.name + '/');
      } while (batch.length);
    }
  };
  for (const e of entries) await walk(e, '');
  return out;
}

// ─────────────────────────────── Providers ───────────────────────────────
/** BeatmapProvider interface. Online providers (mirrors, APIs) can implement this later;
 *  the core game only ever depends on the LocalBeatmapProvider. */
class BeatmapProvider {
  get id() { return 'abstract'; }
  get name() { return 'Provider'; }
  get online() { return false; }
  /** @returns {Promise<Array<{id, title, artist, creator, difficulties}>>} */
  async search(query, options) { throw new Error('not implemented'); }
  async getBeatmap(id) { throw new Error('not implemented'); }
  /** @returns {Promise<Blob>} an .osz archive */
  async downloadBeatmap(id, onProgress) { throw new Error('not implemented'); }
  async getMetadata(id) { throw new Error('not implemented'); }
}
class LocalBeatmapProvider extends BeatmapProvider {
  get id() { return 'local'; }
  get name() { return 'Local library'; }
  async search(query) {
    const q = (query || '').toLowerCase();
    return BeatmapManager.sets.filter(s => !q || fuzzyScore(`${s.artist} ${s.title} ${s.creator} ${s.tags}`, q) > 0)
      .map(s => ({ id: s.id, title: s.title, artist: s.artist, creator: s.creator, difficulties: s.maps.map(m => m.version) }));
  }
  async getBeatmap(id) { return BeatmapManager.maps.get(id) || null; }
  async downloadBeatmap(id) {
    const set = BeatmapManager.setById.get(id);
    if (!set) throw new Error('Unknown set');
    const files = [];
    for (const real of Object.values(set.fileIndex)) {
      const b = await DB.get('files', `${id}/${real}`);
      if (b) files.push({ name: real, data: new Uint8Array(await b.arrayBuffer()) });
    }
    return writeZip(files);
  }
  async getMetadata(id) { const s = BeatmapManager.setById.get(id); return s ? { ...s, maps: undefined } : null; }
}
const BeatmapProviders = {
  list: [new LocalBeatmapProvider()],
  register(p) { if (!(p instanceof BeatmapProvider)) throw new Error('Provider must extend BeatmapProvider'); this.list.push(p); },
  get(id) { return this.list.find(p => p.id === id); },
};

    desc: 'Uguuuuuuuu… 1.5× speed with raised pitch.' },
  { id: 'HD', name: 'Hidden', group: 'increase', key: 'KeyH', mult: 1.0, color: '#ff7a8a', incompatible: ['FI'],
    desc: 'Notes fade out before you hit them.' },
  { id: 'FI', name: 'Fade In', group: 'increase', key: 'KeyJ', mult: 1.0, color: '#ff7a8a', incompatible: ['HD'],
    desc: 'Notes appear out of nowhere near the receptors.' },
  { id: 'MR', name: 'Mirror', group: 'conversion', key: 'KeyZ', mult: 1.0, color: '#b28bff', incompatible: ['RD'],
    desc: 'Columns are mirrored left ↔ right.' },
  { id: 'RD', name: 'Random', group: 'conversion', key: 'KeyX', mult: 1.0, color: '#b28bff', incompatible: ['MR'],
    desc: 'Columns are shuffled (seeded — replays stay reproducible).' },
  { id: 'CS', name: 'Constant Speed', group: 'conversion', key: 'KeyC', mult: 0.9, color: '#b28bff', incompatible: [],
    desc: 'No more tricky speed changes: ignores SV and BPM scroll changes.' },
  { id: 'NLN', name: 'No Long Notes', group: 'conversion', key: 'KeyV', mult: 0.9, color: '#b28bff', incompatible: [],
    desc: 'Long notes become regular notes.' },
  { id: 'AT', name: 'Auto', group: 'automation', key: 'KeyM', mult: 1.0, color: '#6cc6ff', incompatible: ['NF', 'SD', 'PF'], unranked: true,
    desc: 'Watch a perfect automated play-through. Scores are not saved.' },
];
const MOD_BY_ID = new Map(MODS.map(m => [m.id, m]));
const MOD_GROUPS = [['reduction', 'Difficulty Reduction'], ['increase', 'Difficulty Increase'], ['conversion', 'Conversion'], ['automation', 'Automation']];

const ModSystem = {
  normalize(list) { return MODS.filter(m => list.includes(m.id)).map(m => m.id); },
  toggle(list, id) {
    const m = MOD_BY_ID.get(id);
    if (!m) return list;
    if (list.includes(id)) return list.filter(x => x !== id);
    return this.normalize([...list.filter(x => !m.incompatible.includes(x) && !(MOD_BY_ID.get(x)?.incompatible || []).includes(id)), id]);
  },
  multiplier(list) { return list.reduce((a, id) => a * (MOD_BY_ID.get(id)?.mult ?? 1), 1); },
  rate(list) { for (const id of list) { const r = MOD_BY_ID.get(id)?.rate; if (r) return r; } return 1; },
  pitchShift(list) { return list.some(id => MOD_BY_ID.get(id)?.pitch); },
  label(list) { return list.length ? list.join('') : 'NM'; },
  isRanked(list) { return !list.some(id => MOD_BY_ID.get(id)?.unranked); },
  /** Timing window multiplier in real time. */
  windowScale(list) { return list.includes('HR') ? 1 / 1.4 : list.includes('EZ') ? 1.4 : 1; },
  drainScale(list) { return list.includes('HR') ? 1.4 : list.includes('EZ') ? 0.5 : 1; },
  /** Column permutation for Mirror / Random. */
  columnMap(list, keys, seed) {
    const map = Array.from({ length: keys }, (_, i) => i);
    if (list.includes('MR')) map.reverse();
    if (list.includes('RD')) {
      const rnd = mulberry32(seed);
      for (let i = keys - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [map[i], map[j]] = [map[j], map[i]]; }
    }
    return map;
  },
  badge(id, small = false) {
    const m = MOD_BY_ID.get(id);
    return h(`span.mod-badge${small ? '.small' : ''}`, { style: { '--mod': m ? m.color : '#888' }, title: m ? m.name : id }, id);
  },
};

/* ===== 09-gameplay.js ===== */
/* JudgementSystem / ScoreSystem / HealthSystem / GameplayEngine.
 * Pure, deterministic logic: given notes and a sequence of (column, down/up, songTime) inputs it
 * always produces the same result. Live play and replay playback share this code path exactly. */

const J = { MARV: 0, PERF: 1, GREAT: 2, GOOD: 3, BAD: 4, MISS: 5 };
const JUDGEMENTS = [
  { id: '300g', name: 'Marvelous', short: 'MAX', score: 305, v1: 300, color: '#ffe066', health: 0.008 },
  { id: '300', name: 'Perfect', short: '300', score: 300, v1: 300, color: '#ffc233', health: 0.006 },
  { id: '200', name: 'Great', short: '200', score: 200, v1: 200, color: '#38d97a', health: 0.002 },
  { id: '100', name: 'Good', short: '100', score: 100, v1: 100, color: '#3c9dff', health: 0 },
  { id: '50', name: 'Bad', short: '50', score: 50, v1: 50, color: '#b07cf0', health: -0.012 },
  { id: '0', name: 'Miss', short: 'MISS', score: 0, v1: 0, color: '#ff4a5c', health: -0.06 },
];
const TAIL_LENIENCE = 1.5;

/** Timing windows in real milliseconds (before rate scaling). */
function timingWindows({ od = 5, mods = [], mode = 'od', customOD = 8, customMs = '' } = {}) {
  let w;
  if (mode === 'ms') {
    const p = String(customMs).split(/[,\s]+/).map(Number).filter(n => isFinite(n) && n > 0);
    if (p.length === 6) w = p.slice().sort((a, b) => a - b);
  }
  if (!w) {
    const o = mode === 'custom' ? customOD : od;
    w = [16, 64 - 3 * o, 97 - 3 * o, 127 - 3 * o, 151 - 3 * o, 188 - 3 * o];
  }
  const s = ModSystem.windowScale(mods);
  return w.map(x => x * s);
}

class ScoreSystem {
  constructor(totalJudgements, { mods = [], accuracyMode = 'v2' } = {}) {
    this.total = Math.max(1, totalJudgements);
    this.mult = ModSystem.multiplier(mods);
    this.accMode = accuracyMode;
    this.counts = [0, 0, 0, 0, 0, 0];
    this.judged = 0; this.combo = 0; this.maxCombo = 0;
    this.scoreSum = 0; this.accSum = 0; this.comboSum = 0;
    this.comboBreaks = 0;
    let cm = 0; for (let k = 1; k <= this.total; k++) cm += Math.min(k, 400) / 400;
    this.comboMax = cm;
  }
  add(j) {
    const J_ = JUDGEMENTS[j];
    this.counts[j]++; this.judged++;
    this.scoreSum += J_.score;
    this.accSum += this.accMode === 'v1' ? J_.v1 : J_.score;
    if (j === J.MISS) this.breakCombo();
    else {
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      this.comboSum += (J_.score / 305) * Math.min(this.combo, 400) / 400;
    }
  }
  breakCombo() { if (this.combo > 0) this.comboBreaks++; this.combo = 0; }
  get accuracy() {
    if (!this.judged) return 1;
    return this.accSum / (this.judged * (this.accMode === 'v1' ? 300 : 305));
  }
  get score() {
    return Math.round(1e6 * this.mult * (0.99 * this.scoreSum / (this.total * 305) + 0.01 * this.comboSum / this.comboMax));
  }
  /** Score if the rest of the map were played perfectly — used for pace display. */
  grade(failed = false, mods = []) { return ScoreSystem.gradeFor(this.accuracy, failed, mods, this.counts); }
  static gradeFor(acc, failed, mods = [], counts = null) {
    if (failed) return 'F';
    const hid = mods.includes('HD') || mods.includes('FI');
    const perfect = counts ? counts[2] + counts[3] + counts[4] + counts[5] === 0 : acc >= 1;
    if (perfect) return hid ? 'XH' : 'SS';
    if (acc >= 0.95) return hid ? 'SH' : 'S';
    if (acc >= 0.9) return 'A';
    if (acc >= 0.8) return 'B';
    if (acc >= 0.7) return 'C';
    return 'D';
  }
}

class HealthSystem {
  constructor({ hp = 5, mods = [], noFail = false } = {}) {
    this.value = 1;
    this.factor = (0.5 + hp / 10) * ModSystem.drainScale(mods);
    this.noFail = noFail || mods.includes('NF') || mods.includes('AT');
    this.suddenDeath = mods.includes('SD');
    this.perfect = mods.includes('PF');
    this.failed = false; this.failTime = null;
    this.min = 1;
  }
  apply(j, t) {
    const g = JUDGEMENTS[j].health;
    this.value = clamp(this.value + (g < 0 ? g * this.factor : g), 0, 1);
    if (this.value < this.min) this.min = this.value;
    if (this.suddenDeath && j === J.MISS) this.fail(t);
    if (this.perfect && j >= J.GREAT) this.fail(t);
    if (this.value <= 0) this.fail(t);
  }
  earlyRelease(t) {
    this.value = clamp(this.value - 0.03 * this.factor, 0, 1);
    if (this.suddenDeath) this.fail(t);
    if (this.value <= 0) this.fail(t);
  }
  fail(t) { if (this.noFail || this.failed) return; this.failed = true; this.failTime = t; }
}

/** Note states */
const NS = { PENDING: 0, HOLDING: 1, DONE: 2, MISSED: 3, DROPPED: 4 };

class GameplayEngine {
  /**
   * @param {object} o
   * @param {Array} o.notes  mania notes (already column-mapped / converted for mods)
   * @param {number} o.keys
   * @param {number[]} o.windows real-time windows [marv..miss] ms
   * @param {number} o.rate playback rate (map-time windows = real * rate)
   */
  constructor({ notes, keys, windows, rate = 1, mods = [], hp = 5, accuracyMode = 'v2', noFail = false }) {
    this.keys = keys; this.rate = rate; this.mods = mods;
    this.W = windows.map(w => w * rate);
    this.TW = this.W.map(w => w * TAIL_LENIENCE);
    this.notes = notes.map((n, i) => ({ ...n, i, state: NS.PENDING, headJ: -1, tailJ: -1, capped: false, holdStart: 0, hitTime: 0 }));
    this.columns = Array.from({ length: keys }, () => []);
    for (const n of this.notes) this.columns[n.col].push(n);
    this.ptr = new Array(keys).fill(0);
    this.held = new Array(keys).fill(false);
    this.holding = new Array(keys).fill(null);
    const totalJ = this.notes.reduce((a, n) => a + (n.isLN ? 2 : 1), 0);
    this.totalJudgements = totalJ;
    this.score = new ScoreSystem(totalJ, { mods, accuracyMode });
    this.health = new HealthSystem({ hp, mods, noFail });
    this.hitErrors = [];            // {t, err (real ms), j, tail}
    this.judgementLog = [];         // {t, j, col}
    this.lastJudgement = null;
    this.remaining = totalJ;
    this.listeners = [];
    this.inputCount = 0;
    this.pressCounts = new Array(keys).fill(0);
    this.lastTime = -Infinity;
  }
  onEvent(fn) { this.listeners.push(fn); }
  _emit(e) { for (const fn of this.listeners) fn(e); }

  _judge(n, j, t, err, tail) {
    this.score.add(j);
    this.health.apply(j, t);
    this.remaining--;
    const e = { type: 'judgement', col: n.col, j, t, err, tail, note: n };
    this.lastJudgement = e;
    this.judgementLog.push({ t, j, col: n.col });
    if (err !== null && j !== J.MISS) this.hitErrors.push({ t, err: err / this.rate, j, tail });
    this._emit(e);
  }
  _windowFor(absErr, W) {
    for (let j = 0; j < 5; j++) if (absErr <= W[j]) return j;
    return J.MISS;
  }

  /** Process misses / auto-resolutions up to song time t. */
  advance(t) {
    if (t < this.lastTime) t = this.lastTime;
    this.lastTime = t;
    for (let c = 0; c < this.keys; c++) {
      const col = this.columns[c];
      let p = this.ptr[c];
      while (p < col.length) {
        const n = col[p];
        if (n.state === NS.PENDING) {
          if (t - n.time > this.W[J.MISS]) {
            this._judge(n, J.MISS, n.time + this.W[J.MISS], null, false);
            if (n.isLN) { n.state = NS.DROPPED; n.headJ = J.MISS; continue; }
            n.state = NS.MISSED; n.headJ = J.MISS; p++; continue;
          }
          break;
        } else if (n.state === NS.HOLDING) {
          if (t - n.end > this.TW[J.BAD]) {
            // held past the release window: judged as a late release
            n.tailJ = J.BAD; n.state = NS.DONE;
            this.holding[c] = null;
            this._judge(n, n.tailJ, n.end + this.TW[J.BAD], null, true);
            p++; continue;
          }
          break;
        } else if (n.state === NS.DROPPED) {
          if (t > n.end) {
            n.tailJ = J.MISS; n.state = NS.MISSED;
            this._judge(n, J.MISS, n.end, null, true);
            p++; continue;
          }
          break;
        } else { p++; }
      }
      this.ptr[c] = p;
    }
  }

  /** Key press/release at song time t (map ms). */
  input(col, down, t) {
    if (col < 0 || col >= this.keys) return;
    this.advance(t);
    this.inputCount++;
    if (down) {
      if (this.held[col]) return;
      this.held[col] = true;
      this.pressCounts[col]++;
      const colNotes = this.columns[col];
      const n = colNotes[this.ptr[col]];
      this._emit({ type: 'press', col, t, note: n || null });
      if (!n) return;
      if (n.state === NS.PENDING) {
        const err = t - n.time;
        if (err < -this.W[J.MISS]) return; // too early: nothing happens
        const j = this._windowFor(Math.abs(err), this.W);
        n.headJ = j; n.hitTime = t;
        if (n.isLN) {
          if (j === J.MISS) { n.state = NS.DROPPED; this._judge(n, j, t, err, false); }
          else { n.state = NS.HOLDING; n.holdStart = t; this.holding[col] = n; this._judge(n, j, t, err, false); }
        } else {
          n.state = j === J.MISS ? NS.MISSED : NS.DONE;
          this._judge(n, j, t, err, false);
          this.ptr[col]++;
        }
      } else if (n.state === NS.DROPPED && t >= n.time - this.W[J.BAD] && t <= n.end) {
        // re-grab a dropped long note: tail result is capped at Bad
        n.state = NS.HOLDING; n.capped = true; this.holding[col] = n;
        this._emit({ type: 'regrab', col, t, note: n });
      }
    } else {
      if (!this.held[col]) return;
      this.held[col] = false;
      this._emit({ type: 'release', col, t });
      const n = this.holding[col];
      if (!n) return;
      this.holding[col] = null;
      const err = t - n.end;
      if (err < -this.TW[J.BAD]) {
        // released too early
        n.state = NS.DROPPED; n.capped = true;
        this.score.breakCombo();
        this.health.earlyRelease(t);
        this._emit({ type: 'earlyRelease', col, t, note: n });
        return;
      }
      let j = this._windowFor(Math.abs(err), this.TW);
      if (n.capped) j = Math.max(j, J.BAD);
      n.tailJ = j; n.state = NS.DONE;
      this._judge(n, j, t, err, true);
      this.ptr[col]++;
    }
  }

  get finished() { return this.remaining <= 0; }
  get endTime() { return this.notes.length ? Math.max(...this.notes.slice(-this.keys * 4).map(n => n.end)) : 0; }

  /** Reset notes in [from, to] (practice looping). */
  resetRange(from, to) {
    for (let c = 0; c < this.keys; c++) {
      const col = this.columns[c];
      let first = -1;
      for (let i = 0; i < col.length; i++) {
        const n = col[i];
        if (n.time >= from - 1 && n.time <= to) {
          if (n.state !== NS.PENDING) this.remaining += n.isLN ? 2 : 1;
          n.state = NS.PENDING; n.headJ = -1; n.tailJ = -1; n.capped = false;
          if (first < 0) first = i;
        }
      }
      if (first >= 0) this.ptr[c] = Math.min(this.ptr[c], first);
      this.held[c] = false; this.holding[c] = null;
    }
    this.lastTime = from - 1;
  }

  summary() {
    const errs = this.hitErrors.filter(e => !e.tail).map(e => e.err);
    const mean = errs.length ? errs.reduce((a, b) => a + b, 0) / errs.length : 0;
    const sd = errs.length > 1 ? Math.sqrt(errs.reduce((a, b) => a + (b - mean) ** 2, 0) / (errs.length - 1)) : 0;
    return {
      score: this.score.score, accuracy: this.score.accuracy, maxCombo: this.score.maxCombo, combo: this.score.combo,
      counts: [...this.score.counts], comboBreaks: this.score.comboBreaks,
      meanError: mean, unstableRate: sd * 10,
      early: errs.filter(e => e < 0).length, late: errs.filter(e => e > 0).length,
      hitErrors: this.hitErrors.map(e => [Math.round(e.t), Math.round(e.err * 10) / 10, e.j, e.tail ? 1 : 0]),
      totalJudgements: this.totalJudgements,
    };
  }
}

/** Prepare notes for a play: apply column map (MR/RD) and NLN. */
function prepareNotes(notes, keys, mods, seed) {
  const map = ModSystem.columnMap(mods, keys, seed);
  const nln = mods.includes('NLN');
  return notes.map(n => ({ ...n, col: map[n.col], isLN: nln ? false : n.isLN, end: nln ? n.time : n.end }));
}

/** Auto: generate a perfect input stream. Returns flat events [t, col, down(1/0)] sorted. */
function generateAutoInputs(notes, keys) {
  const byCol = Array.from({ length: keys }, () => []);
  for (const n of notes) byCol[n.col].push(n);
  const ev = [];
  for (const col of byCol) {
    for (let i = 0; i < col.length; i++) {
      const n = col[i], next = col[i + 1];
      let up = n.isLN ? n.end : n.time + 45;
      if (next && up >= next.time) up = n.isLN ? n.end : (n.time + next.time) / 2;
      ev.push([n.time, n.col, 1], [up, n.col, 0]);
    }
  }
  ev.sort((a, b) => a[0] - b[0] || a[2] - b[2]);
  return ev;
}

/** Resolve beatmap hitsounds (sample set / additions / custom index / keysounds). */
const HitSounds = {
  SETS: ['', 'normal', 'soft', 'drum'],
  /** List of {name, volume, file?} to play for a note. */
  resolve(note, bm, tpIndex) {
    const s = note.sample || [];
    const tp = tpIndex(note.time);
    const mapSet = { normal: 1, soft: 2, drum: 3 }[bm.sampleSetName] || 1;
    let normal = parseInt(s[0], 10) || tp?.sampleSet || mapSet;
    let add = parseInt(s[1], 10) || normal;
    const idx = parseInt(s[2], 10) || tp?.sampleIndex || 0;
    const vol = (parseInt(s[3], 10) || tp?.volume || 100) / 100;
    const file = s[4] ? normPath(s[4]) : '';
    const out = [];
    if (file) { out.push({ file, volume: vol }); return out; }
    const nm = (set, sound) => `${this.SETS[set] || 'normal'}-hit${sound}`;
    out.push({ name: nm(normal, 'normal'), index: idx, volume: vol });
    if (note.hs & 2) out.push({ name: nm(add, 'whistle'), index: idx, volume: vol });
    if (note.hs & 4) out.push({ name: nm(add, 'finish'), index: idx, volume: vol });
    if (note.hs & 8) out.push({ name: nm(add, 'clap'), index: idx, volume: vol });
    return out;
  },
};

/** Loads sample buffers for a play (beatmap custom samples > skin > default). */
class SampleBank {
  constructor(setId) { this.setId = setId; this.cache = new Map(); }
  async _beatmapSample(base) {
    for (const ext of ['wav', 'ogg', 'mp3']) {
      if (BeatmapManager.hasFile(this.setId, `${base}.${ext}`)) {
        const b = await BeatmapManager.getFile(this.setId, `${base}.${ext}`);
        if (b && b.size > 64) return AudioManager.decode(await b.arrayBuffer()).catch(() => null);
        return null;
      }
    }
    return undefined;
  }
  async get(spec) {
    const key = spec.file ? `f:${spec.file}` : `${spec.name}:${spec.index || 0}`;
    if (this.cache.has(key)) return this.cache.get(key);
    const p = (async () => {
      const useMap = Settings.get('audio.beatmapSamples');
      if (spec.file) {
        if (!useMap) return null;
        const b = await BeatmapManager.getFile(this.setId, spec.file);
        return b ? AudioManager.decode(await b.arrayBuffer()).catch(() => null) : null;
      }
      if (useMap && spec.index > 0) {
        const r = await this._beatmapSample(spec.index === 1 ? spec.name : spec.name + spec.index);
        if (r !== undefined) return r;
      }
      return SkinManager.sample(spec.name);
    })();
    this.cache.set(key, p);
    return p;
  }
  async preload(specLists) {
    const uniq = new Map();
    for (const l of specLists) for (const s of l) uniq.set(s.file ? `f:${s.file}` : `${s.name}:${s.index || 0}`, s);
    await Promise.all([...uniq.values()].map(s => this.get(s)));
  }
  play(specs) {
    for (const s of specs) {
      const p = this.cache.get(s.file ? `f:${s.file}` : `${s.name}:${s.index || 0}`);
      if (p) p.then(b => b && AudioManager.play(b, { volume: s.volume ?? 1 }));
    }
  }
}

/* ===== 10-renderer.js ===== */
/* Renderer — Canvas 2D mania stage renderer driven by the TimingEngine clock.
 * All skin geometry is expressed in osu! "480-space" units and scaled by (canvas height / 480),
 * matching how skin.ini [Mania] values are authored. Nothing here decides judgements. */

class ScrollMap {
  constructor(segs) { this.segs = segs; this.i = 0; }
  pos(t) {
    const s = this.segs;
    let i = this.i;
    if (i >= s.length) i = s.length - 1;
    if (t < s[i].time) { i = bsearchLE(s, t, 'time'); if (i < 0) i = 0; }
    else while (i + 1 < s.length && s[i + 1].time <= t) i++;
    this.i = i;
    const g = s[i];
    return g.pos + (t - g.time) * g.vel;
  }
  /** Stateless variant (does not disturb the cached cursor). */
  posAt(t) { let i = bsearchLE(this.segs, t, 'time'); if (i < 0) i = 0; const g = this.segs[i]; return g.pos + (t - g.time) * g.vel; }
  velAt(t) { let i = bsearchLE(this.segs, t, 'time'); if (i < 0) i = 0; return this.segs[i].vel; }
}

class ManiaRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
    this.layout = null;
    this.effects = [];          // lighting + particles
    this.judgementFx = null;
    this.comboBump = 0;
    this.lastCombo = 0;
    this.keyLight = [];         // release time per column for stage light fade
    this.fontCache = new Map();
  }
  setLayout(layout) {
    this.layout = layout;
    this.keyLight = new Array(layout.keys).fill(-1e9);
    this.effects = []; this.judgementFx = null;
    this.resize(true);
  }
  resize(force = false) {
    const c = this.canvas;
    const dpr = (window.devicePixelRatio || 1) * Settings.get('graphics.renderScale');
    const w = Math.max(1, Math.round(c.clientWidth * dpr)), hh = Math.max(1, Math.round(c.clientHeight * dpr));
    if (!force && w === c.width && hh === c.height) return;
    c.width = w; c.height = hh;
    this.W = w; this.H = hh;
    this._geom();
  }
  _geom() {
    const L = this.layout;
    if (!L) return;
    const s = this.H / 480;
    this.s = s;
    const lw = Settings.get('gameplay.laneWidth');
    this.colW = L.columnWidth.map(w => w * s * lw);
    this.colX = [];
    let x = 0;
    for (let i = 0; i < L.keys; i++) {
      this.colX.push(x);
      x += this.colW[i] + (i < L.keys - 1 ? (L.columnSpacing[i] || 0) * s * lw : 0);
    }
    this.stageW = x;
    const pos = Settings.get('gameplay.stagePosition');
    this.stageX = pos === 'skin' ? L.columnStart * s * (this.W / this.H > 4 / 3 ? 1 : 1)
      : pos === 'left' ? this.W * 0.12 : pos === 'right' ? this.W * 0.88 - this.stageW : (this.W - this.stageW) / 2;
    this.hitY = clamp((L.hitPosition + Settings.get('gameplay.hitPositionOffset')) * s, 40 * s, this.H - 4);
    this.up = Settings.get('gameplay.scrollDirection') === 'up' || L.upsideDown;
  }
  /** Map a down-scroll rect to the actual direction and draw an image. */
  _img(img, x, yTop, w, h, flipY = false) {
    if (!img || w <= 0 || h <= 0) return;
    if (this.up) yTop = this.H - yTop - h;
    if (flipY) {
      const c = this.ctx;
      c.save(); c.translate(x, yTop + h); c.scale(1, -1); c.drawImage(img, 0, 0, w, h); c.restore();
      return;
    }
    this.ctx.drawImage(img, x, yTop, w, h);
  }
  _rect(x, yTop, w, h) { if (this.up) yTop = this.H - yTop - h; this.ctx.fillRect(x, yTop, w, h); }
  _noteH(tex, i) {
    const L = this.layout;
    if (!tex) return 0;
    // note height follows the narrowest column (or WidthForNoteHeightScale) so every column's notes match
    const w = L.widthForNoteHeightScale > 0 ? L.widthForNoteHeightScale * this.s * Settings.get('gameplay.laneWidth') : Math.min(...this.colW);
    return tex.h * (w / tex.w);
  }

  /** Render a frame. g: {now, posNow, scroll:ScrollMap, pxPerMs, engine, held[], barlines[], hidden:'HD'|'FI'|null, realNow} */
  render(g) {
    const L = this.layout;
    if (!L) return;
    this.resize();
    const ctx = this.ctx, s = this.s, K = L.keys, H = this.H;
    const realNow = g.realNow ?? performance.now();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, this.W, H);
    ctx.save();
    ctx.translate(this.stageX, 0);

    // column backgrounds
    for (let i = 0; i < K; i++) {
      ctx.fillStyle = rgba(L.colours.column[i]);
      ctx.fillRect(this.colX[i], 0, this.colW[i], H);
    }
    const dim = Settings.get('skin.dim');
    if (dim > 0) { ctx.fillStyle = `rgba(0,0,0,${dim})`; ctx.fillRect(0, 0, this.stageW, H); }
    // column lines
    if (L.columnLineWidth.some(w => w > 0)) {
      ctx.fillStyle = rgba(L.colours.columnLine, 0.5);
      for (let i = 0; i <= K; i++) {
        const w = (L.columnLineWidth[i] || 0) * s * 0.5;
        if (w <= 0) continue;
        const x = i < K ? this.colX[i] : this.stageW;
        ctx.fillRect(x - w / 2, 0, w, this.hitY);
      }
    }
    const pxPerMs = g.pxPerMs;
    const yOf = pos => this.hitY - (pos - g.posNow) * pxPerMs;
    // barlines
    if (g.barlines && Settings.get('gameplay.barlines')) {
      ctx.fillStyle = rgba(L.colours.barline, 0.6);
      const bh = Math.max(1, L.barlineHeight * s * 0.5);
      for (let i = g.barIdx || 0; i < g.barlines.length; i++) {
        const t = g.barlines[i];
        const y = yOf(g.scroll.posAt(t));
        if (y > this.hitY + 2) { g.barIdx = i + 1; continue; }
        if (y < -10) break;
        this._rect(0, y - bh, this.stageW, bh);
      }
    }
    // stage light (key press glow)
    if (Settings.get('skin.effects')) {
      for (let i = 0; i < K; i++) {
        const t = L.tinted.stageLight[i];
        if (!t) continue;
        let a = 0;
        if (g.held[i]) a = 1; else { const dt = realNow - this.keyLight[i]; if (dt < 120) a = 1 - dt / 120; }
        if (a <= 0) continue;
        ctx.globalAlpha = a;
        const h = t.h * s;
        const bottom = (L.lightPosition + Settings.get('gameplay.hitPositionOffset')) * s;
        this._img(t.frameAt(realNow), this.colX[i], bottom - h, this.colW[i], h);
        ctx.globalAlpha = 1;
      }
    }
    // stage hint
    if (L.tex.stageHint) {
      const t = L.tex.stageHint, h = t.h * s;
      this._img(t.img, 0, this.hitY - h / 2, this.stageW, h);
    }
    const drawKeys = () => {
      for (let i = 0; i < K; i++) {
        const t = g.held[i] ? (L.tex.keyD[i] || L.tex.key[i]) : L.tex.key[i];
        if (!t) continue;
        const h = t.h * (this.colW[i] / t.w);
        this._img(t.img, this.colX[i], H - h, this.colW[i], h);
      }
    };
    if (L.keysUnderNotes) drawKeys();

    // notes
    if (g.engine) this._drawNotes(g, yOf, realNow);

    if (L.judgementLine) {
      ctx.fillStyle = rgba(L.colours.judgementLine, 0.9);
      this._rect(0, this.hitY - Math.max(1, s * 0.5), this.stageW, Math.max(1, s * 0.5));
    }
    if (!L.keysUnderNotes) drawKeys();
    // stage sides / bottom
    if (L.tex.stageLeft) { const t = L.tex.stageLeft, w = t.w * s; ctx.drawImage(t.img, -w, 0, w, H); }
    if (L.tex.stageRight) { const t = L.tex.stageRight, w = t.w * s; ctx.drawImage(t.img, this.stageW, 0, w, H); }
    if (L.tex.stageBottom) {
      const t = L.tex.stageBottom, w = t.w * s, h = t.h * s;
      this._img(t.img, (this.stageW - w) / 2, H - h, w, h);
    }
    // lighting
    if (Settings.get('gameplay.hitLighting')) this._drawLighting(g, realNow);
    this._drawParticles(realNow);
    // judgement & combo
    if (g.engine) {
      this._drawJudgement(realNow);
      this._drawCombo(g.engine.score.combo, realNow);
      if (Settings.get('gameplay.hitErrorBar')) this._drawErrorBar(g, realNow);
    }
    ctx.restore();
    if (g.engine) {
      if (Settings.get('gameplay.showHealth')) this._drawHealth(g.engine.health.value);
      if (Settings.get('input.keyOverlay')) this._drawKeyOverlay(g);
      if (Settings.get('gameplay.judgementCounter')) this._drawCounter(g.engine.score.counts);
    }
  }

  _noteAlpha(y, hidden) {
    if (!hidden) return 1;
    const f = y / this.hitY;
    if (hidden === 'HD') return clamp(1 - (f - 0.45) / 0.2, 0, 1);
    return clamp((f - 0.3) / 0.2, 0, 1);
  }

  _drawNotes(g, yOf, realNow) {
    const L = this.layout, ctx = this.ctx, eng = g.engine, K = L.keys;
    const top = -this.H * 0.1;
    for (let c = 0; c < K; c++) {
      const col = eng.columns[c];
      const x = this.colX[c], w = this.colW[c];
      const texN = L.tex.note[c], texH = L.tex.noteH[c], texL = L.tex.noteL[c], texT = L.tex.noteT[c];
      for (let i = eng.ptr[c]; i < col.length; i++) {
        const n = col[i];
        if (n.state === NS.DONE || (n.state === NS.MISSED && !n.isLN)) continue;
        const headPos = g.scroll.pos(n.time);
        let yHead = yOf(headPos);
        if (yHead < top && !n.isLN) break;
        if (n.isLN) {
          const yTail = yOf(g.scroll.posAt(n.end));
          if (yTail > this.H + 50 && n.state !== NS.HOLDING) continue;
          if (yHead < top && yTail < top) break;
          const holding = n.state === NS.HOLDING;
          if (holding) yHead = Math.min(yHead, this.hitY);
          const dropped = n.state === NS.DROPPED || n.state === NS.MISSED;
          const alpha = this._noteAlpha(Math.max(yTail, 0), g.hidden) * (dropped ? 0.45 : 1);
          ctx.globalAlpha = Math.max(this._noteAlpha(yHead, g.hidden), alpha) * (dropped ? 0.45 : 1);
          const hh = this._noteH(texH || texN, c);
          const th = texT ? this._noteH(texT, c) : 0;
          // body runs from the head's centre to the tail's centre; the tail cap is drawn flipped over the
          // body end in down-scroll (legacy skins author tails as "caps" that round the body off)
          const bodyTop = yTail - th / 2, bodyBottom = yHead - hh / 2;
          if (texL && bodyBottom > bodyTop) this._drawBody(texL, x, w, bodyTop, bodyBottom, L.noteBodyStyle[c], realNow);
          if (texT && yTail - th < yHead - hh / 2) this._img(texT.frameAt(realNow), x, yTail - th, w, th, !this.up);
          if (texH || texN) this._img((texH || texN).frameAt(realNow), x, yHead - hh, w, hh);
          ctx.globalAlpha = 1;
        } else {
          if (yHead > this.H + 60) continue;
          const nh = this._noteH(texN, c);
          ctx.globalAlpha = this._noteAlpha(yHead, g.hidden) * (n.state === NS.MISSED ? 0.5 : 1);
          if (texN) this._img(texN.frameAt(realNow), x, yHead - nh, w, nh);
          ctx.globalAlpha = 1;
        }
      }
    }
  }
  _drawBody(tex, x, w, top, bottom, style, realNow) {
    const img = tex.frameAt(realNow);
    const len = bottom - top;
    if (style === 0) { this._img(img, x, top, w, len); return; }
    const th = Math.max(2, tex.h * (w / tex.w));
    const ctx = this.ctx;
    ctx.save();
    const clipY = this.up ? this.H - bottom : top;
    ctx.beginPath(); ctx.rect(x, clipY, w, len); ctx.clip();
    if (style === 2) { for (let y = bottom - th; y > top - th; y -= th) this._img(img, x, y, w, th); }
    else { for (let y = top; y < bottom; y += th) this._img(img, x, y, w, th); }
    ctx.restore();
  }

  // ── effects
  onJudgement(e, realNow) {
    const L = this.layout;
    if (!L) return;
    if (e.j !== J.MISS && Settings.get('gameplay.hitLighting') && (!e.note.isLN || e.tail)) this.effects.push({ type: 'N', col: e.col, t0: realNow });
    if (Settings.get('gameplay.showJudgements')) this.judgementFx = { j: e.j, t0: realNow };
    if (Settings.get('graphics.particles') && e.j <= J.GREAT) {
      const n = e.j === J.MARV ? 7 : 4;
      const gold = e.j === J.MARV && Settings.get('gameplay.neruSparkle');
      for (let k = 0; k < n; k++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
        const sp = (0.25 + Math.random() * 0.45) * this.s;
        this.effects.push({ type: 'P', col: e.col, t0: realNow, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          color: gold ? `hsl(${45 + Math.random() * 10},100%,${60 + Math.random() * 20}%)` : rgba(L.colours.light[e.col]), star: gold, life: 380 + Math.random() * 200 });
      }
    }
  }
  onRelease(col, realNow) { this.keyLight[col] = realNow; }

  _drawLighting(g, realNow) {
    const L = this.layout, ctx = this.ctx, s = this.s;
    ctx.globalCompositeOperation = 'lighter';
    // hold lighting
    const eng = g.engine;
    if (eng) for (let c = 0; c < L.keys; c++) {
      if (!eng.holding[c]) continue;
      const t = L.tinted.lightingL[c];
      if (!t) continue;
      const w = (L.lightingLWidth[c] > 0 ? L.lightingLWidth[c] * s : t.w * s), hh = t.h * (w / t.w);
      const cx = this.colX[c] + this.colW[c] / 2;
      this._img(t.frameAt(realNow), cx - w / 2, this.hitY - hh / 2, w, hh);
    }
    // hit lighting
    this.effects = this.effects.filter(e => {
      if (e.type !== 'N') return true;
      const t = L.tinted.lightingN[e.col];
      if (!t) return false;
      const el = realNow - e.t0;
      const multi = t.frames.length > 1;
      const dur = multi ? t.frames.length / t.fps * 1000 : 180;
      if (el > dur) return false;
      const w0 = (L.lightingNWidth[e.col] > 0 ? L.lightingNWidth[e.col] * s : t.w * s);
      const sc = multi ? 1 : 1 + el / dur * 0.25;
      const w = w0 * sc, hh = t.h * (w0 / t.w) * sc;
      ctx.globalAlpha = multi ? 1 : 1 - el / dur;
      const cx = this.colX[e.col] + this.colW[e.col] / 2;
      this._img(t.frameAt(el, false), cx - w / 2, this.hitY - hh / 2, w, hh);
      ctx.globalAlpha = 1;
      return true;
    });
    ctx.globalCompositeOperation = 'source-over';
  }
  _drawParticles(realNow) {
    const ctx = this.ctx;
    this.effects = this.effects.filter(e => {
      if (e.type !== 'P') return true;
      const el = realNow - e.t0;
      if (el > e.life) return false;
      const x = this.colX[e.col] + this.colW[e.col] / 2 + e.vx * el;
      let y = this.hitY + e.vy * el + 0.0006 * this.s * el * el;
      if (this.up) y = this.H - y;
      ctx.globalAlpha = 1 - el / e.life;
      ctx.fillStyle = e.color;
      const r = (e.star ? 3.2 : 2) * this.s * 0.5 * (1 - el / e.life * 0.5);
      if (e.star) {
        ctx.beginPath();
        for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + el / 200, rr = k % 2 ? r * 0.4 : r * 1.6; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
        ctx.fill();
      } else ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.globalAlpha = 1;
      return true;
    });
  }
  _drawJudgement(realNow) {
    const fx = this.judgementFx;
    if (!fx) return;
    const L = this.layout, el = realNow - fx.t0;
    const t = L.judgement[JUDGEMENTS[fx.j].id];
    if (!t) return;
    const total = t.frames.length > 1 ? Math.max(t.frames.length / t.fps * 1000, 300) : 360;
    if (el > total) { this.judgementFx = null; return; }
    const sk = Settings.get('skin.scale');
    const pop = t.frames.length > 1 ? 1 : (el < 60 ? 1.18 - 0.18 * (el / 60) : 1);
    const w = t.w * this.s * sk * pop * 0.8, hh = t.h * this.s * sk * pop * 0.8;
    const y = L.scorePosition * this.s;
    this.ctx.globalAlpha = el > total - 100 ? (total - el) / 100 : 1;
    this._img(t.frameAt(el, false), this.stageW / 2 - w / 2, y - hh / 2, w, hh);
    this.ctx.globalAlpha = 1;
  }
  _drawCombo(combo, realNow) {
    if (combo !== this.lastCombo) { if (combo > this.lastCombo) this.comboBump = realNow; this.lastCombo = combo; }
    if (combo < 2) return;
    const L = this.layout, ctx = this.ctx, s = this.s;
    const el = realNow - this.comboBump;
    const bump = Settings.get('gameplay.comboEffects') && el < 90 ? 1 + 0.12 * (1 - el / 90) : 1;
    const y = L.comboPosition * s;
    const cx = this.stageW / 2;
    const sk = Settings.get('skin.scale');
    const text = String(combo);
    if (L.font) {
      const glyphs = text.split('').map(ch => L.font.glyphs[ch]).filter(Boolean);
      const hh = glyphs[0].h * s * 0.8 * sk * bump;
      const widths = glyphs.map(gl => gl.w * (hh / gl.h));
      const ov = L.font.overlap * s * 0.8 * sk;
      const total = widths.reduce((a, b) => a + b, 0) - ov * (glyphs.length - 1);
      let x = cx - total / 2;
      glyphs.forEach((gl, k) => { this._img(gl.img, x, y - hh / 2, widths[k], hh); x += widths[k] - ov; });
      return;
    }
    const size = Math.round(26 * s * sk * bump);
    ctx.font = `800 ${size}px Nunito, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const yy = this.up ? this.H - y : y;
    ctx.lineWidth = Math.max(2, size / 8); ctx.strokeStyle = 'rgba(0,0,0,.7)';
    ctx.strokeText(text, cx, yy);
    const milestone = Settings.get('gameplay.comboEffects') && combo % 100 === 0;
    ctx.fillStyle = milestone ? '#ffd54a' : (this.layout.skin.builtin ? '#efe6ff' : '#fff');
    ctx.fillText(text, cx, yy);
  }
  _drawErrorBar(g, realNow) {
    const eng = g.engine, ctx = this.ctx, s = this.s;
    const W = eng.W.map(w => w / eng.rate);
    const width = Math.min(this.stageW * 0.9, 150 * s);
    const scale = width / 2 / W[J.BAD];
    const cx = this.stageW / 2;
    const y = this.up ? 14 * s : this.H - 8 * s;
    const hh = 2.4 * s;
    for (let j = J.BAD; j >= 0; j--) {
      ctx.fillStyle = JUDGEMENTS[j].color; ctx.globalAlpha = 0.45;
      ctx.fillRect(cx - W[j] * scale, y - hh / 2, W[j] * 2 * scale, hh);
    }
    ctx.globalAlpha = 1;
    const errs = eng.hitErrors;
    const nowT = g.now;
    for (let i = errs.length - 1, k = 0; i >= 0 && k < 40; i--, k++) {
      const e = errs[i];
      const age = (nowT - e.t) / eng.rate;
      if (age > 3000) break;
      ctx.globalAlpha = clamp(1 - age / 3000, 0, 1);
      ctx.fillStyle = JUDGEMENTS[e.j].color;
      ctx.fillRect(cx + clamp(e.err, -W[J.BAD], W[J.BAD]) * scale - 1, y - hh * 2.5, Math.max(2, s * 0.6), hh * 5);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 1, y - hh * 3, 2, hh * 6);
  }
  _drawHealth(v) {
    const ctx = this.ctx, s = this.s;
    const x = this.stageX + this.stageW + 6 * s, top = this.H * 0.18, bottom = this.hitY, w = 3.2 * s;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, top, w, bottom - top);
    const hh = (bottom - top) * v;
    const grd = ctx.createLinearGradient(0, bottom - hh, 0, bottom);
    grd.addColorStop(0, v < 0.25 ? '#ff4a5c' : '#c79bff'); grd.addColorStop(1, v < 0.25 ? '#ff8a5c' : '#8a4dff');
    ctx.fillStyle = grd;
    ctx.fillRect(x, bottom - hh, w, hh);
  }
  _drawKeyOverlay(g) {
    const ctx = this.ctx, s = this.s, K = this.layout.keys;
    const size = 14 * s, gap = 2 * s;
    const x0 = this.stageX + this.stageW + 14 * s, y0 = this.H * 0.5;
    ctx.font = `700 ${Math.round(size * 0.36)}px Nunito, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < K; i++) {
      const y = y0 + i * (size + gap);
      ctx.fillStyle = g.held[i] ? rgba(this.layout.colours.light[i], 0.85) : 'rgba(20,12,34,.75)';
      ctx.fillRect(x0, y, size * 2.2, size);
      ctx.fillStyle = g.held[i] ? '#000' : '#ddd';
      ctx.fillText(`${g.keyLabels?.[i] || i + 1}  ${g.engine.pressCounts[i]}`, x0 + size * 1.1, y + size / 2);
    }
  }
  _drawCounter(counts) {
    const ctx = this.ctx, s = this.s;
    const x = this.stageX - 12 * s, y0 = this.H * 0.45, lh = 9 * s;
    ctx.font = `800 ${Math.round(lh * 0.8)}px Nunito, system-ui, sans-serif`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    JUDGEMENTS.forEach((jj, i) => {
      ctx.fillStyle = jj.color; ctx.fillText(`${jj.short}  ${counts[i]}`, x, y0 + i * lh);
    });
  }
}

/* ===== 11-managers.js ===== */
/* ScoreManager, ReplayManager, StatisticsManager, ProfileManager, CollectionManager, Favorites, DataManager. */

const ScoreManager = {
  scores: [],                // all, newest last
  byHash: new Map(),         // mapHash -> scores[]
  async init() {
    this.scores = (await DB.getAll('scores')).sort((a, b) => a.date - b.date);
    this._reindex();
  },
  _reindex() {
    this.byHash.clear();
    for (const s of this.scores) {
      if (!this.byHash.has(s.mapHash)) this.byHash.set(s.mapHash, []);
      this.byHash.get(s.mapHash).push(s);
    }
  },
  forMap(hash) { return (this.byHash.get(hash) || []).slice().sort((a, b) => b.score - a.score || b.accuracy - a.accuracy); },
  best(hash) { const l = this.forMap(hash).filter(s => s.passed); return l[0] || null; },
  playCount(hash) { return (this.byHash.get(hash) || []).length; },
  lastPlayed(hash) { const l = this.byHash.get(hash); return l && l.length ? l[l.length - 1].date : 0; },
  recent(n = 20) { return this.scores.slice(-n).reverse(); },
  async add(score) {
    const prev = this.best(score.mapHash);
    score.isPB = score.passed && (!prev || score.score > prev.score);
    score.prevBest = prev ? { score: prev.score, accuracy: prev.accuracy, grade: prev.grade } : null;
    await DB.put('scores', score);
    this.scores.push(score);
    this._reindex();
    Bus.emit('scores:changed');
    return score;
  },
  async remove(id) {
    await DB.del('scores', id);
    this.scores = this.scores.filter(s => s.id !== id); this._reindex(); Bus.emit('scores:changed');
  },
  async clear() { await DB.clear('scores'); this.scores = []; this._reindex(); Bus.emit('scores:changed'); },
};

const ReplayManager = {
  list: [],
  async init() { this.list = (await DB.getAll('replays')).sort((a, b) => b.date - a.date); },
  build({ map, mods, rate, seed, windows, accuracyMode, hp, keys, events, summary, scoreId, player, duration }) {
    return {
      app: APP_NAME, kind: 'replay', format: 1, id: 'rp-' + uid(), date: Date.now(),
      mapHash: map.hash, mapId: map.id, title: map.title, artist: map.artist, version: map.version, creator: map.creator,
      keys, mods, rate, seed, windows, accuracyMode, hp, player, duration,
      events, // flat [t, col, down, t, col, down, ...] in song ms
      summary: { score: summary.score, accuracy: summary.accuracy, maxCombo: summary.maxCombo, counts: summary.counts, grade: summary.grade },
      scoreId: scoreId || null,
    };
  },
  async save(rep) {
    await DB.put('replays', rep);
    this.list = [rep, ...this.list.filter(r => r.id !== rep.id)];
    if (rep.scoreId) {
      const s = ScoreManager.scores.find(x => x.id === rep.scoreId);
      if (s && s.replayId !== rep.id) { s.replayId = rep.id; await DB.put('scores', s); }
    }
    Bus.emit('replays:changed');
    return rep;
  },
  async get(id) { return DB.get('replays', id); },
  async remove(id) { await DB.del('replays', id); this.list = this.list.filter(r => r.id !== id); Bus.emit('replays:changed'); },
  async clear() { await DB.clear('replays'); this.list = []; Bus.emit('replays:changed'); },
  export(rep) { downloadJSON(rep, `${rep.artist} - ${rep.title} [${rep.version}] (${new Date(rep.date).toISOString().slice(0, 10)}).amr`.replace(/[\\/:*?"<>|]/g, '_')); },
  validate(obj) {
    if (!obj || obj.app !== APP_NAME || obj.kind !== 'replay' || !Array.isArray(obj.events) || obj.events.length % 3 !== 0) throw new Error('Not a valid Ashtonk!mania replay');
    if (!Array.isArray(obj.windows) || obj.windows.length !== 6) throw new Error('Replay is missing timing windows');
    return obj;
  },
  async importFile(f) { return this.importObject(JSON.parse(await f.text())); },
  async importObject(obj) { this.validate(obj); return this.save({ ...obj, imported: true }); },
};

  /** XP & level derived from local scores. */
  xpInfo() {
    let xp = 0;
    for (const s of ScoreManager.scores) {
      const hits = s.counts ? s.counts.slice(0, 5).reduce((a, b) => a + b, 0) : 0;
      xp += Math.round(hits * 0.5 + (s.passed ? 50 + s.accuracy * 100 * Math.max(1, s.stars || 1) : 10));

    let level = 1, need = 500, acc = 0;
    while (xp >= acc + need) { acc += need; level++; need = Math.round(500 * Math.pow(level, 1.35)); }

const StatisticsManager = {
  compute() {
    const sc = ScoreManager.scores;
    const passed = sc.filter(s => s.passed);
    const st = {
      plays: sc.length, passed: passed.length, failed: sc.filter(s => !s.passed).length,
      playtime: sc.reduce((a, s) => a + (s.duration || 0), 0),
      notes: sc.reduce((a, s) => a + (s.counts ? s.counts.slice(0, 5).reduce((x, y) => x + y, 0) : 0), 0),
      misses: sc.reduce((a, s) => a + (s.counts ? s.counts[5] : 0), 0),
      avgAcc: passed.length ? passed.reduce((a, s) => a + s.accuracy, 0) / passed.length : 0,
      highestScore: sc.reduce((a, s) => Math.max(a, s.score), 0),
      highestCombo: sc.reduce((a, s) => Math.max(a, s.maxCombo), 0),
      bestGrade: null, grades: {}, keyModes: {}, perDay: [], accTrend: [], judgements: [0, 0, 0, 0, 0, 0],
    };
    const order = ['XH', 'SS', 'SH', 'S', 'A', 'B', 'C', 'D', 'F'];
    for (const s of sc) {
      st.grades[s.grade] = (st.grades[s.grade] || 0) + 1;
      const k = st.keyModes[s.keys] || (st.keyModes[s.keys] = { plays: 0, passed: 0, accSum: 0, best: 0, playtime: 0 });
      k.plays++; k.playtime += s.duration || 0;
      if (s.passed) { k.passed++; k.accSum += s.accuracy; k.best = Math.max(k.best, s.score); }
      if (s.counts) s.counts.forEach((c, i) => st.judgements[i] += c);
    }
    for (const g of order) if (st.grades[g] && g !== 'F') { st.bestGrade = g; break; }
    const day = 86400000, today = Math.floor(Date.now() / day);
    for (let d = 29; d >= 0; d--) st.perDay.push({ day: today - d, plays: 0 });
    for (const s of sc) { const idx = Math.floor(s.date / day) - (today - 29); if (idx >= 0 && idx < 30) st.perDay[idx].plays++; }
    st.accTrend = passed.slice(-60).map(s => ({ date: s.date, acc: s.accuracy, title: s.title, version: s.version }));
    return st;
  },
};

    };

    downloadJSON({ app: APP_NAME, kind: 'settings', version: APP_VERSION, date: Date.now(), settings: Settings.export() }, 'ashtonk-mania-settings.json');
  },

    if (!obj || obj.app !== APP_NAME) throw new Error('Not an Ashtonk!mania data file');
    if (obj.settings) await Settings.import(obj.settings);
    if (obj.kind === 'settings') return;
    if (obj.profile) { ProfileManager.profile = { ...ProfileManager.profile, ...obj.profile }; await ProfileManager.save(); }

    if (Array.isArray(obj.collections)) {
      for (const c of obj.collections) {

        if (ex) ex.hashes = [...new Set([...ex.hashes, ...(c.hashes || [])])]; else Collections.list.push(c);

    if (Array.isArray(obj.scores)) await DB.putMany(obj.scores.filter(s => s && s.id).map(s => ({ store: 'scores', value: s })));

    await new Promise(r => { const q = indexedDB.deleteDatabase(DB.name); q.onsuccess = q.onerror = q.onblocked = () => r(); });
    location.reload();
  },
};

/** Star rating colour ramp. */
function starColour(sr) {
  const stops = [[0, '#4290fb'], [1.25, '#4fc0ff'], [2, '#4fffd5'], [2.5, '#7cff4f'], [3.3, '#f6f05c'], [4.2, '#ff8068'], [4.9, '#ff4e6f'], [5.8, '#c645b8'], [6.7, '#6563de'], [7.7, '#18158e'], [9, '#000000']];
  if (sr >= 9) return '#000000';
  let i = 0; while (i < stops.length - 2 && sr > stops[i + 1][0]) i++;
  const [a, ca] = stops[i], [b, cb] = stops[i + 1];
  const t = clamp((sr - a) / (b - a), 0, 1);
  const p = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16));
  const x = p(ca), y = p(cb);
  return '#' + x.map((v, k) => Math.round(lerp(v, y[k], t)).toString(16).padStart(2, '0')).join('');
}
function starBadge(sr) {
  const c = starColour(sr);
  const el = h('span.stars', { style: { '--sc': c, color: sr >= 6.5 ? '#ffd966' : '#16101f' } }, icon('star', 'fill'), sr.toFixed(2));
  return el;
}
