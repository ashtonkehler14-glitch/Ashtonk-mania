<!doctype html>
<html lang="en" data-theme="lazer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#18171c">
<title>Ashtonk!mania</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff66ab' stroke='%23fff' stroke-width='6'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ashtonk!mania">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ───────────────────────── Ashtonk!mania — client styles ───────────────────────── */
:root {
  --vw: 1vw; --vh: 1vh; /* one percent of the app's layout size (set by Zoom.update: it differs from the window when the app is scaled) */
  --ui-scale: 1;
  --anim: 1;
  /* osu!lazer colour scheme (OverlayColourProvider "purple" + OsuColour pink) */
  --bg: #18171c;
  --bg-2: #24222a;
  --panel: rgba(36, 34, 42, 0.94);
  --panel-solid: #24222a;
  --panel-2: #302e38;
  --panel-3: #3d3946;
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.13);
  --text: #ffffff;
  --text-2: #e0dbf0;
  --muted: #948fa3;
  --accent: #aa88ff;
  --accent-2: #7d3cff;
  --accent-3: #d9c2ff;
  --accent-rgb: 170, 136, 255;
  --gold: #ffcc22;
  --gold-2: #ee9900;
  --good: #88b300;
  --bad: #ed1121;
  --blue: #66ccff;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  --t-fast: calc(120ms * var(--anim));
  --t-med: calc(260ms * var(--anim));
  --t-slow: calc(480ms * var(--anim));
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --toolbar-h: 40px;
  font-size: calc(16px * var(--ui-scale));
}
/* Accent themes only change the highlight colour; the osu!lazer layout and greys stay the same. */
:root[data-theme="neru"] { --accent: #ffcf3a; --accent-2: #e6a800; --accent-3: #fff1b8; --accent-rgb: 255, 207, 58; }
:root[data-theme="teto"] { --accent: #ff4d6a; --accent-2: #d0213d; --accent-3: #ffc7d0; --accent-rgb: 255, 77, 106; }
:root[data-theme="miku"] { --accent: #39c5bb; --accent-2: #139a90; --accent-3: #bff4ef; --accent-rgb: 57, 197, 187; }
:root[data-theme="midnight"] { --accent: #66ccff; --accent-2: #2f7fff; --accent-3: #c6e2ff; --accent-rgb: 102, 204, 255; }
:root[data-theme="kori"] { --accent: #aa88ff; --accent-2: #7d3cff; --accent-3: #d9c2ff; --accent-rgb: 170, 136, 255; }
:root[data-theme="neru"] .btn.primary { color: #2a1d00; }
:root.no-anim *, :root.no-anim *::before, :root.no-anim *::after { transition: none !important; animation-duration: 1ms !important; animation-iteration-count: 1 !important; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body {
  font-family: "Torus", "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-weight: 400; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
input, textarea, select { user-select: text; -webkit-user-select: text; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
::selection { background: rgba(var(--accent-rgb), .4); }
/* Scrollbars: vertical ones are hidden everywhere (wheel / drag / keyboard still scroll); only sideways
   scrolling areas (e.g. the mod select columns) show a thin bar. */
* { scrollbar-width: none; }
.modsel-cols, .hscroll { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .28) transparent; }
::-webkit-scrollbar { width: 0; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .28); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
svg.i.fill { fill: currentColor; stroke: none; }

#app { position: fixed; inset: 0; overflow: hidden; }

/* ── background layer */
#bg-layer { position: absolute; inset: -40px; z-index: 0; transition: transform var(--t-slow) var(--ease-out); }
.bg-img { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity calc(700ms * var(--anim)) ease, filter var(--t-slow) ease; will-change: opacity; }
.bg-img.show { opacity: 1; }
.bg-vignette { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); transition: background var(--t-slow); }
#app.bg-empty .bg-vignette { background: radial-gradient(ellipse at 50% 40%, #2a2733, #141318 75%); }
#app.in-game #bg-layer { inset: 0; transform: none !important; }

/* ── toolbar (osu!lazer: thin black bar, icon buttons with tooltips) */
#toolbar {
  position: absolute; top: 0; left: 0; right: 0; height: var(--toolbar-h); z-index: 30;
  display: flex; align-items: stretch; background: rgba(0, 0, 0, .78);
  transition: transform var(--t-med) var(--ease), opacity var(--t-med);
}
#app.in-game #toolbar, #app.hide-toolbar #toolbar { transform: translateY(-110%); opacity: 0; pointer-events: none; }
.tb-group { display: flex; align-items: stretch; }
.tb-spacer { flex: 1; }
.tb-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 40px; height: 100%; padding: 0 12px; border: 0; background: transparent; color: #fff; font-size: .8rem; font-weight: 600; transition: background var(--t-fast); }
.tb-btn > .i { width: 18px; height: 18px; }
.tb-btn:hover { background: rgba(255, 255, 255, .1); }
.tb-btn.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent); }
.tb-tip { position: absolute; top: calc(100% + 6px); left: 50%; transform: translate(-50%, -4px); min-width: 140px; padding: 7px 10px; border-radius: 6px; background: rgba(0, 0, 0, .85); text-align: left; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--t-fast), transform var(--t-fast); }
.tb-group:first-child .tb-tip { left: 0; transform: translate(0, -4px); }
.tb-tip b { font-size: .85rem; font-weight: 700; }
.tb-tip span { font-size: .72rem; color: #bbb; font-weight: 400; }
.tb-btn:hover .tb-tip { opacity: 1; transform: translate(-50%, 0); transition-delay: .35s; }
.tb-group:first-child .tb-btn:hover .tb-tip { transform: none; }
.tb-btn.tip-off .tb-tip { opacity: 0 !important; transition-delay: 0s !important; }
.tb-music { max-width: 320px; }
.tb-np-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #ddd; }
.tb-music.paused .tb-np-text { color: #888; }
.tb-clock { display: flex; align-items: center; padding: 0 12px; font-variant-numeric: tabular-nums; font-size: .8rem; color: #ddd; white-space: nowrap; }
.tb-profile { padding: 0 14px 0 6px; }
.tb-profile .avatar { border-radius: 50%; box-shadow: none; }
@media (max-width: 900px) { .tb-np-text, .tb-profile .lbl { display: none; } }

/* now playing panel */
.np-panel { position: absolute; top: calc(var(--toolbar-h) + 6px); right: 8px; z-index: 55; width: 400px; max-width: calc(calc(100 * var(--vw)) - 16px); height: 130px; border-radius: 10px; overflow: hidden; background: #111; box-shadow: 0 8px 30px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity var(--t-fast), transform var(--t-med) var(--ease-out); }
.np-panel.show { opacity: 1; transform: none; pointer-events: auto; }
.np-cover { position: absolute; inset: 0; background: center / cover no-repeat #222; opacity: .45; }
.np-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .2), rgba(0, 0, 0, .6)); }
.np-body { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 14px 16px 16px; text-align: center; }
.np-title { font-size: 1.05rem; font-weight: 700; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.np-artist { font-size: .82rem; color: #ccc; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.np-ctls { display: flex; gap: 6px; margin-top: 8px; }
.np-ctl { width: 36px; height: 36px; border: 0; border-radius: 50%; display: grid; place-items: center; background: transparent; color: #fff; transition: background var(--t-fast), transform var(--t-fast); }
.np-ctl:hover { background: rgba(255, 255, 255, .15); }
.np-ctl:active { transform: scale(.9); }
.np-ctl .i { width: 20px; height: 20px; }
.np-times { position: absolute; left: 10px; right: 10px; bottom: 9px; display: flex; justify-content: space-between; font-size: .68rem; color: #bbb; font-variant-numeric: tabular-nums; pointer-events: none; }
.np-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; cursor: pointer; background: rgba(255, 255, 255, .15); transition: height var(--t-fast); }
.np-bar:hover { height: 10px; }
.np-bar i { display: block; height: 100%; background: var(--accent); }

/* ── screens */
#screens { position: absolute; inset: 0; z-index: 10; }
.screen { position: absolute; inset: 0; padding-top: var(--toolbar-h); display: flex; flex-direction: column; }
.screen.enter { animation: scrIn var(--t-med) var(--ease-out) both; }
.screen.leave { animation: scrOut calc(200ms * var(--anim)) ease both; pointer-events: none; }
.screen.enter.from-right { animation-name: scrInRight; }
.screen.enter.zoom { animation-name: scrInZoom; }
.screen.leave.zoom { animation-name: scrOutZoom; }
@keyframes scrIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes scrInRight { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
@keyframes scrInZoom { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
@keyframes scrOut { to { opacity: 0; transform: translateY(-10px); } }
@keyframes scrOutZoom { to { opacity: 0; transform: scale(.97); } }
.screen-body { flex: 1; min-height: 0; overflow: auto; padding: 24px clamp(16px, calc(3 * var(--vw)), 48px) 40px; }
.screen-title { display: flex; align-items: center; gap: 14px; margin: 4px 0 20px; }
.screen-title h1 { margin: 0; font-size: 1.9rem; font-weight: 700; letter-spacing: -.01em; }
.screen-title .sub { color: var(--muted); font-weight: 600; }
.screen-title .grow { flex: 1; }
.page { max-width: 1400px; margin: 0 auto; }

/* ── generic controls */
.btn {
  --c: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); color: var(--text);
  font-weight: 600; font-size: .92rem; letter-spacing: .01em; white-space: nowrap;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast), filter var(--t-fast);
}
.btn:hover { background: rgba(var(--accent-rgb), .14); border-color: rgba(var(--accent-rgb), .5); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 6px 20px rgba(var(--accent-rgb), .35); }
.btn.primary:hover { filter: brightness(1.1); box-shadow: 0 8px 26px rgba(var(--accent-rgb), .5); }
.btn.gold { background: linear-gradient(180deg, #ffe07a, #f2b705); color: #2a1d00; border-color: transparent; }
.btn.danger { border-color: rgba(255, 74, 92, .45); color: #ffb1b9; }
.btn.danger:hover { background: rgba(255, 74, 92, .16); border-color: #ff4a5c; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: rgba(var(--accent-rgb), .12); }
.btn.sm { height: 32px; padding: 0 11px; font-size: .82rem; border-radius: 8px; }
.btn.lg { height: 50px; padding: 0 24px; font-size: 1.05rem; border-radius: 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 10px; border: 0; background: transparent; color: var(--text-2); display: inline-grid; place-items: center; transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast); }
.icon-btn:hover { background: rgba(var(--accent-rgb), .14); color: var(--text); }
.icon-btn:active { transform: scale(.9); }
.icon-btn.on { color: var(--gold); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, .03); color: var(--text-2); font-weight: 600; font-size: .8rem;
  transition: all var(--t-fast);
}
.chip:hover { border-color: rgba(var(--accent-rgb), .6); color: var(--text); }
.chip:active { transform: scale(.95); }
.chip.on { background: rgba(var(--accent-rgb), .22); border-color: var(--accent); color: var(--text); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .3); }
.input, .select {
  height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(8, 5, 14, .6);
  color: var(--text); font-weight: 700; transition: border-color var(--t-fast), box-shadow var(--t-fast); min-width: 0;
}
.input:hover, .select:hover { border-color: rgba(var(--accent-rgb), .45); }
.input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .2); }
.select { appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.select option { background: var(--panel-solid); }
.toggle { position: relative; width: 44px; height: 24px; flex: none; border-radius: 99px; border: 0; background: rgba(255, 255, 255, .12); transition: background var(--t-fast); padding: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #d8cfee; transition: transform var(--t-fast) var(--ease), background var(--t-fast); }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(20px); background: #fff; }
.toggle:active::after { width: 22px; }
input[type=range].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; margin: 0; cursor: pointer; --p: 50%; }
input[type=range].slider::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(90deg, var(--accent) var(--p), rgba(255, 255, 255, .12) var(--p)); }
input[type=range].slider::-moz-range-track { height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .12); }
input[type=range].slider::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--accent); }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5.5px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); transition: transform var(--t-fast); }
input[type=range].slider::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
input[type=range].slider:hover::-webkit-slider-thumb { transform: scale(1.2); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
:root:not(.no-effects) .panel.glass { backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); }
.muted { color: var(--muted); }
.gold { color: var(--gold); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .03em; background: rgba(255, 255, 255, .08); color: var(--text-2); }
.tag.accent { background: rgba(var(--accent-rgb), .22); color: var(--accent-3); }
.tag.warn { background: rgba(255, 74, 92, .18); color: #ffb3bb; }
.tag.goldtag { background: rgba(255, 213, 74, .16); color: #ffe38a; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
.empty .big { font-size: 1.3rem; color: var(--text-2); font-weight: 600; margin-bottom: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .12); border-bottom-width: 2px; font-size: .72rem; font-weight: 700; color: var(--text-2); }

/* stars / difficulty colours */
.stars { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 99px; font-weight: 700; font-size: .75rem; color: #16101f; background: var(--sc, #6cf); white-space: nowrap; }
.stars svg { width: 11px; height: 11px; }

/* grades */
.grade { font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.grade-XH, .grade-SH { background: linear-gradient(180deg, #ffffff, #b8c4d8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.grade-SS, .grade-S { background: linear-gradient(180deg, #fff3a6, #ffc31f); -webkit-background-clip: text; background-clip: text; color: transparent; }
.grade-A { color: #6ef08e; } .grade-B { color: #5cb3ff; } .grade-C { color: #c68bff; } .grade-D { color: #ff6b7a; } .grade-F { color: #ff3b4f; }

/* mods */
.mod-badge { display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 6px; border-radius: 7px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; background: color-mix(in srgb, var(--mod) 24%, transparent); color: color-mix(in srgb, var(--mod) 70%, white); border: 1px solid color-mix(in srgb, var(--mod) 55%, transparent); }
.mod-badge.small { min-width: 28px; height: 18px; font-size: .64rem; border-radius: 5px; }

/* avatar */
.avatar { border-radius: 30%; background: center / cover no-repeat var(--panel-3); flex: none; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .35); }
.avatar-mono { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 700; }

/* ── toasts */
#toasts { position: absolute; right: 18px; bottom: 18px; z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; min-width: 260px; max-width: 420px; padding: 12px 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: var(--shadow); animation: toastIn var(--t-med) var(--ease-out) both; display: flex; gap: 12px; align-items: flex-start; }
.toast .t-ico { color: var(--accent); margin-top: 1px; }
.toast.err .t-ico { color: var(--bad); }
.toast.ok .t-ico { color: var(--good); }
.toast .t-title { font-weight: 600; }
.toast .t-body { color: var(--text-2); font-size: .85rem; margin-top: 2px; white-space: pre-line; max-height: 180px; overflow: auto; }
.toast.out { animation: toastOut var(--t-med) ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

/* ── drop overlay */
#drop-overlay { position: absolute; inset: 0; z-index: 95; display: grid; place-items: center; background: rgba(8, 4, 16, .78); opacity: 0; pointer-events: none; transition: opacity var(--t-fast); }
#drop-overlay.show { opacity: 1; }
.drop-inner { border: 3px dashed rgba(var(--accent-rgb), .7); border-radius: 28px; padding: 48px 70px; text-align: center; background: rgba(var(--accent-rgb), .07); transform: scale(.96); transition: transform var(--t-med) var(--ease); }
#drop-overlay.show .drop-inner { transform: none; }
.drop-title { font-size: 2rem; font-weight: 700; }
.drop-sub { color: var(--muted); margin-top: 6px; }
.drop-icon { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 40px rgba(var(--accent-rgb), .6); }

/* ── loading screen */
#loading-screen { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #18171c; transition: opacity calc(500ms * var(--anim)) ease, visibility 0s linear calc(500ms * var(--anim)); }
#loading-screen.done { opacity: 0; visibility: hidden; pointer-events: none; }
/* (a hidden element's infinite animation still restyles the page every frame, on every screen) */
#loading-screen.gone { display: none; }
.load-logo { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #ff85bd, #e6428e 80%); border: 7px solid #fff; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.6rem; line-height: .9; text-align: center; animation: logoBreath 1.6s ease-in-out infinite; box-shadow: 0 6px 30px rgba(0, 0, 0, .45); }
.load-logo small { display: block; font-size: .5em; letter-spacing: .12em; font-weight: 600; margin-top: .25em; }

/* ── FPS counter */

/* ── overlays / dialogs */
#overlay-root { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
#overlay-root > * { pointer-events: auto; }
.backdrop { position: absolute; inset: 0; background: rgba(5, 2, 10, .55); animation: fadeIn var(--t-med) ease both; }
.backdrop.out { animation: fadeOut var(--t-fast) ease both; }
@keyframes fadeIn { from { opacity: 0; } } @keyframes fadeOut { to { opacity: 0; } }
.dialog { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(calc(100 * var(--vw)) - 32px)); max-height: calc(calc(100 * var(--vh)) - 60px); overflow: auto; padding: 24px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 20px; box-shadow: var(--shadow); animation: dlgIn var(--t-med) var(--ease-out) both; }
.dialog.out { animation: dlgOut var(--t-fast) ease both; }
@keyframes dlgIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.97); } }
@keyframes dlgOut { to { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
.dialog h2 { margin: 0 0 8px; font-weight: 700; }
.dialog .body { color: var(--text-2); margin-bottom: 18px; line-height: 1.5; }
.dialog .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.menu { position: fixed; min-width: 220px; padding: 6px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: var(--shadow); z-index: 70; animation: menuIn var(--t-fast) var(--ease-out) both; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-weight: 700; font-size: .88rem; color: var(--text-2); }
.menu button:hover, .menu button:focus-visible { background: rgba(var(--accent-rgb), .16); color: var(--text); outline: none; }
.menu .sep { height: 1px; margin: 5px 6px; background: var(--line); }
.menu .hdr { padding: 6px 12px 4px; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.menu .check { margin-left: auto; color: var(--accent); }

/* ── settings panel — osu!lazer's SettingsOverlay: a 60px icon sidebar and a 400px panel, lowercase "settings" header,
   sections under a 2px separator with 30px titles, and every setting a form control (a rounded box with its caption
   inside, 4px apart). Colours are lazer's OverlayColourProvider, Purple scheme (hue 255). */
.settings-panel { --o-h: 255; --ob6: hsl(var(--o-h) 10% 10%); --ob5: hsl(var(--o-h) 10% 15%); --ob4: hsl(var(--o-h) 10% 20%); --ob3: hsl(var(--o-h) 10% 25%); --ob1: hsl(var(--o-h) 10% 40%); --od4: hsl(var(--o-h) 20% 20%); --od3: hsl(var(--o-h) 20% 25%); --ol4: hsl(var(--o-h) 40% 50%); --ohl: hsl(var(--o-h) 100% 70%); --oc2: hsl(var(--o-h) 40% 90%);
  position: absolute; top: 0; bottom: 0; left: 0; width: min(460px, calc(100 * var(--vw))); display: flex; background: var(--ob4); box-shadow: 20px 0 60px rgba(0, 0, 0, .5); animation: slideInL calc(600ms * var(--anim)) var(--ease-out); }
.settings-panel.out { animation: slideOutL calc(200ms * var(--anim)) ease both; }
@keyframes slideInL { from { transform: translateX(-100%); } }
@keyframes slideOutL { to { transform: translateX(-100%); } }
.sp-nav { width: 60px; flex: none; display: flex; flex-direction: column; align-items: stretch; padding: 10px 0; gap: 2px; background: var(--ob5); }
.sp-nav .icon-btn { width: 100%; height: 48px; border-radius: 0; color: var(--oc2); opacity: .6; transition: opacity var(--t-fast), color var(--t-fast); }
.sp-nav .icon-btn:hover { opacity: 1; background: transparent; }
.sp-nav .icon-btn.active { opacity: 1; color: #fff; box-shadow: inset 4px 0 0 var(--ohl); background: linear-gradient(90deg, hsl(var(--o-h) 100% 70% / .12), transparent); }
.sp-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sp-head { position: relative; padding: 22px 22px 14px 12px; }
.sp-head > .row > .icon-btn { position: absolute; top: 12px; right: 10px; }
.sp-head h2 { margin: 0; font-size: 2.5rem; font-weight: 400; line-height: 1; letter-spacing: -.01em; }
.sp-head .sub { color: var(--oc2); font-size: 1rem; margin-top: 4px; }
.sp-searchbox { position: relative; margin-top: 16px; }
.sp-searchbox .i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--oc2); pointer-events: none; }
.sp-search { width: 100%; height: 40px; padding-left: 38px; border-radius: 5px; border: 2.5px solid transparent; background: var(--ob5); font-size: .95rem; }
.sp-search:hover { border-color: transparent; background: var(--ob6); }
.sp-search:focus { border-color: var(--ohl); background: linear-gradient(var(--ob5), var(--od3)); }
.sp-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 0 60px; scroll-behavior: smooth; }
.sp-section { padding: 24px 22px 32px 12px; border-top: 2px solid var(--ob6); min-width: 0; }
.sp-section > h3 { margin: 0 0 6px; font-size: 1.875rem; font-weight: 400; line-height: 1.1; }
.sp-group { margin: 18px 0 4px 5px; font-size: 1.25rem; font-weight: 500; color: #fff; min-width: 0; }
.settings-panel .set-row.form { position: relative; display: flex; align-items: center; gap: 10px; text-align: left; margin: 0 0 4px; padding: 9px; border-radius: 5px; background: hsl(var(--o-h) 10% 18%); box-shadow: inset 0 0 0 2.5px transparent; transition: box-shadow 250ms var(--ease-out), background 250ms var(--ease-out); cursor: default; }
.settings-panel .set-row.form:hover { background: linear-gradient(var(--ob5), var(--od4)); box-shadow: inset 0 0 0 2.5px var(--ol4); }
.settings-panel .set-row.form:focus-within { background: linear-gradient(var(--ob5), var(--od3)); box-shadow: inset 0 0 0 2.5px var(--ohl); }
.settings-panel .set-row.form .lbl { flex: 1; min-width: 0; font-size: .8125rem; font-weight: 600; color: var(--oc2); }
.settings-panel .set-row.form .lbl .hint { margin-top: 2px; font-size: .75rem; font-weight: 400; color: hsl(var(--o-h) 20% 70%); }
.settings-panel .fbool { cursor: pointer; min-height: 52px; }
.settings-panel .fbool .toggle, .settings-panel .fbool > .btn { flex: none; }
/* SwitchButton: an outlined pill that fills in Highlight1 when on */
.settings-panel .toggle { width: 44px; height: 22px; background: transparent; box-shadow: inset 0 0 0 2.5px var(--ol4); transition: background 200ms, box-shadow 200ms; }
.settings-panel .toggle::after { top: 5px; left: 5px; width: 12px; height: 12px; background: var(--ol4); transition: transform 200ms var(--ease-out), background 200ms; }
.settings-panel .toggle.on { background: var(--ohl); box-shadow: inset 0 0 0 2.5px var(--ohl); }
.settings-panel .toggle.on::after { transform: translateX(22px); background: var(--ob5); }
/* FormSliderBar: caption and value on the left half, a 40px rounded track with a 10px nub on the right half */
.settings-panel .frange { padding: 5px 5px 5px 9px; }
.settings-panel .frange .fleft { width: 50%; flex: none; min-width: 0; padding: 4px 10px 4px 0; display: flex; flex-direction: column; gap: 4px; }
.settings-panel .frange .val { min-width: 0; text-align: left; font-weight: 400; font-size: .875rem; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.settings-panel .frange .fcal { align-self: flex-start; }
.settings-panel .frange .fright { flex: 1; min-width: 0; }
.settings-panel input[type=range].slider { display: block; width: 100%; height: 40px; margin: 0; background: transparent; }
.settings-panel input[type=range].slider::-webkit-slider-runnable-track { height: 40px; border-radius: 5px; background: linear-gradient(90deg, var(--ol4) var(--p), var(--ob5) var(--p)); }
.settings-panel input[type=range].slider::-webkit-slider-thumb { width: 10px; height: 40px; margin-top: 0; border-radius: 5px; border: 0; background: var(--ohl); box-shadow: 0 0 0 1px rgba(0, 0, 0, .15); }
.settings-panel input[type=range].slider::-moz-range-track { height: 40px; border-radius: 5px; background: var(--ob5); }
.settings-panel input[type=range].slider::-moz-range-progress { height: 40px; border-radius: 5px 0 0 5px; background: var(--ol4); }
.settings-panel input[type=range].slider::-moz-range-thumb { width: 10px; height: 40px; border-radius: 5px; border: 0; background: var(--ohl); }
/* FormDropdown / FormTextBox: caption on top, the value underneath */
.settings-panel .set-row.fsel, .settings-panel .set-row.fwide { flex-direction: column; align-items: stretch; gap: 4px; }
.settings-panel .fsel .lbl, .settings-panel .fwide .lbl { flex: none; }
.settings-panel .fsel .select, .settings-panel .fsel .input { width: 100%; max-width: none; height: 28px; padding: 0 28px 0 0; border: 0; background-color: transparent; box-shadow: none; font-size: .875rem; color: #fff; background-position: calc(100% - 13px) 12px, calc(100% - 8px) 12px; }
.settings-panel .fsel .input { padding-right: 0; }
.settings-panel .fline { display: flex; align-items: center; gap: 8px; min-width: 0; }
.settings-panel .fline .select { flex: 1; min-width: 0; }
.settings-panel .fwide .keycfg { min-width: 0; max-width: 100%; }
/* SettingsRevertToDefaultButton: a slim pill just right of the box */
.settings-panel .set-row .reset { position: absolute; top: 0; bottom: 0; right: -16px; width: 8px; padding: 0; border: 0; border-radius: 4px; background: var(--ohl); opacity: 0; pointer-events: none; transform: scaleY(.6); transition: opacity 200ms, transform 200ms var(--ease-out); cursor: pointer; }
.settings-panel .set-row .reset.show { opacity: .75; pointer-events: auto; transform: none; }
.settings-panel .set-row .reset.show:hover { opacity: 1; }
.settings-panel .sp-section { padding-right: 34px; }
.sp-more { width: calc(100% - 46px); margin: 22px 34px 0 12px; }
.sp-footer { padding: 16px 0 0; color: var(--oc2); opacity: .6; font-size: .78rem; text-align: center; }
.set-row { display: flex; align-items: center; gap: 14px; padding: 9px 10px; margin: 0 -10px; border-radius: 10px; transition: background var(--t-fast); }
.set-row:hover { background: rgba(255, 255, 255, .035); }
.set-row .lbl { flex: 1; min-width: 0; }
.set-row .lbl .hint { color: var(--muted); font-size: .76rem; font-weight: 600; margin-top: 1px; }
.set-row .ctl { flex: none; display: flex; align-items: center; gap: 10px; }
.set-row.col { flex-direction: column; align-items: stretch; gap: 8px; }
.set-row.col .ctl { width: 100%; }
.set-row .val { min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent-3); font-weight: 600; font-size: .85rem; }
.set-row .reset { opacity: 0; transition: opacity var(--t-fast); }
.set-row:hover .reset.show { opacity: 1; }

/* key config */
.keycfg { display: flex; flex-direction: column; gap: 12px; }
.keycfg-modes { display: flex; flex-wrap: wrap; gap: 6px; }
.keycfg-lanes { display: flex; gap: 6px; justify-content: center; padding: 14px; border-radius: 14px; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); flex-wrap: wrap; }
.lane-key { min-width: 48px; min-height: 64px; padding: 6px; border-radius: 10px; border: 2px solid var(--line-2); background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .01)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 700; font-size: .85rem; color: var(--text); transition: all var(--t-fast); position: relative; }
.lane-key .ln { position: absolute; top: 3px; left: 6px; font-size: .6rem; color: var(--muted); }
.lane-key .alt { font-size: .66rem; color: var(--muted); }
.lane-key:hover { border-color: var(--accent); }
.lane-key.listening { border-color: var(--gold); background: rgba(255, 213, 74, .12); animation: pulseBorder 1s ease-in-out infinite; }
.lane-key.conflict { border-color: var(--bad); background: rgba(255, 74, 92, .12); }
.lane-key.pressed { background: rgba(var(--accent-rgb), .35); border-color: var(--accent); transform: translateY(2px); }
.lane-key.special { border-color: rgba(255, 213, 74, .4); }
@keyframes pulseBorder { 50% { box-shadow: 0 0 0 4px rgba(255, 213, 74, .2); } }
.keycfg-help { font-size: .8rem; color: var(--muted); text-align: center; }
.keycfg-help.warn { color: #ffb3bb; }

/* ── mod select (bottom sheet) */

/* ── SONG SELECT — osu!lazer's new song select: sheared title wedge, difficulty display and ranking on the left; the
   filter and a carousel of right-anchored panels on the right. Colours are lazer's OverlayColourProvider (Blue scheme,
   hue 200), sizes and offsets are lazer's (panels 80/50px, 3px spacing, collapsed panels slid right). */
.ss { --ss-h: 200; --b2: hsl(var(--ss-h) 10% 30%); --b3: hsl(var(--ss-h) 10% 25%); --b4: hsl(var(--ss-h) 10% 20%); --b5: hsl(var(--ss-h) 10% 15%); --c2: hsl(var(--ss-h) 40% 90%); --l2: hsl(var(--ss-h) 40% 75%); --shear: -11.31deg; --unshear: 11.31deg; --k: 1; padding-top: var(--toolbar-h); }
.ss-main { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, min(50%, 700px)) minmax(0, min(50%, 720px)); justify-content: space-between; }
.ss-main::before { content: ""; position: absolute; inset: 0 40% 0 0; background: linear-gradient(90deg, rgba(0, 0, 0, .3), transparent); pointer-events: none; }
.ss-info { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 0 0 10px; min-height: 0; }
.ss-right { position: relative; display: flex; flex-direction: column; min-height: 0; background: linear-gradient(90deg, transparent, rgba(0, 0, 0, .5)); }
@media (max-width: 1000px) { .ss-main { grid-template-columns: 1fr; } .ss-info { display: none; } .ss { --k: .45; } }
/* sheared backgrounds: the box stays upright (so text isn't slanted) and a skewed ::before draws the shape */
.wedge, .wd, .ss-filter, .ss-search, .ss-sel, .lb-head .lb-tab, .lb-head .lb-scope, .lb-row, .w-plays, .w-fav { position: relative; isolation: isolate; }
.wedge::before, .wd::before, .wd-box::before, .ss-filter::before, .ss-search::before, .ss-sel::before, .lb-tab::before, .lb-scope::before, .lb-row::before, .w-plays::before, .w-fav::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(var(--shear)); }
/* WedgeBackground: Background5 at 90%, fading to 60% over the last 30% */
.wedge::before, .wd::before { transform-origin: top left; border-radius: 0 0 10px 0; background: linear-gradient(90deg, hsl(var(--ss-h) 10% 15% / .9) 70%, hsl(var(--ss-h) 10% 15% / .6)), linear-gradient(90deg, hsl(var(--ss-h) 10% 30% / .25), transparent 60%); }
.wedge { flex: none; margin-left: -40px; padding: 18px 64px 12px 72px; animation: wedgeSwap calc(200ms * var(--anim)) ease-out both; }
.ss.entering .wedge, .ss.entering .wd { animation: wedgeIn calc(600ms * var(--anim)) var(--ease-out) both; }
@keyframes wedgeSwap { from { opacity: .5; } }
.wedge.still, .wd.still { animation: none; }
@keyframes wedgeIn { from { opacity: 0; transform: translateX(-150px); } }
.wedge .w-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wedge .w-top { display: flex; gap: 6px; align-items: center; min-height: 18px; }
.wedge .w-title { font-size: 1.75rem; font-weight: 600; line-height: 1.12; margin-bottom: -2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
.wedge .w-artist { font-size: 1.15rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 6px rgba(0, 0, 0, .45); }
.wedge .w-stats { display: flex; align-items: center; gap: 2px; height: 30px; margin-top: 4px; font-size: .85rem; font-weight: 600; }
.w-plays, .w-fav { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; min-width: 50px; padding: 0 12px; border: 0; background: none; color: #fff; font: inherit; }
.w-plays { margin-left: -44px; padding-left: 44px; min-width: 94px; }
.w-plays::before, .w-fav::before { background: hsl(var(--ss-h) 10% 15% / .8); border-radius: 6px; }
.w-plays::before { border-radius: 0 6px 6px 0; }
.w-fav { cursor: pointer; transition: color var(--t-fast); }
.w-fav:hover::before { background: hsl(var(--ss-h) 10% 25% / .9); }
.w-fav.on { color: #ff66ab; }
.w-plays .i, .w-fav .i, .w-stat .i { width: 14px; height: 14px; }
.w-stat { display: inline-flex; align-items: center; gap: 6px; margin-left: 12px; }
/* DifficultyDisplay: the name line in the difficulty colour, then a darker box with the note counts and the stats */
.wd { flex: none; margin-left: -40px; padding: 0 2px 2px 72px; animation: wedgeSwap calc(200ms * var(--anim)) ease-out both; }
.ss.entering .wd { animation-delay: 60ms; }
.wd-name { display: flex; align-items: center; gap: 6px; height: 20px; margin: 5px 0; min-width: 0; font-size: .875rem; white-space: nowrap; color: var(--ink); }
.wd-name .wd-v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.wd-name .wd-by { flex: none; white-space: pre; }
.wd-name .wd-mapper { font-weight: 600; color: var(--l2); flex: none; }
.wd-box { position: relative; isolation: isolate; display: grid; grid-template-columns: 1fr auto; gap: 30px; margin-left: -72px; padding: 7.5px 26px 7.5px 72px; }
.wd-box::before { transform-origin: top left; border-radius: 0 0 8px 0; background: hsl(var(--ss-h) 10% 15% / .8); }
.wd-counts, .wd-diffs { display: flex; gap: 14px; min-width: 0; }
.wd-counts .wd-stat { flex: 1; max-width: 120px; }
.wd-diffs .wd-stat { width: 64px; }
.wd-bar { position: relative; height: 2px; border-radius: 1px; background: #000; overflow: hidden; }
.wd-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1px; background: var(--ink); transition: width 300ms var(--ease-out); }
.wd-k { margin-top: 2px; font-size: .75rem; font-weight: 600; color: var(--c2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wd-v { font-size: .875rem; }
.ss-problem { display: flex; gap: 10px; padding: 10px 14px; margin-right: 24px; border-radius: 10px; background: rgba(237, 17, 33, .15); font-size: .85rem; }
.ss-problem .i { color: #ff6b77; margin-top: 2px; }
/* ranking: sheared tab + scope, then sheared score rows */
.lb { flex: 1; min-height: 120px; overflow: hidden; display: flex; flex-direction: column; margin-top: 6px; }
.lb-head { display: flex; align-items: center; gap: 6px; padding: 2px 30px 8px 0; font-size: .8rem; }
.lb-tab, .lb-scope { height: 26px; display: inline-flex; align-items: center; padding: 0 14px; font-weight: 600; }
.lb-tab { margin-left: -40px; padding-left: 72px; color: var(--b5); }
.lb-tab::before { transform-origin: top left; border-radius: 0 6px 6px 0; background: var(--l2); }
.lb-scope::before { border-radius: 6px; background: hsl(var(--ss-h) 10% 15% / .85); }
.lb-list { overflow: auto; display: flex; flex-direction: column; gap: 3px; padding: 0 24px 4px 0; }
.lb-empty { padding: 30px 10px; text-align: center; color: var(--muted); font-size: .9rem; }
.lb-row { display: flex; align-items: center; gap: 12px; flex: none; height: 50px; margin-left: -40px; padding: 0 22px 0 70px; border: 0; background: none; text-align: left; color: #fff; cursor: pointer; animation: rowIn 300ms var(--ease-out) both; }
.lb-row::before { transform-origin: top left; border-radius: 0 10px 10px 0; background: hsl(var(--ss-h) 10% 15% / .8); transition: background var(--t-fast); }
.lb-row:hover::before { background: hsl(var(--ss-h) 10% 22% / .9); }
.lb-row .rank { width: 30px; color: var(--c2); font-size: .8rem; font-weight: 600; }
.lb-row .main { flex: 1; min-width: 0; }
.lb-row .who { font-weight: 600; font-size: .9rem; }
.lb-row .nums { text-align: right; }
.lb-row .sc { font-weight: 600; font-variant-numeric: tabular-nums; }
.lb-row .meta { color: var(--c2); opacity: .75; font-size: .72rem; }
.lb-row.pb::before { box-shadow: inset 3px 0 0 var(--gold); }
/* FilterControl: a sheared dark panel hanging from the top right, with sheared search box and dropdowns */
.ss-filter { flex: none; margin-right: -20px; padding: 10px 44px 10px 34px; display: flex; flex-direction: column; gap: 8px; }
.ss-filter::before { transform-origin: bottom left; border-radius: 0 0 0 10px; background: hsl(var(--ss-h) 10% 15% / .9); }
.ss-search .input { position: relative; width: 100%; height: 38px; padding-left: 38px; font-size: .95rem; background: none; border-color: transparent; box-shadow: none; }
.ss-search::before { border-radius: 8px; background: var(--b4); transition: background var(--t-fast); }
.ss-search:focus-within::before { background: var(--b3); box-shadow: 0 0 0 1px rgba(255, 255, 255, .2); }
.ss-search .i { position: absolute; left: 12px; top: 11px; color: var(--c2); z-index: 1; }
.ss-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ss-sel { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 2px 0 12px; font-size: .78rem; font-weight: 600; color: var(--c2); }
.ss-sel::before { border-radius: 6px; background: var(--b4); }
.ss-sel .select { height: 28px; padding: 0 26px 0 6px; font-size: .8rem; font-weight: 600; background-color: transparent; border-color: transparent; box-shadow: none; background-position: calc(100% - 14px) 12px, calc(100% - 9px) 12px; }
.ss-count { color: var(--c2); font-size: .78rem; white-space: nowrap; }

@keyframes rowIn { from { opacity: 0; transform: translateX(-8px); } }

/* carousel panels, anchored right and running past the screen edge (so the right corners never show); lazer slides
   panels that aren't selected to the right: sets by 125px, difficulties by 75px */
.carousel { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.carousel-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; outline: none; }
.carousel-scroll.under { -webkit-mask-image: linear-gradient(transparent, #000 36px); mask-image: linear-gradient(transparent, #000 36px); }
.carousel-inner { position: relative; }
.c-item { position: absolute; left: 0; right: 0; will-change: transform, translate; transition: transform calc(400ms * var(--anim)) var(--ease-out), translate calc(400ms * var(--anim)) var(--ease-out), opacity calc(300ms * var(--anim)) ease-out; }
.carousel-scroll.scrolling .c-item { transition: transform calc(400ms * var(--anim)) var(--ease-out), opacity calc(300ms * var(--anim)) ease-out; }
.c-item.set { z-index: 1; } /* (difficulties slide out from under their set's panel) */
.c-item.spawn { opacity: 0; pointer-events: none; }
.set-panel, .diff-panel { position: relative; display: block; width: calc(100% + 10px); height: 100%; margin: 0; padding: 0; border: 0; border-radius: 10px; overflow: hidden; text-align: left; color: #fff; background: linear-gradient(90deg, var(--b3), var(--b4)); box-shadow: 0 1px 4px rgba(0, 0, 0, .2); transform: translateX(var(--x)); transition: transform calc(400ms * var(--anim)) var(--ease-out), box-shadow calc(400ms * var(--anim)) var(--ease-out); }
.set-panel { --x: calc(155px * var(--k)); }
.set-panel.expanded { --x: calc(55px * var(--k)); box-shadow: 0 0 3px 1px rgba(78, 191, 255, .8); }
.diff-panel { --x: calc(145px * var(--k)); background: var(--sc); }
.diff-panel.selected { --x: calc(70px * var(--k)); box-shadow: 0 0 3px 1px color-mix(in srgb, var(--sc) 80%, transparent); }
/* hover: lazer's faint blue; selection: an additive sweep over the right 80% (lazer pulses it; kept still here so an
   idle song select costs nothing on slow devices) */
.set-panel::after, .diff-panel::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: rgba(102, 204, 255, .1); opacity: 0; transition: opacity 1000ms var(--ease-out); }
.set-panel:hover::after, .diff-panel:hover::after { opacity: 1; transition-duration: 100ms; }
.set-panel.expanded::after, .diff-panel.selected::after { left: 20%; opacity: 1; background: linear-gradient(90deg, transparent, var(--sel, rgba(255, 255, 255, .35))); mix-blend-mode: plus-lighter; }
.diff-panel.selected::after { --sel: color-mix(in srgb, var(--sc) 50%, transparent); }
.set-panel .sp-bg { position: absolute; inset: 0; background: center / cover; }
/* PanelSetBackground: a diagonal (~40°) dark gradient over the cover */
.set-panel .sp-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(51deg, rgba(0, 0, 0, .5) 40%, rgba(0, 0, 0, .3) 60%, rgba(0, 0, 0, .2)); }
.sp-chev { position: absolute; left: 0; top: 0; bottom: 0; width: 18px; display: grid; place-items: center; background: #fff; color: var(--b5); transform: translateX(-100%); transition: transform calc(400ms * var(--anim)) var(--ease-out); z-index: 1; }
.sp-chev .i { width: 11px; height: 11px; stroke-width: 3.2; }
.set-panel.expanded .sp-chev { transform: none; }
.set-panel .sp-body { position: relative; display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 4px 16px 6px 15px; min-width: 0; max-width: calc(100% - var(--x) - 28px); transition: transform calc(400ms * var(--anim)) var(--ease-out); }
.set-panel.expanded .sp-body { transform: translateX(18px); }
.set-panel .sp-t { font-size: 1.3rem; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
.set-panel .sp-a { font-size: .875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
.set-panel .sp-dots { display: flex; gap: 3px; margin-top: 5px; align-items: center; }
.set-panel .sp-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); }
.sp-extra { font-size: .72rem; color: var(--c2); }
.set-panel .sp-fav { position: absolute; top: 10px; right: calc(var(--x) + 24px); color: #ff66ab; }
.set-panel.broken { filter: saturate(.3); }
/* PanelBeatmap: the difficulty colour shows as a 13px strip on the left, and tints the panel */
.dp-body { position: absolute; inset: 0 0 0 13px; display: flex; align-items: center; gap: 5px; padding-left: 6.5px; border-radius: 10px; background: linear-gradient(90deg, color-mix(in srgb, var(--sc) 25%, transparent), transparent 70%), linear-gradient(90deg, var(--b3), var(--b4)); }
.dp-body .rank-pill { transform: scale(.8); margin-right: -3px; }
.dp-main { min-width: 0; max-width: calc(100% - var(--x) - 20px); padding-bottom: 3px; }
.dp-top { display: flex; align-items: baseline; min-width: 0; padding-bottom: 3px; white-space: nowrap; }
.dp-k, .dp-v { font-size: .875rem; font-weight: 600; }
.dp-k { white-space: pre; }
.dp-v { overflow: hidden; text-overflow: ellipsis; margin-right: 4px; }
.dp-s { flex: none; font-size: .75rem; font-weight: 600; color: var(--c2); }
.dp-bottom { display: flex; align-items: center; gap: 4px; }
.dp-bottom .stars { height: 17px; font-size: .68rem; padding: 0 6px; }
.dp-stars { font-size: 9px; letter-spacing: 1.5px; background: linear-gradient(90deg, var(--sc) var(--p), rgba(255, 255, 255, .12) var(--p)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dp-bad { font-size: .72rem; color: #ff9aa6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.diff-panel.broken { opacity: .55; }
/* lazer's DrawableRank */
.rank-pill { display: inline-grid; place-items: center; flex: none; min-width: 30px; height: 16px; padding: 0 6px; border-radius: 99px; background: var(--rc); color: var(--rt); font-size: .66rem; font-weight: 800; line-height: 1; }
.keys-tag { font-weight: 600; font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: rgba(0, 0, 0, .55); color: #fff; }
.ss-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
.ss-empty .box { max-width: 520px; }
.ss-empty h2 { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
.ss-empty p { color: var(--text-2); }

/* footer bar with back button, Mods / Random / Options and the logo play button */
.ss-footer { position: relative; display: flex; align-items: center; gap: 4px; height: 50px; padding: 0 20px 0 0; background: rgba(0, 0, 0, .8); }
.ss-footer .foot-btn { --c: #888; position: relative; height: 50px; min-width: 110px; padding: 0 20px; border: 0; background: rgba(255, 255, 255, .04); color: #fff; transform: skewX(-12deg); overflow: hidden; font-size: .95rem; transition: background var(--t-fast); }
.ss-footer .foot-btn::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); transition: height var(--t-fast); }
.ss-footer .foot-btn:hover { background: rgba(255, 255, 255, .1); }
.ss-footer .foot-btn:hover::before { height: 6px; }
.fb-inner { display: inline-flex; align-items: center; gap: 8px; transform: skewX(12deg); }
.ss-footer .mods-on { display: flex; gap: 4px; margin-left: 12px; }
.ss-cookie { position: relative; width: 96px; height: 96px; margin: -46px 0 0 10px; border: 0; padding: 0; border-radius: 50%; background: transparent; transition: transform var(--t-fast); }
.ss-cookie:hover { transform: scale(1.06); }
.ss-cookie:active { transform: scale(.95); }
.ss-cookie[disabled] { filter: grayscale(1); opacity: .5; }
.ss-cookie-disc { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 50% 30%, #ff85bd, #e6428e 80%); border: 5px solid #fff; box-shadow: 0 4px 20px rgba(0, 0, 0, .5); }
.ss-cookie-disc .i { width: 34px; height: 34px; margin-left: 4px; }

/* ── GAMEPLAY */
.gameplay { padding-top: 0; cursor: none; }
.gameplay.show-cursor { cursor: default; }
.gp-bg { position: absolute; inset: 0; background: center / cover no-repeat #000; transition: filter var(--t-med); }
.gp-dim { position: absolute; inset: 0; background: #000; }
.gp-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gp-hud { position: absolute; inset: 0; pointer-events: none; }
.hud-score { position: absolute; top: 16px; right: 24px; text-align: right; }
.hud-score .sc { font-size: clamp(1.8rem, calc(3.2 * var(--vw)), 2.8rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; text-shadow: 0 2px 12px rgba(0, 0, 0, .6); }
.hud-score .acc { font-size: clamp(1.1rem, calc(1.8 * var(--vw)), 1.5rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-2); }
.hud-progress { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: rgba(255, 255, 255, .06); }
.hud-progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); width: 100%; transform: scaleX(0); transform-origin: 0 0; }
.hud-time { position: absolute; top: 12px; left: 22px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }
.hud-mods { position: absolute; top: 118px; right: 24px; display: flex; gap: 4px; }
.hud-meta { position: absolute; bottom: 18px; left: 22px; color: var(--text-2); font-size: .85rem; font-weight: 700; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); max-width: calc(30 * var(--vw)); }
.hud-meta b { color: var(--text); }
.hud-skip { position: absolute; right: 30px; bottom: 30px; pointer-events: auto; width: 220px; height: 64px; padding: 0 18px; display: flex; align-items: center; justify-content: center; gap: 10px; overflow: hidden; border: 0; border-radius: 12px; background: rgba(0, 0, 0, .5); color: #fff; font: inherit; font-size: 1.45rem; font-weight: 700; cursor: pointer; box-shadow: 0 8px 26px rgba(0, 0, 0, .35); transition: background var(--t-fast), transform var(--t-fast) var(--ease-out); animation: skipIn 400ms var(--ease-out) both; }
.hud-skip:hover { background: rgba(var(--accent-rgb), .55); transform: scale(1.04); }
.hud-skip:active { transform: scale(.97); }
.hud-skip .sk-chev { display: flex; }
.hud-skip .sk-chev svg { width: 18px; height: 18px; margin: 0 -4px; animation: skipChev 1.2s ease-in-out infinite; }
.hud-skip .sk-chev svg:nth-child(2) { animation-delay: .15s; }
.hud-skip .sk-chev svg:nth-child(3) { animation-delay: .3s; }
.hud-skip .kbd { margin-left: 4px; font-size: .7rem; opacity: .75; }
.hud-skip .sk-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255, 255, 255, .85); transform-origin: left; transform: scaleX(var(--left, 1)); }
@keyframes skipChev { 0%, 100% { opacity: .3; transform: translateX(-2px); } 50% { opacity: 1; transform: translateX(3px); } }
@keyframes skipIn { from { opacity: 0; transform: translateY(16px); } }
.hud-center-msg { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 2.4rem; font-weight: 700; text-shadow: 0 4px 20px rgba(0, 0, 0, .7); pointer-events: none; animation: msgPop 400ms var(--ease-out); }
@keyframes msgPop { from { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
.hud-replay { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 6px 16px; border-radius: 99px; background: rgba(0, 0, 0, .55); border: 1px solid var(--line-2); font-weight: 700; font-size: .85rem; letter-spacing: .06em; }
.hud-replay.low { top: auto; bottom: 16px; } /* upscroll: the keys are up top, so the badge goes under the stage */
.hud-replay .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 8px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.gp-fail { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255, 30, 60, .0), rgba(255, 30, 60, .35)); pointer-events: none; opacity: 0; transition: opacity 600ms; }
.gp-fail.on { opacity: 1; }
.gameplay.failing > canvas { animation: failSink 1.2s cubic-bezier(.55, 0, 1, .45) forwards; transform-origin: 50% 100%; }
@keyframes failSink { to { transform: translateY(7%) scale(.97); filter: brightness(.55) saturate(.4); } }
/* pause / fail: osu!lazer's GameplayMenuOverlay — a plain black dim (no blur), lowercase title with its line, and
   DialogButtons: a slanted band of colour across a wide strip that widens and glows when hovered */
.pause-menu { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .75); animation: fadeIn 200ms ease; }
.pause-box { display: flex; flex-direction: column; align-items: center; width: min(620px, calc(92 * var(--vw))); text-align: center; }
.pause-box h2 { font-size: 2.4rem; font-weight: 400; margin: 0; letter-spacing: .01em; text-shadow: 0 2px 12px rgba(0, 0, 0, .6); }
.pause-box h2.failed { color: #fff; }
.pause-box .pm-desc { font-size: 1.05rem; margin: 6px 0 34px; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
.pm-buttons { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.pm-btn { position: relative; height: 54px; width: 100%; border: 0; padding: 0; background: rgba(0, 0, 0, .25); color: #fff; font: inherit; font-size: 1.3rem; font-weight: 600; cursor: pointer; outline: none; overflow: hidden; }
.pm-btn .pm-band { position: absolute; top: 0; bottom: 0; left: 12%; right: 12%; background: var(--c); transform: skewX(-18deg); transition: left 250ms var(--ease-out), right 250ms var(--ease-out), box-shadow 250ms, filter 250ms; box-shadow: 0 0 0 transparent; }
.pm-btn:hover .pm-band, .pm-btn:focus-visible .pm-band { left: 6%; right: 6%; box-shadow: 0 0 26px var(--c); filter: brightness(1.12); }
.pm-btn:active .pm-band { filter: brightness(.9); }
.pm-btn .pm-label { position: relative; text-shadow: 0 1px 4px rgba(0, 0, 0, .55); }
.pause-box .pb-sub { color: var(--muted); font-weight: 600; margin-top: 18px; max-width: 440px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.countdown { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font-size: 5rem; font-weight: 700; color: var(--accent-3); text-shadow: 0 0 40px rgba(var(--accent-rgb), .8); pointer-events: none; }
.practice-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(980px, calc(calc(100 * var(--vw)) - 40px)); padding: 12px 14px; border-radius: 16px; background: rgba(12, 8, 20, .88); border: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; cursor: default; transition: opacity var(--t-med); }
.practice-bar.dim { opacity: .25; }
.pr-offset { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.practice-bar.docked { left: 16px; transform: none; bottom: 64px; }
.practice-bar.docked.dim { opacity: .85; }
.practice-bar.top { bottom: auto; top: 14px; }
.practice-bar.docked .pr-controls, .practice-bar.docked .speed-group { flex-wrap: wrap; }
.practice-bar:hover { opacity: 1; }
.pr-timeline { position: relative; height: 36px; border-radius: 8px; background: rgba(255, 255, 255, .04); cursor: pointer; overflow: hidden; }
.pr-timeline canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pr-loop { position: absolute; top: 0; bottom: 0; background: rgba(var(--accent-rgb), .22); border-left: 2px solid var(--accent); border-right: 2px solid var(--gold); pointer-events: none; }
.pr-head { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; box-shadow: 0 0 8px #fff; pointer-events: none; }
.pr-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .82rem; }
.pr-controls .speed-group { display: flex; gap: 3px; }
.pr-controls .speed-group .chip { height: 28px; padding: 0 9px; }
/* replay / Auto controls (osu!lazer's replay player): shown while the mouse moves, when paused or hovered */
.replay-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(720px, calc(calc(100 * var(--vw)) - 340px)); min-width: min(470px, calc(calc(100 * var(--vw)) - 32px)); padding: 10px 12px; border-radius: 14px; background: rgba(12, 8, 20, .84); border: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 8px; pointer-events: auto; cursor: default; opacity: 0; transition: opacity var(--t-med); }
.gameplay.show-cursor .replay-bar, .replay-bar.paused, .replay-bar:hover, .replay-bar:focus-within { opacity: 1; }
.replay-bar.top { bottom: auto; top: 14px; }
/* the REPLAY tag sits on the same side: it steps aside while the controls are up */
.hud-replay { transition: opacity var(--t-med); }
.gameplay.show-cursor .hud-replay, .gameplay:has(.replay-bar.paused) .hud-replay, .gameplay:has(.replay-bar:hover) .hud-replay { opacity: 0; }
.rp-timeline { position: relative; height: 28px; border-radius: 7px; background: rgba(255, 255, 255, .04); cursor: pointer; overflow: hidden; touch-action: none; }
.rp-timeline canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.rp-fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: rgba(var(--accent-rgb), .3); pointer-events: none; }
.rp-headwrap { position: absolute; inset: 0; pointer-events: none; will-change: transform; }
.rp-head { position: absolute; left: 0; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 8px #fff; }
.rp-controls { display: flex; align-items: center; gap: 8px; font-size: .82rem; }
.rp-controls .grow { flex: 1; }
.rp-controls .speed-group { display: flex; gap: 3px; }
.rp-controls .speed-group .chip { height: 26px; padding: 0 8px; }
.rp-play { min-width: 38px; justify-content: center; }
.rp-time { font-variant-numeric: tabular-nums; color: var(--text-2); min-width: 96px; }

/* ── RESULTS */
.results { padding-top: var(--toolbar-h); }
.res-body { flex: 1; min-height: 0; overflow: auto; padding: 22px clamp(16px, calc(3 * var(--vw)), 48px) 26px; }
.res-grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 400px minmax(0, 700px); justify-content: center; align-items: start; gap: 24px; }
@media (max-width: 1000px) { .res-grid { grid-template-columns: minmax(0, 440px); } }
/* osu!lazer's expanded score panel */
.rs { border-radius: 20px; overflow: hidden; background: #1d1c22; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); animation: rsIn 500ms var(--ease-out) both; }
@keyframes rsIn { from { opacity: 0; transform: translateY(24px) scale(.97); } }
.rs-top { display: flex; align-items: center; gap: 14px; padding: 18px 20px; background: linear-gradient(120deg, color-mix(in srgb, var(--rc) 38%, #2b2931), #24232a 70%); }
.rs-top .avatar, .rs-top > :first-child { flex: none; }
.rs-initial { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; background: rgba(255, 255, 255, .1); font-size: 1.8rem; font-weight: 700; }
.rs-who { min-width: 0; flex: 1; }
.rs-name { font-size: 1.3rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs-when { font-size: .8rem; color: var(--text-2); margin-top: 2px; }
.rs-tag { padding: 3px 10px; border-radius: 99px; background: rgba(0, 0, 0, .35); font-size: .72rem; font-weight: 700; letter-spacing: .08em; }
.rs-mid { padding: 18px 22px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.rs-map { width: 100%; min-width: 0; }
.rs-title { font-size: 1.25rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs-artist { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs-diff { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; font-size: .85rem; min-width: 0; }
.rs-diff > :first-child { flex: none; }
.rs-version { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs-mapper { margin-top: 3px; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs-ring { position: relative; width: 230px; height: 230px; margin: 22px 0 14px; }
.rs-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.rs-grade { position: absolute; inset: 0; display: grid; place-items: center; font-size: 5.4rem; font-weight: 700; color: var(--rc); text-shadow: 0 0 28px color-mix(in srgb, var(--rc) 70%, transparent); animation: gradeIn 700ms var(--ease-out) 300ms both; }
.rs-badge { position: absolute; transform: translate(-50%, -50%); min-width: 30px; height: 16px; padding: 0 6px; display: grid; place-items: center; border-radius: 99px; font-size: .66rem; font-weight: 800; line-height: 1; color: var(--rt); background: var(--rc); animation: rsBadge 500ms var(--ease-out) both; }
@keyframes rsBadge { from { opacity: 0; box-shadow: 0 0 0 0 var(--rc); } 10% { opacity: 1; box-shadow: 0 0 22px 4px var(--rc); } }
.rs-badge.on { box-shadow: 0 0 14px color-mix(in srgb, var(--rc) 60%, transparent); }
.rs-mods { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.rs-failed { color: #ff5a5a; font-weight: 800; letter-spacing: .12em; font-size: .85rem; }
.rs .res-score { font-size: 2.8rem; font-weight: 300; letter-spacing: .03em; line-height: 1.1; }
.rs-stats { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 4px; }
.rs-stat .k, .rs-j .k { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.rs-stat .v { font-size: 1.3rem; font-weight: 600; margin-top: 2px; }
.rs-judges { width: 100%; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 10px 0 2px; border-top: 1px solid rgba(255, 255, 255, .07); }
.rs-j .v { font-size: 1.02rem; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.rs .res-pb { margin-top: 4px; }

.chart-card { padding: 16px; }
.chart-card h3 { margin: 0 0 10px; font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.chart-card h3 .grow { flex: 1; }
.res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.res-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px; border-radius: 8px; background: rgba(255, 255, 255, .04); }
.res-stat span { font-size: .72rem; color: var(--muted); }
.res-stat b { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.chart-wrap { position: relative; width: 100%; }
.chart-wrap canvas { width: 100%; display: block; }
.chart-tip { position: absolute; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: rgba(8, 5, 14, .95); border: 1px solid var(--line-2); font-size: .78rem; font-weight: 700; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 3; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; color: var(--text-2); margin-top: 8px; }
.chart-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.res-actions { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 20px 0 0; background: rgba(0, 0, 0, .8); }

/* ── lists / cards (collections, replays, skins, beatmaps) */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { position: relative; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); overflow: hidden; transition: transform var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast); }

.side-list { display: flex; flex-direction: column; gap: 6px; }
.side-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); text-align: left; width: 100%; font-weight: 600; transition: all var(--t-fast); }

.side-item.active { border-color: var(--accent); background: rgba(var(--accent-rgb), .16); }

/* skins */

/* profile */
.lvl-badge { width: 48px; height: 48px; display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; border-radius: 14px; background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #2a1d00; box-shadow: 0 0 20px rgba(255, 213, 74, .35); }
.xp-bar { width: min(340px, calc(50 * var(--vw))); height: 8px; border-radius: 8px; background: rgba(0, 0, 0, .4); overflow: hidden; }

/* statistics */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.big-stat { padding: 16px 18px; }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }

.table { width: 100%; border-collapse: collapse; font-size: .86rem; }

/* debug overlay */

.debug-overlay .h { color: #ffe38a; }

/* import status pill */
.import-pill { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 91; max-width: min(560px, calc(100% - 32px)); padding: 10px 18px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--accent); display: flex; align-items: center; gap: 10px; font-weight: 600; box-shadow: var(--shadow); animation: toastIn var(--t-med) var(--ease-out); }

/* ── onboarding */

.hud-pie.lead { background: conic-gradient(#7ee07a var(--p), rgba(126,224,122,.18) 0); box-shadow: 0 0 0 2px #7ee07a, 0 2px 10px rgba(0,0,0,.5); }

.profile-pp .v { font-size: 2.6rem; font-weight: 700; line-height: 1.05; color: var(--accent-3); font-variant-numeric: tabular-nums; }

/* ── beatmap explorer (lazer beatmap-listing style) */
.ex-body { padding-top: 0; }

.ex-statuspill { font-size: .62rem; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; background: #444; color: #fff; }
.st-ranked, .st-approved { background: #b3ff66; color: #1a2600; } .st-qualified { background: #66ccff; color: #00202e; } .st-loved { background: #ff66aa; color: #2e0014; }
.st-pending, .st-wip { background: #ffd966; color: #2e2300; } .st-graveyard { background: #1a1a1a; color: #aaa; }
/* ── Beatmap explorer cards (osu!lazer / osu-web style): cover on top, details below */
.ex-grid { gap: 16px; }
.ex-card { position: relative; display: flex; flex-direction: column; min-width: 0; border-radius: 12px; overflow: hidden; background: #2a2830; cursor: pointer; outline: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast); }
.ex-card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px rgba(var(--accent-rgb), 0); pointer-events: none; transition: box-shadow var(--t-fast); }
.ex-card:hover, .ex-card:focus-visible { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(0, 0, 0, .45); }
.ex-card:hover::after, .ex-card:focus-visible::after { box-shadow: inset 0 0 0 2px rgba(var(--accent-rgb), .6); }

.ex-cover { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 300ms ease, filter 300ms ease; }

.ex-badges { position: absolute; left: 10px; top: 10px; display: flex; gap: 5px; align-items: center; }

.ex-length { position: absolute; right: 10px; bottom: 9px; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 99px; background: rgba(0, 0, 0, .65); font-size: .72rem; font-weight: 600; font-variant-numeric: tabular-nums; }

.ex-action { flex: none; display: flex; align-items: center; }

.ex-set-a { font-size: 1.05rem; color: var(--text-2); text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
.ex-set-m { font-size: .85rem; color: var(--muted); margin-top: 4px; }
