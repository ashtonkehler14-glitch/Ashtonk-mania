  async download(set) {
    if (this.downloads.get(set.id)?.state === 'downloading') return;
    const state = { state: 'downloading', progress: 0, bytes: 0 };
    this.downloads.set(set.id, state);
    this.refreshCard(set);
    try {
      let lastPaint = 0;
      await OnlineBeatmaps.downloadAndImport(set, (p, bytes) => {
        state.progress = p; state.bytes = bytes;
        const now = performance.now();
        if (now - lastPaint > 120) { lastPaint = now; this.refreshCard(set); }
      });
      state.state = 'done';
    } catch (e) {
      state.state = 'error';
      Toast.err(`Couldn't download ${set.title}`, friendlyError(e));
    }
    this.refreshCard(set);
  },
  /** Multiplayer: choose one of the set's difficulties, then pick it for the room (host) or suggest it. */
  mpChoose(set, btn) {
    const r = btn.getBoundingClientRect();
    showMenu(r.left, r.bottom + 4, [
      { header: 'Choose a difficulty' },
      ...set.diffs.map(d => ({ label: `${d.version} · ${d.keys}K · ★${d.stars.toFixed(2)}`, icon: 'star', onClick: () => this.mpPickDiff(set, d) })),
    ]);
  },
  async mpPickDiff(set, d) {
    if (!Multiplayer.inRoom()) { Toast.err('You are no longer in a room'); return; }
    const host = Multiplayer.isHost();
    const findLocal = () => [...BeatmapManager.maps.values()].find(m => m.onlineId === d.id && !m.problems.length)
      || (this.owned(set.id)?.maps || []).find(m => m.version === d.version && !m.problems.length) || null;
    let m = findLocal();
    try {
      if (host) {
        if (!m) {
          // download (with the card's progress ring) before picking
          const state = { state: 'downloading', progress: 0, bytes: 0 };
          this.downloads.set(set.id, state); this.refreshCard(set);
          try {
            await OnlineBeatmaps.downloadAndImport(set, p => { state.progress = p; this.refreshCard(set); });
            state.state = 'done';
          } catch (e) { state.state = 'error'; throw e; } finally { this.refreshCard(set); }
          m = findLocal();
        }
        if (!m) throw new Error('That difficulty couldn\'t be found after downloading.');
        Multiplayer.selectMap(m, Settings.get('songselect.mods') || []);
        Toast.ok('Beatmap picked', `${m.title} [${m.version}]`);
      } else {
        const info = { title: set.title, artist: set.artist, version: d.version, creator: set.creator, stars: d.stars, keys: d.keys, onlineSetId: set.id, onlineId: d.id };
        Multiplayer.send({ t: 'suggest', map: m ? { ...info, hash: m.hash, length: m.length } : info });
        Toast.show('Suggested to the host', `${set.title} [${d.version}]`);
      }
      Screens.go('multiplayer', {}, { replace: true });
    } catch (e) { Toast.err(host ? 'Couldn\'t pick that beatmap' : 'Couldn\'t suggest that beatmap', e.message); }
  },
  refreshCard(set) {
    const old = this.grid && this.grid.querySelector(`.ex-card[data-id="${set.id}"]`);
    if (old) old.replaceWith(this.card(set));
    if (this.setView && this.setView.set.id === set.id) this.renderSet();
  },
  togglePreview(id) {
    if (this.previewId === id) { this.stopPreview(); this.syncPreviewButtons(); return; }
    this.stopPreview();
    AudioManager.resume();
    if (Music.playing) { Music.pause(); this._resumeMusic = true; }
    const a = new Audio(OnlineBeatmaps.previewURL(id));
    a.volume = clamp(Settings.get('audio.master') * Settings.get('audio.music'), 0, 1);
    a.play().catch(() => Toast.err('Preview unavailable'));
    a.onended = () => { this.stopPreview(); this.syncPreviewButtons(); };
    this.audio = a; this.previewId = id;
    this.syncPreviewButtons();
  },
  stopPreview() {
    if (this.audio) { this.audio.pause(); this.audio = null; }
    this.previewId = null;
    if (this._resumeMusic && Music.loaded && !Music.playing) Music.play(Music.pausedPos, { fadeIn: 300 });
    this._resumeMusic = false;
  },
};

/* ===== 18-settings-ui.js ===== */
/* Settings panel (schema-driven), key configuration, offset calibration and the mod select overlay. */

const SECTION_ICONS = { Gameplay: 'target', Audio: 'volume', Graphics: 'sparkle', Input: 'keyboard', Interface: 'home', Skin: 'brush', Maintenance: 'database' };

/** The settings shown by default; everything else sits behind "Show all settings" (search always finds it). */
const ESSENTIAL_SETTINGS = new Set([
  'gameplay.scrollSpeed', 'gameplay.scrollDirection', 'gameplay.scrollMode', 'gameplay.laneWidth', 'gameplay.bgDim', 'gameplay.bgBlur', 'gameplay.progressDisplay', 'gameplay.showPp', 'gameplay.healthStyle',
  'audio.master', 'audio.music', 'audio.effects', 'audio.offset',
  'graphics.fpsLimit', 'graphics.showFps', 'graphics.performanceMode',
  'input.keybinds', 'ui.scale', 'ui.theme', 'ui.mascot', 'ui.mascotImage', 'skin.current', 'data',
]);

const SettingsPanel = {
  o: null,
  toggle() { this.o ? this.close() : this.open(); },
  open(section) {
    if (this.o) { if (section) this.scrollTo(section); return; }
    UISounds.click();
    const nav = h('div.sp-nav');
    const search = h('input.input.sp-search', { type: 'search', placeholder: 'Search settings…', 'aria-label': 'Search settings' });
    const scroll = h('div.sp-scroll');
    const panel = h('div.settings-panel', { role: 'dialog', 'aria-label': 'Settings' }, nav,
      h('div.sp-main', h('div.sp-head', h('div.row', h('h2', 'Settings'), h('span.grow'), h('button.icon-btn', { title: 'Close (Esc)', onclick: () => this.close() }, icon('x'))),
        search), scroll));
    this.scrollEl = scroll; this.nav = nav;
    this.build('');
    search.addEventListener('input', () => this.build(search.value.trim().toLowerCase()));
    search.addEventListener('keydown', e => { if (e.key !== 'Escape') e.stopPropagation(); });
    scroll.addEventListener('scroll', () => this.syncNav());
    this.o = makeOverlay(panel, { onClose: () => { this.o = null; KeyConfig.stop(); } });
    requestAnimationFrame(() => { if (section) this.scrollTo(section); else this.syncNav(); });
  },
  close() { if (this.o) { UISounds.back(); this.o.close(); } },
  scrollTo(sec) {
    const el = this.scrollEl && this.scrollEl.querySelector(`[data-section="${sec}"]`);
    if (el) this.scrollEl.scrollTo({ top: el.offsetTop - 8, behavior: 'smooth' });
  },
  /** Highlight the section being read. (Measured on screen: before the panel is shown every section sits at 0,
   *  which used to light up the last icon.) */
  syncNav() {
    const el = this.scrollEl, secs = $$('.sp-section', el);
    let cur = secs[0]?.dataset.section;
    if (el.isConnected && el.clientHeight) {
      const top = el.getBoundingClientRect().top;
      for (const s of secs) if (s.getBoundingClientRect().top - top < 80) cur = s.dataset.section;
    }
    $$('[data-sec]', this.nav).forEach(b => b.classList.toggle('active', b.dataset.sec === cur));
  },
  build(q) {
    this.q = q;
    const scroll = this.scrollEl;
    clearEl(scroll);
    const all = !!Settings.get('ui.allSettings') || !!q;
    const bySec = new Map();
    let hiddenCount = 0;
    for (const it of SETTINGS_SCHEMA) {
      if (!it.s) continue;
      if (q && !(`${it.s} ${it.g} ${it.l} ${it.hint || ''}`.toLowerCase().includes(q))) continue;
      if (!all && !ESSENTIAL_SETTINGS.has(it.k)) { hiddenCount++; continue; }
      if (!bySec.has(it.s)) bySec.set(it.s, new Map());
      const g = bySec.get(it.s);
      if (!g.has(it.g)) g.set(it.g, []);
      g.get(it.g).push(it);
    }
    for (const [sec, groups] of bySec) {
      const secEl = h('div.sp-section', { dataset: { section: sec } }, h('h3', icon(SECTION_ICONS[sec] || 'gear'), sec));
      for (const [g, items] of groups) {
        secEl.append(h('div.sp-group', g));
        for (const it of items) secEl.append(this.row(it));
      }
      scroll.append(secEl);
    }
    if (!bySec.size) scroll.append(h('div.empty', 'No settings match your search.'));
    if (!q) {
      const more = !!Settings.get('ui.allSettings');
      scroll.append(h('button.btn.sp-more', { onclick: () => { Settings.set('ui.allSettings', !more); UISounds.click(); this.build(''); } },
        more ? 'Show fewer settings' : `Show all settings (${hiddenCount} more)`));
    }
    scroll.append(h('div.sp-footer', `${APP_NAME} v${APP_VERSION}`));
    clearEl(this.nav).append(...[...bySec.keys()].map(sec => h('button.icon-btn', { title: sec, 'aria-label': sec, dataset: { sec }, onclick: () => this.scrollTo(sec) }, icon(SECTION_ICONS[sec] || 'gear'))));
    this.syncNav();
  },
  row(it) {
    const val = () => Settings.get(it.k);
    const isDefault = () => JSON.stringify(Settings.get(it.k)) === JSON.stringify(it.d);
    const reset = h('button.icon-btn.reset', { title: 'Reset to default', onclick: () => { Settings.set(it.k, structuredClone(it.d)); rebuild(); } }, icon('retry'));
    const updReset = () => reset.classList.toggle('show', !isDefault());
    const lbl = h('div.lbl', it.l, it.hint ? h('div.hint', it.hint) : null);
    let row;
    const rebuild = () => { const n = this.row(it); row.replaceWith(n); };
    if (it.when && !it.when()) return h('div', { hidden: true });
    switch (it.t) {
      case 'bool': {
        const t = h(`button.toggle${val() ? '.on' : ''}`, { role: 'switch', 'aria-checked': String(!!val()), 'aria-label': it.l, onclick: () => {
          const v = !val(); Settings.set(it.k, v); t.classList.toggle('on', v); t.setAttribute('aria-checked', String(v)); UISounds.play(v ? 'check-on' : 'check-off'); updReset();
        } });
        row = h('div.set-row', lbl, h('div.ctl', reset, t));
        break;
      }
      case 'range': {
        const s = h('input.slider', { type: 'range', min: it.min, max: it.max, step: it.step, value: val(), 'aria-label': it.l });
        const v = h('span.val');
        const upd = () => { const x = parseFloat(s.value); v.textContent = it.fmt ? it.fmt(x) : x; s.style.setProperty('--p', ((x - it.min) / (it.max - it.min) * 100) + '%'); };
        s.addEventListener('input', () => { Settings.set(it.k, parseFloat(s.value)); upd(); updReset(); });
        s.addEventListener('keydown', e => e.stopPropagation());
        upd();
        row = h('div.set-row.col', h('div.row', lbl, v, reset), h('div.ctl', s,
          it.calibrate ? h('button.btn.sm', { onclick: () => Calibration.open() }, 'Calibrate') : null));
        break;
      }
      case 'select': {
        const sel = h('select.select', { 'aria-label': it.l }, ...it.o.map(([k, l]) => h('option', { value: k, selected: String(val()) === String(k) }, l)));
        sel.addEventListener('change', () => {
          Settings.set(it.k, it.num ? Number(sel.value) : sel.value); UISounds.click(); updReset();
          if (SETTINGS_SCHEMA.some(x => x.when && x.s === it.s)) { const st = this.scrollEl.scrollTop; this.build(this.q || ''); this.scrollEl.scrollTop = st; }
        });
        row = h('div.set-row', lbl, h('div.ctl', reset, sel));
        break;
      }
      case 'text': {
        const inp = h('input.input', { value: val(), style: { width: '100%' } });
        inp.addEventListener('change', () => { Settings.set(it.k, inp.value); updReset(); });
        inp.addEventListener('keydown', e => e.stopPropagation());
        row = h('div.set-row.col', h('div.row', lbl, reset), h('div.ctl', inp));
        break;
      }
      case 'keybinds': row = h('div.set-row.col', lbl, KeyConfig.build()); break;
      case 'skin': {
        const sel = h('select.select', { 'aria-label': 'Skin' }, ...SkinManager.list().map(s => h('option', { value: s.id, selected: s.id === SkinManager.current.id }, s.name)));
        sel.addEventListener('change', async () => { await SkinManager.select(sel.value); Toast.ok('Skin selected', SkinManager.current.name); });
        row = h('div.set-row', lbl, h('div.ctl', sel, h('button.btn.sm', { onclick: () => { this.close(); Screens.go('skins'); } }, 'Browse')));
        break;
      }
      case 'data': row = h('div.set-row.col', lbl, DataPanel.build()); break;
      case 'mascot': row = h('div.set-row', lbl, h('div.ctl',
        h('button.btn.sm', { onclick: async () => { const [f] = await pickFiles({ accept: 'image/*', multiple: false }); if (f) { await NeruMascot.setImage(f); Toast.ok('Main menu character updated'); } } }, icon('upload'), 'Choose image'),
        h('button.btn.sm.ghost', { onclick: async () => { await NeruMascot.setImage(null); Toast.show('Main menu character reset'); } }, 'Reset'))); break;
      default: row = h('div');
    }

// ─────────────────────────────── Key configuration ───────────────────────────────
const KeyConfig = {
  keys: 4, listening: null, addMode: false, root: null,
  build() {
    const root = h('div.keycfg');
    this.root = root;
    this.render();
    return root;
  },
  stop() {
    if (this._kd) { window.removeEventListener('keydown', this._kd, true); window.removeEventListener('keyup', this._ku, true); this._kd = null; }
    this.listening = null;
  },
  render() {
    const root = this.root;
    if (!root) return;
    clearEl(root);
    const binds = Settings.keybinds(this.keys);
    // conflicts: same code used by more than one lane
    const count = new Map();
    binds.forEach(codes => codes.forEach(c => count.set(c, (count.get(c) || 0) + 1)));
    const conflicts = new Set([...count].filter(([, n]) => n > 1).map(([c]) => c));
    const types = maniaColumnTypes(this.keys);
    root.append(h('div.keycfg-modes', ...Array.from({ length: MAX_KEYS }, (_, i) => i + 1).map(k => h(`button.chip${k === this.keys ? '.on' : ''}`, { onclick: () => { this.keys = k; this.listening = null; this.render(); } }, `${k}K`))));
    const lanes = h('div.keycfg-lanes');
    binds.forEach((codes, i) => {
      const lane = h(`button.lane-key${this.listening === i ? '.listening' : ''}${codes.some(c => conflicts.has(c)) ? '.conflict' : ''}${types[i] === 'S' ? '.special' : ''}`, {
        dataset: { lane: i }, title: 'Click: rebind · Right-click / Shift+click: add an extra key',
        onclick: e => { this.listen(i, e.shiftKey); },
        oncontextmenu: e => { e.preventDefault(); this.listen(i, true); },
      }, h('span.ln', String(i + 1)), this.listening === i ? '…' : keyLabel(codes[0]), codes.length > 1 ? h('span.alt', codes.slice(1).map(keyLabel).join(' ')) : null);
      lanes.append(lane);
    });
    root.append(lanes);
    let help = this.listening !== null
      ? `Press a key for lane ${this.listening + 1}${this.addMode ? ' (adding an extra binding)' : ''} · Backspace clears extras · Esc cancels`
      : 'Click a lane, then press a key. Shift+click or right-click to add multiple keys to one lane.';
    const warn = conflicts.size ? `Conflict: ${[...conflicts].map(keyLabel).join(', ')} bound to multiple lanes.` : '';
    root.append(h(`div.keycfg-help${warn ? '.warn' : ''}`, warn || help));
    root.append(h('div.row', { style: { justifyContent: 'center' } },
      h('button.btn.sm', { onclick: () => { Settings.setKeybinds(this.keys, structuredClone(DEFAULT_KEYBINDS[this.keys])); this.render(); } }, `Reset ${this.keys}K`),
      h('button.btn.sm.ghost', { onclick: async () => { if (await Dialog.confirm('Reset all keybinds?', 'Every key mode goes back to its default layout.')) { Settings.set('input.keybinds', structuredClone(DEFAULT_KEYBINDS)); this.render(); } } }, 'Reset all')));
    this.attach();
  },
  listen(i, add) { this.listening = i; this.addMode = add; UISounds.click(); this.render(); this.pollPad(); },
  /** While a lane is listening, a gamepad button press is captured as that lane's binding ("Pad<n>"). */
  pollPad() {
    if (!navigator.getGamepads || this._padRaf) return;
    const base = {};
    const tick = () => {
      this._padRaf = null;
      if (this.listening === null || !this.root || !this.root.isConnected) return;
      for (const gp of [...navigator.getGamepads()].filter(Boolean)) {
        for (let i = 0; i < gp.buttons.length; i++) {
          const k = gp.index + ':' + i, pressed = gp.buttons[i].pressed;
          if (base[k] === undefined) { base[k] = pressed; continue; }
          if (pressed && !base[k]) { this._kd({ code: `Pad${i}`, preventDefault() {}, stopPropagation() {} }); base[k] = pressed; return this.listening !== null && this.pollPad(); }
          base[k] = pressed;
        }
      }
      this._padRaf = requestAnimationFrame(tick);
    };
    this._padRaf = requestAnimationFrame(tick);
  },
  attach() {
    if (this._kd) return;
    this._kd = e => {
      if (!this.root || !this.root.isConnected) { this.stop(); return; }
      const binds = Settings.keybinds(this.keys);
      // visualization
      binds.forEach((codes, i) => { if (codes.includes(e.code)) this.root.querySelector(`[data-lane="${i}"]`)?.classList.add('pressed'); });
      if (this.listening === null) return;
      e.preventDefault(); e.stopPropagation();
      if (e.code === 'Escape') { this.listening = null; this.render(); return; }
      const lane = this.listening;
      if (e.code === 'Backspace') { binds[lane] = binds[lane].slice(0, 1); }
      else if (e.code === 'Backquote') { Toast.show('That key is reserved', 'Hold ` to quick-retry during gameplay.'); return; }
      else if (this.addMode) { if (!binds[lane].includes(e.code)) binds[lane].push(e.code); }
      else binds[lane] = [e.code, ...binds[lane].slice(1).filter(c => c !== e.code)];
      Settings.setKeybinds(this.keys, binds);
      UISounds.play('check-on');
      this.listening = lane + 1 < this.keys && !this.addMode ? lane + 1 : null;
      this.render();
    };
    this._ku = e => {
      if (!this.root) return;
      const binds = Settings.keybinds(this.keys);
      binds.forEach((codes, i) => { if (codes.includes(e.code)) this.root.querySelector(`[data-lane="${i}"]`)?.classList.remove('pressed'); });
    };
    window.addEventListener('keydown', this._kd, true);
    window.addEventListener('keyup', this._ku, true);
  },
};

// ─────────────────────────────── Offset calibration ───────────────────────────────
const Calibration = {
  open() {
    AudioManager.resume();
    const beat = h('div.calib-beat', 'TAP');
    const info = h('div.muted', 'Tap Space (or click) in time with the clicks. 16 taps are averaged.');
    const res = h('div', { style: { fontWeight: 900, fontSize: '1.2rem', minHeight: '1.5em' } });
    const body = h('div.calib', beat, info, res);
    const BPM = 120, period = 60 / BPM;
    const ctx = AudioManager.ctx;
    const click = AudioManager.synth('click-short-confirm');
    const start = ctx.currentTime + 0.5;
    let n = 0, stopped = false;
    const errs = [];
    const schedule = () => {
      if (stopped) return;
      while (start + n * period < ctx.currentTime + 0.3) {
        AudioManager.play(click, { when: start + n * period, volume: 1.2 });
        const tBeat = start + n * period;
        setTimeout(() => { beat.classList.add('on'); setTimeout(() => beat.classList.remove('on'), 90); }, Math.max(0, (tBeat - AudioManager.now()) * 1000));
        n++;
      }
      setTimeout(schedule, 60);
    };
    schedule();
    const tap = ts => {
      const t = AudioManager.perfToCtx(ts);
      const k = Math.round((t - start) / period);
      if (k < 1) return;
      errs.push((t - (start + k * period)) * 1000);
      const recent = errs.slice(-16);
      const mean = recent.reduce((a, b) => a + b, 0) / recent.length;
      res.textContent = `${recent.length} taps · average ${mean >= 0 ? '+' : ''}${mean.toFixed(1)}ms`;
      this.suggest = Math.round(mean);
    };
    const kd = e => { if (e.code === 'Space') { e.preventDefault(); e.stopPropagation(); if (!e.repeat) tap(e.timeStamp); } };
    window.addEventListener('keydown', kd, true);
    beat.addEventListener('pointerdown', e => tap(e.timeStamp));
    const o = Dialog.custom('Audio offset calibration', body, [
      { label: 'Cancel' },
      { label: 'Apply', primary: true, onClick: () => { if (this.suggest != null) { Settings.set('audio.offset', clamp(this.suggest, -300, 300)); Toast.ok('Offset applied', `${this.suggest}ms`); if (SettingsPanel.o) SettingsPanel.build(''); } } },
    ]);
    const origClose = o.close;
    o.close = () => { stopped = true; window.removeEventListener('keydown', kd, true); origClose(); };
  },
};

const ModSelect = {

    const cur = Settings.get('songselect.mods') || [];

        h('div.modcol-h', h('span', gname), n ? h('span.modcol-n', String(n)) : null));
      const list = h('div.modcol-list');
      for (const m of mods) {
        const on = cur.includes(m.id);

/* ===== 18b-setup.js ===== */
/* First-run setup — a short, friendly wizard shown the first time the client opens (and from Settings →
 * Maintenance → "Run first-run setup"). Name first, then the player chooses whether to set things up at all:
 * device, accent colour and size, scroll speed and background, and a skin. Every choice applies immediately
 * (the previews are live) and stays editable in Settings. */

/** Render scale that keeps the playfield canvas at (at most) one pixel per CSS pixel — the cheapest setting
 *  that still looks sharp on a Chromebook's high-DPI panel. */
const lowEndRenderScale = () => clamp(Math.round(20 / (window.devicePixelRatio || 1)) / 20, 0.5, 1);

const SETUP_DEVICES = {
  pc: { label: 'PC', sub: 'Desktop or gaming laptop', icon: 'pc',
    values: () => ({ 'graphics.performanceMode': false, 'graphics.particles': true, 'graphics.effects': true, 'gameplay.hitLighting': true, 'skin.effects': true, 'gameplay.comboEffects': true,
      'graphics.bgQuality': 'high', 'gameplay.video': true, 'graphics.renderScale': 1, 'graphics.menuBlur': 12, 'ui.parallax': true }) },
  chromebook: { label: 'Chromebook', sub: 'School Chromebook or older laptop', icon: 'laptop',
    values: () => ({ 'graphics.performanceMode': true, 'graphics.bgQuality': 'low', 'gameplay.video': false, 'graphics.renderScale': lowEndRenderScale(),
      'graphics.menuBlur': 0, 'ui.parallax': false }) },
};

const SETUP_THEMES = [['kori', '#aa88ff', 'Kori'], ['neru', '#ffcf3a', 'Neru'], ['teto', '#ff4d6a', 'Teto'], ['miku', '#39c5bb', 'Miku']];
const SETUP_NOTE_STYLES = [['bars', 'Bars'], ['circles', 'Circles'], ['diamonds', 'Diamonds'], ['arrows', 'Arrows']];

const Onboarding = {
  STEPS: [
    { id: 'welcome', title: 'Welcome!' },
    { id: 'ask', title: 'Set up the game?' },
    { id: 'device', title: 'What are you playing on?' },
    { id: 'look', title: 'Make it yours' },
    { id: 'gameplay', title: 'How notes move' },
    { id: 'skin', title: 'Pick a skin' },
  ],

  /** Runs the wizard. Resolves once it is finished or skipped. `again`: opened from Settings (name is kept). */
  run({ again = false } = {}) {
    if (this.o) return this.done;
    this.done = new Promise(resolve => {
      this.resolve = resolve;
      this.again = again;
      this.i = 0;
      this.dir = 1;
      this.animate = true;
      this.el = h('div.onboarding.setup', { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Setup' });
      this.o = makeOverlay(this.el, {
        dismissable: false,
        onKey: e => {
          if (e.key === 'Escape') return true; // closed with its own buttons only
          if (e.key === 'Enter' && this.step.id !== 'ask' && !(e.target.closest && e.target.closest('button, input, select'))) { this.next(); return true; }
          return false;
        },
      });
      this.render();
    });
    return this.done;
  },

  get step() { return this.STEPS[this.i]; },
  get last() { return this.i === this.STEPS.length - 1; },

  render() {
    this.stopPreview();
    const st = this.step;
    const body = h(`div.setup-body.setup-step-${st.id}${this.animate ? '.anim' : ''}`, { style: { '--dir': this.dir } }, ...[].concat(this['step_' + st.id]()));
    this.animate = false;
    const showNav = st.id !== 'ask';
    this.nextBtn = showNav ? h('button.btn.primary.setup-next', { onclick: () => this.next() }, this.last ? 'Finish' : 'Next', icon(this.last ? 'check' : 'chevron')) : null;
    clearEl(this.el).append(
      h('div.setup-head',
        h('h2', st.id === 'welcome' ? 'Welcome to Ashtonk!mania' : st.title),
        this.i > 1 ? h('div.setup-progress', ...this.STEPS.slice(2).map((s, k) => h(`i${k + 2 === this.i ? '.on' : k + 2 < this.i ? '.past' : ''}`)))
          : null),
      body,
      h('div.setup-foot',
        this.i > 0 ? h('button.btn.ghost', { onclick: () => this.go(this.i === 2 ? 1 : this.i - 1) }, icon('back'), 'Back') : null,
        h('span.grow'),
        this.err = h('div.ob-err'),
        this.nextBtn));
    this.afterRender && this.afterRender();
    this.afterRender = null;
  },

  async go(k) {
    if (k === this.i || k < 0 || k >= this.STEPS.length) return;
    if (k > this.i && !(await this.commit())) return;
    this.dir = k > this.i ? 1 : -1;
    this.i = k;
    this.animate = true;
    UISounds.click();
    this.render();
  },
  next() {
    if (this.last) this.finish();
    else this.go(this.i + 1);
  },
  /** Validate / save the current step before moving on. */
  async commit() {
    if (this.step.id === 'welcome') {
      const n = this.nameEl.value.trim();
      if (!n) { this.err.textContent = 'Type a name first.'; this.nameEl.focus(); return false; }
      if (n !== ProfileManager.profile.name) await ProfileManager.setName(n);
      Toolbar.updateProfile();
    }
    return true;
  },
  /** Close and land on the main menu. */
  async finish() {
    if (!(await this.commit())) return;
    const p = ProfileManager.profile;
    const first = !p.onboarded;
    p.onboarded = true;
    await ProfileManager.save();
    await Settings.flush();
    Toolbar.updateProfile();
    this.stopPreview();
    UISounds.click();
    const o = this.o;
    this.o = null;
    o.close();
    if (Screens.currentName !== 'home') Screens.go('home');
    if (first) Toast.show(`Welcome, ${p.name}!`, 'Change anything later in Settings (Ctrl+O).');
    this.resolve();
  },

  // ─────────────────────────────── steps ───────────────────────────────
  logo(cls = '') { return h(`div.setup-logo${cls}`, h('span.lz-cookie-disc', h('span.lz-cookie-text', 'ashtonk!', h('small', 'mania')))); },

  step_welcome() {
    const p = ProfileManager.profile;
    this.nameEl = h('input.input.ob-name', { value: p.onboarded || this.again ? p.name : '', placeholder: 'Your name', maxlength: 24, 'aria-label': 'Your name', autocomplete: 'nickname' });
    this.nameEl.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); this.next(); } });
    this.nameEl.addEventListener('input', () => { this.err.textContent = ''; });
    this.afterRender = () => setTimeout(() => this.nameEl && this.nameEl.focus(), 60);
    return [this.logo(), h('p.setup-lead', 'What should we call you?'), this.nameEl];
  },

  step_ask() {
    return [
      this.logo('.small'),
      h('p.setup-lead', `Hi ${ProfileManager.profile.name}! Want to set up the game now? It takes about 30 seconds.`),
      h('div.setup-choices.two',
        h('button.setup-choice.primary', { onclick: () => this.go(2) }, h('span.setup-choice-ic', icon('sparkle')), h('span.setup-choice-t', 'Set it up'), h('span.setup-choice-s', 'Pick your device, colours, speed and skin')),

  slider(k, label, min, max, step, fmt, after, evt = 'input') {

    const v = h('span.val');
    const upd = () => { const x = parseFloat(s.value); v.textContent = fmt(x); s.style.setProperty('--p', ((x - min) / (max - min) * 100) + '%'); };
    s.addEventListener('input', () => { if (evt === 'input') Settings.set(k, parseFloat(s.value)); upd(); after && after(); });
    if (evt === 'change') s.addEventListener('change', () => Settings.set(k, parseFloat(s.value)));
    s.addEventListener('keydown', e => e.stopPropagation());

  cleanup: [],
  stopPreview() {
    if (this.preview) { this.preview.stop(); this.preview = null; }
    for (const f of this.cleanup.splice(0)) try { f(); } catch { /* ignore */ }
  },
  /** A generated "beatmap background" for the gameplay preview, so dim and blur are visible even before any
   *  beatmap is installed. Cached as a data URL. */
  previewArt() {
    if (this._art) return this._art;
    const c = document.createElement('canvas'); c.width = 640; c.height = 360;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 640, 360);
    g.addColorStop(0, '#2b1055'); g.addColorStop(0.55, '#7a2d8c'); g.addColorStop(1, '#ff6a88');
    x.fillStyle = g; x.fillRect(0, 0, 640, 360);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 26; i++) {
      const r = 8 + rnd() * 46;
      x.fillStyle = `hsla(${280 + rnd() * 80}, 90%, ${60 + rnd() * 25}%, ${0.25 + rnd() * 0.5})`;
      x.beginPath(); x.arc(rnd() * 640, rnd() * 360, r, 0, Math.PI * 2); x.fill();
    }
    x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 3;
    for (let i = 0; i < 7; i++) { x.beginPath(); x.moveTo(-40 + i * 110, 360); x.lineTo(120 + i * 110, 0); x.stroke(); }
    x.fillStyle = '#fff'; x.font = '700 54px sans-serif'; x.textAlign = 'center';
    x.fillText('ashtonk!mania', 320, 200);
    this._art = c.toDataURL('image/jpeg', 0.85);
    return this._art;
  },
};

/* ===== 19-multiplayer.js ===== */
/* Online 1v1 multiplayer (osu!lazer-style room). Talks to the Worker's Durable Objects over a
 * WebSocket (/api/mp/room/<code>); see worker/multiplayer.js for the protocol and room rules. */

/** Mods that change the song's speed: in multiplayer they apply to the whole room, once everyone accepts. */
const MP_SPEED_MODS = ['DT', 'NC', 'HT', 'DC', 'RT'];

const Multiplayer = {
  ws: null, room: null, me: null, code: null, quick: false,
  chat: [], opp: null, lastResults: null, rtt: 80, _keep: 0,
  temp: new Set(),   // beatmap sets downloaded automatically for this room (removed again when leaving)
  fetch: null,       // {onlineSetId, progress, error, done} — the automatic download of the room's beatmap
  myDiffId: null,    // the difficulty (local map id) this player chose from the room's beatmap set

  available() { return /^https?:$/.test(location.protocol); },
  // (while reconnecting after a dropped connection the room stays on screen)
  inRoom() { return !!(this.room && (this.ws || this.reconnecting)); },
  isHost() { return !!this.room && this.room.host === this.me; },
  opponent() { return this.room ? this.room.players.find(p => p.id !== this.me) || null : null; },
  self() { return this.room ? this.room.players.find(p => p.id === this.me) || null : null; },

  async api(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `Server error (${r.status})`);
    return d;
  },
  async create() { const { code } = await this.api('api/mp/new'); return this.connect(code, true); },
  join(code) { return this.connect(String(code).trim().toUpperCase(), false); },
  /** Quick match: host a waiting room or join the one someone else is waiting in. */
  async quickMatch() {
    let last = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      const { code, host } = await this.api('api/mp/quick', { not: last });
      try { await this.connect(code, host, true); return; } catch (e) { if (host) throw e; last = code; }
    }
    throw new Error('Couldn\'t find a match — try again.');
  },

  connect(code, create, quick = false, rejoin = false) {
    if (!rejoin) this.leave(true);
    return new Promise((resolve, reject) => {
      const u = new URL(`api/mp/room/${encodeURIComponent(code)}`, location.href);
      u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
      let ws;
      try { ws = new WebSocket(u); } catch (e) { reject(e); return; }
      this.ws = ws; this.code = code; this.quick = quick; this.opp = null;
      if (!rejoin) { this.chat = []; this.lastResults = null; }
      let settled = false;
      const fail = msg => { if (!settled) { settled = true; reject(new Error(msg)); } };
      ws.onopen = () => { ws.send(JSON.stringify({ t: 'hello', name: ProfileManager.profile.name, create })); this.ping(); };
      ws.onmessage = ev => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.t === 'welcome') { this.me = m.you; this.room = m.room; settled = true; resolve(); this.startKeepAlive(); this.autoFetch(); Bus.emit('mp:changed'); return; }
        if (m.t === 'error' && m.fatal) { fail(m.msg); return; }
        this.onMessage(m);
      };
      ws.onerror = () => fail('Couldn\'t reach the multiplayer server.');
      ws.onclose = () => {
        fail('Connection closed.');
        if (this.ws !== ws) return; // left on purpose
        const wasIn = !!this.room;
        this.ws = null; this.stopKeepAlive();
        // dropped: quietly keep trying to get back in (the only notice is "Reconnected")
        if (wasIn) { this.startReconnect(); Bus.emit('mp:changed'); }
      };
    });
  },
  /** Rejoin the room after the connection dropped, retrying with backoff until it works or the player leaves.
   *  The server sees a fresh join, so this player's beatmap, difficulty and mods are sent again afterwards. */
  startReconnect() {
    if (this.reconnecting) return;
    const me = this.self();
    const rc = this.reconnecting = { code: this.code, quick: this.quick, tries: 0, create: false, mods: (me && me.mods) || [], diff: this.myDiffId, timer: 0 };
    const attempt = async () => {
      if (this.reconnecting !== rc) return;
      try {
        await this.connect(rc.code, rc.create, rc.quick, true);
        if (this.reconnecting !== rc) return;
        this.reconnecting = null;
        this.syncHasMap();
        if (rc.mods.length) this.send({ t: 'mods', mods: rc.mods });
        if (rc.diff) this.chooseDiff(rc.diff);
        Toast.ok('Reconnected to the room', rc.code);
        Bus.emit('mp:changed');
      } catch (e) {
        if (this.reconnecting !== rc) return;
        if (/not found/i.test(e.message)) rc.create = true; // everyone left meanwhile: open it again under the same code
        rc.tries++;
        rc.timer = setTimeout(attempt, Math.min(10000, 1000 * 2 ** Math.min(rc.tries, 4)));
      }
    };
    rc.timer = setTimeout(attempt, 600);
  },
  leave(silent = false) {
    if (this.reconnecting) { clearTimeout(this.reconnecting.timer); this.reconnecting = null; }
    this.stopKeepAlive();
    this.myDiffId = null; this.fetch = null;
    if (this.temp.size) this.cleanupTemp();
    if (this.quick && this.code && this.room && this.room.players.length < 2) this.api('api/mp/quick/cancel', { code: this.code }).catch(() => {});
    const ws = this.ws;
    this.ws = null; this.room = null; this.me = null; this.opp = null;
    if (ws) { try { ws.close(1000, 'leave'); } catch { /* already closed */ } }
    if (!silent) Bus.emit('mp:changed');
  },
  send(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
  ping() { this._pingAt = performance.now(); this.send({ t: 'ping', c: this._pingAt }); },
  startKeepAlive() {
    this.stopKeepAlive();
    this._keep = setInterval(() => {
      this.ping();
      if (this.quick && this.room && this.room.players.length < 2) this.api('api/mp/quick/keep', { code: this.code }).catch(() => {});
    }, 15000);
  },
  stopKeepAlive() { clearInterval(this._keep); this._keep = 0; },

  onMessage(m) {
    switch (m.t) {
      case 'room': {
        const hadOpp = !!this.opponent();
        const prevHash = this.room && this.room.map && this.room.map.hash;
        this.room = m.room;
        if ((m.room.map && m.room.map.hash) !== prevHash) this.myDiffId = null;
        this.syncHasMap();
        this.autoFetch();
        if (!hadOpp && this.opponent()) UISounds.click();
        Bus.emit('mp:changed');
        break;
      }
      case 'chat': this.chat.push(m); if (this.chat.length > 200) this.chat.shift(); Bus.emit('mp:chat', m); break;
      case 'pong': if (m.c === this._pingAt) this.rtt = performance.now() - m.c; break;
      case 'opp': this.opp = m; break;
      case 'start': this.launch(m); break;
      case 'skipvote': if (typeof GameplayScreen !== 'undefined') GameplayScreen.mpSkipVotes(m); break;
      case 'skip': if (typeof GameplayScreen !== 'undefined') GameplayScreen.mpSkip(); break;
      case 'results':
        this.lastResults = m.results;
        if (Screens.currentName === 'gameplay' && GameplayScreen.s && GameplayScreen.s.mp && !GameplayScreen.s.finished) {
          const won = m.results.winner === this.me;
          Toast.show(won ? 'Your opponent left — you win!' : 'Match ended', 'Finish the map or press Esc to return to the room.');
        }
        Bus.emit('mp:changed');
        break;
      case 'error': Toast.err(m.msg); break;
    }
  },

  /** The room's beatmap in the local library (by hash, else by osu! beatmap id). */
  localMap(map = this.room && this.room.map) {
    if (!map) return null;
    const byHash = BeatmapManager.mapByHash(map.hash);
    if (byHash && !byHash.problems.length) return byHash;
    if (map.onlineId > 0) for (const m of BeatmapManager.maps.values()) if (m.onlineId === map.onlineId && !m.problems.length) return m;
    return null;
  },
  /** The difficulty this player will play: their own pick from the room's set, else the host's. */
  myMap() {
    const local = this.localMap();
    if (!local) return null;
    const d = this.myDiffId && BeatmapManager.maps.get(this.myDiffId);
    return d && d.setId === local.setId && !d.problems.length ? d : local;
  },
  chooseDiff(mapId) {
    const d = BeatmapManager.maps.get(mapId), local = this.localMap();
    if (!d || !local || d.setId !== local.setId) return;
    this.myDiffId = d.id === local.id ? null : d.id;
    this.send({ t: 'diff', diff: this.myDiffId ? { version: d.version, stars: d.stars, keys: d.keys } : null });
    Bus.emit('mp:changed');
  },

  /** Download the room's beatmap straight away when this player doesn't have it. It's installed only for the
   *  room: `cleanupTemp()` removes it when they leave (unless they choose to keep it). */
  autoFetch() {
    const map = this.room && this.room.map;
    if (!map || this.isHost() || this.localMap(map) || !(map.onlineSetId > 0)) return;
    if (this.fetch && this.fetch.onlineSetId === map.onlineSetId && !this.fetch.error) return;
    const f = this.fetch = { onlineSetId: map.onlineSetId, progress: 0 };
    const before = new Set(BeatmapManager.sets.map(x => x.id));
    let last = 0;
    OnlineBeatmaps.downloadAndImport({ id: map.onlineSetId, title: map.title, artist: map.artist }, p => {
      f.progress = p;
      if (performance.now() - last > 150) { last = performance.now(); Bus.emit('mp:fetch', f); }
    }, { quiet: true }).then(report => {
      for (const set of report.sets) if (!before.has(set.id)) this.temp.add(set.id);
      this.saveTemp();
      f.done = true;
      if (this.fetch === f) Bus.emit('mp:changed');
    }).catch(e => { f.error = e.message; if (this.fetch === f) Bus.emit('mp:changed'); });
  },
  isTemp(map = this.room && this.room.map) { const l = this.localMap(map); return !!(l && this.temp.has(l.setId)); },
  keepTemp() { const l = this.localMap(); if (l) { this.temp.delete(l.setId); this.saveTemp(); Toast.ok('Kept in your library', `${l.artist} - ${l.title}`); Bus.emit('mp:changed'); } },
  saveTemp() { DB.kvSet('mp.tempSets', [...this.temp]).catch(() => {}); },
  /** Remove beatmaps that were only installed for a room (also run at startup, in case the tab was closed). */
  async cleanupTemp() {
    const ids = new Set([...this.temp, ...(await DB.kvGet('mp.tempSets', []).catch(() => []))]);
    this.temp.clear();
    await DB.kvSet('mp.tempSets', []).catch(() => {});
    for (const id of ids) {
      if (!BeatmapManager.setById.has(id)) continue;
      if (Music.meta && Music.meta.setId === id) Music.stop(0);
      await BeatmapManager.removeSet(id).catch(e => console.warn('temp cleanup', e));
    }
  },
  syncHasMap() {
    const me = this.self();
    if (!me || !this.room.map) return;
    const has = !!this.localMap();
    if (has !== me.hasMap) this.send({ t: 'hasMap', has });
  },
  /** This player's own mods; a speed mod (DT, HT…) in the list is proposed to the room instead. */
  setMods(list) {
    const speed = list.filter(x => MP_SPEED_MODS.includes(x)).slice(0, 1);
    this.send({ t: 'mods', mods: list.filter(x => !MP_SPEED_MODS.includes(x) && x !== 'AT') });
    const r = this.room, cur = r ? r.mods || [] : [];
    const pending = r && r.vote ? r.vote.mods : null;
    const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
    if (!same(speed, cur) && !(pending && same(speed, pending))) this.send({ t: 'rate', mods: speed, modConfig: ModSystem.config() });
  },
  vote(yes) { this.send({ t: 'vote', yes }); },
  selectMap(m, mods) {
    const set = BeatmapManager.setById.get(m.setId);
    this.send({ t: 'map', map: { hash: m.hash, title: m.title, artist: m.artist, version: m.version, creator: m.creator, keys: m.keys, stars: m.stars, length: m.length,
      onlineSetId: set && set.onlineId > 0 ? set.onlineId : -1, onlineId: m.onlineId > 0 ? m.onlineId : -1 }, mods: mods.filter(x => x !== 'AT'), modConfig: ModSystem.config() });
  },
  launch(m) {
    const local = this.localMap(m.map) && this.myMap();
    if (!local) { Toast.err('Missing beatmap', 'You need the beatmap to play this match.'); this.send({ t: 'quit' }); return; }
    this.opp = null;
    const startAt = performance.now() + m.delay - this.rtt / 2;
    // the room's speed mod (everyone accepted it) plus this player's own mods
    const mods = ModSystem.normalize([...(m.mods || []), ...((m.playerMods && m.playerMods[this.me]) || [])]);
    Game.launch({ mapId: local.id, mods, modConfig: m.modConfig ? { ...ModSystem.config(), ...m.modConfig } : null, mode: 'play', mp: { startAt } });
  },
  /** Invite link for the current room: opening it joins the room directly. */
  inviteLink() {
    const u = new URL(location.href);
    u.search = ''; u.hash = '';
    u.searchParams.set('join', this.room.code);
    return u.toString();
  },
  async invite() {
    const link = this.inviteLink(), text = `Join my Ashtonk!mania room (${this.room.code})`;
    // the share sheet where there is one (phones, some desktops), otherwise copy the link
    if (navigator.share) { try { await navigator.share({ title: 'Ashtonk!mania', text, url: link }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(link); Toast.ok('Invite link copied', 'Send it to your friend — opening it joins this room.'); }
    catch { Dialog.prompt('Invite link', link, { ok: 'Done' }); }
  },
  /** Opened from an invite link (?join=CODE): join that room once the game has started. */
  async joinFromLink() {
    const code = new URLSearchParams(location.search).get('join');
    if (!code) return;
    const u = new URL(location.href); u.searchParams.delete('join'); history.replaceState(null, '', u);
    if (!/^[A-Za-z0-9]{4,8}$/.test(code) || !this.available()) return;
    await Screens.go('multiplayer');
    try { await this.join(code); Toast.ok('Joined the room', code.toUpperCase()); }
    catch (e) { Toast.err('Couldn\'t join the room', friendlyError(e)); }
  },
  finish(score, forfeit = false) {
    this.send({ t: 'finish', result: { score: score.score, accuracy: score.accuracy, maxCombo: score.maxCombo, counts: score.counts, grade: score.grade, passed: score.passed, pp: score.pp, forfeit } });
  },
};

/** Who's online, for invites: one WebSocket to the Worker (/api/mp/presence) for the whole session, which
 *  reconnects on its own. Players show as in the menus, in a room or playing. */
const Presence = {
  ws: null, me: null, players: [], retry: 0, started: false,
  start() {
    if (this.started || !Multiplayer.available()) return;
    this.started = true;
    // only where the Worker serves multiplayer (a plain static copy has no /api)
    fetch('api/health', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.multiplayer) this.connect(); }).catch(() => {});
    const push = () => this.pushStatus();
    Bus.on('mp:changed', push); Bus.on('profile:changed', push); Bus.on('screen:changed', push);
  },
  status() { return Screens.currentName === 'gameplay' ? 'playing' : Multiplayer.inRoom() ? 'room' : 'menu'; },
  connect() {
    const u = new URL('api/mp/presence', location.href);
    u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws;
    try { ws = new WebSocket(u); } catch { this.later(); return; }
    this.ws = ws;
    ws.onopen = () => {
      this.retry = 0;
      this._sent = this.status(); this._name = ProfileManager.profile.name;
      ws.send(JSON.stringify({ t: 'hello', name: this._name, status: this._sent }));
      clearInterval(this._ping); this._ping = setInterval(() => this.send({ t: 'ping' }), 25000);
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === 'welcome') this.me = m.you;
      else if (m.t === 'online') { this.players = Array.isArray(m.players) ? m.players : []; Bus.emit('presence:changed'); }
      else if (m.t === 'invite') this.onInvite(m);
      else if (m.t === 'invited') Bus.emit('presence:invited', m.to);
      else if (m.t === 'error') Toast.err(m.msg);
    };
    ws.onclose = () => {
      if (this.ws !== ws) return;
      this.ws = null; this.players = []; clearInterval(this._ping);
      Bus.emit('presence:changed');
      this.later();
    };
  },
  later() { clearTimeout(this._t); this._t = setTimeout(() => this.connect(), Math.min(60000, 2000 * 2 ** this.retry++)); },
  send(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
  pushStatus() {
    const st = this.status(), name = ProfileManager.profile.name;
    if (st === this._sent && name === this._name) return;
    this._sent = st; this._name = name;
    this.send({ t: 'status', status: st, name });
  },
  others() { return this.players.filter(p => p.id !== this.me); },
  invite(id) { if (Multiplayer.inRoom()) this.send({ t: 'invite', to: id, code: Multiplayer.room.code }); },
  async onInvite(m) {
    const from = m.from && m.from.name || 'Someone';
    if (Multiplayer.inRoom() && Multiplayer.room.code === m.code) return;
    if (Screens.currentName === 'gameplay' && GameplayScreen.s && GameplayScreen.s.running) {
      Toast.show(`${from} invited you to their room`, `Room ${m.code} — join it from Multiplayer after this play.`);
      return;
    }
    UISounds.play('check-on');
    const ok = await Dialog.confirm(`${from} invited you!`, `Join their multiplayer room (${m.code})?${Multiplayer.inRoom() ? ' You\'ll leave your current room.' : ''}`, { ok: 'Join', cancel: 'Not now' });
    if (!ok) return;
    try { await Multiplayer.join(m.code); if (Screens.currentName !== 'multiplayer') await Screens.go('multiplayer'); Toast.ok('Joined the room', m.code); }
    catch (e) { Toast.err('Couldn\'t join the room', friendlyError(e)); }
  },
  /** The room's Invite button: invite someone who's online, or share a link. */
  openInvite() {
    if (!Multiplayer.inRoom()) return;
    const invited = new Set();
    const list = h('div.inv-list');
    const paint = () => {
      const others = this.others();
      clearEl(list).append(...(others.length ? others.map(p => {
        const busy = p.status === 'playing';
        const done = invited.has(p.id);
        return h('div.inv-row', h('span.inv-av', (p.name || '?').slice(0, 1).toUpperCase()),
          h('div.inv-who', h('b', p.name), h('small', p.status === 'playing' ? 'Playing' : p.status === 'room' ? 'In a room' : 'Online')),
          h(`button.btn.sm${done ? '' : '.primary'}`, { disabled: done || busy, onclick: () => { this.invite(p.id); invited.add(p.id); UISounds.click(); paint(); } }, done ? 'Invited' : 'Invite'));
      }) : [h('div.inv-empty', this.ws ? 'Nobody else is online right now.' : 'Connecting…')]));
    };
    paint();
    const off = Bus.on('presence:changed', paint);
    const o = Dialog.custom(`Invite to room ${Multiplayer.room.code}`, h('div.inv',
      h('div.inv-label', 'Online players'), list,
      h('div.inv-label', 'Or send a link'),
      h('button.btn.inv-link', { onclick: () => { Multiplayer.invite(); } }, icon('upload'), 'Copy invite link')), [{ label: 'Done' }]);
    const close = o.close; o.close = () => { off(); close(); };
  },
};

// Leaving the multiplayer area (anything but the room, song select, gameplay or results) leaves the room.
Bus.on('screen:changed', name => {
  if (Multiplayer.inRoom() && !['multiplayer', 'songselect', 'gameplay', 'results', 'explore'].includes(name)) { Multiplayer.leave(); Toast.show('Left the multiplayer room'); }
});
Bus.on('library:changed', () => Multiplayer.inRoom() && Multiplayer.syncHasMap());

const MultiplayerScreen = {
  tab: 'multiplayer',
  enter() {
    this.el = h('div.mp');
    this.body = h('div.mp-body');
    this.el.append(this.body, h('div.page-back', backButton(() => this.onBack() || Screens.back())));
    this._unsub = [Bus.on('mp:changed', () => this.render()), Bus.on('mp:chat', m => this.appendChat(m)), Bus.on('mp:fetch', () => this.updateFetch())];
    this.render();
    return this.el;
  },
  leave() { (this._unsub || []).forEach(f => f()); },
  onBack() {
    if (Multiplayer.inRoom()) {
      Dialog.confirm('Leave room?', 'You will leave this multiplayer room.', { ok: 'Leave' }).then(ok => { if (ok) { Multiplayer.leave(); } });
      return true;
    }
    return false;
  },
  onKey(e) { return false; },
  render() {
    if (!this.body) return;
    if (Multiplayer.inRoom()) { this.renderRoom(); return; }
    this.roomEl = null;
    clearEl(this.body);
    this.renderLobby();
  },

  // ── lobby: quick match / create / join
  renderLobby() {
    const status = h('div.mp-status');
    const busy = async (label, fn) => {
      clearEl(status).append(h('span.spinner'), label);
      $$('button', this.body).forEach(b => b.disabled = true);
      try { await fn(); } catch (e) { clearEl(status).append(h('span.mp-err', e.message)); $$('button', this.body).forEach(b => b.disabled = false); }
    };
    const code = h('input.input.mp-code', { placeholder: 'ROOM CODE', maxlength: 8, spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Room code' });
    code.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') joinBtn.click(); });
    code.addEventListener('input', () => { code.value = code.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
    const joinBtn = h('button.btn', { onclick: () => code.value.length >= 4 && busy('Joining room…', () => Multiplayer.join(code.value)) }, 'Join');
    const card = (ic, title, sub, ...rest) => h('div.mp-card', h('div.mp-card-ico', icon(ic)), h('div.mp-card-t', title), h('div.mp-card-s', sub), ...rest);
    const offline = !Multiplayer.available();
    this.body.append(h('div.mp-lobby',
      h('h1', 'Multiplayer'), h('div.mp-sub', 'Play the same beatmap head-to-head against one other player.'),
      offline ? h('div.mp-note', 'Multiplayer needs the online server — open the game from its web address (the Cloudflare deployment).') : null,
      h('div.mp-cards',
        card('shuffle', 'Quick match', 'Get paired with the next player who is looking for a match.',
          h('button.btn.primary', { disabled: offline, onclick: () => busy('Looking for an opponent…', () => Multiplayer.quickMatch()) }, 'Find match')),
        card('plus', 'Create room', 'Make a private room and send the code to a friend.',
          h('button.btn', { disabled: offline, onclick: () => busy('Creating room…', () => Multiplayer.create()) }, 'Create')),
        card('multi', 'Join room', 'Enter the code your friend gave you.',
          h('div.row', code, joinBtn))),
      status));
    if (offline) $$('button', this.body).forEach(b => b.disabled = true);
  },

  // ── room: the chat panel is built once per room and survives updates, so a half-typed message is
  //    never wiped when the other player readies up.
  renderRoom() {
    const r = Multiplayer.room;
    if (!this.roomEl || !this.roomEl.isConnected || this.roomCode !== r.code) this.buildRoom();
    this.refreshRoom();
  },
  buildRoom() {
    const r = Multiplayer.room;
    this.roomCode = r.code;
    clearEl(this.body);
    this.headEl = h('div.mp-head'); this.resEl = h('div'); this.mapEl = h('div'); this.playersEl = h('div'); this.footEl = h('div.mp-footer');
    // chat
    this.chatList = h('div.mp-chat-list');
    for (const m of Multiplayer.chat) this.appendChat(m, false);
    const input = h('input.input', { placeholder: 'Type a message…', maxlength: 300, 'aria-label': 'Chat message' });
    input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && input.value.trim()) { Multiplayer.send({ t: 'chat', text: input.value }); input.value = ''; } if (e.key === 'Escape') input.blur(); });
    const chat = h('div.mp-tabpane', this.chatList, input);
    const side = h('div.mp-side', h('div.mp-tabs', h('span.mp-tab.on', 'Chat')), chat);
    this.roomEl = h('div.mp-room', this.headEl, this.resEl, h('div.mp-grid', h('div.mp-left', this.mapEl, this.playersEl), side));
    this.body.append(this.roomEl, this.footEl);
    requestAnimationFrame(() => { if (this.chatList) this.chatList.scrollTop = this.chatList.scrollHeight; });
  },
  refreshRoom() {
    const r = Multiplayer.room, me = Multiplayer.self(), opp = Multiplayer.opponent(), host = Multiplayer.isHost();
    const copy = h('button.btn.sm', { onclick: () => { navigator.clipboard && navigator.clipboard.writeText(r.code); Toast.ok('Room code copied', r.code); } }, icon('save'), 'Copy code');
    const invite = h('button.btn.sm.primary.mp-invite', { title: 'Invite someone who\'s online, or share a link', onclick: () => { UISounds.click(); Presence.openInvite(); } }, icon('multi'), 'Invite');
    const reconnecting = Multiplayer.reconnecting ? h('span.mp-reconnecting', h('span.spinner'), 'Reconnecting…') : null;
    clearEl(this.headEl).append(h('div', h('div.mp-room-label', Multiplayer.quick ? 'Quick match' : 'Room'), h('div.mp-room-code', r.code)), reconnecting, h('div.grow'), invite, copy);

    // beatmap panel
    const map = r.map, local = map ? Multiplayer.localMap(map) : null;
    const bg = h('div.mp-map-bg');
    if (local) BeatmapManager.bgURL(local).then(u => u && (bg.style.backgroundImage = `url("${u}")`));
    else if (map && map.onlineSetId > 0) bg.style.backgroundImage = `url("${OnlineBeatmaps.coverURL(map.onlineSetId, 'cover')}")`;
    const mapInfo = map ? [h('div.mp-map-t', map.title), h('div.mp-map-a', map.artist), h('div.mp-map-d', starBadge(map.stars), h('span', map.version), h('span.keys-tag', `${map.keys}K`),
      ...(r.mods || []).map(m => ModSystem.badge(m, true)))] : [h('div.mp-map-t', 'No beatmap selected'), h('div.mp-map-a', host ? 'Pick one from song select or search beatmaps.' : 'Waiting for the host to pick a beatmap — you can search beatmaps and suggest one.')];
    const mapActions = h('div.mp-map-actions');
    if (host) mapActions.append(h('button.btn', { onclick: () => Screens.go('songselect', { mpPick: true }) }, icon('music'), map ? 'Change beatmap' : 'Select beatmap'));
    // the real Browse screen (Beatmap Explorer), in "pick for this room" mode
    mapActions.append(h('button.btn', { onclick: () => Screens.go('explore', { mpPick: true }) }, icon('search'), 'Search beatmaps'));
    const status = h('div.mp-map-status');
    this.fetchEl = null;
    if (map && !local) {
      const f = Multiplayer.fetch;
      if (!(map.onlineSetId > 0)) status.append(h('span.mp-warn', 'You don\'t have this beatmap and it has no online ID — import it to play.'));
      else if (f && f.onlineSetId === map.onlineSetId && f.error) status.append(h('span.mp-warn', `Download failed: ${f.error}`), h('button.btn.sm', { onclick: () => { Multiplayer.fetch = null; Multiplayer.autoFetch(); this.refreshRoom(); } }, 'Retry'));
      else { this.fetchEl = h('span'); status.append(h('span.spinner'), this.fetchEl); this.updateFetch(); }
    } else if (local && Multiplayer.isTemp(map)) {
      status.append(h('span.mp-temp', 'Installed for this room — removed when you leave'), h('button.btn.sm', { onclick: () => Multiplayer.keepTemp() }, 'Keep'));
    }
    // each player chooses their own difficulty from the room's beatmap set
    let diffPick = null;
    if (local) {
      const set = BeatmapManager.setById.get(local.setId);
      const diffs = set ? set.maps.filter(m => !m.problems.length).sort((a, b) => a.stars - b.stars) : [local];
      const mine = Multiplayer.myMap() || local;
      // a set with a single difficulty has nothing to choose (the picker would only look like it does something)
      if (diffs.length > 1) {
        const sel = h('select.select', { 'aria-label': 'Your difficulty' }, ...diffs.map(m => h('option', { value: m.id, selected: m.id === mine.id }, `${m.version} · ${m.keys}K · ★${m.stars.toFixed(2)}${m.id === local.id ? ' (room)' : ''}`)));
        sel.addEventListener('change', () => { UISounds.click(); Multiplayer.chooseDiff(sel.value); });
        sel.addEventListener('keydown', e => e.stopPropagation());
        diffPick = h('label.mp-diff', h('span', 'Your difficulty'), sel);
      }
    }
    // mods: the room's speed (DT, HT… — everyone must accept) and this player's own mods
    const myMods = (me && me.mods) || [];
    const badges = (list, none) => list.length ? list.map(m => ModSystem.badge(m, true)) : [h('span.mp-none', none)];
    const modsRow = h('div.mp-mods',
      h('div.mp-modline', h('span.mp-modlabel', 'Speed'), ...badges(r.mods || [], 'Normal')),
      h('div.mp-modline', h('span.mp-modlabel', 'Your mods'), ...badges(myMods, 'None')),
      h('span.grow'),
      h('button.btn.sm.mp-mods-btn', { onclick: () => this.openMods() }, icon('mods'), 'Mods'));
    let voteEl = null;
    if (r.vote) {
      const by = r.players.find(p => p.id === r.vote.by), what = r.vote.mods.length ? r.vote.mods.join('') : 'no speed mods';
      const mine = r.vote.yes.includes(Multiplayer.me);
      voteEl = h('div.mp-vote', icon('mods'),
        mine ? h('span', `Waiting for everyone to accept ${what} (${r.vote.yes.length}/${r.players.length})`)
          : h('span', h('b', by ? by.name : 'Someone'), ` wants to play with ${what}`),
        h('span.grow'),
        mine ? null : h('button.btn.sm.primary.mp-accept', { onclick: () => { UISounds.click(); Multiplayer.vote(true); } }, 'Accept'),
        mine ? null : h('button.btn.sm.mp-decline', { onclick: () => { UISounds.click(); Multiplayer.vote(false); } }, 'Decline'));
    }
    clearEl(this.mapEl).append(h('div.mp-map', bg, h('div.mp-map-body', ...mapInfo, diffPick, modsRow, voteEl, mapActions, status.childNodes.length ? status : null)));

    // players
    const slot = p => {
      if (!p) return h('div.mp-player.empty', h('div.mp-avatar', icon('user')), h('div.mp-pname', 'Waiting for an opponent…'), h('span.spinner'));
      const isMe = p.id === Multiplayer.me;
      const state = !r.map ? '' : !p.hasMap ? 'Missing beatmap' : p.ready ? 'Ready' : 'Not ready';
      return h(`div.mp-player${p.ready ? '.ready' : ''}`,
        isMe ? ProfileManager.avatarEl(44) : h('div.avatar.avatar-mono', { style: { width: '44px', height: '44px', fontSize: '20px' } }, (p.name || '?').slice(0, 1).toUpperCase()),
        h('div', h('div.mp-pname', p.name, isMe ? h('span.muted', ' (you)') : null, p.id === r.host ? h('span.mp-host', 'HOST') : null),
          r.map ? h('div.mp-pdiff', p.diff ? `${p.diff.version} · ★${p.diff.stars.toFixed(2)}` : `${r.map.version} · ★${r.map.stars.toFixed(2)}`,
            ...(p.mods || []).map(m => ModSystem.badge(m, true))) : null),
        h('span.grow'), state ? h(`span.mp-state${p.ready ? '.on' : !p.hasMap ? '.warn' : ''}`, state) : null);
    };
    clearEl(this.playersEl).append(h('div.mp-players', h('h3', 'Players'), slot(me), slot(opp)));

    clearEl(this.resEl);
    if (Multiplayer.lastResults) this.resEl.append(this.resultsPanel(Multiplayer.lastResults));

    const allReady = r.players.length === 2 && r.players.every(p => p.ready && p.hasMap);
    const readyBtn = h(`button.mp-ready${me && me.ready ? '.on' : ''}`, {
      disabled: !r.map || !me || !me.hasMap,
      onclick: () => { UISounds.click(); Multiplayer.send({ t: 'ready', ready: !(me && me.ready) }); },
    }, me && me.ready ? 'Not ready' : 'Ready');
    const startBtn = host ? h('button.mp-start', { disabled: !allReady || !!r.vote, title: r.vote ? 'Everyone has to accept or decline the speed mod first' : allReady ? '' : 'Both players must be ready', onclick: () => { UISounds.click(); Multiplayer.send({ t: 'start' }); } }, 'Start match') : null;
    clearEl(this.footEl).append(...[h('div.grow'), readyBtn, startBtn].filter(Boolean));
  },

  /** The mod select, for this player's mods in the room; a speed mod picked there is proposed to the room. */
  openMods() {
    const r = Multiplayer.room, me = Multiplayer.self();
    if (!r) return;
    Settings.set('songselect.mods', ModSystem.normalize([...(r.mods || []), ...((me && me.mods) || [])]));
    const off = Bus.on('mods:changed', () => { off(); if (Multiplayer.inRoom()) Multiplayer.setMods(Settings.get('songselect.mods') || []); });
    ModSelect.open();
  },
  updateFetch() {
    const f = Multiplayer.fetch;
    if (this.fetchEl && f) this.fetchEl.textContent = ` Downloading the beatmap for this room… ${f.progress != null ? Math.round(f.progress * 100) + '%' : ''}`;
  },
  appendChat(m, scroll = true) {
    if (!this.chatList || !this.chatList.isConnected && scroll) return;
    let el;
    if (m.suggest) {
      const map = m.suggest;
      const pick = Multiplayer.isHost() ? h('button.btn.sm.primary', { onclick: async () => {
        pick.disabled = true;
        try {
          let local = Multiplayer.localMap(map);
          if (!local && map.onlineSetId > 0) { pick.textContent = 'Downloading…'; await OnlineBeatmaps.downloadAndImport({ id: map.onlineSetId, title: map.title, artist: map.artist }); local = Multiplayer.localMap(map); }
          if (!local) throw new Error('Beatmap not available.');
          Multiplayer.selectMap(local, Settings.get('songselect.mods') || []);
        } catch (e) { Toast.err('Couldn\'t pick that beatmap', e.message); }
        pick.disabled = false; pick.textContent = 'Pick';
      } }, 'Pick') : null;
      el = h('div.mp-msg.suggest', h('b', m.name), h('span', 'suggested ', h('i', `${map.artist} - ${map.title} [${map.version}]`)), pick);
    } else el = m.from ? h('div.mp-msg', h('b', m.name), h('span', m.text)) : h('div.mp-msg.sys', m.text);
    this.chatList.append(el);
    if (scroll) this.chatList.scrollTop = this.chatList.scrollHeight;
  },
  resultsPanel(res) {
    const meId = Multiplayer.me;
    const verdict = res.winner === null ? 'Draw' : res.winner === meId ? 'You win!' : 'You lose';
    const row = x => h(`div.mp-res-row${x.id === res.winner ? '.win' : ''}`,
      x.pending ? h('span.grade', '—') : gradeEl(x.forfeit ? 'F' : x.grade || 'D'),
      h('div.main', h('div.t', x.name, x.id === meId ? h('span.muted', ' (you)') : null), h('div.s', x.forfeit ? (x.left ? 'left the match' : 'forfeited') : x.pending ? 'won by forfeit' : `${fmtScore(x.score)} · ${fmtAcc(x.accuracy)} · ${fmtInt(x.maxCombo)}x${x.diff ? ` · ${x.diff.version}` : res.map ? ` · ${res.map.version}` : ''}`)),
      h('div.mp-res-score', `${fmtInt(x.pp || 0)}pp`));
    return h(`div.mp-results.${res.winner === null ? 'draw' : res.winner === meId ? 'won' : 'lost'}`,
      h('div.mp-verdict', verdict, h('button.icon-btn', { title: 'Dismiss', onclick: () => { Multiplayer.lastResults = null; clearEl(this.resEl); } }, icon('x'))),
      ...res.rows.map(row));
  },
};

/* ===== 20-app.js ===== */
/* Application — boot sequence, global input routing, drag & drop importing. */

/** Version of public/skins/kori.osk: 2 added its health bar (scorebar-bg / scorebar-colour). */
const BUNDLED_KORI_VERSION = 2;

const App = {
  lastReport: null,
  async boot() {
    const status = $('.load-status');
    const say = (msg) => { status.textContent = msg; };
    // each step on its own, so one broken record can't leave the rest of the library unloaded
    const failed = [];
    const step = async (label, fn) => { try { await fn(); } catch (e) { console.error(label, e); failed.push(label); } };
    say('Opening library…');
    await step('storage', () => DB.open());
    await step('settings', () => Settings.load());
    say('Loading skin…');
    await step('skins', () => SkinManager.init());
    if (!SkinManager.current) { SkinManager.defaultSkin = SkinManager.defaultSkin || new DefaultSkin(); SkinManager.current = SkinManager.defaultSkin; }
    await step('the bundled skin', () => this.installBundledSkin(say));
    say('Loading beatmaps…');
    await step('beatmaps', () => BeatmapManager.init());
    await BeatmapManager.pruneUnplayable().catch(e => console.warn('prune', e)); // older versions kept them
    await Multiplayer.cleanupTemp().catch(() => {}); // beatmaps installed only for a room that wasn't left cleanly
    await Promise.all([['scores', ScoreManager], ['replays', ReplayManager], ['favourites', Favorites], ['collections', Collections], ['profile', ProfileManager], ['beatmap offsets', MapOffsets]]
      .map(([label, m]) => step(label, () => m.init())));
    say('Preparing stage…');
    AudioManager.init();
    Zoom.init();
    Toolbar.build();
    Screens.register('home', HomeScreen);
    Screens.register('songselect', SongSelect);
    Screens.register('gameplay', GameplayScreen);
    Screens.register('results', ResultsScreen);
    Screens.register('beatmaps', BeatmapsScreen);
    Screens.register('explore', ExplorerScreen);
    Screens.register('multiplayer', MultiplayerScreen);
    Screens.register('collections', CollectionsScreen);
    Screens.register('profile', ProfileScreen);
    Screens.register('stats', ProfileScreen);
    Screens.register('replays', ReplaysScreen);
    Screens.register('skins', SkinsScreen);
    this.bindGlobal();
    VolumeOverlay.bind();
    window.AshtonkMania = { MapOffsets, Onboarding, Presence, NeruMascot, App, DB, Settings, ProfileManager, OsuMath, ExplorerScreen, OnlineBeatmaps, BeatmapManager, SkinManager, ScoreManager, ReplayManager, Music, AudioManager, Screens, GameplayScreen, SongSelect, BeatmapParser, Collections, Favorites, SettingsPanel, ModSelect, MenuMusic, NowPlaying, Multiplayer, MultiplayerScreen, Zoom, healthModeFor, SkinHealthBar, friendlyError };
    try { await Screens.go('home'); }
    catch (e) { console.error(e); Toast.err('The main menu failed to load', e.message); }
    await sleep(250);
    $('#loading-screen').classList.add('done');
    if (DB.memory) Toast.show('Storage is blocked', 'This browser isn\'t letting the game save anything here (private window or blocked site data?). You can play, but beatmaps, scores and settings are lost when the tab closes.', { type: 'err', timeout: 20000 });
    else if (failed.length) Toast.err('Some saved data could not be loaded', `Problem with: ${failed.join(', ')}. Everything else works; Settings → Maintenance can export or reset your data.`);
    this.globalLoop();
    this.initPWA();
    if (!ProfileManager.profile.onboarded) await Onboarding.run();
    Multiplayer.joinFromLink();
    Presence.start();
    setTimeout(() => BeatmapManager.migrateStarRatings().catch(e => console.warn('SR migration', e)), 1500);
    Bus.on('profile:changed', () => Toolbar.updateProfile());
    Bus.on('skin:changed', s => Toast.show('Skin changed', s.name));
  },

  /** Kori 3.0 ships with the client (public/skins/kori.osk, mania assets only) and is installed and selected
   *  on first launch. A skin dropped in as skins/default.osk takes priority. Runs once per browser; deleting
   *  Kori afterwards is respected. Needs http(s) — browsers block fetch() from file://. */
  async installBundledSkin(say) {
    if (!/^https?:/.test(location.protocol)) return;
    if (await DB.kvGet('bundled.kori', false)) { await this.upgradeBundledSkin(); return; }
    const existing = SkinManager.skins.find(sk => /kori/i.test(sk.name));
    if (existing) {
      await DB.kvSet('bundled.kori', true);
      if (SkinManager.current.builtin) await SkinManager.select(existing.id, { silent: true });
      return;
    }
    for (const name of ['skins/default.osk', 'skins/kori.osk', 'public/skins/kori.osk', 'skins/Kori 3.0.osk']) {
      try {
        const r = await fetch(encodeURI(name), { cache: 'no-cache' });
        if (!r.ok) continue;
        const blob = await r.blob();
        if (blob.size < 1000 || !/zip|octet|osk/i.test(r.headers.get('content-type') || 'zip')) continue;
        say('Installing Kori 3.0…');
        const meta = await SkinManager.importOsk(new File([blob], name.split('/').pop()));
        if (SkinManager.current.builtin || name === 'skins/default.osk') await SkinManager.select(meta.id, { silent: true });
        await DB.kvSet('bundled.kori', true);
        await DB.kvSet('bundled.kori.v', BUNDLED_KORI_VERSION);
        return;
      } catch (e) { /* not bundled */ }
    }
  },

  /** Copies of the bundled Kori installed before version 2 lack its health bar (scorebar-*): add those files once. */
  async upgradeBundledSkin() {
    if ((await DB.kvGet('bundled.kori.v', 1)) >= BUNDLED_KORI_VERSION) return;
    try {
      const kori = SkinManager.skins.find(sk => (sk.source === 'kori.osk' || /kori 3\.0$/i.test(sk.name || '')) && !sk.files.some(f => /^scorebar-colour/i.test(f)));
      if (kori) {
        const r = await fetch('skins/kori.osk', { cache: 'no-cache' });
        if (!r.ok) return; // try again next launch
        const zip = new ZipReader(await r.arrayBuffer());
        const files = [];
        for (const e of zip.entries) if (/^scorebar-[^/]+\.png$/i.test(e.name)) files.push({ rel: e.name, data: await zip.read(e) });
        await SkinManager.addFiles(kori.id, files);
      }
      await DB.kvSet('bundled.kori.v', BUNDLED_KORI_VERSION);
    } catch (e) { /* offline or blocked: try again next launch */ }
  },

  bindGlobal() {
    // anything that slips through: log it and tell the player (at most every 10 s, and never mid-play)
    let lastErr = -1e9;
    const report = err => {
      const e = err && (err instanceof Error || err.message) ? err : new Error(String(err));
      if (/ResizeObserver loop|^Script error\.?$|play\(\) request was interrupted/i.test(e.message || '') || /^(AbortError|NotAllowedError)$/.test(e.name)) return;
      console.error(e);
      const now = performance.now();
      if (now - lastErr < 10000 || (Screens.current === GameplayScreen && GameplayScreen.s && GameplayScreen.s.running)) return;
      lastErr = now;
      Toast.err('Something went wrong', friendlyError(e));
    };
    window.addEventListener('error', ev => { if (ev.error || ev.message) report(ev.error || ev.message); });
    window.addEventListener('unhandledrejection', ev => report(ev.reason));
    const resume = () => AudioManager.resume();
    window.addEventListener('pointerdown', resume, { capture: true });
    window.addEventListener('keydown', resume, { capture: true });
    window.addEventListener('pointermove', e => Background.parallax(e), { passive: true });
    window.addEventListener('keydown', e => this.onKey(e));
    window.addEventListener('contextmenu', e => { if (!e.target.closest('input, textarea')) e.preventDefault(); });
    // hiding the tab pauses a solo play (a match keeps going, like losing focus)
    document.addEventListener('visibilitychange', () => { if (document.hidden && Screens.current === GameplayScreen && GameplayScreen._blur) GameplayScreen._blur(); });
    // hover sounds for all buttons
    document.addEventListener('pointerover', e => { const b = e.target.closest && e.target.closest('.btn, .chip, .tb-btn, .side-item, .lb-row, .list-row button'); if (b && !b.contains(e.relatedTarget)) UISounds.hover(); });
    // drag & drop
    let depth = 0;
    const ov = $('#drop-overlay');
    const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
    window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; ov.classList.add('show'); });
    window.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) ov.classList.remove('show'); });
    window.addEventListener('drop', async e => {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0; ov.classList.remove('show');
      if (Screens.current === GameplayScreen && GameplayScreen.s && GameplayScreen.s.running) { Toast.show('Finish or pause your play before importing'); return; }
      const files = await filesFromDataTransfer(e.dataTransfer);
      this.importFiles(files);
    });
  },

  onKey(e) {
    const top = Overlays.top();
    if (top) {
      if (top.onKey && top.onKey(e)) { e.preventDefault(); return; }
      if (e.key === 'Escape') { e.preventDefault(); top.close(); return; }
      if (e.target.closest && e.target.closest('input, textarea, select')) return;
    }
    // global shortcuts
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyO') { e.preventDefault(); SettingsPanel.toggle(); return; }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyD') { e.preventDefault(); const v = !Settings.get('debug.overlay'); Settings.set('debug.overlay', v); Toast.show(v ? 'Debug overlay enabled' : 'Debug overlay disabled', 'Ctrl+Shift+D'); return; }
    if (e.altKey && e.code === 'Enter') { e.preventDefault(); toggleFullscreen(); return; }
    if (Screens.current === GameplayScreen) return; // gameplay handles its own input (capture listener)
    if (top) return;
    const inField = e.target.closest && e.target.closest('input, textarea, select');
    if (Screens.current && Screens.current.onKey && Screens.current.onKey(e)) { e.preventDefault(); return; }
    if (inField) return;
    if (e.key === 'Escape') { e.preventDefault(); Screens.back(); return; }
  },

  async importFiles(files) {
    if (!files || !files.length) return;
    await AudioManager.resume();
    const pill = h('div.import-pill', h('span.spinner'), h('span', 'Importing…'));
    $('#app').appendChild(pill);
    const off = Bus.on('import:status', m => { if (m) pill.lastChild.textContent = m; });
    let report;
    try { report = await BeatmapManager.importFiles(files); }
    catch (e) { report = { sets: [], skins: [], replays: [], errors: [friendlyError(e)], warnings: [] }; }
    finally { off(); pill.remove(); }
    this.lastReport = report;
    Bus.emit('import:report', report);
    const parts = [];
    if (report.sets.length) parts.push(`${plural(report.sets.length, 'beatmap set')} (${plural(report.sets.reduce((a, s) => a + s.maps.length, 0), 'difficulty', 'difficulties')})`);
    if (report.skins.length) parts.push(`skin ${report.skins.map(s => s.name).join(', ')}`);
    if (report.replays.length) parts.push(`${report.replays.length} replay${report.replays.length === 1 ? '' : 's'}`);
    if (report.data) parts.push('data backup');
    if (parts.length) Toast.ok('Imported ' + parts.join(', '));
    if (report.errors.length) Toast.err(`Import problem${report.errors.length === 1 ? '' : 's'}`, report.errors.slice(0, 6).join('\n') + (report.errors.length > 6 ? `\n…and ${report.errors.length - 6} more` : ''));
    if (report.sets.length || report.skins.length) this.keepStorage();
    if (report.skins.length) await SkinManager.select(report.skins[report.skins.length - 1].id);
    if (report.data) Toolbar.updateProfile();
    const firstSet = report.sets.find(s => s.maps.some(m => !m.problems.length));
    if (firstSet) {
      const map = firstSet.maps.find(m => !m.problems.length);
      SongSelect.selectedId = map.id;
      Settings.set('last.map', map.id);
      if (Screens.currentName === 'songselect') SongSelect.select(map.id);
      else if (Screens.currentName === 'home') Screens.go('songselect', { mapId: map.id }, { transition: 'zoom' });
    }
    return report;
  },

  /** Installable, offline-capable app: the service worker (public/sw.js) keeps the game for offline play,
   *  the manifest lets browsers install it, and the installed app opens .osz / .osk / .amr files directly. */
  installPrompt: null,
  initPWA() {
    if ('serviceWorker' in navigator && window.isSecureContext && /^https?:/.test(location.protocol))
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e));
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); this.installPrompt = e; Bus.emit('install:available', true); });
    window.addEventListener('appinstalled', () => { this.installPrompt = null; Bus.emit('install:available', false); Toast.ok('Ashtonk!mania installed', 'Open it from your apps — it works offline too.'); });
    if ('launchQueue' in window) window.launchQueue.setConsumer(async params => {
      if (!params.files || !params.files.length) return;
      const files = await Promise.all(params.files.map(f => f.getFile()));
      this.importFiles(files);
    });
  },
  get installed() { return ['fullscreen', 'standalone', 'minimal-ui'].some(m => window.matchMedia && matchMedia(`(display-mode: ${m})`).matches); },
  async install() {
    const p = this.installPrompt;
    if (!p) return false;
    this.installPrompt = null;
    p.prompt();
    const r = await p.userChoice.catch(() => null);
    Bus.emit('install:available', false);
    return !!(r && r.outcome === 'accepted');
  },

  /** Once there's a library worth keeping, ask the browser not to evict it when disk space runs low
   *  (Chrome decides silently; Firefox asks once). */
  async keepStorage() {
    try {
      if (DB.memory || !navigator.storage || !navigator.storage.persisted || await navigator.storage.persisted()) return;
      if (await DB.kvGet('storage.persistAsked', false)) return;
      await DB.kvSet('storage.persistAsked', true);
      await DB.persist();
    } catch (e) { /* not supported */ }
  },

  globalLoop() {
    const dbg = h('div.debug-overlay', { hidden: true });
    $('#app').appendChild(dbg);
    let lastDbg = 0;
    const tick = now => {
      requestAnimationFrame(tick);
      // (only write `hidden` when it changes: an attribute write every frame forces a style pass every frame)
      if (Screens.current === GameplayScreen) { if (!dbg.hidden) dbg.hidden = true; return; }
      FPS.frame(now);
      const on = Settings.get('debug.overlay');
      if (dbg.hidden === on) dbg.hidden = !on;
      if (on && now - lastDbg > 250) {
        lastDbg = now;
        const ctx = AudioManager.ctx;
        dbg.textContent =
`ASHTONK!MANIA DEBUG  (Ctrl+Shift+D)
Screen       ${Screens.currentName}
FPS          ${FPS.fps.toFixed(0)} (${FPS.frameMs.toFixed(2)}ms)
Audio        ${ctx ? ctx.state : 'n/a'} · ${ctx ? ctx.sampleRate + 'Hz' : ''} · out ${ctx ? ((ctx.outputLatency || ctx.baseLatency || 0) * 1000).toFixed(1) : 0}ms
Music        ${Music.playing ? 'playing' : 'stopped'} @ ${Music.time.toFixed(0)}ms / ${Music.duration.toFixed(0)}ms
Library      ${BeatmapManager.sets.length} sets · ${BeatmapManager.maps.size} diffs
Scores       ${ScoreManager.scores.length} · replays ${ReplayManager.list.length}
Skin         ${SkinManager.current.name}${SkinManager.prefer2x() ? ' (@2x)' : ''}
DPR          ${devicePixelRatio} · ${innerWidth}×${innerHeight}
Memory       ${performance.memory ? fmtBytes(performance.memory.usedJSHeapSize) : 'n/a'}`;
      }
    };
    requestAnimationFrame(tick);
  },
};

window.addEventListener('DOMContentLoaded', () => App.boot());

</script>
