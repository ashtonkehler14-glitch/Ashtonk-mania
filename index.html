<!doctype html>
<html lang="en" data-theme="lazer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#18171c">
<title>Ashtonk!mania</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff66ab' stroke='%23fff' stroke-width='6'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ashtonk!mania">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ───────────────────────── Ashtonk!mania — client styles ───────────────────────── */
:root {
  --ui-scale: 1;
  --anim: 1;
  /* osu!lazer colour scheme (OverlayColourProvider "purple" + OsuColour pink) */
  --bg: #18171c;
  --bg-2: #24222a;
  --panel: rgba(36, 34, 42, 0.94);
  --panel-solid: #24222a;
  --panel-2: #302e38;
  --panel-3: #3d3946;
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.13);
  --text: #ffffff;
  --text-2: #e0dbf0;
  --muted: #948fa3;
  --accent: #aa88ff;
  --accent-2: #7d3cff;
  --accent-3: #d9c2ff;
  --accent-rgb: 170, 136, 255;
  --gold: #ffcc22;
  --gold-2: #ee9900;
  --good: #88b300;
  --bad: #ed1121;
  --blue: #66ccff;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  --t-fast: calc(120ms * var(--anim));
  --t-med: calc(260ms * var(--anim));
  --t-slow: calc(480ms * var(--anim));
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --toolbar-h: 40px;
  font-size: calc(16px * var(--ui-scale));
}
/* Accent themes only change the highlight colour; the osu!lazer layout and greys stay the same. */
:root[data-theme="neru"] { --accent: #ffcf3a; --accent-2: #e6a800; --accent-3: #fff1b8; --accent-rgb: 255, 207, 58; }
:root[data-theme="teto"] { --accent: #ff4d6a; --accent-2: #d0213d; --accent-3: #ffc7d0; --accent-rgb: 255, 77, 106; }
:root[data-theme="miku"] { --accent: #39c5bb; --accent-2: #139a90; --accent-3: #bff4ef; --accent-rgb: 57, 197, 187; }
:root[data-theme="midnight"] { --accent: #66ccff; --accent-2: #2f7fff; --accent-3: #c6e2ff; --accent-rgb: 102, 204, 255; }
:root[data-theme="kori"] { --accent: #aa88ff; --accent-2: #7d3cff; --accent-3: #d9c2ff; --accent-rgb: 170, 136, 255; }
:root[data-theme="neru"] .btn.primary { color: #2a1d00; }
:root.no-anim *, :root.no-anim *::before, :root.no-anim *::after { transition: none !important; animation-duration: 1ms !important; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body {
  font-family: "Torus", "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-weight: 400; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
input, textarea, select { user-select: text; -webkit-user-select: text; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
::selection { background: rgba(var(--accent-rgb), .4); }
/* Scrollbars: vertical ones are hidden everywhere (wheel / drag / keyboard still scroll); only sideways
   scrolling areas (e.g. the mod select columns) show a thin bar. */
* { scrollbar-width: none; }
.modsel-cols, .hscroll { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .28) transparent; }
::-webkit-scrollbar { width: 0; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .28); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
svg.i.fill { fill: currentColor; stroke: none; }

#app { position: fixed; inset: 0; overflow: hidden; }

/* ── background layer */
#bg-layer { position: absolute; inset: -40px; z-index: 0; transition: transform var(--t-slow) var(--ease-out); }
.bg-img { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity calc(700ms * var(--anim)) ease, filter var(--t-slow) ease; will-change: opacity; }
.bg-img.show { opacity: 1; }
.bg-vignette { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); transition: background var(--t-slow); }
#app.bg-empty .bg-vignette { background: radial-gradient(ellipse at 50% 40%, #2a2733, #141318 75%); }
#app.in-game #bg-layer { inset: 0; transform: none !important; }

/* ── toolbar (osu!lazer: thin black bar, icon buttons with tooltips) */
#toolbar {
  position: absolute; top: 0; left: 0; right: 0; height: var(--toolbar-h); z-index: 30;
  display: flex; align-items: stretch; background: rgba(0, 0, 0, .78);
  transition: transform var(--t-med) var(--ease), opacity var(--t-med);
}
#app.in-game #toolbar, #app.hide-toolbar #toolbar { transform: translateY(-110%); opacity: 0; pointer-events: none; }
.tb-group { display: flex; align-items: stretch; }
.tb-spacer { flex: 1; }
.tb-btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 40px; height: 100%; padding: 0 12px; border: 0; background: transparent; color: #fff; font-size: .8rem; font-weight: 600; transition: background var(--t-fast); }
.tb-btn > .i { width: 18px; height: 18px; }
.tb-btn:hover { background: rgba(255, 255, 255, .1); }
.tb-btn.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent); }
.tb-tip { position: absolute; top: calc(100% + 6px); left: 50%; transform: translate(-50%, -4px); min-width: 140px; padding: 7px 10px; border-radius: 6px; background: rgba(0, 0, 0, .85); text-align: left; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--t-fast), transform var(--t-fast); }
.tb-group:first-child .tb-tip { left: 0; transform: translate(0, -4px); }
.tb-tip b { font-size: .85rem; font-weight: 700; }
.tb-tip span { font-size: .72rem; color: #bbb; font-weight: 400; }
.tb-btn:hover .tb-tip { opacity: 1; transform: translate(-50%, 0); transition-delay: .35s; }
.tb-group:first-child .tb-btn:hover .tb-tip { transform: none; }
.tb-music { max-width: 320px; }
.tb-np-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #ddd; }
.tb-music.paused .tb-np-text { color: #888; }
.tb-clock { display: flex; align-items: center; padding: 0 12px; font-variant-numeric: tabular-nums; font-size: .8rem; color: #ddd; white-space: nowrap; }
.tb-profile { padding: 0 14px 0 6px; }
.tb-profile .avatar { border-radius: 50%; box-shadow: none; }
@media (max-width: 900px) { .tb-np-text, .tb-profile .lbl { display: none; } }

/* now playing panel */
.np-panel { position: absolute; top: calc(var(--toolbar-h) + 6px); right: 8px; z-index: 55; width: 400px; max-width: calc(100vw - 16px); height: 130px; border-radius: 10px; overflow: hidden; background: #111; box-shadow: 0 8px 30px rgba(0, 0, 0, .5); opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity var(--t-fast), transform var(--t-med) var(--ease-out); }
.np-panel.show { opacity: 1; transform: none; pointer-events: auto; }
.np-cover { position: absolute; inset: 0; background: center / cover no-repeat #222; opacity: .45; }
.np-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .2), rgba(0, 0, 0, .6)); }
.np-body { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 14px 16px 16px; text-align: center; }
.np-title { font-size: 1.05rem; font-weight: 700; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.np-artist { font-size: .82rem; color: #ccc; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.np-ctls { display: flex; gap: 6px; margin-top: 8px; }
.np-ctl { width: 36px; height: 36px; border: 0; border-radius: 50%; display: grid; place-items: center; background: transparent; color: #fff; transition: background var(--t-fast), transform var(--t-fast); }
.np-ctl:hover { background: rgba(255, 255, 255, .15); }
.np-ctl:active { transform: scale(.9); }
.np-ctl .i { width: 20px; height: 20px; }
.np-times { position: absolute; left: 10px; right: 10px; bottom: 9px; display: flex; justify-content: space-between; font-size: .68rem; color: #bbb; font-variant-numeric: tabular-nums; pointer-events: none; }
.np-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; cursor: pointer; background: rgba(255, 255, 255, .15); transition: height var(--t-fast); }
.np-bar:hover { height: 10px; }
.np-bar i { display: block; height: 100%; background: var(--accent); }

/* ── screens */
#screens { position: absolute; inset: 0; z-index: 10; }
.screen { position: absolute; inset: 0; padding-top: var(--toolbar-h); display: flex; flex-direction: column; }
.screen.enter { animation: scrIn var(--t-med) var(--ease-out) both; }
.screen.leave { animation: scrOut calc(200ms * var(--anim)) ease both; pointer-events: none; }
.screen.enter.from-right { animation-name: scrInRight; }
.screen.enter.zoom { animation-name: scrInZoom; }
.screen.leave.zoom { animation-name: scrOutZoom; }
@keyframes scrIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes scrInRight { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }
@keyframes scrInZoom { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
@keyframes scrOut { to { opacity: 0; transform: translateY(-10px); } }
@keyframes scrOutZoom { to { opacity: 0; transform: scale(.97); } }
.screen-body { flex: 1; min-height: 0; overflow: auto; padding: 24px clamp(16px, 3vw, 48px) 40px; }
.screen-title { display: flex; align-items: center; gap: 14px; margin: 4px 0 20px; }
.screen-title h1 { margin: 0; font-size: 1.9rem; font-weight: 700; letter-spacing: -.01em; }
.screen-title .sub { color: var(--muted); font-weight: 600; }
.screen-title .grow { flex: 1; }
.page { max-width: 1400px; margin: 0 auto; }

/* ── generic controls */
.btn {
  --c: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); color: var(--text);
  font-weight: 600; font-size: .92rem; letter-spacing: .01em; white-space: nowrap;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast), filter var(--t-fast);
}
.btn:hover { background: rgba(var(--accent-rgb), .14); border-color: rgba(var(--accent-rgb), .5); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn.primary { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 6px 20px rgba(var(--accent-rgb), .35); }
.btn.primary:hover { filter: brightness(1.1); box-shadow: 0 8px 26px rgba(var(--accent-rgb), .5); }
.btn.gold { background: linear-gradient(180deg, #ffe07a, #f2b705); color: #2a1d00; border-color: transparent; }
.btn.danger { border-color: rgba(255, 74, 92, .45); color: #ffb1b9; }
.btn.danger:hover { background: rgba(255, 74, 92, .16); border-color: #ff4a5c; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: rgba(var(--accent-rgb), .12); }
.btn.sm { height: 32px; padding: 0 11px; font-size: .82rem; border-radius: 8px; }
.btn.lg { height: 50px; padding: 0 24px; font-size: 1.05rem; border-radius: 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 10px; border: 0; background: transparent; color: var(--text-2); display: inline-grid; place-items: center; transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast); }
.icon-btn:hover { background: rgba(var(--accent-rgb), .14); color: var(--text); }
.icon-btn:active { transform: scale(.9); }
.icon-btn.on { color: var(--gold); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line-2); background: rgba(255, 255, 255, .03); color: var(--text-2); font-weight: 600; font-size: .8rem;
  transition: all var(--t-fast);
}
.chip:hover { border-color: rgba(var(--accent-rgb), .6); color: var(--text); }
.chip:active { transform: scale(.95); }
.chip.on { background: rgba(var(--accent-rgb), .22); border-color: var(--accent); color: var(--text); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .3); }
.input, .select {
  height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(8, 5, 14, .6);
  color: var(--text); font-weight: 700; transition: border-color var(--t-fast), box-shadow var(--t-fast); min-width: 0;
}
.input:hover, .select:hover { border-color: rgba(var(--accent-rgb), .45); }
.input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .2); }
.select { appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.select option { background: var(--panel-solid); }
.toggle { position: relative; width: 44px; height: 24px; flex: none; border-radius: 99px; border: 0; background: rgba(255, 255, 255, .12); transition: background var(--t-fast); padding: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #d8cfee; transition: transform var(--t-fast) var(--ease), background var(--t-fast); }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(20px); background: #fff; }
.toggle:active::after { width: 22px; }
input[type=range].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; margin: 0; cursor: pointer; --p: 50%; }
input[type=range].slider::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(90deg, var(--accent) var(--p), rgba(255, 255, 255, .12) var(--p)); }
input[type=range].slider::-moz-range-track { height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .12); }
input[type=range].slider::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--accent); }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5.5px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); transition: transform var(--t-fast); }
input[type=range].slider::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
input[type=range].slider:hover::-webkit-slider-thumb { transform: scale(1.2); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
:root:not(.no-effects) .panel.glass { backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); }
.muted { color: var(--muted); }
.gold { color: var(--gold); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .03em; background: rgba(255, 255, 255, .08); color: var(--text-2); }
.tag.accent { background: rgba(var(--accent-rgb), .22); color: var(--accent-3); }
.tag.warn { background: rgba(255, 74, 92, .18); color: #ffb3bb; }
.tag.goldtag { background: rgba(255, 213, 74, .16); color: #ffe38a; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; }
.empty .big { font-size: 1.3rem; color: var(--text-2); font-weight: 600; margin-bottom: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .12); border-bottom-width: 2px; font-size: .72rem; font-weight: 700; color: var(--text-2); }

/* stars / difficulty colours */
.stars { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 99px; font-weight: 700; font-size: .75rem; color: #16101f; background: var(--sc, #6cf); white-space: nowrap; }
.stars svg { width: 11px; height: 11px; }

/* grades */
.grade { font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.grade-XH, .grade-SH { background: linear-gradient(180deg, #ffffff, #b8c4d8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.grade-SS, .grade-S { background: linear-gradient(180deg, #fff3a6, #ffc31f); -webkit-background-clip: text; background-clip: text; color: transparent; }
.grade-A { color: #6ef08e; } .grade-B { color: #5cb3ff; } .grade-C { color: #c68bff; } .grade-D { color: #ff6b7a; } .grade-F { color: #ff3b4f; }

/* mods */
.mod-badge { display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 6px; border-radius: 7px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; background: color-mix(in srgb, var(--mod) 24%, transparent); color: color-mix(in srgb, var(--mod) 70%, white); border: 1px solid color-mix(in srgb, var(--mod) 55%, transparent); }
.mod-badge.small { min-width: 28px; height: 18px; font-size: .64rem; border-radius: 5px; }

/* avatar */
.avatar { border-radius: 30%; background: center / cover no-repeat var(--panel-3); flex: none; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .35); }
.avatar-mono { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 700; }

/* ── toasts */
#toasts { position: absolute; right: 18px; bottom: 18px; z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
.toast { pointer-events: auto; min-width: 260px; max-width: 420px; padding: 12px 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: var(--shadow); animation: toastIn var(--t-med) var(--ease-out) both; display: flex; gap: 12px; align-items: flex-start; }
.toast .t-ico { color: var(--accent); margin-top: 1px; }
.toast.err .t-ico { color: var(--bad); }
.toast.ok .t-ico { color: var(--good); }
.toast .t-title { font-weight: 600; }
.toast .t-body { color: var(--text-2); font-size: .85rem; margin-top: 2px; white-space: pre-line; max-height: 180px; overflow: auto; }
.toast.out { animation: toastOut var(--t-med) ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

/* ── drop overlay */
#drop-overlay { position: absolute; inset: 0; z-index: 95; display: grid; place-items: center; background: rgba(8, 4, 16, .78); opacity: 0; pointer-events: none; transition: opacity var(--t-fast); }
#drop-overlay.show { opacity: 1; }
.drop-inner { border: 3px dashed rgba(var(--accent-rgb), .7); border-radius: 28px; padding: 48px 70px; text-align: center; background: rgba(var(--accent-rgb), .07); transform: scale(.96); transition: transform var(--t-med) var(--ease); }
#drop-overlay.show .drop-inner { transform: none; }
.drop-title { font-size: 2rem; font-weight: 700; }
.drop-sub { color: var(--muted); margin-top: 6px; }
.drop-icon { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 40px rgba(var(--accent-rgb), .6); }

/* ── loading screen */
#loading-screen { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: #18171c; transition: opacity calc(500ms * var(--anim)) ease, visibility 0s linear calc(500ms * var(--anim)); }
#loading-screen.done { opacity: 0; visibility: hidden; pointer-events: none; }
.load-logo { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #ff85bd, #e6428e 80%); border: 7px solid #fff; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.6rem; line-height: .9; text-align: center; animation: logoBreath 1.6s ease-in-out infinite; box-shadow: 0 6px 30px rgba(0, 0, 0, .45); }
.load-logo small { display: block; font-size: .5em; letter-spacing: .12em; font-weight: 600; margin-top: .25em; }
@keyframes logoBreath { 50% { transform: scale(1.04); } }
.load-status { color: var(--muted); font-size: .9rem; min-height: 1.4em; }

/* ── FPS counter */

/* ── overlays / dialogs */
#overlay-root { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
#overlay-root > * { pointer-events: auto; }
.backdrop { position: absolute; inset: 0; background: rgba(5, 2, 10, .55); animation: fadeIn var(--t-med) ease both; }
.backdrop.out { animation: fadeOut var(--t-fast) ease both; }
@keyframes fadeIn { from { opacity: 0; } } @keyframes fadeOut { to { opacity: 0; } }
.dialog { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 60px); overflow: auto; padding: 24px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 20px; box-shadow: var(--shadow); animation: dlgIn var(--t-med) var(--ease-out) both; }
.dialog.out { animation: dlgOut var(--t-fast) ease both; }
@keyframes dlgIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.97); } }
@keyframes dlgOut { to { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
.dialog h2 { margin: 0 0 8px; font-weight: 700; }
.dialog .body { color: var(--text-2); margin-bottom: 18px; line-height: 1.5; }
.dialog .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.menu { position: fixed; min-width: 220px; padding: 6px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: var(--shadow); z-index: 70; animation: menuIn var(--t-fast) var(--ease-out) both; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-weight: 700; font-size: .88rem; color: var(--text-2); }
.menu button:hover, .menu button:focus-visible { background: rgba(var(--accent-rgb), .16); color: var(--text); outline: none; }
.menu .sep { height: 1px; margin: 5px 6px; background: var(--line); }
.menu .hdr { padding: 6px 12px 4px; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.menu .check { margin-left: auto; color: var(--accent); }

/* ── settings panel (slides in from the left, like a game client) */
.settings-panel { position: absolute; top: 0; bottom: 0; left: 0; width: min(560px, 100vw); display: flex; background: var(--panel-solid); border-right: 1px solid var(--line-2); box-shadow: 20px 0 60px rgba(0, 0, 0, .5); animation: slideInL var(--t-med) var(--ease-out) both; }
.settings-panel.out { animation: slideOutL calc(200ms * var(--anim)) ease both; }
@keyframes slideInL { from { transform: translateX(-100%); } }
@keyframes slideOutL { to { transform: translateX(-100%); } }
.sp-nav { width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px; background: rgba(0, 0, 0, .25); border-right: 1px solid var(--line); }
.sp-nav .icon-btn { width: 44px; height: 44px; border-radius: 12px; }
.sp-nav .icon-btn.active { background: rgba(var(--accent-rgb), .2); color: var(--accent-3); }
.sp-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sp-head { padding: 20px 22px 12px; }
.sp-head h2 { margin: 0; font-size: 1.6rem; font-weight: 700; }
.sp-head .sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }
.sp-search { margin-top: 12px; width: 100%; }
.sp-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 22px 60px; scroll-behavior: smooth; }
.sp-section { padding-top: 18px; }
.sp-section > h3 { margin: 0 0 4px; font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.sp-section > h3 .i { color: var(--accent); }
.sp-group { margin: 12px 0 4px; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.set-row { display: flex; align-items: center; gap: 14px; padding: 9px 10px; margin: 0 -10px; border-radius: 10px; transition: background var(--t-fast); }
.set-row:hover { background: rgba(255, 255, 255, .035); }
.set-row .lbl { flex: 1; min-width: 0; }
.set-row .lbl .hint { color: var(--muted); font-size: .76rem; font-weight: 600; margin-top: 1px; }
.set-row .ctl { flex: none; display: flex; align-items: center; gap: 10px; }
.set-row.col { flex-direction: column; align-items: stretch; gap: 8px; }
.set-row.col .ctl { width: 100%; }
.set-row .val { min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent-3); font-weight: 600; font-size: .85rem; }
.set-row .reset { opacity: 0; transition: opacity var(--t-fast); }
.set-row:hover .reset.show { opacity: 1; }
.sp-footer { padding: 16px 0 0; color: var(--muted); font-size: .78rem; text-align: center; }

/* key config */
.keycfg { display: flex; flex-direction: column; gap: 12px; }
.keycfg-modes { display: flex; flex-wrap: wrap; gap: 6px; }
.keycfg-lanes { display: flex; gap: 6px; justify-content: center; padding: 14px; border-radius: 14px; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); flex-wrap: wrap; }
.lane-key { min-width: 48px; min-height: 64px; padding: 6px; border-radius: 10px; border: 2px solid var(--line-2); background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .01)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 700; font-size: .85rem; color: var(--text); transition: all var(--t-fast); position: relative; }
.lane-key .ln { position: absolute; top: 3px; left: 6px; font-size: .6rem; color: var(--muted); }
.lane-key .alt { font-size: .66rem; color: var(--muted); }
.lane-key:hover { border-color: var(--accent); }
.lane-key.listening { border-color: var(--gold); background: rgba(255, 213, 74, .12); animation: pulseBorder 1s ease-in-out infinite; }
.lane-key.conflict { border-color: var(--bad); background: rgba(255, 74, 92, .12); }
.lane-key.pressed { background: rgba(var(--accent-rgb), .35); border-color: var(--accent); transform: translateY(2px); }
.lane-key.special { border-color: rgba(255, 213, 74, .4); }
@keyframes pulseBorder { 50% { box-shadow: 0 0 0 4px rgba(255, 213, 74, .2); } }
.keycfg-help { font-size: .8rem; color: var(--muted); text-align: center; }
.keycfg-help.warn { color: #ffb3bb; }

/* ── mod select (bottom sheet) */

/* ── SONG SELECT (osu!lazer: info wedge + leaderboard left, filter + carousel right, footer bar) */
.ss { padding-top: var(--toolbar-h); }
.ss-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(420px, 42%) 1fr; }
@media (max-width: 1000px) { .ss-main { grid-template-columns: 1fr; } .ss-info { display: none; } }
.ss-info { display: flex; flex-direction: column; gap: 10px; padding: 14px 10px 14px 20px; min-height: 0; }
.ss-right { display: flex; flex-direction: column; min-height: 0; }
.ss-filter { padding: 12px 20px 12px 24px; display: flex; flex-direction: column; gap: 8px; background: rgba(0, 0, 0, .5); }
.ss-search { position: relative; }
.ss-search .input { width: 100%; padding-left: 38px; height: 38px; font-size: .95rem; background: rgba(255, 255, 255, .06); border-color: transparent; }
.ss-search .input:focus { box-shadow: none; border-color: rgba(255, 255, 255, .25); }
.ss-search .i { position: absolute; left: 12px; top: 10px; color: var(--muted); }
.ss-filter-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ss-sel { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); }
.ss-sel .select { height: 28px; padding: 0 28px 0 10px; font-size: .8rem; background-color: rgba(255, 255, 255, .06); border-color: transparent; background-position: calc(100% - 15px) 12px, calc(100% - 10px) 12px; }
.ss-count { color: var(--muted); font-size: .78rem; white-space: nowrap; }

.wedge { position: relative; overflow: hidden; border-radius: 10px; min-height: 210px; background: var(--panel-3); box-shadow: var(--shadow); animation: wedgeIn var(--t-med) var(--ease-out); flex: none; }
@keyframes wedgeIn { from { opacity: .4; transform: translateX(-12px); } }
.wedge .w-bg { position: absolute; inset: 0; background: center / cover; }
.wedge .w-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .1), rgba(0, 0, 0, .8) 80%); }
.wedge .w-body { position: relative; padding: 14px 18px 14px; display: flex; flex-direction: column; gap: 3px; min-height: 210px; justify-content: flex-end; }
.wedge .w-top { position: absolute; top: 12px; left: 14px; right: 10px; display: flex; gap: 6px; align-items: center; }
.wedge .w-title { font-size: 1.6rem; font-weight: 600; line-height: 1.15; text-shadow: 0 2px 8px rgba(0, 0, 0, .5); }
.wedge .w-artist { font-size: 1rem; color: #eee; }
.wedge .w-diff { font-size: .88rem; margin-top: 6px; }
.wedge .w-diff b { font-weight: 600; }
.wedge .w-stats { display: flex; gap: 18px; margin-top: 8px; font-size: .85rem; color: #ffcc22; }
.w-stat { display: inline-flex; align-items: center; gap: 6px; }
.w-stat .i { width: 15px; height: 15px; }
.ss-attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; padding: 10px 14px; border-radius: 10px; background: rgba(0, 0, 0, .45); }
.attr { display: grid; grid-template-columns: 84px 1fr 34px; align-items: center; gap: 10px; font-size: .78rem; }
.attr .k { color: var(--muted); }
.attr .v { text-align: right; font-variant-numeric: tabular-nums; }
.attr .bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.attr .bar i { display: block; height: 100%; background: #fff; transition: width var(--t-med) var(--ease); }
.ss-problem { display: flex; gap: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(237, 17, 33, .15); font-size: .85rem; }
.ss-problem .i { color: #ff6b77; margin-top: 2px; }
.lb { flex: 1; min-height: 120px; overflow: hidden; display: flex; flex-direction: column; }
.lb-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; font-size: .8rem; }
.lb-tab { font-weight: 600; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
.lb-list { overflow: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 4px; }
.lb-empty { padding: 30px 10px; text-align: center; color: var(--muted); font-size: .9rem; }
.lb-row { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 8px; background: rgba(0, 0, 0, .45); border: 0; text-align: left; width: 100%; transition: background var(--t-fast); animation: rowIn var(--t-med) var(--ease-out) both; }
.lb-row:hover { background: rgba(255, 255, 255, .08); }
.lb-row .rank { width: 30px; color: var(--muted); font-size: .8rem; }
.lb-row .grade { font-size: 1.2rem; width: 28px; text-align: center; }
.lb-row .main { flex: 1; min-width: 0; }
.lb-row .who { font-weight: 600; font-size: .9rem; }
.lb-row .nums { text-align: right; }
.lb-row .sc { font-weight: 600; font-variant-numeric: tabular-nums; }
.lb-row .meta { color: var(--muted); font-size: .72rem; }
.lb-row.pb { box-shadow: inset 3px 0 0 var(--gold); }
@keyframes rowIn { from { opacity: 0; transform: translateX(-8px); } }

.carousel { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.carousel-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; outline: none; }
.carousel-inner { position: relative; }
.c-item { position: absolute; left: 0; right: 0; will-change: transform; transition: transform calc(220ms * var(--anim)) var(--ease-out); }
.set-panel { position: relative; height: 82px; margin-left: 30px; margin-right: 12px; width: calc(100% - 42px); border-radius: 8px; overflow: hidden; border: 0; background: var(--panel-3); display: flex; align-items: stretch; text-align: left; padding: 0; color: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .3); transition: box-shadow var(--t-fast), filter var(--t-fast); }
.set-panel .sp-bg { position: absolute; inset: 0; background: center / cover; opacity: .6; transition: opacity var(--t-fast); }
.set-panel .sp-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .8) 25%, rgba(0, 0, 0, .25)); }
.set-panel .sp-body { position: relative; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; flex: 1; }
.set-panel .sp-t { font-weight: 600; font-size: 1.08rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-panel .sp-a { color: #ddd; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-panel .sp-dots { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.set-panel .sp-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--sc); }
.set-panel .sp-fav { position: relative; align-self: center; margin-right: 14px; color: var(--accent); }
.set-panel:hover .sp-bg { opacity: .8; }
.set-panel.expanded { box-shadow: 0 0 0 2px #fff, 0 4px 20px rgba(0, 0, 0, .4); }
.set-panel.broken { filter: saturate(.3); }
.diff-panel { position: relative; height: 56px; margin-left: 56px; margin-right: 12px; width: calc(100% - 68px); border-radius: 8px; border: 0; background: rgba(36, 34, 42, .92); display: flex; align-items: center; gap: 12px; padding: 0 14px 0 10px; text-align: left; color: #fff; transition: background var(--t-fast), box-shadow var(--t-fast); }
.diff-panel:hover { background: rgba(61, 57, 70, .95); }
.diff-panel.selected { background: rgba(61, 57, 70, .98); box-shadow: 0 0 0 2px var(--sc), 0 0 16px color-mix(in srgb, var(--sc) 35%, transparent); }
.diff-panel .dp-main { flex: 1; min-width: 0; }
.diff-panel .dp-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.diff-panel .dp-v { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.diff-panel .dp-s { font-size: .74rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.diff-panel .grade { font-size: 1.3rem; width: 30px; text-align: center; }
.diff-panel.broken { opacity: .55; }
.dp-icon { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: .66rem; font-weight: 700; color: #000; background: var(--sc); }
.keys-tag { font-weight: 600; font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: rgba(0, 0, 0, .55); color: #fff; }
.ss-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
.ss-empty .box { max-width: 520px; }
.ss-empty h2 { font-size: 1.5rem; font-weight: 600; margin: 0 0 8px; }
.ss-empty p { color: var(--text-2); }

/* footer bar with back button, Mods / Random / Options and the logo play button */
.ss-footer { position: relative; display: flex; align-items: center; gap: 4px; height: 50px; padding: 0 20px 0 0; background: rgba(0, 0, 0, .8); }
.ss-footer .foot-btn { --c: #888; position: relative; height: 50px; min-width: 110px; padding: 0 20px; border: 0; background: rgba(255, 255, 255, .04); color: #fff; transform: skewX(-12deg); overflow: hidden; font-size: .95rem; transition: background var(--t-fast); }
.ss-footer .foot-btn::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); transition: height var(--t-fast); }
.ss-footer .foot-btn:hover { background: rgba(255, 255, 255, .1); }
.ss-footer .foot-btn:hover::before { height: 6px; }
.fb-inner { display: inline-flex; align-items: center; gap: 8px; transform: skewX(12deg); }
.ss-footer .mods-on { display: flex; gap: 4px; margin-left: 12px; }
.ss-cookie { position: relative; width: 96px; height: 96px; margin: -46px 0 0 10px; border: 0; padding: 0; border-radius: 50%; background: transparent; transition: transform var(--t-fast); }
.ss-cookie:hover { transform: scale(1.06); }
.ss-cookie:active { transform: scale(.95); }
.ss-cookie[disabled] { filter: grayscale(1); opacity: .5; }
.ss-cookie-disc { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 50% 30%, #ff85bd, #e6428e 80%); border: 5px solid #fff; box-shadow: 0 4px 20px rgba(0, 0, 0, .5); }
.ss-cookie-disc .i { width: 34px; height: 34px; margin-left: 4px; }

/* ── GAMEPLAY */
.gameplay { padding-top: 0; cursor: none; }
.gameplay.show-cursor { cursor: default; }
.gp-bg { position: absolute; inset: 0; background: center / cover no-repeat #000; transition: filter var(--t-med); }
.gp-dim { position: absolute; inset: 0; background: #000; }
.gp-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gp-hud { position: absolute; inset: 0; pointer-events: none; }
.hud-score { position: absolute; top: 16px; right: 24px; text-align: right; }
.hud-score .sc { font-size: clamp(1.8rem, 3.2vw, 2.8rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; text-shadow: 0 2px 12px rgba(0, 0, 0, .6); }
.hud-score .acc { font-size: clamp(1.1rem, 1.8vw, 1.5rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-2); }
.hud-score .pace { font-size: .8rem; color: var(--muted); font-weight: 600; }
.hud-progress { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: rgba(255, 255, 255, .06); }
.hud-progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); width: 100%; transform: scaleX(0); transform-origin: 0 0; }
.hud-time { position: absolute; top: 12px; left: 22px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }
.hud-mods { position: absolute; top: 118px; right: 24px; display: flex; gap: 4px; }
.hud-meta { position: absolute; bottom: 18px; left: 22px; color: var(--text-2); font-size: .85rem; font-weight: 700; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); max-width: 30vw; }
.hud-meta b { color: var(--text); }
.hud-skip { position: absolute; right: 30px; bottom: 30px; pointer-events: auto; }
.hud-center-msg { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 2.4rem; font-weight: 700; text-shadow: 0 4px 20px rgba(0, 0, 0, .7); pointer-events: none; animation: msgPop 400ms var(--ease-out); }
@keyframes msgPop { from { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
.hud-replay { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 6px 16px; border-radius: 99px; background: rgba(0, 0, 0, .55); border: 1px solid var(--line-2); font-weight: 700; font-size: .85rem; letter-spacing: .06em; }
.hud-replay .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 8px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.gp-fail { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255, 30, 60, .0), rgba(255, 30, 60, .35)); pointer-events: none; opacity: 0; transition: opacity 600ms; }
.gp-fail.on { opacity: 1; }
.gameplay.failing > canvas { animation: failSink 1.2s cubic-bezier(.55, 0, 1, .45) forwards; transform-origin: 50% 100%; }
@keyframes failSink { to { transform: translateY(7%) scale(.97); filter: brightness(.55) saturate(.4); } }
.pause-menu { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4, 2, 8, .72); animation: fadeIn var(--t-fast) ease; }
:root:not(.no-effects) .pause-menu { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.pause-box { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 320px; }
.pause-box h2 { font-size: 2.6rem; font-weight: 700; margin: 0 0 10px; }
.pause-box h2.failed { color: var(--bad); }
.pause-box .btn { width: 300px; height: 54px; font-size: 1.08rem; }
.pause-box .pb-sub { color: var(--muted); font-weight: 700; margin-top: 4px; }
.countdown { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font-size: 5rem; font-weight: 700; color: var(--accent-3); text-shadow: 0 0 40px rgba(var(--accent-rgb), .8); pointer-events: none; }
.practice-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(980px, calc(100vw - 40px)); padding: 12px 14px; border-radius: 16px; background: rgba(12, 8, 20, .88); border: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; cursor: default; transition: opacity var(--t-med); }
.practice-bar.dim { opacity: .25; }
.practice-bar.docked { left: 16px; transform: none; bottom: 64px; }
.practice-bar.docked.dim { opacity: .85; }
.practice-bar:hover { opacity: 1; }
.pr-timeline { position: relative; height: 36px; border-radius: 8px; background: rgba(255, 255, 255, .04); cursor: pointer; overflow: hidden; }
.pr-timeline canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pr-loop { position: absolute; top: 0; bottom: 0; background: rgba(var(--accent-rgb), .22); border-left: 2px solid var(--accent); border-right: 2px solid var(--gold); pointer-events: none; }
.pr-head { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; box-shadow: 0 0 8px #fff; pointer-events: none; }
.pr-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .82rem; }
.pr-controls .speed-group { display: flex; gap: 3px; }
.pr-controls .speed-group .chip { height: 28px; padding: 0 9px; }
/* replay / Auto controls (osu!lazer's replay player): shown while the mouse moves, when paused or hovered */
.replay-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(720px, calc(100vw - 340px)); min-width: min(470px, calc(100vw - 32px)); padding: 10px 12px; border-radius: 14px; background: rgba(12, 8, 20, .84); border: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 8px; pointer-events: auto; cursor: default; opacity: 0; transition: opacity var(--t-med); }
.gameplay.show-cursor .replay-bar, .replay-bar.paused, .replay-bar:hover, .replay-bar:focus-within { opacity: 1; }
.rp-timeline { position: relative; height: 28px; border-radius: 7px; background: rgba(255, 255, 255, .04); cursor: pointer; overflow: hidden; touch-action: none; }
.rp-timeline canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.rp-fill { position: absolute; inset: 0; transform-origin: left; transform: scaleX(0); background: rgba(var(--accent-rgb), .3); pointer-events: none; }

.rp-play { min-width: 38px; justify-content: center; }
.rp-time { font-variant-numeric: tabular-nums; color: var(--text-2); min-width: 96px; }

/* ── RESULTS */
.results { padding-top: var(--toolbar-h); }
.res-body { flex: 1; min-height: 0; overflow: auto; padding: 22px clamp(16px, 3vw, 48px) 26px; }
.res-grid { max-width: 1380px; margin: 0 auto; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 20px; }
@media (max-width: 1000px) { .res-grid { grid-template-columns: 1fr; } }
.res-head { grid-column: 1 / -1; display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.res-head .t { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
.res-head .a { color: var(--text-2); font-weight: 700; }
.res-head .d { color: var(--muted); font-weight: 700; }
.res-grade-card { padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; overflow: hidden; }
.res-ring { position: relative; width: 230px; height: 230px; }
.res-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.res-ring .grade { position: absolute; inset: 0; display: grid; place-items: center; font-size: 6.5rem; animation: gradeIn 700ms var(--ease-out) 300ms both; }
@keyframes gradeIn { from { opacity: 0; transform: scale(1.8) rotate(-10deg); filter: blur(8px); } }
.res-score { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.res-pb { padding: 5px 14px; border-radius: 99px; font-weight: 700; font-size: .85rem; background: linear-gradient(90deg, #ffe07a, #f2b705); color: #2a1d00; animation: pbPulse 1.6s ease-in-out infinite; }
@keyframes pbPulse { 50% { box-shadow: 0 0 24px rgba(255, 213, 74, .6); } }
.res-kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.res-kv .stat { text-align: center; }
.res-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.res-judge { padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.jrow { display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); }
.jrow .jn { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.jrow .jc { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.jrow .jb { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.jrow .jb i { display: block; height: 100%; background: var(--jc); width: 0; transition: width 900ms var(--ease-out); }
.chart-card { padding: 16px; }
.chart-card h3 { margin: 0 0 10px; font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.chart-card h3 .grow { flex: 1; }
.chart-wrap { position: relative; width: 100%; }
.chart-wrap canvas { width: 100%; display: block; }
.chart-tip { position: absolute; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: rgba(8, 5, 14, .95); border: 1px solid var(--line-2); font-size: .78rem; font-weight: 700; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 3; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .76rem; color: var(--text-2); margin-top: 8px; }
.chart-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.res-actions { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 20px 0 0; background: rgba(0, 0, 0, .8); }

/* ── lists / cards (collections, replays, skins, beatmaps) */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { position: relative; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); overflow: hidden; transition: transform var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast); }
.card.clickable { cursor: pointer; }
.card.clickable:hover { transform: translateY(-3px); border-color: rgba(var(--accent-rgb), .55); box-shadow: 0 12px 30px rgba(0, 0, 0, .35); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 30px rgba(var(--accent-rgb), .25); }
.card .c-body { padding: 14px 16px; }
.card .c-title { font-weight: 700; font-size: 1.05rem; }

.list { display: flex; flex-direction: column; gap: 6px; }

.list-row .main { flex: 1; min-width: 0; }
.list-row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .s { color: var(--muted); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-row .grade { font-size: 1.6rem; width: 40px; text-align: center; }
.split { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.side-list { display: flex; flex-direction: column; gap: 6px; }
.side-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); text-align: left; width: 100%; font-weight: 600; transition: all var(--t-fast); }
.side-item:hover { border-color: var(--line-2); }
.side-item.active { border-color: var(--accent); background: rgba(var(--accent-rgb), .16); }
.side-item .cnt { margin-left: auto; color: var(--muted); font-size: .8rem; }

/* skins */
.skin-preview { position: relative; height: 380px; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--line-2); }
.skin-preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* profile */
.lvl-badge { width: 48px; height: 48px; display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; border-radius: 14px; background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #2a1d00; box-shadow: 0 0 20px rgba(255, 213, 74, .35); }
.xp-bar { width: min(340px, 50vw); height: 8px; border-radius: 8px; background: rgba(0, 0, 0, .4); overflow: hidden; }
.xp-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-2), var(--gold)); }

/* statistics */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.big-stat { padding: 16px 18px; }
.big-stat .k { font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.big-stat .v { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.big-stat .sub { font-size: .76rem; color: var(--muted); }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 1000px) { .chart-row { grid-template-columns: 1fr; } }
.table { width: 100%; border-collapse: collapse; font-size: .86rem; }
.table th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.table td { padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.table tr:hover td { background: rgba(255, 255, 255, .025); }

/* debug overlay */
.debug-overlay { position: absolute; left: 10px; top: 60px; z-index: 85; padding: 10px 12px; border-radius: 10px; background: rgba(0, 0, 0, .78); border: 1px solid rgba(159, 245, 181, .3); font: 700 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #bff5cc; pointer-events: none; white-space: pre; min-width: 250px; }
#app.in-game .debug-overlay { top: 40px; }
.debug-overlay .h { color: #ffe38a; }

/* import status pill */
.import-pill { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 91; padding: 10px 18px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--accent); display: flex; align-items: center; gap: 10px; font-weight: 600; box-shadow: var(--shadow); animation: toastIn var(--t-med) var(--ease-out); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 3px solid rgba(var(--accent-rgb), .25); border-top-color: var(--accent); animation: spin 700ms linear infinite; }

/* calibration */
.calib { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.calib-beat { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent); display: grid; place-items: center; font-weight: 700; transition: transform 60ms, background 60ms; }
.calib-beat.on { transform: scale(1.12); background: rgba(var(--accent-rgb), .3); }

/* ── onboarding */
.ob-err { color: #ffb3bb; min-height: 1.3em; font-size: .85rem; margin-top: 6px; }

/* ── in-game pie / pp / kps */
.hud-accrow { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.hud-pie { --p: 0%; width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(rgba(255,255,255,.92) var(--p), rgba(255,255,255,.14) 0); box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 2px 10px rgba(0,0,0,.5); }
.hud-pie.lead { background: conic-gradient(#7ee07a var(--p), rgba(126,224,122,.18) 0); box-shadow: 0 0 0 2px #7ee07a, 0 2px 10px rgba(0,0,0,.5); }
.hud-pp { font-size: clamp(1rem, 1.5vw, 1.3rem); font-weight: 700; color: var(--accent-3); font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
.res-pp { font-size: 1.1rem; font-weight: 600; color: var(--text-2); margin-top: -6px; }
.res-pp b { font-size: 1.9rem; color: var(--accent-3); margin-right: 2px; }
.res-ppdelta { font-size: .85rem; }
.profile-pp { text-align: right; padding: 10px 18px; border-radius: 16px; background: rgba(0,0,0,.28); border: 1px solid var(--line-2); }
.profile-pp .k { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.profile-pp .v { font-size: 2.6rem; font-weight: 700; line-height: 1.05; color: var(--accent-3); font-variant-numeric: tabular-nums; }
.profile-pp .v span { font-size: 1.2rem; margin-left: 3px; color: var(--text-2); }
.profile-pp .sub { font-size: .78rem; color: var(--muted); }
.pp-cell { display: flex; flex-direction: column; align-items: flex-end; font-size: .78rem; }
.pp-cell b { font-size: 1.05rem; color: var(--accent-3); }

/* ── beatmap explorer (lazer beatmap-listing style) */
.ex-body { padding-top: 0; }
.ex-header { position: relative; margin: 0 0 20px; padding: 24px 0 16px; border-bottom: 1px solid var(--line); }
.ex-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.ex-title h1 { margin: 0; font-size: 1.7rem; font-weight: 700; }
.ex-searchwrap { position: relative; }
.ex-searchwrap .i { position: absolute; left: 16px; top: 16px; color: var(--muted); width: 1.3em; height: 1.3em; }
.ex-search { width: 100%; height: 54px; padding-left: 50px; font-size: 1.15rem; border-radius: 14px; background: rgba(0, 0, 0, .35); }
.ex-filters { display: grid; gap: 6px; margin-top: 12px; }
.ex-filter { display: flex; align-items: flex-start; gap: 12px; }
.ex-flabel { width: 74px; flex: none; padding-top: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ex-chips { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; min-width: 0; }
.ex-filter > .ex-stars { padding-top: 3px; }
.ex-chip { border: 0; background: transparent; color: var(--text-2); font-weight: 700; font-size: .86rem; padding: 4px 9px; border-radius: 8px; transition: all var(--t-fast); }
.ex-chip:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
.ex-chip.on { color: var(--accent); font-weight: 700; }
.ex-chip.ex-reset { display: inline-flex; align-items: center; gap: 4px; color: var(--bad, #ff6b7a); }
.ex-chip.ex-reset .ic { width: 13px; height: 13px; }
.ex-stars { display: flex; align-items: center; gap: 12px; width: min(520px, 100%); }
.ex-stars .slider { flex: 1; }
.ex-starval { min-width: 96px; font-weight: 600; color: var(--accent-3); font-size: .85rem; }
.ex-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 600px) { .ex-grid { grid-template-columns: 1fr; } }
.ex-statuspill { font-size: .62rem; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; background: #444; color: #fff; }
.st-ranked, .st-approved { background: #b3ff66; color: #1a2600; } .st-qualified { background: #66ccff; color: #00202e; } .st-loved { background: #ff66aa; color: #2e0014; }
.st-pending, .st-wip { background: #ffd966; color: #2e2300; } .st-graveyard { background: #1a1a1a; color: #aaa; }
/* ── Beatmap explorer cards (osu!lazer / osu-web style): cover on top, details below */
.ex-grid { gap: 16px; }
.ex-card { position: relative; display: flex; flex-direction: column; min-width: 0; border-radius: 12px; overflow: hidden; background: #2a2830; cursor: pointer; outline: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast); }
.ex-card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px rgba(var(--accent-rgb), 0); pointer-events: none; transition: box-shadow var(--t-fast); }
.ex-card:hover, .ex-card:focus-visible { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(0, 0, 0, .45); }
.ex-card:hover::after, .ex-card:focus-visible::after { box-shadow: inset 0 0 0 2px rgba(var(--accent-rgb), .6); }
.ex-cover-wrap { position: relative; aspect-ratio: 20 / 7; flex: none; overflow: hidden; background: linear-gradient(135deg, #3b3744, #1f1d24); }
.ex-cover { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 300ms ease, filter 300ms ease; }
.ex-cover.loaded { opacity: 1; }
.ex-card:hover .ex-cover { filter: brightness(1.12) saturate(1.1); }
.ex-cover-shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0, 0, 0, .5) 0%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0) 62%, rgba(0, 0, 0, .55) 100%); }
.ex-badges { position: absolute; left: 10px; top: 10px; display: flex; gap: 5px; align-items: center; }
.ex-statuspill { display: inline-flex; align-items: center; height: 20px; }
.ex-badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 99px; background: rgba(0, 0, 0, .65); font-size: .64rem; font-weight: 700; letter-spacing: .04em; color: #fff; }
.ex-badge .i { width: 12px; height: 12px; }
.ex-badge.owned { background: #88b300; color: #16200a; }
.ex-counts { position: absolute; right: 10px; top: 10px; display: flex; gap: 10px; font-size: .74rem; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .9); }
.ex-counts span { display: inline-flex; align-items: center; gap: 4px; }
.ex-counts .i { width: 12px; height: 12px; opacity: .85; }
.ex-play { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .6); color: #fff; display: grid; place-items: center; opacity: 0; transform: scale(.8); transition: opacity var(--t-fast), transform var(--t-fast) var(--ease-out), background var(--t-fast); }
.ex-play .i { width: 20px; height: 20px; }
.ex-card:hover .ex-play, .ex-card:focus-within .ex-play, .ex-play[data-ic="pause"] { opacity: 1; transform: none; }
.ex-play[data-ic="pause"] { background: var(--accent); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .3); }
.ex-card .ex-play:hover { background: var(--accent); transform: scale(1.1); }
@media (hover: none) { .ex-play { opacity: 1; transform: none; } }
.ex-length { position: absolute; right: 10px; bottom: 9px; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 99px; background: rgba(0, 0, 0, .65); font-size: .72rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.ex-length .i { width: 11px; height: 11px; opacity: .8; }
.ex-cb { position: relative; flex: 1; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ex-t { font-weight: 700; font-size: 1.06rem; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-a { font-size: .86rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-m { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.ex-m b { color: var(--accent-3); font-weight: 600; }
.ex-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; min-height: 30px; }
.ex-spec { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
.ex-spec i { flex: none; width: 7px; height: 16px; border-radius: 4px; background: var(--sc); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.ex-spec-more { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 700; white-space: nowrap; }

.ex-srange { font-size: .76rem; font-weight: 700; white-space: nowrap; filter: brightness(1.25); }
.ex-keys { font-size: .7rem; font-weight: 700; white-space: nowrap; padding: 2px 7px; border-radius: 99px; background: rgba(255, 255, 255, .07); color: var(--text-2); }
.ex-action { flex: none; display: flex; align-items: center; }

.ex-progress { --p: 0%; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: .56rem; font-weight: 700; background: radial-gradient(closest-side, #2a2830 76%, transparent 78% 100%), conic-gradient(var(--accent) var(--p), rgba(255, 255, 255, .12) 0); }
